name: WPA AI Search R2 Credential CI

on:
  pull_request:
    paths:
      - 'scripts/ai_search_zero_state_v3.py'
      - 'scripts/ai_search_zero_state_v3_runner.py'
      - 'scripts/ai_search_zero_state_v3_io_runner.py'
      - 'scripts/ai_search_v3_cutover.py'
      - 'scripts/ai_search_v3_cutover_runner.py'
      - '.github/workflows/ai-search-r2-credential-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ai_search_zero_state_v3.py'
      - 'scripts/ai_search_zero_state_v3_runner.py'
      - 'scripts/ai_search_zero_state_v3_io_runner.py'
      - 'scripts/ai_search_v3_cutover.py'
      - 'scripts/ai_search_v3_cutover_runner.py'
      - '.github/workflows/ai-search-r2-credential-ci.yml'

permissions:
  contents: read

jobs:
  r2-credential-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript
          python -m pip install --disable-pip-version-check --quiet requests boto3
      - name: Compile AI Search R2 scripts
        run: |
          python -m py_compile scripts/ai_search_zero_state_v3.py
          python -m py_compile scripts/ai_search_zero_state_v3_runner.py
          python -m py_compile scripts/ai_search_zero_state_v3_io_runner.py
          python -m py_compile scripts/ai_search_v3_cutover.py
          python -m py_compile scripts/ai_search_v3_cutover_runner.py
      - name: Run v3 staging self-tests
        run: |
          python scripts/ai_search_zero_state_v3.py --self-test
          python scripts/ai_search_zero_state_v3_runner.py --runner-self-test
          python scripts/ai_search_zero_state_v3_io_runner.py --io-self-test
      - name: Run controlled cutover self-tests
        run: |
          python scripts/ai_search_v3_cutover.py --self-test
          python scripts/ai_search_v3_cutover_runner.py --runner-self-test
