name: Virtual Sande v35.1 Staging Recertification Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-v35.1-certification-ledger.json'
      - 'config/virtual-sande-v35.1-production-candidate.json'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification.yml'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate preserved staging certification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          certified = '6a1822ba8e524a454dcf4a038f3d6bc38c3d500d'
          ledger = json.loads(Path('config/virtual-sande-v35.1-certification-ledger.json').read_text())
          candidate = json.loads(Path('config/virtual-sande-v35.1-production-candidate.json').read_text())
          assert ledger['certification_status'] == 'STAGING_CERTIFIED_EXACT_CANDIDATE'
          assert ledger['certified_candidate_sha'] == certified
          assert ledger['recertification_evidence']['result'] == 'SUCCESS'
          assert ledger['recertification_evidence']['acceptance_suite'] == 'PASSED'
          assert ledger['recertification_evidence']['legacy_compatibility'] == 'PASSED'
          assert candidate['certified_candidate_sha'] == certified
          assert candidate['certification_evidence']['acceptance_suite'] == 'PASSED'
          assert candidate['certification_evidence']['legacy_compatibility'] == 'PASSED'
          PY

      - name: Verify staging workflow remains isolated
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/virtual-sande-v35-1-staging-recertification.yml').read_text()
          required = ['workflow_dispatch:', 'environment: staging', "test \"$GITHUB_REF\" = 'refs/heads/main'", 'workers/virtual-sande-v35.1-staging/wrangler.toml', 'Production deployment performed: **No**']
          missing = [x for x in required if x not in text]
          if missing: raise SystemExit(f'Missing staging isolation controls: {missing}')
          forbidden = ['environment: production', '--config workers/virtual-sande-v35.1-production/', 'routes =', 'custom_domain']
          found = [x for x in forbidden if x in text]
          if found: raise SystemExit(f'Forbidden staging surface: {found}')
          PY

      - name: Staging certification boundary
        run: |
          echo 'Staging certification remains valid and separate from the approved protected production release.' >> "$GITHUB_STEP_SUMMARY"
