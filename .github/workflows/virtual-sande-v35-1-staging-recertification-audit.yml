name: Virtual Sande v35.1 Staging Recertification Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-v35.1-certification-ledger.json'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification.yml'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate certification ledger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/virtual-sande-v35.1-certification-ledger.json').read_text())
          assert data['component'] == 'Virtual Sande'
          assert data['version'] == 'v35.1'
          assert data['production_authorized'] is False
          assert data['certification_status'] == 'RECERTIFICATION_REQUIRED_AFTER_SOURCE_CHANGE'
          assert data['current_candidate_ref'] == 'main'
          assert data['previous_evidence']['staging_deploy_run_number'] == 14
          assert data['previous_evidence']['staging_acceptance_run_number'] == 5
          assert data['required_recertification']['same_commit_deploy_acceptance_compatibility'] is True
          PY

      - name: Verify recertification safety surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/virtual-sande-v35-1-staging-recertification.yml')
          text = path.read_text()
          required = [
              'workflow_dispatch:',
              'permissions:\n  contents: read',
              'environment: staging',
              "test \"$GITHUB_REF\" = 'refs/heads/main'",
              'persist-credentials: false',
              'workers/virtual-sande-v35.1-staging/wrangler.toml',
              'virtual-sande-v35-1-exact-candidate-recertification',
              'Production deployment performed: **No**',
              'Production authorized: **No**',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Missing recertification controls: {missing}')

          forbidden = [
              'pull_request_target:',
              'push:',
              'schedule:',
              'environment: production',
              'contents: write',
              'workers/virtual-sande-v35.1-production/wrangler.toml',
              'routes =',
              'custom_domain',
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit(f'Forbidden recertification surface found: {found}')
          PY

      - name: Verify production remains blocked
        run: |
          set -euo pipefail
          test ! -e workers/virtual-sande-v35.1-production/wrangler.toml
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidate = json.loads(Path('config/virtual-sande-v35.1-production-candidate.json').read_text())
          assert candidate['production_authorized'] is False
          assert candidate['candidate_status'] == 'BLOCKED_PENDING_EXPLICIT_APPROVAL_AND_TARGETS'
          PY
