name: Virtual Sande v35.1.1 Staging Recertification Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-current-state.json'
      - 'config/virtual-sande-v35.1.1-staging-certification.json'
      - 'config/virtual-sande-v35.1-consistency-contract.json'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification.yml'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate historical same-commit recertification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('config/virtual-sande-current-state.json').read_text())
          cert = json.loads(Path('config/virtual-sande-v35.1.1-staging-certification.json').read_text())
          contract = json.loads(Path('config/virtual-sande-v35.1-consistency-contract.json').read_text())
          assert state['public_production']['version'] == 'v35.1.1'
          assert state['public_production']['public_cutover_status'] == 'COMPLETED'
          patch = state['consistency_patch']
          assert patch['version'] == 'v35.1.1'
          assert patch['certified_candidate_sha'] == '1576d7a2ccc3b674e84c6cb13537558dcaa4668c'
          assert patch['staging_recertification_status'] == 'SUCCESS'
          assert patch['production_patch_status'] == 'DEPLOYED_AND_ACCEPTED'
          assert cert['candidate_sha'] == patch['certified_candidate_sha']
          assert cert['certification_status'] == 'STAGING_RECERTIFIED_SAME_COMMIT'
          assert cert['run_number'] == 2
          assert cert['run_status'] == 'SUCCESS'
          assert cert['production_patch_deployment_performed'] is False
          assert contract['requires_same_commit_staging_recertification'] is True
          assert contract['production_deploy_performed'] is False
          PY

      - name: Verify staging workflow remains isolated and complete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/virtual-sande-v35-1-staging-recertification.yml').read_text()
          required = [
            'name: Virtual Sande v35.1.1 Staging Recertification',
            'workflow_dispatch:',
            'environment: staging',
            "test \"$GITHUB_REF\" = 'refs/heads/main'",
            'workers/virtual-sande-v35.1-staging/wrangler.toml',
            'wpa-protocol-bot-v35.1-response-contract.test.mjs',
            'wpa-protocol-bot-v35.1-consistency-integration.test.mjs',
            '\"version\": \"v35.1.1\"',
            'message=Здраво',
            'production_patch_deployment_performed',
            'Current public production remains v35.1: **Yes**',
            'Production patch deployment performed: **No**',
          ]
          missing = [x for x in required if x not in text]
          if missing: raise SystemExit(f'Missing staging recertification controls: {missing}')
          forbidden = [
            'environment:' + ' production',
            '--config workers/virtual-sande-v35.1-production/' + 'wrangler.toml',
            'test ! -e workers/virtual-sande-v35.1-production/' + 'wrangler.toml',
          ]
          found = [x for x in forbidden if x in text]
          if found: raise SystemExit(f'Forbidden staging surface: {found}')
          PY

      - name: Staging certification boundary
        run: |
          {
            echo '## Virtual Sande v35.1.1 Staging Certification History'
            echo '- Same-commit recertification: **Passed**'
            echo '- Exact candidate SHA preserved: **Yes**'
            echo '- Staging environment remained isolated: **Yes**'
            echo '- Production patch performed by staging workflow: **No**'
            echo '- Candidate subsequently deployed to production: **Yes**'
          } >> "$GITHUB_STEP_SUMMARY"
