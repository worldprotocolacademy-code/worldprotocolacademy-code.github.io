name: QA Apply PR-B-A Accessibility Hardening

on:
  push:
    branches:
      - a11y/home-institute-prb-a-2026-08-31

permissions:
  contents: write

jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify safe branch ancestry and pre-patch diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c89425c02c8642042ced111745a27ad804c6f528 HEAD
          changed="$(git diff --name-only c89425c02c8642042ced111745a27ad804c6f528...HEAD)"
          test "$changed" = ".github/workflows/qa-prb-a-apply.yml"

      - name: Apply exact accessibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # HOME: footer brand is branding, not a document heading.
          replace_exact('index.html', '.footer-brand h4{font-family:var(--fp);font-size:20px;color:var(--white);margin-bottom:12px}', '.footer-brand .footer-brand-title{font-family:var(--fp);font-size:20px;color:var(--white);margin-bottom:12px}')
          replace_exact('index.html', '<h4 data-i18n="a_footer.1">Светска академија за протокол<br>World Protocol Academy</h4>', '<div class="footer-brand-title" data-i18n="a_footer.1">Светска академија за протокол<br>World Protocol Academy</div>')
          # HOME: visible localized button text is the accessible name; remove conflicting English aria-label overrides.
          replace_exact('index.html', '      btn.setAttribute("aria-label", "Open navigation menu");\n      btn.setAttribute("aria-expanded", "false");\n      btn.setAttribute("type", "button");', '      btn.setAttribute("aria-expanded", "false");\n      btn.setAttribute("type", "button");')
          replace_exact('index.html', '      parts.btn.setAttribute("aria-expanded", open ? "true" : "false");\n      parts.btn.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");\n      parts.btn.textContent = open ? (wpaUILang()==="en"?"Close":"Затвори") : (wpaUILang()==="en"?"Menu":"Мени");', '      parts.btn.setAttribute("aria-expanded", open ? "true" : "false");\n      parts.btn.textContent = open ? (wpaUILang()==="en"?"Close":"Затвори") : (wpaUILang()==="en"?"Menu":"Мени");')

          # INSTITUTE: stable contrast on canonical navy, without changing layout.
          replace_exact('institute.html', ".jump-menu-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:rgba(201,168,76,0.6);align-self:center;margin-right:4px;font-family:'Inter',sans-serif}", ".jump-menu-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:#e3c878;align-self:center;margin-right:4px;font-family:'Inter',sans-serif}")
          replace_exact('institute.html', '<nav style="background:rgba(13,31,60,0.6);border-bottom:1px solid rgba(201,168,76,0.15);padding:0 0">', '<nav style="background:#0d1f3c;border-bottom:1px solid rgba(201,168,76,0.15);padding:0 0">')
          replace_exact('institute.html', 'style="font-size:9.5px;color:rgba(201,168,76,0.65);max-width:520px;', 'style="font-size:9.5px;color:#e3c878;max-width:520px;')

          # INSTITUTE: h1 -> h2 is the correct instrument-card hierarchy; preserve appearance via selector change.
          replace_exact('institute.html', '.wpa-identity .wpaid-inst h3{font-family:var(--wpaid-serif);font-weight:400;font-size:clamp(1.4rem,3.5vw,1.85rem);margin:0 0 .2rem;color:var(--wpaid-parchment)}', '.wpa-identity .wpaid-inst h2{font-family:var(--wpaid-serif);font-weight:400;font-size:clamp(1.4rem,3.5vw,1.85rem);margin:0 0 .2rem;color:var(--wpaid-parchment)}')
          replace_exact('institute.html', '.wpa-identity .wpaid-inst h3 .wpaid-en{display:block;font-style:italic;color:rgba(245,240,224,.55);font-size:.62em;letter-spacing:.04em}', '.wpa-identity .wpaid-inst h2 .wpaid-en{display:block;font-style:italic;color:rgba(245,240,224,.55);font-size:.62em;letter-spacing:.04em}')
          replace_exact('institute.html', '<h3>PSPI · ИПММ<span class="wpaid-en">WPA Protocol Soft Power Index · Индекс на протоколарна мека моќ</span></h3>', '<h2>PSPI · ИПММ<span class="wpaid-en">WPA Protocol Soft Power Index · Индекс на протоколарна мека моќ</span></h2>')
          replace_exact('institute.html', '<h3>Индекс на Институтот<span class="wpaid-en">WPA Institute Index</span></h3>', '<h2>Индекс на Институтот<span class="wpaid-en">WPA Institute Index</span></h2>')

          # INSTITUTE footer labels are navigation labels, not deep document headings.
          replace_exact('institute.html', '  .footer-col h4 {', '  .footer-col .footer-heading {')
          footer_labels = [
              ('<h4 data-i18n="institute.footer.about_label">Светска академија за протокол<br>World Protocol Academy</h4>', '<div class="footer-heading" data-i18n="institute.footer.about_label">Светска академија за протокол<br>World Protocol Academy</div>'),
              ('<h4 data-i18n="institute.footer.institute_label">Институт</h4>', '<div class="footer-heading" data-i18n="institute.footer.institute_label">Институт</div>'),
              ('<h4 data-i18n="institute.footer.resources_label">Ресурси</h4>', '<div class="footer-heading" data-i18n="institute.footer.resources_label">Ресурси</div>'),
              ('<h4 data-i18n="institute.footer.contact_label">Контакт</h4>', '<div class="footer-heading" data-i18n="institute.footer.contact_label">Контакт</div>'),
          ]
          for old, new in footer_labels:
              replace_exact('institute.html', old, new)

          # INSTITUTE mobile menu: visible localized text is the accessible name.
          replace_exact('institute.html', '      btn.setAttribute("aria-label", "Open navigation menu");\n      btn.setAttribute("aria-expanded", "false");\n      btn.innerHTML = menuTxt(false);', '      btn.setAttribute("aria-expanded", "false");\n      btn.innerHTML = menuTxt(false);')

          # WIC controls: bind visible labels to their controls.
          replace_exact('wpa-translator.js', '<div class="wic-form"><div class="wic-field"><label>Purpose</label><select id="wicPurpose">', '<div class="wic-form"><div class="wic-field"><label for="wicPurpose">Purpose</label><select id="wicPurpose">')
          replace_exact('wpa-translator.js', '</select></div><div class="wic-field"><label>Domain</label><select id="wicDomain">', '</select></div><div class="wic-field"><label for="wicDomain">Domain</label><select id="wicDomain">')
          replace_exact('wpa-translator.js', '</select></div><div class="wic-field"><label>Language</label><select id="wicLang">', '</select></div><div class="wic-field"><label for="wicLang">Language</label><select id="wicLang">')
          replace_exact('wpa-translator.js', '<div class="wic-field"><label>Context</label><textarea id="wicContext"', '<div class="wic-field"><label for="wicContext">Context</label><textarea id="wicContext"')

          # Preserve the valid static Institute brand href in every runtime normalizer.
          replace_exact('scripts/wpa-performance.js', "    brand.removeAttribute('href');\n    brand.removeAttribute('target');", "    brand.removeAttribute('target');")
          replace_exact('scripts/virtual-sande-institute-widget.js', "    brand.classList.add('wpa-institute-brand');\n    brand.removeAttribute('href');", "    brand.classList.add('wpa-institute-brand');")
          PY

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py
          grep -q 'class="footer-brand-title"' index.html
          ! grep -q 'parts.btn.setAttribute("aria-label", open ? "Close navigation menu"' index.html
          grep -q 'label for="wicPurpose"' wpa-translator.js
          grep -q 'label for="wicDomain"' wpa-translator.js
          grep -q 'label for="wicLang"' wpa-translator.js
          ! grep -q "brand.removeAttribute('href')" scripts/wpa-performance.js
          ! grep -q "brand.removeAttribute('href')" scripts/virtual-sande-institute-widget.js
          grep -q '<h2>PSPI · ИПММ' institute.html
          grep -q 'background:#0d1f3c' institute.html

      - name: Commit product changes only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worldprotocolacademy-code'
          git config user.email 'worldprotocolacademy@gmail.com'
          git add index.html institute.html wpa-translator.js scripts/wpa-performance.js scripts/virtual-sande-institute-widget.js
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'Harden Home and Institute accessibility semantics'
          git push origin HEAD:a11y/home-institute-prb-a-2026-08-31
