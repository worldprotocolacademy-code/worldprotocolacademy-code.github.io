name: Virtual Sande v35.1 Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Exact workers.dev URL printed by the successful staging deploy run.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_URL: ${{ inputs.staging_url }}

    steps:
      - name: Validate staging URL boundary
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          STAGING_URL="${STAGING_URL%/}"
          case "$STAGING_URL" in
            https://*.workers.dev) ;;
            *) echo 'Only an exact HTTPS workers.dev staging URL is allowed.' >&2; exit 1 ;;
          esac
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"

      - name: Health and version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$STAGING_URL/orchestrator/health" | tee /tmp/health.json
          grep -F '"ok": true' /tmp/health.json
          grep -F 'v35.1' /tmp/health.json

      - name: Academic answer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е агреман?' \
            --data-urlencode 'lang=mk' | tee /tmp/agreman.json
          grep -F '"ok": true' /tmp/agreman.json
          grep -F '"answer"' /tmp/agreman.json

      - name: Multisystem overview
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што може ботот во сите WPA системи?' \
            --data-urlencode 'lang=mk' | tee /tmp/systems.json
          grep -F '"ok": true' /tmp/systems.json
          grep -F '"answer"' /tmp/systems.json

      - name: Global Institutions D001
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Покажи ми D001' \
            --data-urlencode 'lang=mk' | tee /tmp/d001.json
          grep -F '"ok": true' /tmp/d001.json
          grep -F 'D001' /tmp/d001.json

      - name: Journal Live strict search
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Кои се најновите дипломатски вести?' \
            --data-urlencode 'lang=mk' | tee /tmp/live.json
          grep -F '"ok": true' /tmp/live.json
          grep -E 'journal_live_strict_search|journal_live_unavailable' /tmp/live.json
          grep -F '"human_review_required": true' /tmp/live.json

      - name: Reject unsupported method
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/method.json --write-out '%{http_code}' -X PUT "$STAGING_URL/ask")
          test "$status" = '405'
          grep -F 'Method not allowed.' /tmp/method.json

      - name: Reject disallowed origin
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/origin.json --write-out '%{http_code}' \
            -H 'Origin: https://example.invalid' \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е протокол?' \
            --data-urlencode 'lang=mk')
          test "$status" = '403'
          grep -F 'Origin not allowed.' /tmp/origin.json

      - name: Reject oversized message
        run: |
          set -euo pipefail
          message=$(python3 -c "print('а' * 701)")
          status=$(curl --silent --output /tmp/long.json --write-out '%{http_code}' \
            --get "$STAGING_URL/ask" \
            --data-urlencode "message=$message" \
            --data-urlencode 'lang=mk')
          test "$status" = '400'
          grep -F 'Message too long.' /tmp/long.json

      - name: Reject too many URLs
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/urls.json --write-out '%{http_code}' \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=https://a.example https://b.example https://c.example https://d.example' \
            --data-urlencode 'lang=mk')
          test "$status" = '400'
          grep -F 'Too many URLs in one request.' /tmp/urls.json

      - name: Acceptance boundary
        run: |
          echo 'Acceptance tests read only from the exact isolated staging URL supplied by the deploy run.'
          echo 'No Worker deployment, route, custom domain, secret, KV namespace, D1 database, or production endpoint was modified.'
