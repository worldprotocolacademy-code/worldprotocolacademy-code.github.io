name: Validate Pilot 20 v1.3.2

on:
  pull_request:
    paths:
      - 'data/global-institutions/pilot-20/v1.3.2/**'
      - 'data/global-institutions/pilot-20/v1.3.1/pilot20-v1.3.1.tar.gz.b64'
      - '.github/workflows/pilot20-v132-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/global-institutions/pilot-20/v1.3.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Syntax check
        run: python -m py_compile secure_extract_bundle.py

      - name: Unit security tests
        env:
          PYTHONPATH: ${{ github.workspace }}/data/global-institutions/pilot-20/v1.3.2
        run: python -m pytest -q tests

      - name: Verify pinned source and archive
        run: python secure_extract_bundle.py --verify --log validation.log | tee verification-result.json

      - name: Dry run
        run: python secure_extract_bundle.py --dry-run --log dry-run.log

      - name: Atomic extraction and manifest generation
        run: python secure_extract_bundle.py --output ci-extracted --log extraction.log > extraction-result.json

      - name: Validate extraction manifest schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path('pilot20-package.schema.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('ci-extracted/extraction-manifest.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)
          assert manifest['guardrails']['rev2_changed'] is False
          assert manifest['guardrails']['d002_applied'] is False
          assert manifest['guardrails']['h005_next_action'] == 'MANUAL_REVIEW_AND_REATTEMPT_IN_NEXT_BATCH_CYCLE'
          print('Schema and canonical guardrails validated.')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: pilot20-v1.3.2-verification-evidence
          path: |
            data/global-institutions/pilot-20/v1.3.2/verification-result.json
            data/global-institutions/pilot-20/v1.3.2/ci-extracted/extraction-manifest.json
            data/global-institutions/pilot-20/v1.3.2/*.log
          if-no-files-found: error
          retention-days: 30
