name: QA Apply Home Footer Semantics

on:
  push:
    branches:
      - a11y/home-institute-prb-a-2026-08-31

permissions:
  contents: write

jobs:
  guarded-home-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
      - name: Apply exact footer patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('.footer-col h5{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--goldl);margin-bottom:14px;font-family:var(--fb)}', '.footer-col .footer-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--goldl);margin-bottom:14px;font-family:var(--fb)}'),
            ('<h5 data-i18n="ftKeyAreas">Клучни области</h5>', '<div class="footer-col-title" data-i18n="ftKeyAreas">Клучни области</div>'),
            ('<h5 data-i18n="ftChannels">Официјални канали</h5>', '<div class="footer-col-title" data-i18n="ftChannels">Официјални канали</div>'),
            ('<h5 data-i18n="ftAcad">Академски профили</h5>', '<div class="footer-col-title" data-i18n="ftAcad">Академски профили</div>'),
            ('<h5 data-i18n="ftContact">Контакт</h5>', '<div class="footer-col-title" data-i18n="ftContact">Контакт</div>'),
          ]
          for old,new in reps:
            c=s.count(old)
            if c!=1: raise SystemExit(f'Expected one match, found {c}: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py
          test "$(grep -c 'class="footer-col-title"' index.html)" -eq 4
      - name: Commit feature-only product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worldprotocolacademy-code'
          git config user.email 'worldprotocolacademy@gmail.com'
          git add index.html
          git commit -m 'Fix Home footer heading semantics'
          git push origin HEAD:a11y/home-institute-prb-a-2026-08-31
