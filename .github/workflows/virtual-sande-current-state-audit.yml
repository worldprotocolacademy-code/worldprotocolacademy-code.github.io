name: Virtual Sande Current State Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-current-state.json'
      - 'config/virtual-sande-v35.1.1-production-patch-evidence.json'
      - '.github/workflows/virtual-sande-current-state-audit.yml'
      - '.github/workflows/virtual-sande-v35-1-1-production-patch-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate completed production state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('config/virtual-sande-current-state.json').read_text())
          evidence = json.loads(Path('config/virtual-sande-v35.1.1-production-patch-evidence.json').read_text())
          assert state['canonical_state_record'] is True
          public = state['public_production']
          assert public['version'] == 'v35.1.1'
          assert public['runtime'] == 'v35.1.1-multisystem-orchestrator'
          assert public['response_contract'] == 'wpa-virtual-sande-response-v1.1'
          assert public['deployment_status'] == 'DEPLOYED_AND_ACCEPTED'
          assert public['public_cutover_status'] == 'COMPLETED'
          assert public['production_patch_run_id'] == 29485825251
          assert public['production_patch_job_id'] == 87579958160
          assert public['release_sha'] == 'b43a4133c106317db0548e9bdd5831eb9c7fa87f'
          assert public['production_evidence_artifact_id'] == 8370399164
          patch = state['consistency_patch']
          assert patch['production_patch_status'] == 'DEPLOYED_AND_ACCEPTED'
          assert patch['stable_health_and_greeting_propagation'] == 'PASSED'
          assert patch['language_guard_nonstandard_ne_vidam'] == 'PASSED'
          assert evidence['status'] == 'PRODUCTION_PATCH_DEPLOYED_AND_ACCEPTED'
          assert evidence['workflow_run_id'] == public['production_patch_run_id']
          assert evidence['artifact']['id'] == public['production_evidence_artifact_id']
          assert evidence['artifact']['digest'] == public['production_evidence_digest']
          assert state['consumer_state']['consumer_endpoints_unchanged_during_patch'] is True
          assert state['rollback']['legacy_worker_retained'] is True
          assert state['rollback']['status'] == 'READY'
          PY
      - name: State boundary
        run: |
          {
            echo '## Virtual Sande Current State'
            echo '- Public v35.1.1: **Deployed and accepted**'
            echo '- Stable health and greeting propagation: **Passed**'
            echo '- Production evidence: **Recorded**'
            echo '- Public consumer changes: **No**'
            echo '- Legacy rollback Worker retained: **Yes**'
          } >> "$GITHUB_STEP_SUMMARY"
