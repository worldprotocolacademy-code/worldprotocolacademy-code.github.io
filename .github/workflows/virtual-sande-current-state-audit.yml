name: Virtual Sande Current State Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-current-state.json'
      - 'config/virtual-sande-v35.1.1-staging-certification.json'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification.yml'
      - '.github/workflows/deploy-virtual-sande-v35-1-1-production-patch.yml'
      - '.github/workflows/virtual-sande-current-state-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate canonical certified patch state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('config/virtual-sande-current-state.json').read_text())
          cert = json.loads(Path('config/virtual-sande-v35.1.1-staging-certification.json').read_text())
          assert state['canonical_state_record'] is True
          public = state['public_production']
          assert public['version'] == 'v35.1'
          assert public['deployment_status'] == 'DEPLOYED_AND_ACCEPTED'
          assert public['public_cutover_status'] == 'COMPLETED'
          patch = state['consistency_patch']
          assert patch['version'] == 'v35.1.1'
          assert patch['code_merge_commit'] == '0142bb33c4b5362f178712f377ed2bdb222a4779'
          assert patch['certified_candidate_sha'] == '1576d7a2ccc3b674e84c6cb13537558dcaa4668c'
          assert patch['code_status'] == 'MERGED_AND_STAGING_RECERTIFIED'
          assert patch['staging_recertification_status'] == 'SUCCESS'
          assert patch['production_patch_status'] == 'AUTHORIZED_FOR_PROTECTED_MANUAL_DEPLOY_ONLY'
          assert cert['certification_status'] == 'STAGING_RECERTIFIED_SAME_COMMIT'
          assert cert['candidate_sha'] == patch['certified_candidate_sha']
          assert cert['production_patch_deployment_performed'] is False
          assert state['consumer_state']['consumer_changes_required_for_patch'] is False
          assert state['rollback']['legacy_worker_retained'] is True
          PY
          staging=.github/workflows/virtual-sande-v35-1-staging-recertification.yml
          production=.github/workflows/deploy-virtual-sande-v35-1-1-production-patch.yml
          grep -F 'Virtual Sande v35.1.1 Staging Recertification' "$staging"
          grep -F 'CERTIFIED_SHA: 1576d7a2ccc3b674e84c6cb13537558dcaa4668c' "$production"
          grep -F 'environment: production' "$production"
          grep -F 'workflow_dispatch:' "$production"
      - name: State boundary
        run: |
          {
            echo '## Virtual Sande Current State'
            echo '- Public v35.1: **Deployed and cut over**'
            echo '- v35.1.1 code: **Merged and staging recertified**'
            echo '- Exact certified candidate: **Recorded**'
            echo '- v35.1.1 production patch: **Protected manual deploy authorized**'
            echo '- Public consumer changes required: **No**'
            echo '- Legacy rollback Worker retained: **Yes**'
          } >> "$GITHUB_STEP_SUMMARY"
