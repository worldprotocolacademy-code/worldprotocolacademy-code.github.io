name: AI Search Zero State v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'PLAN_ONLY, STAGE_ONLY, or CUTOVER_AND_VERIFY'
        required: true
        default: PLAN_ONLY
        type: choice
        options: [PLAN_ONLY, STAGE_ONLY, CUTOVER_AND_VERIFY]
      approval_phrase:
        description: 'For write modes type: APPLY PROTOCOL-AI ZERO STATE V2'
        required: false
        default: ''
        type: string
      approved_plan_sha256:
        description: 'SHA-256 printed by PLAN_ONLY'
        required: false
        default: ''
        type: string
      target_prefix:
        description: 'Staged target prefix for CUTOVER_AND_VERIFY'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ai-search-zero-state-v2
  cancel-in-progress: false

jobs:
  zero_state:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.mode == 'PLAN_ONLY' && 'staging' || 'production' }}
    env:
      AI_SEARCH_INSTANCE: protocol-ai
      R2_BUCKET: protocol-kb
      WRANGLER_BIN: /tmp/node_modules/.bin/wrangler
      OUT: /tmp/ai-search-zero-state-v2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize diagnostic evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          printf '{"status":"started","mode":"%s","run_id":"%s","sha":"%s"}\n' \
            '${{ inputs.mode }}' '${{ github.run_id }}' '${{ github.sha }}' > "$OUT/run-context.json"

      - name: Enforce protected gates
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval_phrase }}
          PLAN_SHA: ${{ inputs.approved_plan_sha256 }}
          TARGET_PREFIX: ${{ inputs.target_prefix }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          : > "$OUT/gate-diagnostics.txt"
          check_present() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "MISSING: $name" | tee -a "$OUT/gate-diagnostics.txt"
              echo "::error title=Missing protected secret::$name is unavailable in the selected GitHub environment."
              fail=1
            else
              echo "PRESENT: $name" >> "$OUT/gate-diagnostics.txt"
            fi
          }
          check_present CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check_present CLOUDFLARE_AI_SEARCH_TOKEN "$CLOUDFLARE_AI_SEARCH_TOKEN"
          if [ "$MODE" != PLAN_ONLY ]; then
            check_present CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
            if [ "$APPROVAL" != 'APPLY PROTOCOL-AI ZERO STATE V2' ]; then
              echo 'INVALID: approval_phrase' | tee -a "$OUT/gate-diagnostics.txt"
              echo '::error title=Approval phrase mismatch::Use exactly APPLY PROTOCOL-AI ZERO STATE V2'
              fail=1
            fi
            if ! printf '%s' "$PLAN_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
              echo 'INVALID: approved_plan_sha256' | tee -a "$OUT/gate-diagnostics.txt"
              echo '::error title=Invalid plan SHA::The approved SHA must contain exactly 64 lowercase hexadecimal characters.'
              fail=1
            fi
          fi
          if [ "$MODE" = CUTOVER_AND_VERIFY ] && ! printf '%s' "$TARGET_PREFIX" | grep -Eq '^__ai_search_ready_v2__/[0-9a-f]{20}/$'; then
            echo 'INVALID: target_prefix' | tee -a "$OUT/gate-diagnostics.txt"
            echo '::error title=Invalid target prefix::Use the exact versioned prefix printed by STAGE_ONLY.'
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            printf '{"status":"gate_failed","mode":"%s"}\n' "$MODE" > "$OUT/failure.json"
            exit 1
          fi
          printf '{"status":"gate_passed","mode":"%s"}\n' "$MODE" > "$OUT/gate-result.json"

      - name: Install tools and test code
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"status\":\"tool_install_failed\",\"exit_code\":%s}\n" "$code" > "$OUT/failure.json"; exit "$code"' ERR
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf ghostscript jq libreoffice
          cd /tmp
          npm install --silent --no-audit --no-fund wrangler@4
          python3 -m pip install --disable-pip-version-check --quiet requests
          test -x "$WRANGLER_BIN"
          command -v libreoffice >/dev/null
          python3 -m py_compile "$GITHUB_WORKSPACE/scripts/ai_search_zero_state_v2.py"
          python3 "$GITHUB_WORKSPACE/scripts/ai_search_zero_state_v2.py" --self-test
          printf '{"status":"tools_ready"}\n' > "$OUT/tool-result.json"

      - name: Generate fresh plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"status\":\"plan_failed\",\"exit_code\":%s}\n" "$code" > "$OUT/failure.json"; exit "$code"' ERR
          find "$OUT" -mindepth 1 -maxdepth 1 ! -name 'run-context.json' ! -name 'gate-diagnostics.txt' ! -name 'gate-result.json' ! -name 'tool-result.json' -exec rm -rf {} +
          python3 scripts/ai_search_zero_state_v2.py --mode PLAN --out "$OUT"
          cat "$OUT/counts.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify approved plan
        if: ${{ inputs.mode != 'PLAN_ONLY' }}
        run: |
          set -euo pipefail
          actual="$(cat "$OUT/migration-plan.sha256")"
          expected='${{ inputs.approved_plan_sha256 }}'
          if [ "$actual" != "$expected" ]; then
            printf '{"status":"plan_sha_mismatch","actual":"%s","expected":"%s"}\n' "$actual" "$expected" > "$OUT/failure.json"
            echo '::error title=Plan SHA mismatch::The corpus changed or the wrong PLAN_ONLY SHA was supplied.'
            exit 1
          fi

      - name: Stage clean versioned corpus
        if: ${{ inputs.mode == 'STAGE_ONLY' || inputs.mode == 'CUTOVER_AND_VERIFY' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          python3 scripts/ai_search_zero_state_v2.py --mode STAGE \
            --approved-sha '${{ inputs.approved_plan_sha256 }}' --out "$OUT" 2>&1 | tee "$OUT/stage.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            last_item="$(grep -E '^\[[0-9]+/[0-9]+\] ' "$OUT/stage.log" | tail -n 1 || true)"
            python3 - "$OUT/failure.json" "$code" "$last_item" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); log=p.with_name('stage.log')
          p.write_text(json.dumps({'status':'stage_failed','exit_code':int(sys.argv[2]),'last_item':sys.argv[3],'log_tail':log.read_text(errors='replace').splitlines()[-120:]},ensure_ascii=False,indent=2)+'\n')
          PY
            exit "$code"
          fi
          cat "$OUT/stage-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Save current AI Search configuration
        if: ${{ inputs.mode == 'CUTOVER_AND_VERIFY' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          test "$(jq -r '.target_prefix' "$OUT/stage-summary.json")" = '${{ inputs.target_prefix }}'
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/${AI_SEARCH_INSTANCE}"
          curl --fail --silent --show-error "$api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > "$OUT/original-instance.json"
          jq -e '.success==true' "$OUT/original-instance.json" >/dev/null
          jq '.result.source_params // {}' "$OUT/original-instance.json" > "$OUT/original-source-params.json"

      - name: Cut over to clean prefix
        if: ${{ inputs.mode == 'CUTOVER_AND_VERIFY' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/${AI_SEARCH_INSTANCE}"
          jq --arg prefix '${{ inputs.target_prefix }}' '. + {prefix:$prefix,include_items:[],exclude_items:[]}' "$OUT/original-source-params.json" > "$OUT/new-source-params.json"
          jq -n --slurpfile p "$OUT/new-source-params.json" '{source_params:$p[0]}' > "$OUT/cutover-request.json"
          curl --fail --silent --show-error -X PUT "$api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" -H 'Content-Type: application/json' --data-binary @"$OUT/cutover-request.json" > "$OUT/cutover-response.json"
          jq -e '.success==true' "$OUT/cutover-response.json" >/dev/null

      - name: Sync and verify zero state
        if: ${{ inputs.mode == 'CUTOVER_AND_VERIFY' }}
        id: verify
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/${AI_SEARCH_INSTANCE}"
          curl --fail --silent --show-error -X POST "$api/jobs" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" -H 'Content-Type: application/json' -d '{"description":"WPA zero-state v2 sync"}' > "$OUT/job.json"
          jq -e '.success==true' "$OUT/job.json" >/dev/null
          job="$(jq -r '.result.id' "$OUT/job.json")"; test -n "$job"
          finished=false
          for n in $(seq 1 240); do
            curl --fail --silent --show-error "$api/jobs/$job" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > "$OUT/job-state.json"
            jq -e '.success==true' "$OUT/job-state.json" >/dev/null
            if [ -n "$(jq -r '.result.ended_at//empty' "$OUT/job-state.json")" ]; then finished=true; break; fi
            sleep 15
          done
          [ "$finished" = true ]
          mkdir -p "$OUT/post"; page=1
          while :; do
            f="$OUT/post/$page.json"; curl --fail --silent --show-error "$api/items?page=$page&per_page=50" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > "$f"
            jq -e '.success==true' "$f" >/dev/null
            count="$(jq '.result|length' "$f")"; [ "$count" -lt 50 ] && break; page=$((page+1)); [ "$page" -le 200 ]
          done
          jq -s '[.[].result[]?]' "$OUT"/post/*.json > "$OUT/post-items.json"
          jq '[.[]|select((.status//""|ascii_downcase)|IN("skipped","skip","error","errored","failed","failure","outdated","queued","running","processing"))]' "$OUT/post-items.json" > "$OUT/post-problems.json"
          test "$(jq 'length' "$OUT/post-problems.json")" -eq 0
          test "$(jq '[.[]|select((.status//""|ascii_downcase)=="indexed")]|length' "$OUT/post-items.json")" -gt 0

      - name: Roll back after failed verification
        if: ${{ inputs.mode == 'CUTOVER_AND_VERIFY' && steps.verify.outcome == 'failure' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/${AI_SEARCH_INSTANCE}"
          jq -n --slurpfile p "$OUT/original-source-params.json" '{source_params:$p[0]}' > "$OUT/rollback-request.json"
          curl --fail --silent --show-error -X PUT "$api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" -H 'Content-Type: application/json' --data-binary @"$OUT/rollback-request.json" > "$OUT/rollback-response.json"
          jq -e '.success==true' "$OUT/rollback-response.json" >/dev/null
          curl --fail --silent --show-error -X POST "$api/jobs" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" -H 'Content-Type: application/json' -d '{"description":"Automatic rollback after zero-state v2 verification failure"}' > "$OUT/rollback-job.json"
          jq -e '.success==true' "$OUT/rollback-job.json" >/dev/null

      - name: Enforce final result
        if: ${{ inputs.mode == 'CUTOVER_AND_VERIFY' }}
        run: test '${{ steps.verify.outcome }}' = success

      - name: Safety summary
        if: always()
        run: |
          {
            echo '### AI Search Zero State v2 safety boundary'
            echo '- No original R2 object is deleted, moved, or overwritten.'
            echo '- Staging writes only below a versioned `__ai_search_ready_v2__/` prefix.'
            echo '- Empty, unsupported, media and archive objects remain preserved in the source bucket but are omitted from the active AI Search prefix.'
            echo '- Failed verification restores the previous source parameters and triggers a rollback sync.'
            [ -f "$OUT/gate-diagnostics.txt" ] && { echo '```text'; cat "$OUT/gate-diagnostics.txt"; echo '```'; }
            [ -f "$OUT/failure.json" ] && { echo '```json'; cat "$OUT/failure.json"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-search-zero-state-v2-${{ github.run_number }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
