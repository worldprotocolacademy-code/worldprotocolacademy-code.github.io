name: WPA Institute header journal and logo fix once

on:
  push:
    branches:
      - fix/institute-header-journal-logo-20260903
    paths:
      - '.github/workflows/wpa-institute-header-journal-logo-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Institute header journal entry, journal CTA contrast and real logo
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          def write_if_changed(path, new):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              if old != new:
                  p.write_text(new, encoding='utf-8')
                  changed.append(path)

          # 1) Static Institute source: use the real WPA logo asset, not the WPA-letter SVG monogram.
          inst_path = Path('institute.html')
          inst = inst_path.read_text(encoding='utf-8')
          original_inst = inst
          inst = inst.replace(
              '<img class="wpa-institute-logo" src="/assets/img/logo.svg"',
              '<img class="wpa-institute-logo" src="/logo.webp"'
          )

          # Add WPA Journal to the primary Institute header itself. Runtime will keep it stable.
          nav_match = re.search(r'(<div class="nav-links">)(.*?)(</div>\s*</nav>)', inst, flags=re.S)
          if not nav_match:
              raise SystemExit('Institute primary nav block not found')
          nav_inner = nav_match.group(2)
          if 'href="journal/index.html"' not in nav_inner and 'href="/journal/index.html"' not in nav_inner:
              journal_link = '\n<a class="wpa-journal-institute-nav-link" href="journal/index.html" title="WPA Journal" translate="no" data-no-i18n="true">WPA Journal</a>'
              # Place after Publications when possible; otherwise append to the primary nav.
              pub = re.search(r'(<a[^>]+href="#institute-publications"[^>]*>.*?</a>)', nav_inner, flags=re.S)
              if pub:
                  nav_inner = nav_inner[:pub.end()] + journal_link + nav_inner[pub.end():]
              else:
                  nav_inner = nav_inner + journal_link
              inst = inst[:nav_match.start(2)] + nav_inner + inst[nav_match.end(2):]

          if inst != original_inst:
              inst_path.write_text(inst, encoding='utf-8')
              changed.append('institute.html')

          # 2) Runtime: make the real logo canonical and keep WPA Journal + Journal Live visible in header.
          perf_path = Path('scripts/wpa-performance.js')
          perf = perf_path.read_text(encoding='utf-8')
          original_perf = perf

          if "var JOURNAL_URL = '/journal/index.html';" not in perf:
              perf = perf.replace(
                  "  var JOURNAL_LIVE_URL = '/journal/live/';",
                  "  var JOURNAL_LIVE_URL = '/journal/live/';\n  var JOURNAL_URL = '/journal/index.html';"
              )

          old_style = "      'html[data-wpa-page=\"institute\"] .wpa-pilot20-institute-nav-link,html[data-wpa-page=\"institute\"] .wpa-journal-live-entry,html[data-wpa-page=\"institute\"] .wpa-sublimate-institute-nav-link{font-weight:600!important;border-color:transparent!important;background:transparent!important;}',"
          new_style = "      'html[data-wpa-page=\"institute\"] .wpa-pilot20-institute-nav-link,html[data-wpa-page=\"institute\"] .wpa-sublimate-institute-nav-link{font-weight:600!important;border-color:transparent!important;background:transparent!important;}',\n      'html[data-wpa-page=\"institute\"] .wpa-journal-institute-nav-link,html[data-wpa-page=\"institute\"] .wpa-journal-live-entry{font-weight:800!important;color:#e3c878!important;border:1px solid rgba(201,168,76,.48)!important;background:rgba(201,168,76,.08)!important;border-radius:4px!important;}',\n      'html[data-wpa-page=\"institute\"] .wpa-journal-institute-nav-link:hover,html[data-wpa-page=\"institute\"] .wpa-journal-live-entry:hover{background:#c9a84c!important;color:#081328!important;border-color:#c9a84c!important;}',\n      'html[data-wpa-page=\"institute\"] #wpaJournalInstituteHero,html[data-wpa-page=\"institute\"] #wpaLiveInstituteHeroLink,html[data-wpa-page=\"institute\"] a[data-i18n=\"institute.tools_hub.journal.cta\"]{background:#0d1f3c!important;color:#fbf8ee!important;border:1px solid #c9a84c!important;box-shadow:none!important;}',\n      'html[data-wpa-page=\"institute\"] #wpaJournalInstituteHero:hover,html[data-wpa-page=\"institute\"] #wpaLiveInstituteHeroLink:hover,html[data-wpa-page=\"institute\"] a[data-i18n=\"institute.tools_hub.journal.cta\"]:hover{background:#1a2c4f!important;color:#e3c878!important;border-color:#e3c878!important;}',"
          if old_style in perf:
              perf = perf.replace(old_style, new_style)
          elif '.wpa-journal-institute-nav-link' not in perf:
              raise SystemExit('Expected Institute runtime style anchor not found')

          # Existing static logo used to survive unchanged; force it to the real /logo.webp asset every run.
          logo_anchor = "    var text = brand.querySelector('.brand-text');"
          logo_force = "    if (logo) {\n      logo.className = 'wpa-institute-logo';\n      logo.src = '/logo.webp';\n      logo.alt = 'World Protocol Academy logo';\n      logo.width = 48;\n      logo.height = 48;\n    }\n\n"
          if logo_force not in perf:
              if logo_anchor not in perf:
                  raise SystemExit('Institute logo normalization anchor not found')
              perf = perf.replace(logo_anchor, logo_force + logo_anchor, 1)

          old_nav = "      var journalAnchor = nav.querySelector('a[href=\"journal/index.html\"]');\n      var journal = makeLink('wpaLiveInstituteNavLink', 'wpa-journal-live-entry', JOURNAL_LIVE_URL, 'Journal Live', 'WPA Journal Live');\n      if (journalAnchor) nav.insertBefore(journal, journalAnchor); else nav.appendChild(journal);"
          new_nav = "      var journalAnchor = nav.querySelector('a[href=\"journal/index.html\"],a[href=\"/journal/index.html\"]');\n      if (!journalAnchor) {\n        journalAnchor = makeLink('wpaJournalInstituteNav', 'wpa-journal-institute-nav-link', JOURNAL_URL, 'WPA Journal', 'WPA Journal');\n        nav.appendChild(journalAnchor);\n      } else {\n        journalAnchor.classList.add('wpa-journal-institute-nav-link');\n        journalAnchor.setAttribute('translate', 'no');\n        journalAnchor.setAttribute('data-no-i18n', 'true');\n        journalAnchor.textContent = 'WPA Journal';\n        journalAnchor.title = 'WPA Journal';\n      }\n      var journal = makeLink('wpaLiveInstituteNavLink', 'wpa-journal-live-entry', JOURNAL_LIVE_URL, 'Journal Live', 'WPA Journal Live');\n      journalAnchor.insertAdjacentElement('afterend', journal);"
          if old_nav in perf:
              perf = perf.replace(old_nav, new_nav)
          elif "wpaJournalInstituteNav" not in perf:
              raise SystemExit('Institute Journal navigation anchor not found')

          old_hero = "      var briefings = hero.querySelector('a[href=\"wpa-briefings.html\"]');\n      var subHero = makeLink('wpaSublimateInstituteHero', 'btn btn-primary wpa-sublimate-hero-button', SUBLIMATE_URL, copy.openSublimate, 'WPA Sublimate Engine Preview');\n      var journalHero = makeLink('wpaLiveInstituteHeroLink', 'btn btn-primary wpa-journal-live-entry', JOURNAL_LIVE_URL, copy.openJournal, 'WPA Journal Live');\n\n      if (briefings) {\n        briefings.insertAdjacentElement('afterend', subHero);\n        subHero.insertAdjacentElement('afterend', journalHero);\n      } else {\n        hero.appendChild(subHero);\n        hero.appendChild(journalHero);\n      }"
          new_hero = "      var briefings = hero.querySelector('a[href=\"wpa-briefings.html\"]');\n      var journalLabel = copy.lang === 'mk' ? 'Отвори WPA Journal' : (copy.lang === 'fr' ? 'Ouvrir WPA Journal' : 'Open WPA Journal');\n      var journalIssueHero = makeLink('wpaJournalInstituteHero', 'btn btn-primary wpa-journal-hero-button', JOURNAL_URL, journalLabel, 'WPA Journal');\n      var subHero = makeLink('wpaSublimateInstituteHero', 'btn btn-primary wpa-sublimate-hero-button', SUBLIMATE_URL, copy.openSublimate, 'WPA Sublimate Engine Preview');\n      var journalHero = makeLink('wpaLiveInstituteHeroLink', 'btn btn-primary wpa-journal-live-entry', JOURNAL_LIVE_URL, copy.openJournal, 'WPA Journal Live');\n\n      if (briefings) {\n        briefings.insertAdjacentElement('afterend', journalIssueHero);\n        journalIssueHero.insertAdjacentElement('afterend', subHero);\n        subHero.insertAdjacentElement('afterend', journalHero);\n      } else {\n        hero.appendChild(journalIssueHero);\n        hero.appendChild(subHero);\n        hero.appendChild(journalHero);\n      }"
          if old_hero in perf:
              perf = perf.replace(old_hero, new_hero)
          elif "wpaJournalInstituteHero" not in perf:
              raise SystemExit('Institute hero Journal anchor not found')

          if perf != original_perf:
              perf_path.write_text(perf, encoding='utf-8')
              changed.append('scripts/wpa-performance.js')

          # 3) Real logo should fit without cropping.
          css_path = Path('styles/wpa-institute-compact-brand.css')
          css = css_path.read_text(encoding='utf-8')
          original_css = css
          css = css.replace('  object-fit:cover !important;', '  object-fit:contain !important;')
          if css != original_css:
              css_path.write_text(css, encoding='utf-8')
              changed.append('styles/wpa-institute-compact-brand.css')

          # 4) Governance note: do not regress to letter monogram or drop Journal from Institute header.
          note = Path('docs/WPA_INSTITUTE_HEADER_CANONICAL_2026-09-03.md')
          note.write_text('''# WPA Institute header canonical state — 2026-09-03\n\n- Primary Institute header must show the real WPA logo asset (`/logo.webp`), not the legacy `assets/img/logo.svg` WPA-letter monogram.\n- Primary Institute navigation must contain **WPA Journal** and **Journal Live** as distinct destinations.\n- WPA Journal: `/journal/index.html`.\n- WPA Journal Live: `/journal/live/`.\n- Journal CTAs on the Institute page use high-contrast navy/cream/gold treatment; they must not regress to low-contrast black text.\n- `scripts/wpa-performance.js` is the runtime repair layer and must preserve these elements if static markup is modified by other layers.\n''', encoding='utf-8')
          changed.append(str(note))

          # Assertions.
          inst_check = inst_path.read_text(encoding='utf-8')
          perf_check = perf_path.read_text(encoding='utf-8')
          if 'src="/assets/img/logo.svg"' in inst_check:
              raise SystemExit('Legacy WPA-letter SVG still used by Institute header')
          for token in ['/logo.webp', 'WPA Journal', 'wpa-journal-institute-nav-link']:
              if token not in inst_check and token not in perf_check:
                  raise SystemExit('Missing canonical Institute header token: ' + token)
          for token in ['wpaJournalInstituteHero', 'JOURNAL_URL', "logo.src = '/logo.webp'", 'wpaLiveInstituteNavLink']:
              if token not in perf_check:
                  raise SystemExit('Missing runtime header token: ' + token)

          print('Changed files:')
          for item in changed:
              print(' -', item)

      - name: Commit Institute header corrections
        run: |
          git config user.name "WPA Header Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add institute.html scripts/wpa-performance.js styles/wpa-institute-compact-brand.css docs/WPA_INSTITUTE_HEADER_CANONICAL_2026-09-03.md
          git commit -m "Fix Institute header Journal links and restore WPA logo"
          git push
