name: WPA Comprehensive Hardening Run

# Archived historical mutator — replaced by read-only canonical consistency audit.
# Do not run the 2026-08-22 source overwriter: it contained 26/19 historical totals.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-comprehensive-hardening-run.yml'
      - 'data/wpa-canonical-metrics-status.json'
      - 'data/wpa-canonical-public-facts.json'
      - 'scripts/render_canonical_public_metrics.py'

permissions:
  contents: read

jobs:
  run-hardening:
    name: Read-only canonical audit (historical mutator retired)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify current canonical publication facts
        run: |
          python scripts/render_canonical_public_metrics.py --check
          python scripts/test_canonical_metrics_regression.py
          python scripts/validate_canonical_public_truth.py
      - name: Confirm this workflow has no writeback
        run: |
          git diff --check
          echo 'Read-only audit. Historical 26/19 mutation and git push to main are retired.'
