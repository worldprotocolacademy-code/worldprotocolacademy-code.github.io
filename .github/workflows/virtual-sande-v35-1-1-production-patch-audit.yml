name: Virtual Sande v35.1.1 Production Patch Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-v35.1.1-production-patch-evidence.json'
      - 'config/virtual-sande-current-state.json'
      - '.github/workflows/virtual-sande-current-state-audit.yml'
      - '.github/workflows/virtual-sande-v35-1-1-production-patch-audit.yml'
      - '.github/workflows/virtual-sande-v35-1-staging-recertification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate production evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('config/virtual-sande-v35.1.1-production-patch-evidence.json').read_text())
          state = json.loads(Path('config/virtual-sande-current-state.json').read_text())
          assert evidence['version'] == 'v35.1.1'
          assert evidence['status'] == 'PRODUCTION_PATCH_DEPLOYED_AND_ACCEPTED'
          assert evidence['workflow_run_number'] == 3
          assert evidence['workflow_run_id'] == 29485825251
          assert evidence['job_id'] == 87579958160
          assert evidence['certified_candidate_sha'] == '1576d7a2ccc3b674e84c6cb13537558dcaa4668c'
          assert evidence['release_sha'] == 'b43a4133c106317db0548e9bdd5831eb9c7fa87f'
          assert evidence['response_contract'] == 'wpa-virtual-sande-response-v1.1'
          assert evidence['gates']['protected_environment_approval'] == 'PASSED'
          assert evidence['gates']['exact_certified_runtime_guard'] == 'PASSED'
          assert evidence['gates']['production_deploy'] == 'PASSED'
          assert evidence['gates']['stable_health_and_greeting_propagation'] == 'PASSED'
          assert evidence['gates']['production_acceptance'] == 'PASSED'
          assert evidence['gates']['security_guards'] == 'PASSED'
          assert evidence['gates']['public_consumer_changes'] is False
          assert evidence['gates']['legacy_rollback_worker_retained'] is True
          assert evidence['artifact']['id'] == 8370399164
          assert evidence['artifact']['digest'] == 'sha256:4d521447841a48c560fa4e9a61c8dcfa999cde0560e9f29d58451b95ec7b2f48'
          assert state['public_production']['version'] == 'v35.1.1'
          assert state['consistency_patch']['production_patch_status'] == 'DEPLOYED_AND_ACCEPTED'
          PY

      - name: Verify exact finalization boundary
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base" "$head")"
          git diff --name-only "$merge_base" "$head" | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
            'config/virtual-sande-v35.1.1-production-patch-evidence.json',
            'config/virtual-sande-current-state.json',
            '.github/workflows/virtual-sande-current-state-audit.yml',
            '.github/workflows/virtual-sande-v35-1-1-production-patch-audit.yml',
            '.github/workflows/virtual-sande-v35-1-staging-recertification-audit.yml',
          }
          actual = {x for x in Path('/tmp/changed.txt').read_text().splitlines() if x}
          if actual != allowed:
              raise SystemExit(f'Unexpected production finalization boundary: actual={sorted(actual)}')
          PY

      - name: Production finalization boundary
        run: |
          {
            echo '## Virtual Sande v35.1.1 Production Finalization'
            echo '- Protected production patch: **Passed**'
            echo '- Stable health and greeting propagation: **Passed**'
            echo '- Production acceptance: **Passed**'
            echo '- Evidence artifact: **Recorded**'
            echo '- Staging certification history preserved: **Yes**'
            echo '- Frontend consumer changes: **No**'
            echo '- Runtime changes in finalization PR: **No**'
            echo '- Legacy rollback Worker retained: **Yes**'
          } >> "$GITHUB_STEP_SUMMARY"
