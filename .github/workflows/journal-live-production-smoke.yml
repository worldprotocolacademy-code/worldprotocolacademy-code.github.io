name: WPA Journal Live Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: wpa-journal-live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ROOT: https://wpa-live-production-bridge.worldprotocolacademy.workers.dev
      PUBLIC_ORIGIN: https://worldprotocolacademy.mk
    steps:
      - name: Check live endpoint contract and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 25 \
            -H "Origin: ${PUBLIC_ORIGIN}" \
            -H 'Accept: application/json' \
            -D /tmp/live.headers \
            "${API_ROOT}/api/v1/live?limit=5" \
            -o /tmp/live.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/live.json').read_text())
          if not isinstance(data, dict):
              raise SystemExit('live endpoint must return a JSON object')
          if not isinstance(data.get('items'), list):
              raise SystemExit('live endpoint missing items[] contract')
          headers = Path('/tmp/live.headers').read_text().lower()
          origin = 'https://worldprotocolacademy.mk'
          if f'access-control-allow-origin: {origin}' not in headers and 'access-control-allow-origin: *' not in headers:
              raise SystemExit('CORS check failed for worldprotocolacademy.mk on /api/v1/live')
          print(f"live contract + CORS: PASS ({len(data['items'])} sample items)")
          PY

      - name: Probe optional stats endpoint
        shell: bash
        run: |
          set -u
          code="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 25 \
            -H "Origin: ${PUBLIC_ORIGIN}" \
            -H 'Accept: application/json' \
            -o /tmp/stats.json -w '%{http_code}' \
            "${API_ROOT}/api/v1/stats" || true)"
          echo "stats HTTP ${code}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/stats.json')
          if not p.exists():
              print('stats: unavailable; frontend compatibility fallback expected')
          else:
              try:
                  data=json.loads(p.read_text())
              except Exception:
                  print('stats: non-JSON response; frontend compatibility fallback expected')
              else:
                  if isinstance(data, dict) and data.get('error') == 'not_found':
                      print('stats: route not found; frontend compatibility fallback expected')
                  else:
                      print('stats: endpoint present')
          PY

      - name: Probe optional ticker endpoint
        shell: bash
        run: |
          set -u
          code="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 25 \
            -H "Origin: ${PUBLIC_ORIGIN}" \
            -H 'Accept: application/json' \
            -o /tmp/ticker.json -w '%{http_code}' \
            "${API_ROOT}/api/v1/ticker?limit=5&since_hours=168" || true)"
          echo "ticker HTTP ${code}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/ticker.json')
          if not p.exists():
              print('ticker: unavailable; frontend compatibility fallback expected')
          else:
              try:
                  data=json.loads(p.read_text())
              except Exception:
                  print('ticker: non-JSON response; frontend compatibility fallback expected')
              else:
                  if isinstance(data, dict) and data.get('error') == 'not_found':
                      print('ticker: route not found; frontend compatibility fallback expected')
                  elif isinstance(data, dict) and isinstance(data.get('items'), list):
                      print(f"ticker: endpoint present ({len(data['items'])} sample items)")
                  else:
                      print('ticker: unexpected contract; frontend compatibility fallback expected')
          PY

      - name: Report production smoke success
        run: echo 'WPA Journal Live authoritative /api/v1/live endpoint and CORS passed; auxiliary endpoints are probed separately.'
