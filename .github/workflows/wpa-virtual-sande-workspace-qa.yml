name: WPA Virtual Sande Academic Workspace QA
on:
  pull_request:
    paths:
      - 'scripts/wpa-virtual-sande-workspace.js'
      - 'scripts/virtual-sande-public-widget.js'
      - 'scripts/virtual-sande-institute-widget.js'
      - 'scripts/test_virtual_sande_academic_workspace.mjs'
      - '.github/workflows/wpa-virtual-sande-workspace-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-workspace:
    name: Evidence passport, copy, export, clear and consent (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and change hygiene
        run: |
          node --check scripts/wpa-virtual-sande-workspace.js
          node --check scripts/virtual-sande-public-widget.js
          node --check scripts/virtual-sande-institute-widget.js
          node --check scripts/test_virtual_sande_academic_workspace.mjs
          git diff --check
      - name: Install ephemeral Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Read-only local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wpa-workspace-test-http.log 2>&1 &
          echo $! >/tmp/wpa-workspace-test-http.pid
          for attempt in $(seq 1 25); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8765/ >/dev/null; then break; fi
            if ! kill -0 "$(cat /tmp/wpa-workspace-test-http.pid)" 2>/dev/null; then
              cat /tmp/wpa-workspace-test-http.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8765/ >/dev/null
      - name: Test source passport and workspace controls
        run: node scripts/test_virtual_sande_academic_workspace.mjs
      - name: Preserve screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpa-virtual-sande-academic-workspace-evidence
          path: qa-output/virtual-sande-workspace/
          retention-days: 30
          if-no-files-found: warn
