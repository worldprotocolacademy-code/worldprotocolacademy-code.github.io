name: USE THIS - AI Search v3 Final Clean Instance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a protected final-instance operation'
        required: true
        default: PLAN
        type: choice
        options:
          - PLAN
          - STATUS
          - APPLY
      approval:
        description: 'Required only for APPLY'
        required: true
        default: DO_NOT_APPROVE
        type: choice
        options:
          - DO_NOT_APPROVE
          - APPROVE_CREATE_FINAL_CLEAN_V3

permissions:
  contents: read

concurrency:
  group: ai-search-v3-final-clean-instance
  cancel-in-progress: false

jobs:
  final_instance:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: staging
    env:
      OUT: /tmp/ai-search-v3-final-instance

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          printf '{"mode":"%s","approval":"%s","run_id":"%s","sha":"%s"}\n' \
            '${{ inputs.mode }}' '${{ inputs.approval }}' '${{ github.run_id }}' '${{ github.sha }}' > "$OUT/run-context.json"

      - name: Enforce operation gate
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -uo pipefail
          fail() {
            reason="$1"
            printf '{"status":"gate_failed","reason":"%s"}\n' "$reason" > "$OUT/gate-failure.json"
            echo "::error title=AI Search final-instance gate failed::$reason"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || fail 'CLOUDFLARE_ACCOUNT_ID is missing'
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN" || fail 'CLOUDFLARE_AI_SEARCH_TOKEN is missing'
          case "$MODE" in
            PLAN|STATUS)
              test "$APPROVAL" = DO_NOT_APPROVE || fail 'PLAN/STATUS requires DO_NOT_APPROVE'
              ;;
            APPLY)
              test "$APPROVAL" = APPROVE_CREATE_FINAL_CLEAN_V3 || fail 'APPLY requires exact final-instance approval'
              ;;
            *) fail 'unknown mode' ;;
          esac
          printf '{"status":"gate_passed","mode":"%s"}\n' "$MODE" > "$OUT/gate-result.json"

      - name: Install and test controller
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet requests
          python3 -m py_compile scripts/ai_search_v3_final_instance.py
          python3 scripts/ai_search_v3_final_instance.py --self-test | tee "$OUT/self-test.log"

      - name: Run protected operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          python3 scripts/ai_search_v3_final_instance.py \
            --mode '${{ inputs.mode }}' \
            --approval '${{ inputs.approval }}' \
            --out "$OUT" 2>&1 | tee "$OUT/operation.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          for file in plan.json status.json result.json; do
            if [ -f "$OUT/$file" ]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$OUT/$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Safety summary
        if: always()
        run: |
          {
            echo '### AI Search v3 final clean instance'
            echo '- Target: `protocol-ai-v3-final` only.'
            echo '- PLAN and STATUS use GET requests only.'
            echo '- APPLY may create exactly one new AI Search instance and at most one initial sync job.'
            echo '- Creation uses the locked include pattern and the exact three CSV exclusions from birth.'
            echo '- APPLY refuses to overwrite or reuse an existing target.'
            echo '- Final success requires exactly 790 Indexed, 0 Skipped, 0 Errored, 0 Queued, 0 Running, and 0 Outdated.'
            echo '- The original 793-key source SHA and verified 790-key active SHA must remain locked.'
            echo '- No R2 objects, production Worker, or existing AI Search instances are changed or deleted.'
            echo '- No production cutover exists in this workflow.'
            for file in gate-failure.json failure.json; do
              if [ -f "$OUT/$file" ]; then echo '```json'; cat "$OUT/$file"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-search-v3-final-instance-${{ github.run_number }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
