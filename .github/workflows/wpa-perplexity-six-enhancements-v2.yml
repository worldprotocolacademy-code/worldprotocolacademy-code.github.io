name: WPA Perplexity Six Controlled Enhancements v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wpa-perplexity-six-enhancements-v2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wpa-perplexity-six-enhancements-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply controlled enhancements
        run: python3 scripts/wpa-perplexity-six-enhancements-v2.py
      - name: Verify six enhancements and freeze invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WPA Brand Architecture' brand-architecture.html
          grep -q 'Export BibTeX' bibliography/index.html
          grep -q 'Export RIS' bibliography/index.html
          grep -q 'Export CSV' bibliography/index.html
          grep -q 'Краток апстракт' working-papers/index.html
          grep -q 'Source & Attribution Logic' virtual-sande-ai.html
          grep -q 'Component Map' audio-media-engine.html
          grep -q 'INACTIVE / FROZEN' audio-media-engine.html
          ! grep -q 'EUR 4,820' audio-media-engine.html
          ! grep -q 'PPP voiceover' audio-media-engine.html
          ! grep -q '>Монетизација<' audio-media-engine.html
      - name: Commit enhancements
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No changes required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-architecture.html institute.html bibliography/index.html working-papers/index.html virtual-sande-ai.html audio-media-engine.html
          git commit -m 'Implement six controlled WPA enhancements'
          git push origin main
