name: Apply Publication Integrity Static Patch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply_publication_integrity_static.py
      - .github/workflows/apply-publication-integrity-static.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.number == 37 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed static patch
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/apply_publication_integrity_static.py > publication-integrity-run.log 2>&1
          status=$?
          cat publication-integrity-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic only on assertion failure
        if: steps.apply.outputs.status != '0'
        run: |
          git restore institute.html papers.html locales/institute/mk.json locales/institute/en.json locales/institute/locales/institute/mk.json locales/institute/locales/institute/en.json 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publication-integrity-run.log
          git commit -m "Record publication integrity assertion failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
      - name: Verify allowed file scope
        if: steps.apply.outputs.status == '0'
        run: |
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'institute.html',
              'papers.html',
              'locales/institute/mk.json',
              'locales/institute/en.json',
              'locales/institute/locales/institute/mk.json',
              'locales/institute/locales/institute/en.json',
          }
          changed = {x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          required = {'institute.html', 'papers.html'}
          if not required.issubset(changed):
              raise SystemExit(f'Required public files not changed: {sorted(required - changed)}')
          if 'tools/wpa-digital-pavilion/index.html' in changed:
              raise SystemExit('Digital Pavilion guard failed')
          PY
      - name: Commit verified static changes
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add institute.html papers.html locales/institute/mk.json locales/institute/en.json locales/institute/locales/institute/mk.json locales/institute/locales/institute/en.json
          git diff --cached --quiet && { echo 'No verified changes to commit'; exit 1; }
          git commit -m "Align Institute and Papers publication integrity statically"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
