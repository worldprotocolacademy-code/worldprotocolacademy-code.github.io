name: WPA Protocol Living Lab CI

on:
  pull_request:
    paths:
      - 'protocol-living-lab/**'
      - 'scripts/verify_protocol_living_lab.py'
      - 'scripts/living_lab_interaction_smoke.cjs'
      - '.github/workflows/protocol-living-lab.yml'
      - 'institute.html'
  push:
    branches: [main]
    paths:
      - 'protocol-living-lab/**'
      - 'scripts/verify_protocol_living_lab.py'
      - '.github/workflows/protocol-living-lab.yml'
      - 'institute.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-living-lab:
    name: Validate Living Lab scientific and functional contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate evidence, rubric and web app boundaries
        run: python scripts/verify_protocol_living_lab.py
      - name: JavaScript syntax verification
        run: |
          node --check protocol-living-lab/lab.js
          node --check scripts/living_lab_interaction_smoke.cjs
      - name: Exercise scenario choices and local exports in a deterministic DOM harness
        run: node scripts/living_lab_interaction_smoke.cjs
      - name: Compile Python validator
        run: python -m py_compile scripts/verify_protocol_living_lab.py
