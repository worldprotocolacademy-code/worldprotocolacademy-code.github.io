name: Virtual Sande Connected Vessels and AI Council CI

on:
  pull_request:
    paths:
      - 'data/wpa-module-registry.json'
      - 'data/wpa-ai-council-80.json'
      - 'data/wpaws-proactive-research-mandate.json'
      - 'data/wpa-strategic-speed-directive.json'
      - 'data/wpa-preventive-source-compliance-gate.json'
      - 'data/wpa-doctrine-kernel.json'
      - 'data/wpa-student-lifecycle.json'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.test.mjs'
      - 'tools/virtual-sande/wpa-central-orchestrator.mjs'
      - 'tools/virtual-sande/wpa-central-orchestrator.test.mjs'
      - 'tools/virtual-sande/wpa-doctrine-kernel.mjs'
      - 'tools/virtual-sande/wpa-doctrine-kernel.test.mjs'
      - 'tools/virtual-sande/wpa-ai-council-phase3.mjs'
      - 'tools/virtual-sande/wpa-ai-council-phase3.test.mjs'
      - 'tools/virtual-sande/wpa-ai-council-prompt-compiler.mjs'
      - 'tools/virtual-sande/wpa-ai-council-prompt-compiler.test.mjs'
      - 'scripts/virtual-sande-connected-vessels.js'
      - '.github/workflows/virtual-sande-v35-2-connected-vessels-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.mjs
          node --check tools/virtual-sande/wpa-central-orchestrator.mjs
          node --check tools/virtual-sande/wpa-doctrine-kernel.mjs
          node --check tools/virtual-sande/wpa-ai-council-phase3.mjs
          node --check tools/virtual-sande/wpa-ai-council-prompt-compiler.mjs
          node --check scripts/virtual-sande-connected-vessels.js
      - name: JSON validation
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('data/wpa-module-registry.json','utf8')); if(!Array.isArray(r.modules)||r.architecture!=='WPA six-level governed constitutional command architecture'||!r.doctrine_kernel||!r.source_compliance_gate||!r.strategic_speed_directive||!r.student_lifecycle) process.exit(1); if(r.student_lifecycle.stages!==10||r.student_lifecycle.orchestrator!=='virtual_sande'||r.student_lifecycle.official_wpa_logo!=='/logo.png') process.exit(1);"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('data/wpa-ai-council-80.json','utf8')); const total=c.pillars.reduce((n,p)=>n+p.seats,0); if(c.pillars.length!==10||total!==80||c.governance.doctrine_kernel_required!==true||c.seat_policy.authority!=='bounded_task_execution') process.exit(1);"
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('data/wpa-preventive-source-compliance-gate.json','utf8')); if(g.mode!=='fail_closed'||g.trigger_position!=='before_any_content_access'||g.default_decision!=='deny_until_verified') process.exit(1);"
          node -e "const fs=require('fs'); const k=JSON.parse(fs.readFileSync('data/wpa-doctrine-kernel.json','utf8')); if(k.canonical_chain.length!==6||k.canonical_chain[1]!=='wpa_doctrine_kernel'||k.release_gates.length!==6) process.exit(1);"
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/wpa-student-lifecycle.json','utf8')); if(s.orchestrator!=='virtual_sande'||s.stages.length!==10) process.exit(1); const ids=s.stages.map(x=>x.id); if(ids[0]!=='application'||ids[9]!=='certificate_issue') process.exit(1); if(s.boundaries.certificate_is_not_issued_without_authorised_backend_record!==true||!s.backend_requirements.includes('certificate_registry')) process.exit(1);"
      - name: Routing, orchestration and governance tests
        run: |
          node --test tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.test.mjs
          node --test tools/virtual-sande/wpa-doctrine-kernel.test.mjs
          node --test tools/virtual-sande/wpa-central-orchestrator.test.mjs
          node --test tools/virtual-sande/wpa-ai-council-phase3.test.mjs
          node --test tools/virtual-sande/wpa-ai-council-prompt-compiler.test.mjs