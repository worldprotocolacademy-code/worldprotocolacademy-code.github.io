name: Virtual Sande Connected Vessels and AI Council CI

on:
  pull_request:
    paths:
      - 'data/wpa-module-registry.json'
      - 'data/wpa-ai-council-80.json'
      - 'data/wpaws-proactive-research-mandate.json'
      - 'data/wpa-strategic-speed-directive.json'
      - 'data/wpa-preventive-source-compliance-gate.json'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.test.mjs'
      - 'tools/virtual-sande/wpa-central-orchestrator.mjs'
      - 'tools/virtual-sande/wpa-central-orchestrator.test.mjs'
      - 'tools/virtual-sande/wpa-ai-council-phase3.mjs'
      - 'tools/virtual-sande/wpa-ai-council-phase3.test.mjs'
      - 'tools/virtual-sande/wpa-ai-council-prompt-compiler.mjs'
      - 'tools/virtual-sande/wpa-ai-council-prompt-compiler.test.mjs'
      - 'scripts/virtual-sande-connected-vessels.js'
      - '.github/workflows/virtual-sande-v35-2-connected-vessels-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.mjs
          node --check tools/virtual-sande/wpa-central-orchestrator.mjs
          node --check tools/virtual-sande/wpa-ai-council-phase3.mjs
          node --check tools/virtual-sande/wpa-ai-council-prompt-compiler.mjs
          node --check scripts/virtual-sande-connected-vessels.js
      - name: JSON validation
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('data/wpa-module-registry.json','utf8')); if(!Array.isArray(r.modules)||!r.central_orchestration||!r.strategic_speed_directive||!r.source_compliance_gate) process.exit(1); if(r.strategic_speed_directive.fast_mission_target_seconds!==60||r.strategic_speed_directive.advanced_mission_target_seconds!==300||r.strategic_speed_directive.full_council_mission_target_seconds!==900||r.strategic_speed_directive.accuracy_over_deadline!==true) process.exit(1); if(r.source_compliance_gate.mode!=='fail_closed'||r.source_compliance_gate.content_reading_allowed_before_pass!==false||r.source_compliance_gate.paywall_bypass!==false||r.source_compliance_gate.unverified_rag_ingestion!==false) process.exit(1);"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('data/wpa-ai-council-80.json','utf8')); const total=c.pillars.reduce((n,p)=>n+p.seats,0); if(c.pillars.length!==10||total!==80) process.exit(1);"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data/wpaws-proactive-research-mandate.json','utf8')); if(m.domains.length!==10||m.agent_mandates.length!==17) process.exit(1); if(m.source_policy.paywall_bypass!==false||m.publication_policy.automatic_publication!==false) process.exit(1);"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/wpa-strategic-speed-directive.json','utf8')); const x=Object.fromEntries(d.mission_classes.map(m=>[m.id,m])); if(x.fast_mission.target_seconds!==60||x.advanced_mission.target_seconds!==300||x.full_council_mission.target_seconds!==900||x.extended_verification.target_seconds!==null) process.exit(1); if(d.execution_policy.accuracy_must_not_be_sacrificed_for_speed!==true||d.execution_policy.deadline_is_target_not_guarantee!==true||d.execution_policy.automatic_publication!==false) process.exit(1);"
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('data/wpa-preventive-source-compliance-gate.json','utf8')); if(g.mode!=='fail_closed'||g.trigger_position!=='before_any_content_access'||g.default_decision!=='deny_until_verified') process.exit(1); if(g.prohibited_actions.paywall_bypass!==true||g.prohibited_actions.credential_bypass!==true||g.prohibited_actions.silent_download!==true||g.prohibited_actions.unverified_rag_ingestion!==true) process.exit(1); if(g.incident_response.delete_if_unauthorised_after_preserving_required_audit_record!==true) process.exit(1);"
      - name: Routing, orchestration and governance tests
        run: |
          node --test tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.test.mjs
          node --test tools/virtual-sande/wpa-central-orchestrator.test.mjs
          node --test tools/virtual-sande/wpa-ai-council-phase3.test.mjs
          node --test tools/virtual-sande/wpa-ai-council-prompt-compiler.test.mjs