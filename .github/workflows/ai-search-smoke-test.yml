name: WPA AI Search Smoke Test

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Question sent to protocol-ai"
        required: false
        default: "What are the main principles of diplomatic protocol?"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN" || { echo "Missing CLOUDFLARE_AI_SEARCH_TOKEN"; exit 1; }

      - name: Query protocol-ai
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail

          payload=$(jq -n --arg query "$QUERY" '{messages:[{role:"user",content:$query}]}')
          response_file=$(mktemp)

          http_code=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/protocol-ai/search" \
            --header "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload")

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "AI Search request failed with HTTP $http_code"
            jq '{success, errors, messages}' "$response_file" 2>/dev/null || cat "$response_file"
            exit 1
          fi

          jq -e '.success == true' "$response_file" >/dev/null
          result_count=$(jq '[.result.chunks[]?] | length' "$response_file")

          echo "AI Search authentication and request succeeded."
          echo "Retrieved chunk count: $result_count"

          if [[ "$result_count" -eq 0 ]]; then
            echo "Request succeeded, but protocol-ai returned no chunks for this query."
            echo "Response shape summary:"
            jq '{success, result_keys: (.result | keys)}' "$response_file"
            exit 1
          fi

          jq '{success, chunk_count: ([.result.chunks[]?] | length)}' "$response_file"
