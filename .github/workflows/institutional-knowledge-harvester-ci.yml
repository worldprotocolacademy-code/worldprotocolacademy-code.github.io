name: WPA Institutional Knowledge Harvester CI
on:
  pull_request:
    paths:
      - 'tools/institutional-knowledge-harvester/**'
      - 'data/wpa-global-institutional-knowledge-harvester.json'
      - '.github/workflows/institutional-knowledge-harvester-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/institutional-knowledge-harvester/**'
      - 'data/wpa-global-institutional-knowledge-harvester.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JSON and syntax
        run: |
          python -m json.tool data/wpa-global-institutional-knowledge-harvester.json >/dev/null
          python -m py_compile tools/institutional-knowledge-harvester/institutional_knowledge_harvester.py
      - name: Queue dry run
        run: python tools/institutional-knowledge-harvester/institutional_knowledge_harvester.py --build-queue --dry-run
      - name: Rights gate dry run
        run: python tools/institutional-knowledge-harvester/institutional_knowledge_harvester.py --document-url https://example.org/example.pdf --institution-id TEST --access-basis OPEN_ACCESS --dry-run
