name: Audit Virtual Sande P18 AI Search Presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-virtual-sande-p18-ai-search-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_INSTANCE: protocol-ai

    steps:
      - name: Inspect active AI Search inventory for P18
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_AI_SEARCH_TOKEN']
          inst=os.environ['AI_SEARCH_INSTANCE']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai-search/namespaces/default/instances/{inst}/items'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json'}

          all_items=[]
          page=1
          total=None
          while True:
              url=base+'?'+urllib.parse.urlencode({'page':page,'per_page':50})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  payload=json.loads(r.read().decode('utf-8-sig'))
              if payload.get('success') is not True:
                  raise SystemExit(f'Inventory API failed: {payload}')
              items=payload.get('result') or []
              all_items.extend(items)
              if total is None:
                  total=int((payload.get('result_info') or {}).get('total_count') or len(items))
              if not items or len(all_items) >= total:
                  break
              page += 1

          needles=[
              'p18-protocol-public-relations',
              'protocol-public-relations',
              'protocol and public relations',
              'protokolot i odnosite so javnosta',
              'протоколот и односите со јавноста',
          ]

          matches=[]
          for item in all_items:
              key=str(item.get('key') or '')
              hay=' '.join(str(item.get(k) or '') for k in ('key','filename','title','source')).lower()
              if any(n.lower() in hay for n in needles):
                  matches.append(item)

          out={
              'instance':inst,
              'reported_total':total,
              'retrieved_items':len(all_items),
              'p18_match_count':len(matches),
              'matches':[{
                  'key':x.get('key'),
                  'filename':x.get('filename'),
                  'title':x.get('title'),
                  'source':x.get('source'),
                  'status':x.get('status'),
              } for x in matches],
              'verdict':'PRESENT' if matches else 'ABSENT',
          }
          open('p18-ai-search-audit.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Publish audit summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('p18-ai-search-audit.json',encoding='utf-8'))
          print('### Virtual Sande P18 AI Search audit')
          print(f"- Instance: **{p['instance']}**")
          print(f"- Inventory: **{p['retrieved_items']}** items")
          print(f"- P18 verdict: **{p['verdict']}**")
          print(f"- Matches: **{p['p18_match_count']}**")
          for x in p['matches'][:10]:
              print(f"- {x.get('key') or x.get('filename') or x.get('title')}")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sande-p18-ai-search-audit
          retention-days: 30
          path: p18-ai-search-audit.json
