name: One-time enable WPA Symbols Expert Assistant v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-enable-symbols-expert.yml'

permissions:
  contents: write

jobs:
  enable-symbols-expert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add expert assistant script to Symbols page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wpaws/protocol-symbols/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./wpa-symbols-assistant-v2.js?v=20260810" defer></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No closing body tag found; refusing broad edit.')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/one-time-enable-symbols-expert.yml').unlink()
          PY

      - name: Commit Symbols expert activation
        shell: bash
        run: |
          git config user.name "WPA maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add wpaws/protocol-symbols/index.html .github/workflows/one-time-enable-symbols-expert.yml
          git commit -m "Activate WPA Symbols Expert Assistant v2"
          git push origin main
