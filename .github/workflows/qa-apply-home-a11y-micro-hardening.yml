name: QA Apply Home Accessibility Micro-Hardening

on:
  push:
    branches:
      - a11y/home-micro-hardening-2026-08-31

permissions:
  contents: write

jobs:
  guarded-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature candidate
        uses: actions/checkout@v7
        with:
          ref: a11y/home-micro-hardening-2026-08-31
          fetch-depth: 0

      - name: Verify expected feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7ed214181cee8e5a05d3a6c1106726490870861a"

      - name: Apply exact guarded accessibility replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:120]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # About tabs: valid tab children/state + canonical 6/26 evidence.
          replace_exact(
              'scripts/wpa-about-interactive.js',
              '<div class="wpa-about-tabs" role="tablist"><button class="active" data-wpa-about-tab="manifest">WPA Manifest</button><button data-wpa-about-tab="position">Позиционирање</button><button data-wpa-about-tab="audience">За кого е WPA</button><button data-wpa-about-tab="evidence">Академска основа</button></div>',
              '<div class="wpa-about-tabs" role="tablist" aria-label="WPA About sections"><button class="active" type="button" role="tab" aria-selected="true" tabindex="0" data-wpa-about-tab="manifest">WPA Manifest</button><button type="button" role="tab" aria-selected="false" tabindex="-1" data-wpa-about-tab="position">Позиционирање</button><button type="button" role="tab" aria-selected="false" tabindex="-1" data-wpa-about-tab="audience">За кого е WPA</button><button type="button" role="tab" aria-selected="false" tabindex="-1" data-wpa-about-tab="evidence">Академска основа</button></div>'
          )
          replace_exact('scripts/wpa-about-interactive.js', '<span class="wpa-about-stat">5</span><strong>Монографии</strong><p>Авторска и стручна основа.</p>', '<span class="wpa-about-stat">6</span><strong>Монографии и прирачници</strong><p>Авторска и стручна основа.</p>')
          replace_exact('scripts/wpa-about-interactive.js', 'Вкупна академска база од 25 публикации.', 'Вкупна академска база од 26 публикации.')
          replace_exact(
              'scripts/wpa-about-interactive.js',
              "box.querySelectorAll('[data-wpa-about-tab]').forEach(function(x){x.classList.toggle('active',x===b)});box.querySelectorAll('[data-wpa-about-panel]').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-wpa-about-panel')===id)});",
              "box.querySelectorAll('[data-wpa-about-tab]').forEach(function(x){var active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-selected',active?'true':'false');x.setAttribute('tabindex',active?'0':'-1')});box.querySelectorAll('[data-wpa-about-panel]').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-wpa-about-panel')===id)});"
          )

          # AI mode tablist: valid tab children/state.
          replace_exact('scripts/wpa-ai-hub-clarity.js', '<div class="wpa-ai-modes" role="tablist"><button class="wpa-ai-mode active" data-mode="learn">', '<div class="wpa-ai-modes" role="tablist" aria-label="Virtual Sande learning modes"><button type="button" role="tab" aria-selected="true" tabindex="0" class="wpa-ai-mode active" data-mode="learn">')
          replace_exact('scripts/wpa-ai-hub-clarity.js', '<button class="wpa-ai-mode" data-mode="practice">', '<button type="button" role="tab" aria-selected="false" tabindex="-1" class="wpa-ai-mode" data-mode="practice">')
          replace_exact('scripts/wpa-ai-hub-clarity.js', '<button class="wpa-ai-mode" data-mode="advise">', '<button type="button" role="tab" aria-selected="false" tabindex="-1" class="wpa-ai-mode" data-mode="advise">')
          replace_exact('scripts/wpa-ai-hub-clarity.js', '<button class="wpa-ai-mode" data-mode="coach">', '<button type="button" role="tab" aria-selected="false" tabindex="-1" class="wpa-ai-mode" data-mode="coach">')
          replace_exact(
              'scripts/wpa-ai-hub-clarity.js',
              "hub.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});document.getElementById('wpaAiOutput').innerHTML=texts[b.getAttribute('data-mode')]",
              "hub.querySelectorAll('[data-mode]').forEach(function(x){var active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-selected',active?'true':'false');x.setAttribute('tabindex',active?'0':'-1')});document.getElementById('wpaAiOutput').innerHTML=texts[b.getAttribute('data-mode')]"
          )

          # Programme adviser select accessible name.
          replace_exact('scripts/wpa-programme-families-interactive.js', '<select id="wpaPfNeed">', '<select id="wpaPfNeed" aria-label="Примарна професионална потреба">')

          # Targeted contrast only; do not reactivate broad historical contrast override.
          replace_exact('scripts/wpa-home-audio-video-session-card.js', 'color:var(--goldd);font:700 9.5px/1 var(--fb);', 'color:#7a5d18;font:700 9.5px/1 var(--fb);')
          replace_exact('scripts/wpa-home-audio-video-session-card.js', 'color:var(--goldd);font-size:11.5px;font-weight:700;', 'color:#7a5d18;font-size:11.5px;font-weight:700;')
          replace_exact('scripts/wpa-home-audio-video-session-card.js', 'background:transparent;color:var(--goldd)!important;border:1px solid var(--line);', 'background:transparent;color:#7a5d18!important;border:1px solid var(--line);')
          replace_exact('wpa-public-entry-layer.css', '  color:var(--goldd);\n  font-size:11px;', '  color:#7a5d18;\n  font-size:11px;')
          p = Path('wpa-public-entry-layer.css')
          text = p.read_text(encoding='utf-8')
          if '#pricing-contact a{' in text:
              raise SystemExit('wpa-public-entry-layer.css: pricing-contact accessibility override unexpectedly already exists')
          p.write_text(text + '\n#pricing-contact a{\n  color:#7a5d18 !important;\n}\n', encoding='utf-8')
          replace_exact('scripts/wpa-home-promo-cleanup.js', 'color:rgba(248,244,238,.46);font-size:9.8px;', 'color:rgba(248,244,238,.48);font-size:9.8px;')

          # Expand canonical truth validator so runtime-generated About copy cannot regress to 5/25.
          replace_exact(
              'scripts/validate_canonical_public_truth.py',
              'active=["index.html","institute.html","mk.json","index/mk.json","locales/index/mk.json","locales/locales/index/mk.json"]',
              'active=["index.html","institute.html","mk.json","index/mk.json","locales/index/mk.json","locales/locales/index/mk.json","scripts/wpa-about-interactive.js"]'
          )
          replace_exact(
              'scripts/validate_canonical_public_truth.py',
              'for token in ["25 публикации (5 монографии","5 монографии и прирачници, 1 докторска дисертација, 19 научни трудови и прилози — 25 публикации","25 publications"]:',
              'for token in ["25 публикации (5 монографии","5 монографии и прирачници, 1 докторска дисертација, 19 научни трудови и прилози — 25 публикации","25 publications","Вкупна академска база од 25 публикации.",">5</span><strong>Монографии</strong>"]:'
          )
          PY

      - name: Validate source and canonical truth
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py
          grep -q 'role="tab" aria-selected="true"' scripts/wpa-about-interactive.js
          grep -q 'role="tab" aria-selected="true"' scripts/wpa-ai-hub-clarity.js
          grep -q 'aria-label="Примарна професионална потреба"' scripts/wpa-programme-families-interactive.js
          ! grep -q 'Вкупна академска база од 25 публикации' scripts/wpa-about-interactive.js

      - name: Commit to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/wpa-about-interactive.js scripts/wpa-ai-hub-clarity.js scripts/wpa-programme-families-interactive.js scripts/wpa-home-audio-video-session-card.js scripts/wpa-home-promo-cleanup.js scripts/validate_canonical_public_truth.py wpa-public-entry-layer.css
          git diff --cached --quiet && { echo 'No guarded changes produced.' >&2; exit 1; }
          git commit -m 'Harden Home accessibility semantics and contrast'
          git push origin HEAD:a11y/home-micro-hardening-2026-08-31
