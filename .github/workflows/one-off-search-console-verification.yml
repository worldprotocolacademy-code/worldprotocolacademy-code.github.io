name: One-off Search Console verification patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-verification-tag:
    if: github.head_ref == 'fix/search-console-verification-2026-09-09'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add canonical Search Console verification tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<meta name="google-site-verification" content="rJy6kmqcyxuq-qV-QxBOJcSgaleKxoJwf9j_1ZBk3Lw">'
          new = '<meta name="google-site-verification" content="UUh5yj4E39lIl7w6hzn2THf6noPhSxXyFqO88mJyppY">'

          if new not in text:
              if old not in text:
                  raise SystemExit('Existing verification anchor not found; refusing blind edit.')
              text = text.replace(old, old + '\n' + new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch back to PR branch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Verification tag already present; no commit needed."
            exit 0
          fi
          git config user.name "WPA Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add canonical Search Console verification tag"
          git push origin HEAD:${{ github.head_ref }}
