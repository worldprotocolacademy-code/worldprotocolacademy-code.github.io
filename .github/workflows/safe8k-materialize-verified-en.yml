name: SAFE-8K Materialize Verified EN

on:
  push:
    branches:
      - fix/translator-root-architecture-safe8k-20260901
    paths:
      - '.github/workflows/safe8k-materialize-verified-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'worldprotocolacademy-code/worldprotocolacademy-code.github.io' && github.ref == 'refs/heads/fix/translator-root-architecture-safe8k-20260901'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/translator-root-architecture-safe8k-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Guard exact branch and clean tree
        run: |
          test "$(git branch --show-current)" = "fix/translator-root-architecture-safe8k-20260901"
          test -z "$(git status --porcelain)"
      - name: Install deterministic builder dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compose canonical English locale candidates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          function compose(basePath, overlayPath, outPath){
            const base=JSON.parse(fs.readFileSync(basePath,'utf8'));
            const overlay=JSON.parse(fs.readFileSync(overlayPath,'utf8'));
            const merged={...base,...overlay,_meta:{...(base._meta||{}),...(overlay._meta||{})}};
            fs.writeFileSync(outPath,JSON.stringify(merged,null,2)+'\n');
          }
          compose('locales/index/en.json','locales/rebuild/en/index.override.json','/tmp/wpa-en-home-locale.json');
          compose('locales/institute/en.json','locales/rebuild/en/institute.override.json','/tmp/wpa-en-institute-locale.json');
          NODE
      - name: Build verified static English surfaces
        run: |
          node scripts/build_static_translation.js --source index.html --locale /tmp/wpa-en-home-locale.json --lang en --canonical https://worldprotocolacademy.mk/en/ --output /tmp/wpa-en-home.html --strip-script wpa-translator.js --strip-script wpa-home-full-en.js --strip-script translator-loader --strip-script i18n-v2.js
          node scripts/build_static_translation.js --source institute.html --locale /tmp/wpa-en-institute-locale.json --lang en --canonical https://worldprotocolacademy.mk/en/institute.html --output /tmp/wpa-en-institute.html --single-h1 true --strip-script wpa-translator.js --strip-script wpa-home-full-en.js --strip-script translator-loader --strip-script i18n-v2.js
      - name: Require candidate quality before repository write
        run: python scripts/public_translation_quality_check.py --home /tmp/wpa-en-home.html --institute /tmp/wpa-en-institute.html
      - name: Materialize exact verified bytes
        run: |
          cp /tmp/wpa-en-home.html en/index.html
          cp /tmp/wpa-en-institute.html en/institute.html
      - name: Commit only expected files
        run: |
          git add en/index.html en/institute.html
          changed="$(git diff --cached --name-only | sort)"
          if [ -z "$changed" ]; then
            echo 'No materialization drift; nothing to commit.'
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(en/index\.html|en/institute\.html)$' || true)"
          test -z "$unexpected"
          git config user.name 'worldprotocolacademy-code'
          git config user.email 'worldprotocolacademy@gmail.com'
          git commit -m 'SAFE-8K materialize verified static EN surfaces'
          git push origin HEAD:fix/translator-root-architecture-safe8k-20260901
