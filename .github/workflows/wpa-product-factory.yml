name: WPA 24x7 Institute Operations

# v6: automatic work 24/7; production application requires explicit WPA Human Authority approval.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches:
      - feat/wpa-24x7-product-factory-20260904
    paths:
      - '.github/workflows/wpa-product-factory.yml'
      - 'tools/wpa-institute-ops/**'
      - 'tools/wpa-product-factory/**'
      - 'tools/wpa-watch/**'
      - 'generate-journal-watch.mjs'
      - 'journal/watch/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wpa-24x7-institute-operations
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install WPA Watch dependencies
        working-directory: tools/wpa-watch
        run: npm install --no-audit --no-fund

      - name: 01 COLLECT public-source signals
        working-directory: tools/wpa-watch
        run: |
          npm run watch
          npm run report

      - name: 01 COLLECT open scholarly metadata
        run: node tools/wpa-product-factory/academic-harvest.mjs

      - name: 02 CHECK and structure Journal Watch intelligence
        run: node generate-journal-watch.mjs

      - name: 03 PRODUCE finished WPA products and Protocolometry digest
        run: node tools/wpa-product-factory/build-products.mjs

      - name: 02 CHECK WPA Sublimate source package
        run: |
          node workers/wpa-sublimate-engine-v0.3.0/extract-bundle.mjs
          cd workers/wpa-sublimate-engine-v0.3.0/extracted/wpa-sublimate-engine
          npm install --no-audit --no-fund
          npm test
          npm run check
          echo 'WPA_SUBLIMATE_SOURCE_VALIDATED=1' >> "$GITHUB_ENV"

      - name: 02 CHECK Pilot 20 secured evidence package
        run: |
          python data/global-institutions/pilot-20/v1.3.2/secure_extract_bundle.py --verify
          echo 'WPA_PILOT20_VALIDATED=1' >> "$GITHUB_ENV"

      - name: Build WPA Institute continuous operations status
        env:
          WPA_INSTITUTION_BATCH: '16'
          SUBLIMATE_WORKER_URL: https://wpa-sublimate-engine.worldprotocolacademy.workers.dev
        run: node tools/wpa-institute-ops/build-ops.mjs

      - name: Build simplified owner-approval control surface
        run: node tools/wpa-institute-ops/build-simple-approval.mjs

      - name: Validate generated Institute outputs and approval gate
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('products/manifest.json'));if(!m.products||m.products.length<6)process.exit(1);if(!m.products.some(p=>p.id==='protocolometry-digest'))process.exit(1);console.log('Validated',m.products.length,'product families including Protocolometry');"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('products/protocolometryDigest.json'));if(!Array.isArray(p.measurement_profile)||p.measurement_profile.length<5)process.exit(1);if(!String(p.status||'').includes('NO ORDINAL RANKING'))process.exit(1);console.log('Protocolometry measurement guardrail validated');"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('operations/institute-24x7-status.json'));if(!s.systems||!s.systems.global_institutions||!s.systems.sublimate||!s.systems.product_factory||!s.systems.protocolometry)process.exit(1);console.log('Institute operations status validated');"
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('data/global-institutions/operations/verification-candidates.json'));if(q.status!=='HUMAN_REVIEW_QUEUE_ONLY')process.exit(1);console.log('Institutional queue guardrail validated');"
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('operations/approval-queue.json'));if(a.mode!=='OWNER_APPROVAL_REQUIRED')process.exit(1);if(a.owner_gate?.automatic_production_merge!=='DISABLED')process.exit(1);if(!Array.isArray(a.simple_flow)||a.simple_flow.length!==4)process.exit(1);console.log('Owner approval gate validated');"
          test -s products/index.html
          test -s products/dailyBrief.html
          test -s products/academicRadar.html
          test -s products/editorialDossiers.html
          test -s products/protocolometryDigest.html
          test -s products/sourceAudit.html
          test -s operations/index.html
          test -s operations/simple/index.html
          test -s operations/approval-queue.json

      - name: Commit bootstrap outputs to feature branch
        if: github.event_name == 'push' && github.ref_name == 'feat/wpa-24x7-product-factory-20260904'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/wpa-watch/items.json tools/wpa-watch/status.json journal/watch/topics.json journal/watch/editorial-queue.json tools/wpa-product-factory/data/academic-records.json products/ operations/ data/global-institutions/operations/
          if git diff --cached --quiet; then
            echo 'No bootstrap output changes.'
            exit 0
          fi
          git diff --cached --binary > /tmp/wpa-operations.patch
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          git apply --index /tmp/wpa-operations.patch
          git commit -m 'Bootstrap WPA Institute 24x7 operational outputs'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Prepare scheduled Institute update branch
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B automation/wpa-institute-24x7
          git add tools/wpa-watch/items.json tools/wpa-watch/status.json journal/watch/topics.json journal/watch/editorial-queue.json tools/wpa-product-factory/data/academic-records.json products/ operations/ data/global-institutions/operations/
          if git diff --cached --quiet; then
            echo 'No Institute operational changes.'
            echo 'WPA_PRODUCT_CHANGES=0' >> "$GITHUB_ENV"
          else
            git commit -m "WPA Institute 24x7 update $(date -u +%FT%TZ)"
            git push --force origin automation/wpa-institute-24x7
            echo 'WPA_PRODUCT_CHANGES=1' >> "$GITHUB_ENV"
          fi

      - name: 04 APPROVE prepare protected production PR
        if: github.event_name != 'push' && env.WPA_PRODUCT_CHANGES == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head automation/wpa-institute-24x7 --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base main --head automation/wpa-institute-24x7 \
              --title 'WPA Institute 24x7 update — OWNER APPROVAL REQUIRED' \
              --body 'AUTO WORK completed: COLLECT → CHECK → PRODUCE. Human Gate remains closed. This PR must NOT auto-merge. Sande Smiljanov / WPA Human Authority must explicitly approve before production application. The cycle includes public-source monitoring, scholarly metadata, Journal Watch, Protocolometry, finished WPA work products, Sublimate source validation, Pilot 20 validation and bounded institutional evidence observations. No automatic canonical verification, scientific publication, peer-review decision or official institutional judgment.'
            PR=$(gh pr list --head automation/wpa-institute-24x7 --base main --state open --json number --jq '.[0].number // empty')
          fi
          echo "Owner approval required for production PR: #$PR"
          echo 'AUTO-MERGE IS INTENTIONALLY DISABLED.'
