name: One-off GA4 single bootstrap

on:
  push:
    branches:
      - fix/ga4-single-bootstrap-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ga4-single-bootstrap-2026-09-09
          fetch-depth: 0
      - name: Remove duplicate analytics fallback loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core = Path('scripts/wpa-performance-core.js')
          text = core.read_text(encoding='utf-8')
          needle = ";addScript('wpa-analytics-runtime','/scripts/wpa-analytics.js?v=20260909-2')"
          if needle not in text:
              raise SystemExit('analytics fallback loader anchor not found')
          text = text.replace(needle, '', 1)
          core.write_text(text, encoding='utf-8', newline='\n')

          assert 'wpa-analytics-runtime' not in text
          assert '/scripts/wpa-analytics.js' not in text

          tag_re = re.compile(r'<script\b[^>]*\bsrc=["\']/scripts/wpa-analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          head_re = re.compile(r'<head\b[^>]*>', re.I)
          pages = 0
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','vendor'} for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='replace')
              if not head_re.search(html):
                  continue
              pages += 1
              tags = tag_re.findall(html)
              assert len(tags) == 1, f'{path}: expected one analytics bootstrap, got {len(tags)}'
          print(f'Validated single analytics bootstrap across {pages} HTML pages.')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "WPA Analytics Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/wpa-performance-core.js
          git commit -m "Enforce single GA4 bootstrap path"
          git push origin HEAD:fix/ga4-single-bootstrap-2026-09-09
