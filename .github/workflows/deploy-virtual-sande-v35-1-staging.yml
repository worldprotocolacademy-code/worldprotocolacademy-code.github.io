name: Virtual Sande v35.1 VALIDATE ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-sande-v35-1-staging-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging package
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-staging/wrangler.toml
          test -f workers/virtual-sande-v35.1-staging/src/index.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs
          node --check workers/virtual-sande-v35.1-staging/src/index.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs

      - name: Validate Worker bundle without Cloudflare credentials
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --dry-run \
            --config workers/virtual-sande-v35.1-staging/wrangler.toml

      - name: Validation boundary
        run: |
          echo 'Validation completed locally with Wrangler dry-run only.'
          echo 'No Cloudflare credential, Worker deployment, route, custom domain, secret, KV namespace, D1 database, or production endpoint was accessed or modified.'
