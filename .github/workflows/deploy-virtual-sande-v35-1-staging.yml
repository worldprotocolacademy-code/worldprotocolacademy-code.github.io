name: Virtual Sande v35.1 Staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose validate first. Deploy only after validate succeeds.'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy

permissions:
  contents: read

concurrency:
  group: virtual-sande-v35-1-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging package
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-staging/wrangler.toml
          test -f workers/virtual-sande-v35.1-staging/src/index.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs
          node --check workers/virtual-sande-v35.1-staging/src/index.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs

      - name: Validate Worker bundle only
        if: ${{ inputs.mode == 'validate' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run --config workers/virtual-sande-v35.1-staging/wrangler.toml

      - name: Deploy isolated staging Worker
        id: deploy
        if: ${{ inputs.mode == 'deploy' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/virtual-sande-v35.1-staging/wrangler.toml

      - name: Verify deployment URL
        if: ${{ inputs.mode == 'deploy' }}
        env:
          STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          case "$STAGING_URL" in
            https://*.workers.dev|https://*.workers.dev/) ;;
            *) echo "Unexpected staging deployment URL: $STAGING_URL" >&2; exit 1 ;;
          esac
          echo "STAGING_DEPLOYMENT_URL=$STAGING_URL"
          printf '%s\n' "$STAGING_URL" > /tmp/virtual-sande-staging-url.txt

      - name: Staging smoke test
        if: ${{ inputs.mode == 'deploy' }}
        env:
          STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$STAGING_URL/orchestrator/health" | tee /tmp/health.json
          grep -F 'v35.1' /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е агреман?' \
            --data-urlencode 'lang=mk' | tee /tmp/ask.json
          grep -F 'answer' /tmp/ask.json

      - name: Upload exact staging URL
        if: ${{ inputs.mode == 'deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sande-v35-1-staging-url
          path: /tmp/virtual-sande-staging-url.txt
          retention-days: 30

      - name: Deployment boundary
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          echo 'Staging Worker deployed under the exact workers.dev URL returned by Wrangler.'
          echo 'No production Worker, custom domain, route, secret, KV namespace, or D1 database was modified.'
