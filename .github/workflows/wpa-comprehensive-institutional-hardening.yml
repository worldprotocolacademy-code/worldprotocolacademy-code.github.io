<div class="wia-wrap">
<div class="wia-eye">WPA Institute · HGAIM · Research · Evidence · Human Authority</div>
<h2>WPA Human-Governed Agentic Institution Model · HGAIM</h2>
<p class="wia-lead"><strong>Operationally automated; institutionally human-governed.</strong> WPA's long-term objective is an end-to-end agentic institute lifecycle connecting research, analysis, publication, professional practice and controlled learning. AI may coordinate, prepare and recommend; consequential institutional actions remain subject to authorised human approval.</p>
<div class="wia-note"><strong>Status discipline:</strong> HGAIM is a WPA working institutional model, not an external standard and not a world-first claim. WPA distinguishes LIVE, LIMITED PRODUCTION, STAGING, BETA, PROTOTYPE, PLANNED and CANDIDATE REGISTRY capabilities.</div>
<div class="wia-chain">Human Authority → Doctrine Kernel → Strategic AI Core → Virtual Sande → WPAWS 17 Executive Agents → up to 80 bounded Tactical-Operational Seats → Evidence Gate → Safety Gate → Human Approval → WPA Output</div>
<div class="wia-grid">
<article class="wia-card"><span class="wia-status">Governed</span><h3>Human Authority + Doctrine Kernel</h3><p>Truth, doctrine, authorial-dna and drift checks. No automatic doctrine mutation and no consequential WPA action without the applicable Human Gate.</p></article>
<article class="wia-card"><span class="wia-status">Live production · v35.1.1</span><h3>Virtual Sande</h3><p>Central source-disciplined AI interface and orchestration layer. The v35.2 Connected Vessels branch remains a staging candidate, not the canonical production release.</p></article>
<article class="wia-card"><span class="wia-status">WPAWS 11.1.7</span><h3>17 Executive Agent Roles</h3><p>Governed academic and institutional working environment for writing, analysis, review, citations, protocol, diplomacy, security, publishing and quality control.</p></article>
<article class="wia-card"><span class="wia-status">Bounded capacity</span><h3>Council-80</h3><p>Up to 80 tactical-operational seats across ten professional pillars. Capacity does not mean 80 continuously running autonomous agents; approved activation and bounded mandates are required.</p></article>
<article class="wia-card"><span class="wia-status">Candidate registry</span><h3>Council-54</h3><p>External-AI candidate-seat registry for future verified integrations. A listed seat does not imply API availability, partnership, endorsement or provider participation.</p></article>
<article class="wia-card"><span class="wia-status">Research infrastructure</span><h3>Evidence Pipeline</h3><p>Public or authorised sources → WPA Watch → Academic Search Hub → Protocolometry → WPAWS / Virtual Sande → evidence review → human-reviewed output.</p></article>
<article class="wia-card"><span class="wia-status">Beta / backend required</span><h3>Proactive Academy Lifecycle</h3><p>Ten governed stages from application through completion and certificate authorisation. Real enrolment, payment and official certificate issuance remain disabled until the approved private backend and reviews are in place.</p></article>
<article class="wia-card"><span class="wia-status">Academic evidence</span><h3>Quality, Publications & Correction</h3><p>26-publication corpus (6 monographs/manuals, 1 doctoral dissertation, 19 papers/contributions), DOI/COBISS evidence, provenance, correction rights and the WPA Academic Quality & Evidence Standard.</p></article>
</div>
<div class="wia-gates"><strong>Release discipline:</strong> Preventive Source Compliance → authorised/public sources only → evidence mapping → safety review → human approval. Unknown source rights fail closed. No intelligence, surveillance, investigative or autonomous operational authority is claimed.</div>
<div class="wia-links"><a href="/data/wpa-human-governed-agentic-institution-model.json">HGAIM manifest</a><a href="/data/wpa-institutional-operating-architecture.json">Architecture map</a><a href="/data/wpa-academic-quality-standard.json">Academic Quality Standard</a><a href="/data/wpa-canonical-version-manifest.json">Canonical Versions</a><a href="/data/wpa-public-evidence-index.json">Public Evidence Index</a></div>
<p class="wia-boundary">Educational and certification workflows are one controlled application area within the broader Institute architecture. WPA does not claim university status, state accreditation, external provider endorsement or external-customer AI deployment without separate verifiable evidence.</p>
</div></section>
