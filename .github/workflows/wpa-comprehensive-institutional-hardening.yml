name: WPA Comprehensive Institutional Audit Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify comprehensive audit report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('data/wpa-comprehensive-institutional-audit-2026-08-22.json')
          if not report_path.exists():
              raise SystemExit('Missing comprehensive institutional audit report')

          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status') != 'PASS':
              raise SystemExit(f"Audit report status is {report.get('status')!r}, expected 'PASS'")
          if report.get('failures'):
              raise SystemExit(f"Audit report contains failures: {report['failures']}")

          required = [
              Path('data/wpa-human-governed-agentic-institution-model.json'),
              Path('data/wpa-institutional-operating-architecture.json'),
              Path('data/wpa-canonical-version-manifest.json'),
              Path('data/wpa-public-evidence-index.json'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing required architecture/evidence files: ' + ', '.join(missing))

          print('WPA comprehensive institutional audit verification: PASS')
          PY

      - name: Validate JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [
              'data/wpa-comprehensive-institutional-audit-2026-08-22.json',
              'data/wpa-human-governed-agentic-institution-model.json',
              'data/wpa-institutional-operating-architecture.json',
              'data/wpa-canonical-version-manifest.json',
              'data/wpa-public-evidence-index.json'
          ]:
              json.loads(Path(p).read_text(encoding='utf-8'))
          print('JSON validation: PASS')
          PY
