name: WPA Performance Optimization

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type APPROVE_WPA_PERFORMANCE_OPTIMIZATION
        required: true
        default: DO_NOT_APPROVE
        type: string

permissions:
  contents: write

concurrency:
  group: wpa-performance-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: ${{ inputs.approval == 'APPROVE_WPA_PERFORMANCE_OPTIMIZATION' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize and commit
        run: |
          pip install pillow
          python scripts/run_media_optimizer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Performance: generate WebP and stabilize public pages"
          git push
