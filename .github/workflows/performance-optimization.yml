name: WPA Performance Optimization

on:
  workflow_dispatch:
    inputs:
      force_webp:
        description: Rebuild all WebP files
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - feature/ga4-webp-lazy-cls
    paths:
      - "**.html"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "sitemap.xml"
      - "scripts/optimize_site_media.py"
      - "scripts/wpa-performance.js"
      - "config/analytics.json"
      - ".github/workflows/performance-optimization.yml"

permissions:
  contents: write

concurrency:
  group: wpa-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Optimize canonical public pages
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          FORCE_WEBP: ${{ inputs.force_webp }}
        run: |
          args=(--quality 82)
          if [[ -n "${GA4_MEASUREMENT_ID}" ]]; then
            args+=(--measurement-id "${GA4_MEASUREMENT_ID}")
          fi
          if [[ "${FORCE_WEBP}" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/optimize_site_media.py "${args[@]}"

      - name: Validate generated HTML and configuration
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('.')
          config = json.loads((root / 'config/analytics.json').read_text(encoding='utf-8'))
          measurement_id = str(config.get('measurementId', '')).strip()
          if measurement_id and not re.fullmatch(r'G-[A-Z0-9]{6,20}', measurement_id, re.I):
              raise SystemExit('Invalid GA4 Measurement ID in config/analytics.json')

          tree = ET.parse(root / 'sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          failures = []
          for loc in tree.findall('.//sm:loc', ns):
              if not loc.text:
                  continue
              path = urlparse(loc.text.strip()).path or '/'
              page = root / ('index.html' if path == '/' else path.lstrip('/'))
              if path.endswith('/'):
                  page = page / 'index.html'
              if not page.is_file() or page.suffix.lower() != '.html':
                  continue
              text = page.read_text(encoding='utf-8', errors='replace')
              if text.count('wpa-performance.js') != 1:
                  failures.append(f'{page}: expected exactly one performance module')
              for match in re.finditer(r'<img\b[^>]*>', text, re.I | re.S):
                  tag = match.group(0)
                  if 'loading=' not in tag or 'decoding=' not in tag:
                      failures.append(f'{page}: image missing loading/decoding: {tag[:120]}')
                  src_match = re.search(r'\bsrc=["\']([^"\']+)', tag, re.I)
                  if src_match and src_match.group(1).lower().split('?', 1)[0].endswith(('.png', '.jpg', '.jpeg')):
                      nearby = text[max(0, match.start() - 180):match.start()].lower()
                      if '<picture' not in nearby:
                          failures.append(f'{page}: raster image lacks WebP picture source: {src_match.group(1)}')
              if failures:
                  break
          if failures:
              raise SystemExit('\n'.join(failures[:30]))
          print('WPA performance validation passed.')
          PY

      - name: Commit optimized assets and markup
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No optimization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Performance: generate WebP and stabilize public pages"
          git push
