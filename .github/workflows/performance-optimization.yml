name: WPA Performance Optimization

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type APPROVE_WPA_PERFORMANCE_OPTIMIZATION
        required: true
        default: DO_NOT_APPROVE
        type: string

permissions:
  contents: read

concurrency:
  group: wpa-performance-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: ${{ inputs.approval == 'APPROVE_WPA_PERFORMANCE_OPTIMIZATION' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate optimization candidate
        run: |
          pip install pillow
          python scripts/run_media_optimizer.py
          git diff --binary > wpa-performance-optimization.patch
          git status --short > wpa-performance-optimization-status.txt
      - name: Upload candidate for reviewed PR
        uses: actions/upload-artifact@v7
        with:
          name: wpa-performance-optimization-candidate
          path: |
            wpa-performance-optimization.patch
            wpa-performance-optimization-status.txt
          retention-days: 30
