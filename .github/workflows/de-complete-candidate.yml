name: WPA German Current-State CI

on:
  pull_request:
    paths:
      - 'languages/de/**'
      - 'languages/wpa-public-language-router-v2.js'
      - 'languages/NEW_10_LANGUAGE_STATUS_v1.json'
      - 'data/language-activation.json'
      - 'data/language-readiness-50.json'
      - 'data/language-wave1-readiness.json'
      - 'data/human-gates/de-safe8w-candidate.json'
      - 'data/human-gates/de-safe8x-candidate.json'
      - 'data/human-gates/de-safe8y-candidate.json'
      - 'scripts/de_complete_candidate_check.py'
      - 'scripts/de_public_activation_check.py'
      - 'sitemap.xml'
      - '.github/workflows/de-complete-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'languages/de/**'
      - 'languages/wpa-public-language-router-v2.js'
      - 'languages/NEW_10_LANGUAGE_STATUS_v1.json'
      - 'data/language-activation.json'
      - 'data/language-readiness-50.json'
      - 'data/language-wave1-readiness.json'
      - 'data/human-gates/de-safe8w-candidate.json'
      - 'data/human-gates/de-safe8x-candidate.json'
      - 'data/human-gates/de-safe8y-candidate.json'
      - 'scripts/de_complete_candidate_check.py'
      - 'scripts/de_public_activation_check.py'
      - 'sitemap.xml'
      - '.github/workflows/de-complete-candidate.yml'

permissions:
  contents: read

jobs:
  german-current-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate German current state
        run: python scripts/de_complete_candidate_check.py
      - name: Validate German public activation when registered
        run: |
          python - <<'PY'
          import json,subprocess,sys
          d=json.load(open('data/language-activation.json',encoding='utf-8'))
          if 'de' in d.get('public_languages',[]):
              subprocess.check_call([sys.executable,'scripts/de_public_activation_check.py'])
          else:
              print('German remains nonpublic; SAFE-8W invariant applies.')
          PY
      - name: Validate global language governance
        run: python scripts/global_language_governance_check.py
