name: WPA Student Ops Backend CI

on:
  push:
    paths:
      - 'workers/wpa-student-ops-backend/**'
      - 'data/wpa-student-ops-backend-current-state.json'
      - 'data/wpa-human-gate-policy.json'
      - 'data/wpa-student-lifecycle.json'
      - '.github/workflows/wpa-student-ops-backend-ci.yml'
  pull_request:
    paths:
      - 'workers/wpa-student-ops-backend/**'
      - 'data/wpa-student-ops-backend-current-state.json'
      - 'data/wpa-human-gate-policy.json'
      - 'data/wpa-student-lifecycle.json'
      - '.github/workflows/wpa-student-ops-backend-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/wpa-student-ops-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --package-lock-only && npm ci --ignore-scripts

      - name: Verify backend remains fail-closed in source config
        run: |
          grep -q '"WPA_BACKEND_MODE": "DISABLED"' wrangler.jsonc
          grep -q '"workers_dev": false' wrangler.jsonc
          grep -q '"preview_urls": false' wrangler.jsonc

      - name: Compile Worker only - no deployment
        run: npm run dry-run
