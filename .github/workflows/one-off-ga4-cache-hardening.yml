name: One-off GA4 cache hardening

on:
  push:
    branches:
      - fix/ga4-cache-hardening-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ga4-cache-hardening-2026-09-09
          fetch-depth: 0

      - name: Apply deterministic analytics cache hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'scripts/wpa-performance.js': [
                  ('/scripts/wpa-performance-core.js?v=20260714-3', '/scripts/wpa-performance-core.js?v=20260909-2'),
              ],
              'scripts/optimize_site_media.py': [
                  ('BASE_HOST = "worldprotocolacademy-code.github.io"', 'BASE_HOST = "worldprotocolacademy.mk"'),
                  ('/scripts/wpa-performance.js?v=1.0', '/scripts/wpa-performance.js?v=20260909-2'),
              ],
              'scripts/run_media_optimizer.py': [
                  ('/scripts/wpa-performance.js?v=20260712', '/scripts/wpa-performance.js?v=20260909-2'),
              ],
              'scripts/finalize_homepage.py': [
                  ('/scripts/wpa-performance.js?v=20260712', '/scripts/wpa-performance.js?v=20260909-2'),
              ],
              'index.html': [
                  ('/scripts/wpa-performance.js?v=20260712', '/scripts/wpa-performance.js?v=20260909-2'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{filename}: expected anchor not found: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'{filename}: no change applied')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate analytics chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          perf = Path('scripts/wpa-performance.js').read_text(encoding='utf-8')
          core = Path('scripts/wpa-performance-core.js').read_text(encoding='utf-8')
          analytics = Path('scripts/wpa-analytics.js').read_text(encoding='utf-8')
          config = json.loads(Path('config/analytics.json').read_text(encoding='utf-8'))
          optimizer = Path('scripts/optimize_site_media.py').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          assert '/scripts/wpa-performance-core.js?v=20260909-2' in perf
          assert "/scripts/wpa-analytics.js?v=20260909-1" in core
          assert "send_page_view: true" in analytics
          assert config.get('measurementId') == 'G-14VP7NERHJ'
          assert 'BASE_HOST = "worldprotocolacademy.mk"' in optimizer
          assert '/scripts/wpa-performance.js?v=20260909-2' in index
          print('GA4 loader chain and canonical optimizer host validated.')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "WPA Analytics Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/wpa-performance.js scripts/optimize_site_media.py scripts/run_media_optimizer.py scripts/finalize_homepage.py index.html
          git commit -m "Harden GA4 loader cache and canonical optimizer host"
          git push origin HEAD:fix/ga4-cache-hardening-2026-09-09
