name: DIAGNOSE - Final AI Search Job

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-v3-final-job-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      OUT: /tmp/ai-search-v3-final-job-diagnose
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install and validate
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 -m pip install --disable-pip-version-check --quiet requests
          python3 -m py_compile scripts/ai_search_v3_final_job_diagnose.py

      - name: Read job details and logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ai_search_v3_final_job_diagnose.py 2>&1 | tee "$OUT/operation.log"

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$OUT/diagnosis.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT/diagnosis.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo '### Read-only final AI Search job diagnosis'
            echo '- Target: protocol-ai-v3-final only.'
            echo '- Reads instance, stats, jobs, job details, and job logs.'
            echo '- No POST, PATCH, PUT, DELETE, R2 mutation, Worker change, deletion, or cutover.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-search-v3-final-job-diagnose-${{ github.run_number }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
