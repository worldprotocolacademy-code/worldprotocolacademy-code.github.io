name: WPA Final Source Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wpa-final-source-reconcile-20260826.py'
      - 'scripts/wpa-institute-header-canonical-20260903.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preserve-first reconciliation
        run: |
          python scripts/wpa-final-source-reconcile-20260826.py
          python scripts/wpa-institute-header-canonical-20260903.py
      - name: Commit reconciled source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html institute.html bibliography/index.html working-papers/index.html '*.json' index locales
          git commit -m 'Apply final verified source reconciliation'
          git push origin HEAD:main
