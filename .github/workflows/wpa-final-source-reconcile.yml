name: WPA Final Source Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-final-source-reconcile.yml'
      - 'scripts/wpa-institute-header-canonical-20260903.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Institute header canonical repair
        run: python scripts/wpa-institute-header-canonical-20260903.py
      - name: Publish repaired source to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add institute.html
          git commit -m 'Apply Institute header canonical repair'
          git branch -f bot/institute-header-canonical-20260903 HEAD
          git push --force origin bot/institute-header-canonical-20260903
