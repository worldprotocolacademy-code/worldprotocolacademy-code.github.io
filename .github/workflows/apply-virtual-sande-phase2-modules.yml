name: Apply Virtual Sande Phase 2 Modules

on:
  push:
    branches:
      - feat/wpa-functional-modules-phase1-20260718
    paths:
      - 'scripts/apply-virtual-sande-phase2-modules.py'
      - '.github/workflows/apply-virtual-sande-phase2-modules.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wpa-functional-modules-phase1-20260718
          fetch-depth: 0
      - name: Apply guarded phase 2 integration
        run: python3 scripts/apply-virtual-sande-phase2-modules.py
      - name: Verify all phase 2 loaders
        run: |
          grep -q 'virtual-sande-connected-vessels.js' audio-media-engine.html
          grep -q 'virtual-sande-connected-vessels.js' tools/academic-search-hub/index.html
          grep -q 'virtual-sande-connected-vessels.js' wpaws/protocol-symbols-verified/index.html
          grep -q 'virtual-sande-connected-vessels.js' multi-ai-command-center.html
          grep -q 'virtual-sande-connected-vessels.js' journal/vol-1-issue-1-2026.html
          grep -q 'virtual-sande-connected-vessels.js' wpaws/diplomatic-analysis-lab/index.html
          node --check tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.mjs
          node --test tools/virtual-sande/wpa-protocol-bot-v35.2-connected-vessels.test.mjs
          python3 -m json.tool data/wpa-module-registry.json >/dev/null
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio-media-engine.html tools/academic-search-hub/index.html wpaws/protocol-symbols-verified/index.html multi-ai-command-center.html journal/vol-1-issue-1-2026.html wpaws/diplomatic-analysis-lab/index.html
          if git diff --cached --quiet; then
            echo 'No generated phase 2 changes.'
          else
            git commit -m 'Wire Virtual Sande into phase 2 WPA modules'
            git push origin HEAD:feat/wpa-functional-modules-phase1-20260718
          fi
