name: Diagnose WPA AI Search Skipped Items

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ai-search-skipped.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_NAMESPACE: default
      AI_SEARCH_INSTANCE: protocol-ai
    steps:
      - name: Fetch skipped AI Search items read-only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/namespaces/${AI_SEARCH_NAMESPACE}/instances/${AI_SEARCH_INSTANCE}/items?status=skipped&per_page=50"
          curl -fsS "$api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > skipped-items.raw.json
          python - <<'PY'
          import json
          p=json.load(open('skipped-items.raw.json', encoding='utf-8-sig'))
          if p.get('success') is not True:
              raise SystemExit(f"API failed: {p}")
          items=p.get('result') or []
          safe=[]
          for item in items:
              safe.append({
                  'id': item.get('id'),
                  'key': item.get('key'),
                  'status': item.get('status'),
                  'chunks_count': item.get('chunks_count'),
                  'file_size': item.get('file_size'),
                  'source_id': item.get('source_id'),
                  'next_action': item.get('next_action'),
                  'error': item.get('error'),
                  'last_seen_at': item.get('last_seen_at'),
              })
          out={'count':len(safe),'items':safe,'result_info':p.get('result_info')}
          open('skipped-items.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(f"SKIPPED COUNT: {len(safe)}")
          for x in safe:
              print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-skipped-items-diagnostic
          retention-days: 7
          path: skipped-items.json
