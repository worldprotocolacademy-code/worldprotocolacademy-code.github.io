name: Apply Virtual Sande Connected Vessels

on:
  push:
    branches:
      - feat/wpa-functional-modules-phase1-20260718
    paths:
      - 'scripts/apply-virtual-sande-connected-vessels.py'
      - '.github/workflows/apply-virtual-sande-connected-vessels.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wpa-functional-modules-phase1-20260718
          fetch-depth: 0
      - name: Apply guarded integration
        run: python3 scripts/apply-virtual-sande-connected-vessels.py
      - name: Verify loaders and handoff
        run: |
          grep -q 'virtual-sande-connected-vessels.js' protocolometry-center.html
          grep -q 'virtual-sande-connected-vessels.js' tools/wpa-five-engines.html
          grep -q 'virtual-sande-connected-vessels.js' tools/wpa-watch/index.html
          grep -q 'virtual-sande-connected-vessels.js' journal/watch/index.html
          grep -q 'virtual-sande-connected-vessels.js' student-desk/index.html
          grep -q 'virtual-sande-connected-vessels.js' intelligence-center.html
          grep -q 'virtual-sande-connected-vessels.js' wpa-services.html
          grep -q 'virtual-sande-connected-vessels.js' journal/live/index.html
          grep -q 'virtual-sande-connected-vessels.js' wpa-live-intelligence-feed.html
          grep -q 'virtual-sande-connected-vessels.js' wpa-sublimate-engine.html
          grep -q 'virtual-sande-connected-vessels.js' wpaws/index.html
          grep -q 'wpa-connected-vessels-handoff-consumer' virtual-sande-ai.html
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocolometry-center.html tools/wpa-five-engines.html tools/wpa-watch/index.html journal/watch/index.html student-desk/index.html intelligence-center.html wpa-services.html journal/live/index.html wpa-live-intelligence-feed.html wpa-sublimate-engine.html wpaws/index.html virtual-sande-ai.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Wire Virtual Sande context bridge across WPA modules'
            git push origin HEAD:feat/wpa-functional-modules-phase1-20260718
          fi
