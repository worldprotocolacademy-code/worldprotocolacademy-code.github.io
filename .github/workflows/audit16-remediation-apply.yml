name: WPA Audit-16 Feature Branch Remediation Apply

on:
  push:
    branches:
      - hardening/audit-16-remediation-2026-08-31
    paths:
      - '.github/workflows/audit16-remediation-apply.yml'

permissions:
  contents: write

concurrency:
  group: wpa-audit16-remediation-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/hardening/audit-16-remediation-2026-08-31' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: hardening/audit-16-remediation-2026-08-31
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python scripts/_apply_audit16_remediation_20260831.py

      - name: Validate branch before commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/site_quality_check.py
          python scripts/validate_canonical_public_truth.py
          git diff --check

      - name: Commit only non-workflow remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_apply_audit16_remediation_20260831.py
          git restore --source=HEAD -- .github/workflows
          git clean -fd .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes to commit.'; exit 1; }
          git commit -m 'Harden WPA against audit-16 findings'
          git push origin HEAD:hardening/audit-16-remediation-2026-08-31
