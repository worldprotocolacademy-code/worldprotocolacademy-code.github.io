name: WPA OPN Readiness Finalization 2026-08-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-opn-readiness-finalization-20260824.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize governance wording and OPN pilot readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1) Normalize machine-readable status vocabulary without breaking legacy status consumers.
          arch_path = Path('data/wpa-institutional-operating-architecture.json')
          arch = json.loads(arch_path.read_text(encoding='utf-8'))
          arch['version'] = '1.1.0'
          arch['updated'] = '2026-08-24'
          arch['canonical_runtime_chain'] = 'Human Authority -> Doctrine Kernel -> Strategic AI Core -> Strategic Prompt Router control layer -> Virtual Sande -> WPAWS 17 Executive Agents -> up to 80 bounded Tactical-Operational Seats -> Evidence/Safety/Human Gates -> WPA Output'
          arch['authority_chain'] = 'Human Authority -> Doctrine Kernel -> Strategic AI Core -> Virtual Sande -> WPAWS 17 Executive Agents -> up to 80 bounded Tactical-Operational Seats -> Evidence/Safety/Human Gates -> WPA Output'
          arch['control_layers'] = [{
              'id': 'strategic_prompt_router',
              'version': 'wpa-strategic-prompt-router-1.0.1',
              'position': 'between_strategic_ai_core_and_virtual_sande',
              'creates_authority': False,
              'human_gate_unchanged': True,
              'status': 'PRODUCTION_VERIFIED'
          }]
          mapping = {
              'virtual_sande': ('LIVE', 'PUBLIC_PRODUCTION_DEPLOYED_AND_ACCEPTED'),
              'wpaws': ('IMPLEMENTED_MVP', 'CONTROLLED_WORKING_ENVIRONMENT; 17 governed executive roles; provider adapter availability varies by configuration'),
              'council80': ('IMPLEMENTED_MVP', 'BOUNDED_AGENT_CAPACITY_REQUIRES_APPROVED_ACTIVATION'),
              'council54': ('CANDIDATE_REGISTRY', 'NO_PROVIDER_AFFILIATION_OR_LIVE_INTEGRATION_IMPLIED'),
              'protocolometry': ('IMPLEMENTED_MVP', 'OPERATIONAL_METHODOLOGICAL_CENTER'),
              'academic_search': ('STAGING', 'LEGAL_SAFE_EXTERNAL_DISCOVERY; HUMAN_ACADEMIC_VERIFICATION_REQUIRED'),
              'wpa_watch': ('IMPLEMENTED_MVP', 'PUBLIC_SOURCE_CANDIDATE_MONITORING; HUMAN_VERIFICATION_REQUIRED'),
              'journal_watch': ('STAGING', 'EDITORIAL_REVIEW_REQUIRED'),
              'student_desk': ('BETA', 'GOVERNED_PUBLIC_PREVIEW; BACKEND_REQUIRED_BEFORE_LIVE_OPERATIONS')
          }
          for item in arch.get('systems', []):
              base, qualifier = mapping[item['id']]
              item['base_status'] = base
              item['qualifier'] = qualifier
          if '/data/wpa-opn-readiness-current-state.json' not in arch['evidence_and_governance']:
              arch['evidence_and_governance'].append('/data/wpa-opn-readiness-current-state.json')
          arch_path.write_text(json.dumps(arch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Evidence-disciplined WPAWS wording. Roles can be ready even when external adapters are not configured.
          replacements = [
              ('17 агенти активни', '17 управувани агентски улоги подготвени'),
              ('17 agents active', '17 governed agent roles ready'),
              ('17 / 17 активни', '17 / 17 управувани улоги подготвени'),
              ('17 / 17 active', '17 / 17 governed roles ready')
          ]
          for name in ['wpaws/index.html', 'locales/wpaws/mk.json', 'locales/wpaws/en.json']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              if name == 'wpaws/index.html':
                  text = text.replace('.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}', '.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}')
                  text = text.replace('<div class="ai-pill"><div class="ai-dot"></div><span id="aiPillTxt"', '<div class="ai-pill" title="Adapter availability depends on approved configuration"><div class="ai-dot"></div><span id="aiPillTxt"', 1)
              p.write_text(text, encoding='utf-8')

          # Prevent future static canonicalization from reintroducing an unsupported "active" label.
          canon = Path('.github/workflows/wpa-static-canonicalization.yml')
          if canon.exists():
              text = canon.read_text(encoding='utf-8')
              text = text.replace("('16 агенти активни', '17 агенти активни')", "('16 агенти активни', '17 управувани агентски улоги подготвени')")
              text = text.replace("('16 agents active', '17 agents active')", "('16 agents active', '17 governed agent roles ready')")
              text = text.replace("('16 / 16 активни', '17 / 17 активни')", "('16 / 16 активни', '17 / 17 управувани улоги подготвени')")
              text = text.replace("('16 / 16 active', '17 / 17 active')", "('16 / 16 active', '17 / 17 governed roles ready')")
              canon.write_text(text, encoding='utf-8')

          # 3) OPN technical capability recovery package: pilot-ready, no fabricated delivery.
          Path('opn/pilot').mkdir(parents=True, exist_ok=True)

          state = {
            'schema': 'wpa-opn-readiness-current-state/1.0',
            'version': '1.0.0',
            'updated': '2026-08-24',
            'status': 'PILOT_READY_EXTERNAL_ACCEPTANCE_REQUIRED',
            'purpose': 'Evidence-disciplined technical capability recovery package for a future OpenAI Partner Network technical assessment resubmission or supporting review.',
            'truth_boundary': {
              'openai_approval_claimed': False,
              'partner_status_claimed': False,
              'external_customer_delivery_claimed': False,
              'external_pilot_executed': False,
              'external_acceptance_received': False
            },
            'verified_internal_technical_evidence': {
              'virtual_sande': {'version': 'v35.1.1', 'status': 'DEPLOYED_AND_ACCEPTED'},
              'strategic_prompt_router': {'version': 'wpa-strategic-prompt-router-1.0.1', 'status': 'PRODUCTION_VERIFIED', 'workflow_run_id': 32701887795, 'verified_head_sha': '612a68470cc8637a64cb890b791a12b790184004'},
              'central_orchestrator': {'version': 'wpa-central-orchestrator-1.7.0', 'status': 'GOVERNED_ORCHESTRATION_CODE_WITH_STRATEGIC_PROMPT_ROUTING'},
              'module_registry': {'version': '3.2.0'},
              'public_evidence_index': {'version': '1.2.0'}
            },
            'external_pilot': {
              'design_status': 'READY',
              'execution_status': 'NOT_EXECUTED',
              'acceptance_status': 'NOT_RECEIVED',
              'proposed_deliverable': 'Public-Source Institutional AI Evidence Brief with source ledger, provenance record and human approval record',
              'data_boundary': 'Public or explicitly authorised non-sensitive sources only',
              'decision_boundary': 'No legal, security, financial, academic or institutional commitment authority is delegated to AI'
            },
            'human_gate': {
              'required_before_external_commitment': True,
              'required_before_delivery': True,
              'required_before_any_partner_or_customer_claim': True
            },
            'next_required_external_evidence': [
              'A real external counterparty approves a bounded pilot scope.',
              'The pilot is executed and logged using only actually used components and sources.',
              'A human-reviewed deliverable is transmitted to the counterparty.',
              'The counterparty provides an acceptance or evaluation record.',
              'Only then may the evidence manifest move from NOT_EXECUTED to DELIVERED/ACCEPTED as applicable.'
            ]
          }
          Path('data/wpa-opn-readiness-current-state.json').write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = '''# WPA OPN Technical Capability Recovery · Evidence Package v2\n\nStatus: **PILOT_READY · external delivery and acceptance not yet evidenced**\n\nThis directory prepares a bounded, auditable external pilot evidence path for a future OpenAI Partner Network technical assessment resubmission or supporting review. It does **not** claim OpenAI approval, partner status, a customer deployment, a completed external pilot, or third-party acceptance.\n\n## Current technical evidence\n\n- Virtual Sande public production: `v35.1.1`\n- WPA Strategic Prompt Router: `wpa-strategic-prompt-router-1.0.1` — production verified in workflow run `32701887795`\n- WPA Central Orchestrator: `wpa-central-orchestrator-1.7.0`\n- WPA Module Registry: `3.2.0`\n- WPA Public Evidence Index: `1.2.0`\n- Human Gate, source-compliance, evidence and safety boundaries remain mandatory.\n\n## Pilot evidence sequence\n\n1. Counterparty-approved scope.\n2. Public/authorised-source execution.\n3. Delivery log with actual components and sources used.\n4. Human review and release approval.\n5. Counterparty acceptance/evaluation record.\n6. Evidence manifest update.\n\nUntil steps 1–5 are real and evidenced, use **pilot-ready**, never **customer deployment**, **partner delivery**, or **accepted pilot**.\n'''
          Path('opn/README.md').write_text(readme, encoding='utf-8')

          recovery = '''# WPA OPN Technical Capability Recovery v2\n\n## Evidence-disciplined positioning\n\nWorld Protocol Academy develops and operates governed AI-supported research, knowledge, publishing, analytical and institutional workflow systems. Professional learning is one application of the broader technical capability; it is not the sole characterization of WPA.\n\n### What is verifiably implemented\n\n- A public production Virtual Sande interface (`v35.1.1`).\n- A production-verified Strategic Prompt Router (`1.0.1`) with automatic/explicit SP01–SP08 routing, ordinary factual-query bypass and preserved Human Gate.\n- A Central Orchestrator (`1.7.0`) that can route governed work to the WPAWS executive-role layer while preserving source, evidence, safety and human approval boundaries.\n- A machine-readable architecture registry (`3.2.0`) and public evidence index (`1.2.0`).\n- Clear production/staging/beta/prototype/candidate boundaries; unsupported provider, partnership, customer or deployment claims are prohibited.\n\n### What is not claimed\n\nWPA does not currently claim a completed external-customer AI delivery pilot, external acceptance, OpenAI approval of the updated technical capability description, or any provider partnership/endorsement beyond evidence explicitly granted by the provider.\n\n## Proposed bounded external pilot\n\n**Pilot type:** Public-Source Institutional AI Evidence Brief.\n\n**Input:** a real counterparty-approved question and public or explicitly authorised non-sensitive sources.\n\n**Workflow:** source compliance → source discovery/retrieval as actually available → Virtual Sande / Strategic Prompt Router → Central Orchestrator / relevant WPAWS roles → evidence review → Human Gate → deliverable.\n\n**Output:** concise institutional brief + source ledger + provenance record + delivery log.\n\n**Acceptance evidence:** a dated counterparty evaluation/acceptance record. Acceptance of the pilot deliverable does not itself create a partnership, endorsement or procurement relationship.\n\n## Resubmission language\n\n> WPA is an independent AI-enabled research, authoring and workflow platform with governed production and staging components. Its technical work includes source-grounded multilingual assistance, strategic prompt routing, multi-agent workflow orchestration, evidence/provenance controls, staging isolation and human-reviewed release gates. Educational use is one application area, not the sole technical capability. WPA distinguishes verified production from staging, beta, prototype and planned capabilities and makes no unsupported claims regarding customers, deployments, partnerships or provider integrations.\n\nUse this paragraph only together with the current evidence records and the external-pilot truth boundary in `data/wpa-opn-readiness-current-state.json`.\n'''
          Path('opn/WPA_OPN_TECHNICAL_CAPABILITY_RECOVERY_v2.md').write_text(recovery, encoding='utf-8')

          scope = '''# WPA OPN External Pilot · Scope Template\n\n**Status before signatures:** DRAFT / NOT EXECUTED\n\nPilot ID: ____________________  \nCounterparty organisation: ____________________  \nAuthorised contact: ____________________  \nPilot title: ____________________  \nApproved start/date window: ____________________\n\n## Objective\n\nDefine one bounded institutional research/analysis question that can be answered using public or explicitly authorised non-sensitive sources.\n\n## Deliverables\n\n- Human-reviewed institutional evidence brief.\n- Source ledger for material factual claims.\n- Provenance / assumptions / open-questions record.\n- Delivery log identifying only components actually used.\n\n## Mandatory boundaries\n\n- No credential, paywall, DRM or restricted-access bypass.\n- No sensitive personal, classified or restricted data unless separately authorised and governed.\n- No automated legal, security, financial, academic or institutional commitment.\n- AI outputs remain drafts/recommendations until Human Gate approval.\n- Pilot participation does not imply partnership, endorsement, procurement, accreditation or production deployment.\n\n## Acceptance criteria\n\n- Every material factual claim is source-supported or explicitly marked as an assumption/open question.\n- Sources and access methods are recorded.\n- Known limitations and unresolved uncertainty are visible.\n- Final deliverable receives named human release approval before transmission.\n\nCounterparty scope approval: ____________________  Date: __________\nWPA Human Gate approval: ______________________  Date: __________\n'''
          Path('opn/pilot/WPA_OPN_EXTERNAL_PILOT_SCOPE_TEMPLATE.md').write_text(scope, encoding='utf-8')

          log = '''# WPA OPN External Pilot · Delivery Log Template\n\nPilot ID: ____________________  \nExecution date/time: ____________________  \nWPA human operator/reviewer: ____________________\n\n## Inputs\n\nQuestion/task: ____________________\nApproved source/data boundary: ____________________\n\n## Sources actually used\n\nFor each source record: source name, URL/identifier, access method, licence/permission basis where relevant, retrieval date, and material claims supported.\n\n## Components actually used\n\nMark only what was genuinely used. Do not infer usage from availability.\n\n- [ ] Virtual Sande v35.1.1\n- [ ] Strategic Prompt Router v1.0.1\n- [ ] Central Orchestrator v1.7.0\n- [ ] WPAWS governed executive role(s): ____________________\n- [ ] WPA Watch\n- [ ] Academic Search Hub\n- [ ] Protocolometry\n- [ ] Other approved component: ____________________\n\nExternal AI/provider adapter actually used, if any: ____________________\nEvidence of adapter/configuration at execution time: ____________________\n\n## Verification and Human Gate\n\nMaterial factual claims checked: YES / NO / PARTIAL  \nAssumptions/open questions labelled: YES / NO  \nSource-compliance gate passed: YES / NO  \nSafety review passed: YES / NO  \nHuman release approved: YES / NO\n\nReviewer: ____________________  Date/time: ____________________\n\n## Delivery\n\nDeliverable identifier/file: ____________________\nTransmission method/date: ____________________\nSHA-256 or immutable identifier, if available: ____________________\nKnown limitations at delivery: ____________________\n'''
          Path('opn/pilot/WPA_OPN_DELIVERY_LOG_TEMPLATE.md').write_text(log, encoding='utf-8')

          acceptance = '''# WPA OPN External Pilot · Counterparty Acceptance / Evaluation Record\n\nPilot ID: ____________________  \nCounterparty organisation: ____________________  \nEvaluator name/title: ____________________  \nDate: ____________________\n\nDeliverable received: YES / NO  \nEvaluation outcome: ACCEPTED / ACCEPTED WITH CONDITIONS / NOT ACCEPTED\n\nWhat was useful: ____________________\nRequired corrections or limitations: ____________________\nWould the counterparty consider a further bounded pilot or follow-up? YES / NO / NOT ASSESSED\n\n**Boundary:** This record confirms receipt/evaluation of the named pilot deliverable only. It does not create or imply a partnership, endorsement, procurement relationship, accreditation, production deployment or provider affiliation.\n\nCounterparty signature/confirmation: ____________________\nWPA receipt confirmation: ____________________\n'''
          Path('opn/pilot/WPA_OPN_ACCEPTANCE_RECORD_TEMPLATE.md').write_text(acceptance, encoding='utf-8')

          manifest = {
            'schema': 'wpa-opn-external-pilot-evidence-manifest/1.0',
            'status': 'NOT_EXECUTED',
            'pilot_id': None,
            'counterparty': None,
            'scope_approved': False,
            'execution_complete': False,
            'human_gate_release_approved': False,
            'delivery_complete': False,
            'counterparty_evaluation_received': False,
            'counterparty_outcome': None,
            'partnership_implied': False,
            'artifacts': [],
            'rule': 'Do not change status to DELIVERED or ACCEPTED without corresponding real-world evidence.'
          }
          Path('opn/pilot/WPA_OPN_EVIDENCE_MANIFEST_TEMPLATE.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit = {
            'schema': 'wpa-opn-readiness-audit/1.0',
            'date': '2026-08-24',
            'status': 'PASS_WITH_EXTERNAL_EVIDENCE_GAP',
            'repo_side_readiness': 'COMPLETE',
            'status_vocabulary_normalized': True,
            'wpaws_active_wording_hardened': True,
            'pilot_templates_ready': True,
            'external_pilot_executed': False,
            'external_acceptance_received': False,
            'blocking_external_gap': 'A real external counterparty scope, delivery and acceptance/evaluation record are still required for strongest OPN proof.',
            'no_fabricated_evidence': True
          }
          Path('data/wpa-opn-readiness-audit-2026-08-24.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a=json.load(open('data/wpa-institutional-operating-architecture.json',encoding='utf-8'))
          s=json.load(open('data/wpa-opn-readiness-current-state.json',encoding='utf-8'))
          m=json.load(open('opn/pilot/WPA_OPN_EVIDENCE_MANIFEST_TEMPLATE.json',encoding='utf-8'))
          assert a['version']=='1.1.0'
          assert a['control_layers'][0]['creates_authority'] is False
          assert s['status']=='PILOT_READY_EXTERNAL_ACCEPTANCE_REQUIRED'
          assert s['truth_boundary']['external_pilot_executed'] is False
          assert s['truth_boundary']['external_acceptance_received'] is False
          assert m['status']=='NOT_EXECUTED'
          assert m['partnership_implied'] is False
          PY
          ! grep -F '17 agents active' wpaws/index.html
          ! grep -F '17 агенти активни' wpaws/index.html
          grep -F '17 governed agent roles ready' wpaws/index.html
          grep -F 'PILOT_READY_EXTERNAL_ACCEPTANCE_REQUIRED' data/wpa-opn-readiness-current-state.json

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wpa-institutional-operating-architecture.json data/wpa-opn-readiness-current-state.json data/wpa-opn-readiness-audit-2026-08-24.json opn wpaws/index.html locales/wpaws/mk.json locales/wpaws/en.json .github/workflows/wpa-static-canonicalization.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize WPA OPN pilot readiness and governance wording'
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo '## WPA OPN readiness finalization'
            echo '- Status vocabulary: **normalized with base_status + qualifier**'
            echo '- Strategic Prompt Router: **control layer, not authority**'
            echo '- WPAWS wording: **governed agent roles ready; adapter availability remains configuration-dependent**'
            echo '- OPN recovery package: **pilot-ready**'
            echo '- External pilot executed: **NO**'
            echo '- External acceptance received: **NO**'
            echo '- Fabricated customer/partner evidence: **NONE**'
            echo '- Cloudflare Worker deployment: **NOT PERFORMED**'
          } >> "$GITHUB_STEP_SUMMARY"
