name: One-off Scholar preserve metadata

on:
  push:
    branches:
      - fix/scholar-canonical-rebuild-2026-09-09
    paths:
      - .github/workflows/one-off-scholar-preserve-metadata.yml

permissions:
  contents: write

jobs:
  preserve-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scholar-canonical-rebuild-2026-09-09
          fetch-depth: 0
      - name: Restore rich canonical Scholar metadata from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scholar/p01.html > scholar/p01.html
          for target in $(seq -w 2 18); do
            source=$(printf '%02d' $((10#$target + 1)))
            git show origin/main:scholar/p${source}.html > scholar/p${target}.html
          done
          git show origin/main:scholar/wpa-wp-001.html > scholar/p19.html

          git show origin/main:scholar/wpa-wp-002.html > scholar/wpa-wp-001.html
          git show origin/main:scholar/wpa-wp-003.html > scholar/wpa-wp-002.html
          git show origin/main:scholar/wpa-wp-004.html > scholar/wpa-wp-003.html
          git show origin/main:scholar/wpa-wp-005.html > scholar/wpa-wp-004.html
          git show origin/main:scholar/wpa-wp-006.html > scholar/wpa-wp-005.html
          git show origin/main:scholar/wpa-wp-007.html > scholar/wpa-wp-006.html
          git show origin/main:scholar/wpa-wp-008.html > scholar/wpa-wp-007.html
          git show origin/main:wpa-wp-009.html > scholar/wpa-wp-008.html
          git show origin/main:scholar/wpa-wp-009.html > scholar/wpa-wp-009.html
          git show origin/main:scholar/wpa-wp-010.html > scholar/wpa-wp-010.html

      - name: Validate canonical alignment and rich metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('scholar')
          papers=[s/f'p{i:02d}.html' for i in range(1,20)]
          titles=[]
          for p in papers:
              t=p.read_text(encoding='utf-8')
              expected=f'https://worldprotocolacademy.mk/scholar/{p.name}'
              assert expected in t, (p,'canonical')
              assert 'citation_title' in t and 'citation_author' in t and 'citation_publication_date' in t and 'citation_pdf_url' in t, p
              m=re.search(r'<meta name="citation_title" content="([^"]+)"',t); assert m
              titles.append(m.group(1))
          assert len(set(titles)) == 19
          assert 'Military Protocol, Defence Diplomacy and Military Diplomacy' in papers[-1].read_text(encoding='utf-8')
          for i in range(1,11):
              p=s/f'wpa-wp-{i:03d}.html'; t=p.read_text(encoding='utf-8')
              assert f'https://worldprotocolacademy.mk/scholar/{p.name}' in t, p
              assert 'citation_title' in t and 'citation_doi' in t, p
          for i in range(11,14):
              p=s/f'wpa-wp-{i:03d}.html'; assert p.exists(); assert 'citation_doi' in p.read_text(encoding='utf-8')
          for i in range(1,10):
              p=s/f'wpa-pn-{i:03d}.html'; assert p.exists(); assert 'citation_doi' in p.read_text(encoding='utf-8')
          assert Path('papers/p16-leadership-protocol-case-mk.pdf').exists()
          print('Metadata-preserving Scholar QA OK.')
          PY
      - name: Commit metadata-preserving repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Preserve rich metadata in Scholar rebuild"
            git push origin HEAD:fix/scholar-canonical-rebuild-2026-09-09
          fi
