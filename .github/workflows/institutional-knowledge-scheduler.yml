name: WPA Institutional Knowledge Scheduler

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum allowlisted sources to process'
        required: false
        default: '3'
      sleep_seconds:
        description: 'Delay between requests'
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: wpa-institutional-knowledge-scheduler
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir pypdf==5.4.0

      - name: Validate governance files
        run: |
          python -m json.tool data/wpa-citation-reference-policy.json >/dev/null
          python -m json.tool data/institutional-knowledge/source-registry.json >/dev/null
          python -m json.tool data/institutional-knowledge/rights-registry.json >/dev/null
          python -m json.tool data/institutional-knowledge/reference-record.schema.json >/dev/null

      - name: Build REV7 queue
        run: python tools/institutional-knowledge-harvester/institutional_knowledge_harvester.py --build-queue

      - name: Quiet allowlist run
        run: |
          MAX_ITEMS="${{ github.event.inputs.max_items || '3' }}"
          SLEEP_SECONDS="${{ github.event.inputs.sleep_seconds || '5' }}"
          python tools/institutional-knowledge-harvester/institutional_knowledge_harvester.py \
            --run-registry --max-items "$MAX_ITEMS" --sleep-seconds "$SLEEP_SECONDS"

      - name: Human-review summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("tools/institutional-knowledge-harvester/wpa_output/run-report.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print("status:",d["status"])
          for x in d["processed"]:
              print(x["source_id"], x["status"], x.get("citation_status",""), "candidates=",x.get("candidate_count",0))
          PY

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: wpa-institutional-knowledge-review-${{ github.run_id }}
          path: tools/institutional-knowledge-harvester/wpa_output/
          retention-days: 14
          if-no-files-found: error
