name: Bootstrap Virtual Sande v35.1 Six-Consumer Cutover

on:
  push:
    branches:
      - release/virtual-sande-v35-1-public-cutover
    paths:
      - '.github/virtual-sande-v35-1-cutover.marker'

permissions:
  contents: write

concurrency:
  group: virtual-sande-v35-1-public-cutover
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'worldprotocolacademy-code'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact cutover branch
        uses: actions/checkout@v7
        with:
          ref: release/virtual-sande-v35-1-public-cutover
          fetch-depth: 0

      - name: Require exact marker and production evidence
        run: |
          set -euo pipefail
          test -f .github/virtual-sande-v35-1-cutover.marker
          grep -Fx 'AUTHORIZED_RUN_ID=29457124570' .github/virtual-sande-v35-1-cutover.marker
          grep -Fx 'AUTHORIZED_PRODUCTION_URL=https://wpa-virtual-sande-v35-1-production.worldprotocolacademy.workers.dev' .github/virtual-sande-v35-1-cutover.marker
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('config/virtual-sande-v35.1-production-deployment-evidence.json').read_text())
          assert evidence['status'] == 'PRODUCTION_DEPLOYED_AND_ACCEPTED_PENDING_PUBLIC_CUTOVER'
          assert evidence['workflow_run_id'] == 29457124570
          assert evidence['dedicated_production_deploy'] == 'PASSED'
          assert evidence['production_acceptance'] == 'PASSED'
          assert evidence['legacy_compatibility'] == 'PASSED'
          assert evidence['public_cutover_authorized'] is True
          assert evidence['public_cutover_performed'] is False
          PY

      - name: Apply exact endpoint migration and update inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          legacy_base = 'https://protocol-bot-workerjs.worldprotocolacademy.workers.dev'
          legacy_ask = legacy_base + '/ask'
          production_base = 'https://wpa-virtual-sande-v35-1-production.worldprotocolacademy.workers.dev'
          production_ask = production_base + '/ask'

          direct = [
              'index.html',
              'papers.html',
              'wpaws/book/index.html',
              'wpaws/paper/index.html',
              'wpaws/analysis/index.html',
          ]

          for path in direct:
              p = Path(path)
              text = p.read_text()
              count = text.count(legacy_ask)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy /ask endpoint, found {count}.')
              updated = text.replace(legacy_ask, production_ask, 1)
              if updated.count(production_ask) != 1 or legacy_ask in updated:
                  raise SystemExit(f'{path}: exact endpoint replacement verification failed.')
              p.write_text(updated)

          constructed = Path('wpaws/index.html')
          text = constructed.read_text()
          count = text.count(legacy_base)
          if count != 1:
              raise SystemExit(f'wpaws/index.html: expected exactly one legacy base, found {count}.')
          updated = text.replace(legacy_base, production_base, 1)
          if updated.count(production_base) != 1 or legacy_base in updated:
              raise SystemExit('wpaws/index.html: exact base replacement verification failed.')
          constructed.write_text(updated)

          protocolometry = Path('protocolometry-center.html').read_text()
          if legacy_base not in protocolometry:
              raise SystemExit('protocolometry-center.html no longer contains its required legacy non-/ask base.')
          if production_base in protocolometry:
              raise SystemExit('protocolometry-center.html unexpectedly contains the production Virtual Sande base.')

          inventory_path = Path('config/virtual-sande-v35.1-endpoint-inventory.json')
          inventory = json.loads(inventory_path.read_text())
          inventory['inventory_status'] = 'MIGRATION_PR_READY'
          inventory['production_authorized'] = True
          inventory['cutover_strategy'] = 'MIGRATE_EXACTLY_SIX_VIRTUAL_SANDE_ASK_CONSUMERS'
          inventory['rollback_strategy'] = 'RESTORE_ALL_SIX_CONSUMERS_TO_LEGACY_ENDPOINT'
          inventory['canonical_production_endpoint'] = production_ask
          inventory['production_worker'] = 'wpa-virtual-sande-v35-1-production'
          inventory['production_deployment_evidence'] = {
              'workflow_run_number': 3,
              'workflow_run_id': 29457124570,
              'release_sha': '8ab76fe682badfcbedaba9deac75782bcd0d505e',
              'artifact_id': 8366172298,
              'artifact_digest': 'sha256:50e5d6b26080a50f4eeda45a61eca4ca629fe65ed8e3a2a67bc5a24249bda19b',
              'production_acceptance': 'PASSED',
              'legacy_compatibility': 'PASSED',
          }
          inventory['required_before_cutover'] = []
          inventory['safety_boundary'] = 'This reviewed migration PR changes exactly six Virtual Sande /ask consumers. protocolometry-center.html remains on the legacy base for its non-/ask endpoints. Rollback restores all six consumers to the recorded legacy endpoint.'
          inventory_path.write_text(json.dumps(inventory, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Verify exact changed-file boundary
        run: |
          set -euo pipefail
          allowed='^(index.html|papers.html|wpaws/index.html|wpaws/book/index.html|wpaws/paper/index.html|wpaws/analysis/index.html|config/virtual-sande-v35.1-endpoint-inventory.json|\.github/virtual-sande-v35-1-cutover.marker)$'
          git diff --name-only | tee /tmp/bootstrap-changed.txt
          if grep -Ev "$allowed" /tmp/bootstrap-changed.txt; then
            echo 'Unexpected file changed during cutover bootstrap.' >&2
            exit 1
          fi
          test "$(wc -l < /tmp/bootstrap-changed.txt)" -eq 7

      - name: Commit exact cutover changes and remove marker
        run: |
          set -euo pipefail
          rm .github/virtual-sande-v35-1-cutover.marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html papers.html wpaws/index.html wpaws/book/index.html wpaws/paper/index.html wpaws/analysis/index.html config/virtual-sande-v35.1-endpoint-inventory.json .github/virtual-sande-v35-1-cutover.marker
          git commit -m 'Cut over six Virtual Sande consumers to v35.1 production'
          git push origin HEAD:release/virtual-sande-v35-1-public-cutover
