name: Virtual Sande v35.1 Production Readiness Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-v35.1-production-candidate.json'
      - 'config/virtual-sande-v35.1-production-decision.json'
      - 'workers/virtual-sande-v35.1-production/**'
      - '.github/workflows/deploy-virtual-sande-v35-1-production.yml'
      - '.github/workflows/virtual-sande-v35-1-production-readiness-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate approved production candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/virtual-sande-v35.1-production-candidate.json').read_text())
          assert data['production_authorized'] is True
          assert data['candidate_status'] == 'APPROVED_PENDING_PROTECTED_PRODUCTION_DEPLOY_AND_ACCEPTANCE'
          assert data['certified_candidate_sha'] == '6a1822ba8e524a454dcf4a038f3d6bc38c3d500d'
          assert data['production_worker_name'] == 'wpa-virtual-sande-v35-1-production'
          assert data['production_route_or_custom_domain'] == 'workers.dev only'
          assert data['production_environment'] == 'production'
          assert data['deployment']['manual_dispatch_from_main_only'] is True
          assert data['deployment']['production_acceptance_before_cutover'] is True
          assert data['approval']['production_deploy'] is True
          assert data['approval']['public_cutover'] is True
          PY

      - name: Verify production release safety
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-production/wrangler.toml
          test -f workers/virtual-sande-v35.1-production/src/index.mjs
          ! grep -Eq 'routes?\s*=|custom_domain|kv_namespaces|d1_databases' workers/virtual-sande-v35.1-production/wrangler.toml
          node --check workers/virtual-sande-v35.1-production/src/index.mjs
          node --test tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.test.mjs tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/deploy-virtual-sande-v35-1-production.yml').read_text()
          required = ['workflow_dispatch:', 'environment: production', "test \"$GITHUB_REF\" = 'refs/heads/main'", 'Run production acceptance before public cutover', 'Public cutover performed: **No**']
          missing = [x for x in required if x not in text]
          if missing: raise SystemExit(f'Missing production controls: {missing}')
          PY

      - name: Readiness boundary
        run: |
          {
            echo '## Virtual Sande v35.1 Production Readiness'
            echo '- Explicit owner approval: **Recorded**'
            echo '- Dedicated production package: **Ready**'
            echo '- Protected production deploy: **Required**'
            echo '- Acceptance before cutover: **Required**'
            echo '- Deployment performed by this audit: **No**'
          } >> "$GITHUB_STEP_SUMMARY"
