name: WPA Public Financial Freeze

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wpa-public-financial-freeze-20260826.py'

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply public financial freeze
        run: python scripts/wpa-public-financial-freeze-20260826.py
      - name: Commit financial freeze source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Financial freeze already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Enforce WPA public financial freeze'
          git push origin HEAD:main
