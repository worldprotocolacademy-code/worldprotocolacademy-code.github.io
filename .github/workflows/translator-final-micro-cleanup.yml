name: Translator Final Micro Cleanup

on:
  push:
    branches:
      - fix/translator-language-integrity-20260916
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[translator-micro-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/translator-language-integrity-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final MK micro-cleanup
        run: python scripts/translator_final_micro_cleanup.py
      - name: Run final language gates
        run: |
          python scripts/translator_architecture_check.py
          python scripts/mk_home_language_integrity_check.py
          python scripts/en_public_language_integrity_check.py
      - name: Remove temporary helper and commit
        run: |
          set -euo pipefail
          rm scripts/translator_final_micro_cleanup.py
          git config user.name "worldprotocolacademy-code"
          git config user.email "worldprotocolacademy@gmail.com"
          git add index.html scripts/mk_home_language_integrity_check.py scripts/translator_final_micro_cleanup.py
          git diff --cached --check
          git commit -m "Translator: close final MK mixed-language residue [translator-micro-finalized]"
          git push origin HEAD:fix/translator-language-integrity-20260916
