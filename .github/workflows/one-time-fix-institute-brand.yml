name: One-time WPA Institute brand root fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-institute-brand.yml'

permissions:
  contents: write

jobs:
  fix-institute-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply root header fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Root/static Institute HTML: remove legacy W + old academy-name nav brand.
          p = Path('institute.html')
          s = p.read_text(encoding='utf-8')
          old = '''<a class="brand" href="index.html">
          <div class="brand-mark">W</div>
          <div class="brand-text">
          <span class="brand-name" data-i18n="a_nav.1">Светска академија за протокол<span class="wpa-brand-en">World Protocol Academy</span></span>
          <span class="brand-sub" data-i18n="institute.nav.brand_sub">Институт за протокол, дипломатија, јавна комуникација и безбедносни студии</span>
          </div>
          </a>'''
          new = '''<a class="brand wpa-institute-brand" href="index.html" aria-label="WPA Institute" translate="no" data-no-i18n="true">
          <img class="wpa-institute-logo" src="/logo.webp" alt="World Protocol Academy logo" width="48" height="48" loading="eager" decoding="sync"/>
          <div class="brand-text">
          <span class="wpa-institute-label">WPA Institute</span>
          <span class="wpa-institute-name-mk">Институт за протокол, дипломатија, јавна комуникација и безбедносни студии</span>
          <span class="wpa-institute-name-en" lang="en">Institute for Protocol, Diplomacy, Public Communication and Security Studies</span>
          </div>
          </a>'''
          if old not in s:
              raise SystemExit('Legacy Institute nav brand block not found; refusing broad replacement.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Runtime: remove building emoji and preserve a real logo element before the name.
          p = Path('scripts/wpa-performance.js')
          s = p.read_text(encoding='utf-8')
          old_runtime = '''    var mark = brand.querySelector('.brand-mark');
              if (mark) mark.remove();

              var text = brand.querySelector('.brand-text');
              if (text) {
                text.innerHTML = '<span class="wpa-institute-label">🏛️ WPA Institute</span><span class="wpa-institute-name-mk">Институт за протокол, дипломатија, јавна комуникација и безбедносни студии</span><span class="wpa-institute-name-en" lang="en">Institute for Protocol, Diplomacy, Public Communication and Security Studies</span>';
              }'''
          new_runtime = '''    var mark = brand.querySelector('.brand-mark');
              if (mark) mark.remove();

              var logo = brand.querySelector('.wpa-institute-logo');
              if (!logo) {
                logo = document.createElement('img');
                logo.className = 'wpa-institute-logo';
                logo.src = '/logo.webp';
                logo.alt = 'World Protocol Academy logo';
                logo.width = 48;
                logo.height = 48;
                logo.loading = 'eager';
                logo.decoding = 'sync';
                brand.insertBefore(logo, brand.firstChild);
              }

              var text = brand.querySelector('.brand-text');
              if (text) {
                text.innerHTML = '<span class="wpa-institute-label">WPA Institute</span><span class="wpa-institute-name-mk">Институт за протокол, дипломатија, јавна комуникација и безбедносни студии</span><span class="wpa-institute-name-en" lang="en">Institute for Protocol, Diplomacy, Public Communication and Security Studies</span>';
              }'''
          if old_runtime not in s:
              raise SystemExit('Expected runtime Institute brand block not found; refusing broad replacement.')
          s = s.replace(old_runtime, new_runtime, 1)
          p.write_text(s, encoding='utf-8')

          # 3) CSS: style the real logo element and stop generating a pseudo-logo/duplicate label.
          p = Path('styles/wpa-institute-compact-brand.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''html[data-wpa-page="institute"] .wpa-institute-label{
            display:flex !important;
            align-items:center !important;
            gap:11px !important;
            min-height:48px !important;
            margin:0 0 3px !important;
            color:#e3c878 !important;
            font-size:0 !important;
            line-height:1 !important;
            letter-spacing:0 !important;
            white-space:nowrap !important;
          }

          html[data-wpa-page="institute"] .wpa-institute-label::before{
            content:"" !important;
            display:block !important;
            width:46px !important;
            height:46px !important;
            flex:0 0 46px !important;
            border-radius:50% !important;
            background-image:url('/logo.webp') !important;
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            box-shadow:0 0 0 1px rgba(201,168,76,.82),0 5px 16px rgba(0,0,0,.24) !important;
          }

          html[data-wpa-page="institute"] .wpa-institute-label::after{
            content:"WPA Institute" !important;
            display:block !important;
            color:#e3c878 !important;
            font:800 16px/1.1 Inter,system-ui,sans-serif !important;
            letter-spacing:.03em !important;
          }''','''html[data-wpa-page="institute"] .wpa-institute-logo{
            display:block !important;
            width:46px !important;
            height:46px !important;
            flex:0 0 46px !important;
            border-radius:50% !important;
            object-fit:cover !important;
            box-shadow:0 0 0 1px rgba(201,168,76,.82),0 5px 16px rgba(0,0,0,.24) !important;
          }

          html[data-wpa-page="institute"] .wpa-institute-label{
            display:block !important;
            margin:0 0 3px !important;
            color:#e3c878 !important;
            font:800 16px/1.1 Inter,system-ui,sans-serif !important;
            letter-spacing:.03em !important;
            white-space:nowrap !important;
          }''', 1)
          s = s.replace('''html[data-wpa-page="institute"] .wpa-institute-label{
              min-height:42px !important;
              gap:9px !important;
            }
            html[data-wpa-page="institute"] .wpa-institute-label::before{
              width:40px !important;
              height:40px !important;
              flex-basis:40px !important;
            }
            html[data-wpa-page="institute"] .wpa-institute-label::after{
              font-size:14px !important;
            }''','''html[data-wpa-page="institute"] .wpa-institute-logo{
              width:40px !important;
              height:40px !important;
              flex-basis:40px !important;
            }
            html[data-wpa-page="institute"] .wpa-institute-label{
              font-size:14px !important;
            }''', 1)
          p.write_text(s, encoding='utf-8')

          # Remove this one-time workflow itself after applying the patch.
          Path('.github/workflows/one-time-fix-institute-brand.yml').unlink()
          PY

      - name: Commit root fix
        shell: bash
        run: |
          git config user.name "WPA maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add institute.html scripts/wpa-performance.js styles/wpa-institute-compact-brand.css .github/workflows/one-time-fix-institute-brand.yml
          git commit -m "Root-fix WPA Institute header identity" || exit 0
          git push origin main
