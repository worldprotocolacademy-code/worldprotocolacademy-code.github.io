name: WPA Journal Live Backend v11.5.2 Promotion Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/journal-live-backend-integrity-v1152-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-live-backend-v1152-promotion-retry
  cancel-in-progress: false

env:
  WORKER_NAME: wpa-live-production-bridge
  API_ROOT: https://wpa-live-production-bridge.worldprotocolacademy.workers.dev
  ROLLBACK_VERSION_ID: 1aa812ea-6d6a-4855-9e4b-e22cbe79c3f3
  CANDIDATE_VERSION_ID: f7292368-aa3c-4923-8475-dfdb6ccbd181
  CANDIDATE_SHA256: 559f60a1e968988fc102cb530628423e0002d9271a92a4a4ef7b424def175761
  CANDIDATE_LABEL: "11.5.2"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Preflight exact active and candidate state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"

          get_json() {
            local url="$1" out="$2" code
            code=$(curl -sS -o "$out" -w '%{http_code}'               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Accept: application/json' "$url")
            echo "GET ${url##*/}: ${code}"
            test "$code" = 200
          }

          get_json "${API_BASE}/settings" /tmp/settings.json
          get_json "${API_BASE}/deployments" /tmp/deployments.json
          get_json "${API_BASE}/versions?per_page=100" /tmp/versions.json
          get_json "${API_BASE}/versions/${ROLLBACK_VERSION_ID}" /tmp/rollback-version.json
          get_json "${API_BASE}/versions/${CANDIDATE_VERSION_ID}" /tmp/candidate-version.json

          code=$(curl -sS -L -o /tmp/content.bin -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Accept: */*' "${API_BASE}/content/v2")
          echo "GET content/v2: ${code}"
          test "$code" = 200

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def result(path):
              payload=json.loads(Path(path).read_text())
              if payload.get('success') is not True:
                  safe=[{'code':e.get('code'),'message':e.get('message')} for e in payload.get('errors') or []]
                  raise SystemExit(f'PRECONDITION FAIL {path}: {safe}')
              return payload.get('result')

          settings=result('/tmp/settings.json') or {}
          dep=result('/tmp/deployments.json')
          versions=result('/tmp/versions.json')
          rollback=result('/tmp/rollback-version.json') or {}
          candidate=result('/tmp/candidate-version.json') or {}

          deployments=dep.get('deployments',[]) if isinstance(dep,dict) else (dep or [])
          if not deployments or not isinstance(deployments[0],dict):
              raise SystemExit('PRECONDITION FAIL: active deployment unavailable')
          active=deployments[0].get('versions') or []
          candidate_id=os.environ['CANDIDATE_VERSION_ID']
          rollback_id=os.environ['ROLLBACK_VERSION_ID']

          already_active=(len(active)==1 and active[0].get('version_id')==candidate_id and float(active[0].get('percentage') or 0)==100)
          rollback_active=(len(active)==1 and active[0].get('version_id')==rollback_id and float(active[0].get('percentage') or 0)==100)
          if not (already_active or rollback_active):
              raise SystemExit(f'PRECONDITION FAIL: unexpected active deployment: {active}')

          items=versions.get('items',[]) if isinstance(versions,dict) else (versions or [])
          if not items or (items[0] or {}).get('id') != candidate_id:
              raise SystemExit('PRECONDITION FAIL: verified v11.5.2 candidate is no longer the latest Worker version')

          expected={'ADMIN_TOKEN','API_CACHE_SECONDS','DB','DEGRADED_FAILURE_THRESHOLD','LAB_CACHE_LIMIT','MAX_FEED_BYTES','MAX_ITEMS_PER_FEED','MAX_SOURCES_PER_TICK','MIN_RELEVANCE_SCORE','PUBLIC_ITEM_RETENTION_DAYS','PUBLIC_SITE_ORIGINS','QUARANTINE_FAILURE_THRESHOLD','RSS_QUEUE'}
          bindings=settings.get('bindings') or []
          by_name={b.get('name'):b for b in bindings if isinstance(b,dict) and b.get('name')}
          if set(by_name)!=expected:
              raise SystemExit(f'PRECONDITION FAIL: binding drift: {sorted(by_name)}')
          if by_name['DB'].get('type')!='d1' or by_name['RSS_QUEUE'].get('type')!='queue':
              raise SystemExit('PRECONDITION FAIL: DB/Queue binding type drift')
          origins={x.strip() for x in str(by_name['PUBLIC_SITE_ORIGINS'].get('text') or '').split(',') if x.strip()}
          needed={'https://worldprotocolacademy.mk','https://www.worldprotocolacademy.mk'}
          if not needed.issubset(origins):
              raise SystemExit('PRECONDITION FAIL: production CORS origins missing')

          def baseline(v):
              r=v.get('resources') or {}; s=r.get('script') or {}; rt=r.get('script_runtime') or {}
              return {
                  'handlers':s.get('handlers'),
                  'named_handlers':s.get('named_handlers'),
                  'runtime':{k:rt.get(k) for k in ('compatibility_date','compatibility_flags','usage_model','limits')},
                  'binding_names':sorted(b.get('name') for b in r.get('bindings',[]) if isinstance(b,dict) and b.get('name')),
              }
          if baseline(rollback) != baseline(candidate):
              raise SystemExit('PRECONDITION FAIL: candidate metadata differs from audited rollback baseline')

          raw=Path('/tmp/content.bin').read_bytes()
          head,rest=raw.split(b'\r\n\r\n',1)
          boundary=head.split(b'\r\n',1)[0]
          body=rest.rsplit(b'\r\n'+boundary+b'--',1)[0]
          digest=hashlib.sha256(body).hexdigest()
          print('latest_index_sha256='+digest)
          if digest != os.environ['CANDIDATE_SHA256']:
              raise SystemExit('PRECONDITION FAIL: latest Worker source is not the verified v11.5.2 candidate')

          Path('/tmp/preflight.env').write_text('ALREADY_ACTIVE=' + ('true' if already_active else 'false') + '\n')
          print('active_state=' + ('candidate_11.5.2' if already_active else 'rollback_11.4.0'))
          print('candidate_source=verified')
          PY
          cat /tmp/preflight.env >> "$GITHUB_ENV"

      - name: Propagation-aware canary and promotion with rollback
        if: env.ALREADY_ACTIVE != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          DEPLOYMENT_TOUCHED=false
          override="${WORKER_NAME}=\"${CANDIDATE_VERSION_ID}\""

          make_body() {
            python3 - "$@" <<'PY'
          import json,sys
          versions=[]
          for pair in sys.argv[1:]:
              vid,pct=pair.split(':',1)
              versions.append({'version_id':vid,'percentage':float(pct)})
          print(json.dumps({'strategy':'percentage','versions':versions},separators=(',',':')))
          PY
          }

          deploy() {
            local file=$1 out=$2 code
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json' -H 'Accept: application/json'               --data-binary "@$file" "${API_BASE}/deployments")
            echo "POST deployments: ${code}"
            test "$code" = 200
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          if p.get('success') is not True:
              safe=[{'code':e.get('code'),'message':e.get('message')} for e in p.get('errors') or []]
              raise SystemExit(f'DEPLOYMENT API FAIL: {safe}')
          PY
          }

          rollback() {
            echo 'Rolling back to audited v11.4.0 active version.'
            make_body "${ROLLBACK_VERSION_ID}:100" > /tmp/rollback.json
            deploy /tmp/rollback.json /tmp/rollback-response.json
          }

          on_exit() {
            local rc=$?
            if [ "$rc" -ne 0 ] && [ "$DEPLOYMENT_TOUCHED" = true ]; then
              rollback || echo 'CRITICAL: automatic rollback failed.' >&2
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          version_header() {
            awk -F': ' 'tolower($1)=="x-wpa-bridge-version" {gsub("\r", "", $2); print $2}' "$1" | tail -n1
          }
          acao_header() {
            awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' "$1" | tail -n1
          }
          vary_header() {
            awk -F': ' 'tolower($1)=="vary" {gsub("\r", "", $2); print tolower($2)}' "$1" | tail -n1
          }

          probe_get() {
            local path=$1 origin=$2 headers=$3 body=$4 label=$5 attempt code served acao url sep
            for attempt in $(seq 1 12); do
              case "$path" in *\?*) sep='&' ;; *) sep='?' ;; esac
              url="${API_ROOT}${path}${sep}promotion_retry=$(date +%s)-${attempt}"
              code=$(curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}"                 -H "Origin: ${origin}" -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)
              served=$(version_header "$headers")
              acao=$(acao_header "$headers")
              echo "${label} attempt ${attempt}: HTTP=${code:-curl-fail} version=${served:-missing} ACAO=${acao:-missing}"
              if [ "$code" = 200 ] && [ "$served" = "${CANDIDATE_LABEL}" ] && [ "$acao" = "$origin" ]; then
                return 0
              fi
              sleep 5
            done
            echo "CANARY FAIL: ${label} never served verified v${CANDIDATE_LABEL} with expected CORS" >&2
            return 1
          }

          probe_options() {
            local origin=$1 attempt code served acao vary
            for attempt in $(seq 1 12); do
              code=$(curl -sS -X OPTIONS -H "Cloudflare-Workers-Version-Overrides: ${override}"                 -H "Origin: ${origin}" -D /tmp/options-h -o /dev/null -w '%{http_code}'                 "${API_ROOT}/api/v1/live?promotion_options=$(date +%s)-${attempt}" || true)
              served=$(version_header /tmp/options-h)
              acao=$(acao_header /tmp/options-h)
              vary=$(vary_header /tmp/options-h)
              echo "OPTIONS ${origin} attempt ${attempt}: HTTP=${code:-curl-fail} version=${served:-missing} ACAO=${acao:-missing} Vary=${vary:-missing}"
              if { [ "$code" = 200 ] || [ "$code" = 204 ]; } &&                  [ "$served" = "${CANDIDATE_LABEL}" ] && [ "$acao" = "$origin" ] && [[ "$vary" == *origin* ]]; then
                return 0
              fi
              sleep 5
            done
            echo "CANARY FAIL: OPTIONS provenance/CORS did not stabilize for ${origin}" >&2
            return 1
          }

          make_body "${ROLLBACK_VERSION_ID}:100" "${CANDIDATE_VERSION_ID}:0" > /tmp/canary.json
          deploy /tmp/canary.json /tmp/canary-response.json
          DEPLOYMENT_TOUCHED=true

          probe_get "/api/v1/health" "https://worldprotocolacademy.mk" /tmp/health-h /tmp/health "health"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/health').read_text())
          if p.get('ok') is not True or str(p.get('version')) != os.environ['CANDIDATE_LABEL']:
              raise SystemExit('CANARY FAIL: health contract/version mismatch')
          PY

          probe_get "/api/v1/live?limit=100" "https://worldprotocolacademy.mk" /tmp/live-h /tmp/live "live"
          python3 - <<'PY'
          import json,re
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('/tmp/live').read_text()); items=p.get('items')
          if not isinstance(items,list): raise SystemExit('CANARY FAIL: live contract')
          seen=set(); lottery=re.compile(r'\b(lottery|lotto|loto|piyango|winning numbers|jackpot)\b',re.I)
          now=datetime.now(timezone.utc).timestamp()
          for i in items:
              pub=str(i.get('published_at') or ''); fet=str(i.get('fetched_at') or '')
              if not pub or pub==fet: raise SystemExit('CANARY FAIL: undated/fallback publication leaked')
              try: ts=datetime.fromisoformat(pub.replace('Z','+00:00')).timestamp()
              except Exception: raise SystemExit('CANARY FAIL: invalid publication timestamp')
              if ts > now + 6*3600: raise SystemExit('CANARY FAIL: materially future item leaked')
              key=(str(i.get('source') or '').strip().lower(),str(i.get('title') or '').strip().lower(),pub[:10])
              if key in seen: raise SystemExit(f'CANARY FAIL: same-source title/day duplicate leaked: {key}')
              seen.add(key)
              if lottery.search(' '.join([str(i.get('title') or ''),str(i.get('summary') or '')])):
                  raise SystemExit('CANARY FAIL: lottery noise leaked')
          print(f'canary_live_items={len(items)}')
          PY

          probe_get "/api/v1/stats" "https://worldprotocolacademy.mk" /tmp/stats-h /tmp/stats "stats"
          probe_get "/api/v1/ticker?limit=10&since_hours=168" "https://worldprotocolacademy.mk" /tmp/ticker-h /tmp/ticker "ticker"
          python3 - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('/tmp/stats').read_text())
          ticker=json.loads(Path('/tmp/ticker').read_text())
          if not isinstance(stats,dict): raise SystemExit('CANARY FAIL: stats contract')
          if not isinstance(ticker.get('items'),list): raise SystemExit('CANARY FAIL: ticker contract')
          print(f"canary_ticker_items={len(ticker['items'])}")
          PY

          probe_options "https://worldprotocolacademy.mk"
          probe_options "https://www.worldprotocolacademy.mk"

          first_id=$(python3 - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('/tmp/live').read_text()).get('items') or []
          print(items[0].get('id','') if items else '')
          PY
          )
          if [ -n "$first_id" ]; then
            probe_get "/api/v1/item/${first_id}" "https://worldprotocolacademy.mk" /tmp/item-h /tmp/item "item"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/item').read_text())
          if not isinstance(p.get('item'),dict): raise SystemExit('CANARY FAIL: direct item contract')
          PY
          fi

          make_body "${CANDIDATE_VERSION_ID}:100" > /tmp/promote.json
          deploy /tmp/promote.json /tmp/promote-response.json

          final_ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -H 'Origin: https://worldprotocolacademy.mk'               -D /tmp/final-h -o /tmp/final-health -w '%{http_code}'               "${API_ROOT}/api/v1/health?promotion_final=$(date +%s)-${attempt}" || true)
            served=$(version_header /tmp/final-h)
            acao=$(acao_header /tmp/final-h)
            body_version=$(python3 - <<'PY' || true
          import json
          from pathlib import Path
          try: print(json.loads(Path('/tmp/final-health').read_text()).get('version',''))
          except Exception: print('')
          PY
            )
            echo "Final health attempt ${attempt}: HTTP=${code:-curl-fail} version=${served:-missing} body=${body_version:-missing} ACAO=${acao:-missing}"
            if [ "$code" = 200 ] && [ "$served" = "${CANDIDATE_LABEL}" ] &&                [ "$body_version" = "${CANDIDATE_LABEL}" ] && [ "$acao" = 'https://worldprotocolacademy.mk' ]; then
              final_ready=true
              break
            fi
            sleep 5
          done
          test "$final_ready" = true

          www_ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -H 'Origin: https://www.worldprotocolacademy.mk'               -D /tmp/www-h -o /tmp/www-live -w '%{http_code}'               "${API_ROOT}/api/v1/live?limit=20&promotion_final=$(date +%s)-${attempt}" || true)
            served=$(version_header /tmp/www-h)
            acao=$(acao_header /tmp/www-h)
            echo "Final www live attempt ${attempt}: HTTP=${code:-curl-fail} version=${served:-missing} ACAO=${acao:-missing}"
            if [ "$code" = 200 ] && [ "$served" = "${CANDIDATE_LABEL}" ] && [ "$acao" = 'https://www.worldprotocolacademy.mk' ]; then
              www_ready=true
              break
            fi
            sleep 5
          done
          test "$www_ready" = true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/www-live').read_text())
          if not isinstance(p.get('items'),list): raise SystemExit('FINAL FAIL: www live contract')
          print(f"final_live_items={len(p['items'])}")
          PY

          code=$(curl -sS -o /tmp/final-deployments.json -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Accept: application/json' "${API_BASE}/deployments")
          test "$code" = 200
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/final-deployments.json').read_text())
          result=p.get('result') or {}
          deps=result.get('deployments',[]) if isinstance(result,dict) else (result or [])
          if not deps: raise SystemExit('FINAL FAIL: deployment unavailable')
          versions=deps[0].get('versions') or []
          if len(versions)!=1 or versions[0].get('version_id')!=os.environ['CANDIDATE_VERSION_ID'] or float(versions[0].get('percentage') or 0)!=100:
              raise SystemExit(f'FINAL FAIL: v11.5.2 not active at 100 percent: {versions}')
          print('final_deployment=verified')
          PY

          DEPLOYMENT_TOUCHED=false
          trap - EXIT

      - name: Verify active v11.5.2 production contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          code=$(curl -sS -H 'Origin: https://worldprotocolacademy.mk'             -D /tmp/verify-h -o /tmp/verify-health -w '%{http_code}' "${API_ROOT}/api/v1/health?verify=$(date +%s)")
          test "$code" = 200
          grep -qi "^x-wpa-bridge-version: ${CANDIDATE_LABEL}" /tmp/verify-h
          grep -qi '^access-control-allow-origin: https://worldprotocolacademy.mk' /tmp/verify-h
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/verify-health').read_text())
          if p.get('ok') is not True or str(p.get('version')) != os.environ['CANDIDATE_LABEL']:
              raise SystemExit('VERIFY FAIL: production health is not v11.5.2')
          PY
          code=$(curl -sS -o /tmp/deployments.json -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "${API_BASE}/deployments")
          test "$code" = 200
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/deployments.json').read_text())
          result=p.get('result') or {}
          deps=result.get('deployments',[]) if isinstance(result,dict) else (result or [])
          versions=(deps[0].get('versions') or []) if deps else []
          if len(versions)!=1 or versions[0].get('version_id')!=os.environ['CANDIDATE_VERSION_ID'] or float(versions[0].get('percentage') or 0)!=100:
              raise SystemExit('VERIFY FAIL: expected v11.5.2 candidate is not active at 100 percent')
          print('production_v11_5_2=verified')
          PY

      - name: Publish promotion summary
        if: success()
        shell: bash
        run: |
          {
            echo '## WPA Journal Live · v11.5.2 Promotion Retry'
            echo
            echo '- Candidate version: **f7292368-aa3c-4923-8475-dfdb6ccbd181**'
            echo '- Candidate SHA-256: **verified**'
            echo '- Production bindings / runtime metadata: **verified**'
            echo '- Per-endpoint propagation-aware canary: **PASS**'
            echo '- Publication integrity / dedupe / noise filtering: **PASS**'
            echo '- Apex + www CORS and OPTIONS: **PASS**'
            echo '- Direct item contract: **PASS**'
            echo '- Final deployment: **v11.5.2 at 100%**'
          } >> "$GITHUB_STEP_SUMMARY"
