name: Virtual Sande Public Endpoint Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/virtual-sande-public-endpoint-smoke.yml'
      - 'scripts/virtual-sande-public-widget.js'
      - 'workers/virtual-sande-v35.1-production/**'
      - 'workers/virtual-sande-v35.1-staging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require canonical public Virtual Sande endpoint
        shell: bash
        run: |
          set -euo pipefail
          primary='https://wpa-virtual-sande-v35-1-production.worldprotocolacademy.workers.dev/ask'
          payload='{"message":"ШТО ПРЕТСТАВУВА итинерар?","question":"ШТО ПРЕТСТАВУВА итинерар?","query":"ШТО ПРЕТСТАВУВА итинерар?","lang":"mk","language":"mk","history":[],"quality":"3layer_academic","context":"World Protocol Academy public page: /"}'
          headers=/tmp/primary-headers.txt
          body=/tmp/primary-body.txt
          code="$(curl --silent --show-error --location --max-time 20 \
            --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            --request POST "$primary" \
            --header 'Origin: https://worldprotocolacademy.mk' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data "$payload")"
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 300
          grep -Eiq '^access-control-allow-origin:.*(worldprotocolacademy\.mk|\*)' "$headers"
          grep -Eiq 'answer|response|text|message' "$body"
          head -c 3000 "$body"
