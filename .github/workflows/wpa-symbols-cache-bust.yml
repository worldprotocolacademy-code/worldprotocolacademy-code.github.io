name: WPA Symbols cache bust

on:
  push:
    branches: [main]
    paths:
      - 'wpaws/protocol-symbols/wpa-symbols-comprehensive-v3.js'

permissions:
  contents: write

jobs:
  bump-script-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bust Symbols assistant script cache
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('wpaws/protocol-symbols/index.html')
          text = p.read_text(encoding='utf-8')
          version = os.environ['COMMIT_SHA'][:12]
          new = re.sub(
              r'wpa-symbols-comprehensive-v3\.js\?v=[^"\']+',
              f'wpa-symbols-comprehensive-v3.js?v={version}',
              text,
          )
          if new == text:
              raise SystemExit('No Symbols script tag found to update.')
          p.write_text(new, encoding='utf-8')
          PY

      - name: Commit cache-bust version
        run: |
          if git diff --quiet -- wpaws/protocol-symbols/index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wpaws/protocol-symbols/index.html
          git commit -m 'Bust WPA Symbols assistant cache'
          git push
