name: WPA Symbols cache bust

on:
  push:
    branches: [main]
    paths:
      - 'wpaws/protocol-symbols/wpa-symbols-comprehensive-v3.js'
      - 'wpaws/protocol-symbols/wpa-symbols-ratio-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-comparison-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-focus-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-un-status-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-national-days-focus-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-attribution-policy-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-context-intent-v1.js'
      - 'wpaws/protocol-symbols/data/un-status-v1.json'
      - 'wpaws/protocol-symbols/national-holidays-mfa-seed.json'
      - '.github/workflows/wpa-symbols-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-script-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bust Symbols assistant script cache and ensure expert layers
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('wpaws/protocol-symbols/index.html')
          text = p.read_text(encoding='utf-8')
          version = os.environ['COMMIT_SHA'][:12]

          text2 = re.sub(
              r'wpa-symbols-comprehensive-v3\.js\?v=[^"\']+',
              f'wpa-symbols-comprehensive-v3.js?v={version}',
              text,
          )

          ratio_tag = f'<script src="./wpa-symbols-ratio-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-ratio-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-ratio-v1\.js\?v=[^"]+" defer></script>', ratio_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-comprehensive-v3\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols comprehensive script tag found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + ratio_tag, 1)

          comparison_tag = f'<script src="./wpa-symbols-comparison-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-comparison-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-comparison-v1\.js\?v=[^"]+" defer></script>', comparison_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-ratio-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols ratio marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + comparison_tag, 1)

          focus_tag = f'<script src="./wpa-symbols-focus-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-focus-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-focus-v1\.js\?v=[^"]+" defer></script>', focus_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-comparison-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols comparison marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + focus_tag, 1)

          un_tag = f'<script src="./wpa-symbols-un-status-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-un-status-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-un-status-v1\.js\?v=[^"]+" defer></script>', un_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-focus-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols focus marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + un_tag, 1)

          national_days_tag = f'<script src="./wpa-symbols-national-days-focus-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-national-days-focus-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-national-days-focus-v1\.js\?v=[^"]+" defer></script>', national_days_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-un-status-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols UN status marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + national_days_tag, 1)

          attribution_tag = f'<script src="./wpa-symbols-attribution-policy-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-attribution-policy-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-attribution-policy-v1\.js\?v=[^"]+" defer></script>', attribution_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-national-days-focus-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols national-days marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + attribution_tag, 1)

          context_tag = f'<script src="./wpa-symbols-context-intent-v1.js?v={version}" defer></script>'
          if 'wpa-symbols-context-intent-v1.js' in text2:
              text2 = re.sub(r'<script src="\./wpa-symbols-context-intent-v1\.js\?v=[^"]+" defer></script>', context_tag, text2)
          else:
              marker = re.search(r'(<script src="\./wpa-symbols-attribution-policy-v1\.js\?v=[^"]+" defer></script>)', text2)
              if not marker: raise SystemExit('No Symbols attribution-policy marker found.')
              text2 = text2.replace(marker.group(1), marker.group(1) + '\n' + context_tag, 1)

          if text2 == text:
              raise SystemExit('No Symbols cache-bust change was needed.')
          p.write_text(text2, encoding='utf-8')
          PY

      - name: Commit cache-bust version
        run: |
          if git diff --quiet -- wpaws/protocol-symbols/index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wpaws/protocol-symbols/index.html
          git commit -m 'Bust WPA Symbols assistant cache'
          git pull --rebase origin main
          git push origin HEAD:main
