name: WPA Symbols cache bust

on:
  push:
    branches: [main]
    paths:
      - 'wpaws/protocol-symbols/wpa-symbols-comprehensive-v3.js'
      - 'wpaws/protocol-symbols/wpa-symbols-ratio-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-comparison-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-focus-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-un-status-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-national-days-focus-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-national-days-runtime-bridge-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-attribution-policy-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-context-intent-v1.js'
      - 'wpaws/protocol-symbols/wpa-symbols-flag-spec-v1.js'
      - 'wpaws/protocol-symbols/data/un-status-v1.json'
      - 'wpaws/protocol-symbols/data/mk-flag-spec-v1.json'
      - 'wpaws/protocol-symbols/national-holidays-mfa-seed.json'
      - '.github/workflows/wpa-symbols-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-script-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bust Symbols assistant script cache and ensure expert layers
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('wpaws/protocol-symbols/index.html')
          text = p.read_text(encoding='utf-8')
          version = os.environ['COMMIT_SHA'][:12]

          text2 = re.sub(
              r'wpa-symbols-comprehensive-v3\.js\?v=[^"\']+',
              f'wpa-symbols-comprehensive-v3.js?v={version}',
              text,
          )

          def ensure_after(text, filename, marker_filename):
              tag = f'<script src="./{filename}?v={version}" defer></script>'
              if filename in text:
                  return re.sub(
                      rf'<script src="\./{re.escape(filename)}\?v=[^"]+" defer></script>',
                      tag,
                      text,
                  )
              marker = re.search(
                  rf'(<script src="\./{re.escape(marker_filename)}\?v=[^"]+" defer></script>)',
                  text,
              )
              if not marker:
                  raise SystemExit(f'No Symbols marker found for {filename}: {marker_filename}')
              return text.replace(marker.group(1), marker.group(1) + '\n' + tag, 1)

          text2 = ensure_after(text2, 'wpa-symbols-ratio-v1.js', 'wpa-symbols-comprehensive-v3.js')
          text2 = ensure_after(text2, 'wpa-symbols-comparison-v1.js', 'wpa-symbols-ratio-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-focus-v1.js', 'wpa-symbols-comparison-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-un-status-v1.js', 'wpa-symbols-focus-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-national-days-focus-v1.js', 'wpa-symbols-un-status-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-national-days-runtime-bridge-v1.js', 'wpa-symbols-national-days-focus-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-attribution-policy-v1.js', 'wpa-symbols-national-days-runtime-bridge-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-context-intent-v1.js', 'wpa-symbols-attribution-policy-v1.js')
          text2 = ensure_after(text2, 'wpa-symbols-flag-spec-v1.js', 'wpa-symbols-context-intent-v1.js')

          # The flag-spec guard must be the last expert layer so short follow-ups
          # such as "Кој е кодот на бојата?" cannot be swallowed by older wrappers.
          flag_tag_re = r'<script src="\./wpa-symbols-flag-spec-v1\.js\?v=[^"]+" defer></script>\n?'
          m = re.search(flag_tag_re, text2)
          if not m:
              raise SystemExit('No Symbols flag-spec tag found after ensure step.')
          flag_tag = m.group(0).strip()
          text2 = re.sub(flag_tag_re, '', text2)
          text2 = text2.replace('</body>', flag_tag + '\n</body>', 1)

          if text2 == text:
              raise SystemExit('No Symbols cache-bust change was needed.')
          p.write_text(text2, encoding='utf-8')
          PY

      - name: Commit cache-bust version
        run: |
          if git diff --quiet -- wpaws/protocol-symbols/index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wpaws/protocol-symbols/index.html
          git commit -m 'Bust WPA Symbols assistant cache'
          git pull --rebase origin main
          git push origin HEAD:main
