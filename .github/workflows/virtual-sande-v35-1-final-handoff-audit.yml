name: Virtual Sande v35.1 Final Handoff Audit

on:
  pull_request:
    paths:
      - 'docs/virtual-sande-v35.1-final-handoff.md'
      - 'config/virtual-sande-v35.1-production-decision.json'
      - 'config/virtual-sande-v35.1-production-candidate.json'
      - 'config/virtual-sande-v35.1-certification-ledger.json'
      - '.github/workflows/virtual-sande-v35-1-final-handoff-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate approved phased release handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          certified = '6a1822ba8e524a454dcf4a038f3d6bc38c3d500d'
          decision = json.loads(Path('config/virtual-sande-v35.1-production-decision.json').read_text())
          candidate = json.loads(Path('config/virtual-sande-v35.1-production-candidate.json').read_text())
          ledger = json.loads(Path('config/virtual-sande-v35.1-certification-ledger.json').read_text())
          assert decision['decision'] == 'GO_APPROVED_PENDING_PROTECTED_PRODUCTION_DEPLOY'
          assert decision['production_authorized'] is True
          assert decision['owner_approval']['production_deploy'] is True
          assert decision['owner_approval']['public_cutover'] is True
          assert decision['public_cutover']['execution_status'] == 'BLOCKED_UNTIL_PRODUCTION_DEPLOYMENT_AND_ACCEPTANCE_PASS'
          assert decision['staging_certification']['candidate_sha'] == certified
          assert candidate['production_authorized'] is True
          assert candidate['certified_candidate_sha'] == certified
          assert candidate['deployment']['production_acceptance_before_cutover'] is True
          assert ledger['certification_status'] == 'STAGING_CERTIFIED_EXACT_CANDIDATE'
          assert ledger['certified_candidate_sha'] == certified
          PY

      - name: Verify phased release boundaries
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-production/wrangler.toml
          test -f .github/workflows/deploy-virtual-sande-v35-1-production.yml
          python3 - <<'PY'
          from pathlib import Path
          deploy = Path('.github/workflows/deploy-virtual-sande-v35-1-production.yml').read_text()
          required = ['environment: production', 'Run production acceptance before public cutover', 'Public cutover performed: **No**']
          missing = [x for x in required if x not in deploy]
          if missing: raise SystemExit(f'Missing phased release controls: {missing}')
          PY

      - name: Record approved boundary
        run: |
          {
            echo '## Virtual Sande v35.1 Approved Release Handoff'
            echo '- Exact-candidate staging certification: **Passed**'
            echo '- Explicit production and cutover approval: **Recorded**'
            echo '- Dedicated production deploy: **Pending protected environment/manual dispatch**'
            echo '- Public cutover: **Blocked until production acceptance passes**'
          } >> "$GITHUB_STEP_SUMMARY"
