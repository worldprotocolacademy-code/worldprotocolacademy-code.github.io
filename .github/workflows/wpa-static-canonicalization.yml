name: WPA Static Canonical Truth

on:
  pull_request:
    paths:
      - 'index.html'
      - 'institute.html'
      - 'security.html'
      - 'sitemap.xml'
      - 'wpaws/**'
      - 'scripts/**'
      - 'locales/**'
      - 'data/**'
      - '.github/workflows/wpa-static-canonicalization.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'institute.html'
      - 'security.html'
      - 'sitemap.xml'
      - 'wpaws/**'
      - 'scripts/**'
      - 'locales/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate canonical public truth
        run: python scripts/validate_canonical_public_truth.py
