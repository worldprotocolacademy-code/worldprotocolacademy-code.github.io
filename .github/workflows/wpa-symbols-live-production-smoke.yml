name: WPA Symbols Live Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'wpaws/protocol-symbols/**'
      - 'CNAME'
      - '.github/workflows/wpa-symbols-live-production-smoke.yml'
      - '.github/workflows/wpa-symbols-oicp-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-symbols-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live Symbols production endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://worldprotocolacademy.mk/wpaws/protocol-symbols'

          # Retry the whole evidence set, not only HTTP failures. GitHub Pages can
          # briefly return HTTP 200 with the previous deployment while propagation
          # is still completing, so content assertions must also participate in
          # the bounded retry window.
          for i in {1..10}; do
            suffix="?production_smoke=${GITHUB_SHA}-${GITHUB_RUN_ID}-${i}"
            ok=1

            curl --fail --silent --show-error --location \
              --connect-timeout 4 --max-time 8 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$base/$suffix" -o /tmp/symbols-index.html || ok=0

            curl --fail --silent --show-error --location \
              --connect-timeout 4 --max-time 8 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$base/wpa-symbols-serbia-kosovo-case-v1.js$suffix" -o /tmp/serbia-kosovo.js || ok=0

            curl --fail --silent --show-error --location \
              --connect-timeout 4 --max-time 8 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$base/wpa-symbols-oicp-hardening-v1.js$suffix" -o /tmp/oicp-hardening.js || ok=0

            curl --fail --silent --show-error --location \
              --connect-timeout 4 --max-time 8 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$base/data/active-runtime-197.json$suffix" -o /tmp/active-runtime-197.json || ok=0

            if [ "$ok" -eq 1 ] \
              && grep -q 'wpa-symbols-serbia-kosovo-case-v1.js' /tmp/symbols-index.html \
              && grep -q 'chatInput' /tmp/symbols-index.html \
              && grep -q 'wpa-symbols-oicp-hardening-v1.js' /tmp/serbia-kosovo.js \
              && grep -q 'WPA Symbols OICP Hardening v1.1' /tmp/oicp-hardening.js \
              && grep -q 'active.records.length===197' /tmp/oicp-hardening.js \
              && python - <<'PY'
          import json
          with open('/tmp/active-runtime-197.json', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data.get('records', [])) == 197, len(data.get('records', []))
          counts = data.get('counts', {})
          assert counts.get('entities') == 197, counts
          assert counts.get('organizations') == 9, counts
          assert counts.get('national_day_records') == 95, counts
          assert data.get('governance', {}).get('no_llm_guessing_for_missing_fields') is True
          PY
            then
              echo 'Live WPA Symbols dataset: PASS'
              echo 'WPA Symbols live production smoke: PASS'
              exit 0
            fi

            echo "Live Symbols evidence not fully propagated yet (attempt $i/10)." >&2
            sleep 10
          done

          echo 'WPA Symbols live production smoke: FAIL after bounded propagation retries.' >&2
          exit 1
