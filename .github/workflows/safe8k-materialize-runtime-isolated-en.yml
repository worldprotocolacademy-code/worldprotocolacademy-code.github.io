name: SAFE-8K Materialize Runtime-Isolated EN

on:
  push:
    branches:
      - fix/translator-root-architecture-safe8k-20260901
    paths:
      - '.github/workflows/safe8k-materialize-runtime-isolated-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'worldprotocolacademy-code/worldprotocolacademy-code.github.io' && github.ref == 'refs/heads/fix/translator-root-architecture-safe8k-20260901'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/translator-root-architecture-safe8k-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Guard exact branch
        run: |
          test "$(git branch --show-current)" = "fix/translator-root-architecture-safe8k-20260901"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compose locales
        run: |
          node - <<'NODE'
          const fs=require('fs');
          function compose(basePath, overlayPath, outPath){
            const base=JSON.parse(fs.readFileSync(basePath,'utf8'));
            const overlay=JSON.parse(fs.readFileSync(overlayPath,'utf8'));
            fs.writeFileSync(outPath,JSON.stringify({...base,...overlay,_meta:{...(base._meta||{}),...(overlay._meta||{})}},null,2)+'\n');
          }
          compose('locales/index/en.json','locales/rebuild/en/index.override.json','/tmp/home.json');
          compose('locales/institute/en.json','locales/rebuild/en/institute.override.json','/tmp/institute.json');
          NODE
      - name: Build runtime-isolated candidates
        run: |
          node scripts/build_static_translation.js --source index.html --locale /tmp/home.json --lang en --canonical https://worldprotocolacademy.mk/en/ --output /tmp/home.html --strip-script wpa-translator.js --strip-script wpa-home-full-en.js --strip-script translator-loader --strip-script i18n-v2.js --strip-script wpa-language-menu-10.js --append-script /languages/wpa-public-language-router-v2.js?v=2.0
          node scripts/build_static_translation.js --source institute.html --locale /tmp/institute.json --lang en --canonical https://worldprotocolacademy.mk/en/institute.html --output /tmp/institute.html --single-h1 true --strip-script wpa-translator.js --strip-script wpa-home-full-en.js --strip-script translator-loader --strip-script i18n-v2.js --strip-script wpa-language-menu-10.js --append-script /languages/wpa-public-language-router-v2.js?v=2.0
      - name: Require quality before write
        run: python scripts/public_translation_quality_check.py --home /tmp/home.html --institute /tmp/institute.html
      - name: Materialize exact bytes
        run: |
          cp /tmp/home.html en/index.html
          cp /tmp/institute.html en/institute.html
      - name: Commit only two EN surfaces
        run: |
          git add en/index.html en/institute.html
          changed="$(git diff --cached --name-only | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(en/index\.html|en/institute\.html)$' || true)"
          test -z "$unexpected"
          git config user.name 'worldprotocolacademy-code'
          git config user.email 'worldprotocolacademy@gmail.com'
          git commit -m 'SAFE-8K materialize runtime-isolated static EN surfaces'
          git push origin HEAD:fix/translator-root-architecture-safe8k-20260901
