name: Install WPA homepage semantic contrast system v6

on:
  push:
    paths:
      - '.github/workflows/patch-home-signature-colors-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-home-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy inline color patch and install one stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the old broad v1.5 inline patch that caused light/dark conflicts.
          text = re.sub(
              r'\s*<style id="wpa-home-signature-color-v15">.*?</style>\s*',
              '\n',
              text,
              flags=re.S,
          )

          # Remove older duplicate links to the semantic stylesheet, if any.
          text = re.sub(
              r'\s*<link[^>]+href=["\']/styles/wpa-home-emergency-readability\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
              '\n',
              text,
              flags=re.I,
          )

          # Install exactly one cache-busted source of truth at the end of <head>.
          link = '<link rel="stylesheet" href="/styles/wpa-home-emergency-readability.css?v=6.0" data-wpa-style="semantic-contrast-v6">'
          if '</head>' in text:
              text = text.replace('</head>', link + '\n</head>', 1)
          else:
              raise SystemExit('index.html has no </head>')

          # Cache-bust the language loader too, but it no longer controls homepage colors.
          text = re.sub(
              r'/languages/wpa-language-menu-10\.js(?:\?v=[^"\']*)?',
              '/languages/wpa-language-menu-10.js?v=2.0',
              text,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate one-source contrast architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'wpa-home-signature-color-v15' not in text
          assert text.count('wpa-home-emergency-readability.css?v=6.0') == 1
          assert '/languages/wpa-language-menu-10.js?v=2.0' in text
          print('OK: one semantic contrast stylesheet, no legacy inline color patch')
          PY

      - name: Commit root fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "wpa-style-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Root-fix WPA homepage contrast architecture [skip ci]"
          git push
