name: Add WPA Premium Reference Card

on:
  push:
    paths:
      - 'scripts/add_premium_reference_card.py'
      - '.github/workflows/add-premium-reference-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Protocol Symbols page
        run: python scripts/add_premium_reference_card.py

      - name: Commit generated page update
        run: |
          if git diff --quiet -- wpaws/protocol-symbols/index.html; then
            echo "Premium card already present; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wpaws/protocol-symbols/index.html
          git commit -m "Add WPA Premium Reference 2026 card to Protocol Symbols"
          git push
