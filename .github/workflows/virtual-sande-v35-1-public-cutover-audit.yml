name: Virtual Sande v35.1 Public Cutover Audit

on:
  pull_request:
    paths:
      - 'index.html'
      - 'papers.html'
      - 'wpaws/index.html'
      - 'wpaws/book/index.html'
      - 'wpaws/paper/index.html'
      - 'wpaws/analysis/index.html'
      - 'protocolometry-center.html'
      - 'config/virtual-sande-v35.1-endpoint-inventory.json'
      - 'config/virtual-sande-v35.1-production-deployment-evidence.json'
      - '.github/workflows/virtual-sande-v35-1-cutover-bootstrap.yml'
      - '.github/workflows/virtual-sande-v35-1-public-cutover-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact cutover commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production evidence and routing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          legacy='https://protocol-bot-workerjs.worldprotocolacademy.workers.dev'
          production='https://wpa-virtual-sande-v35-1-production.worldprotocolacademy.workers.dev'
          evidence=json.loads(Path('config/virtual-sande-v35.1-production-deployment-evidence.json').read_text())
          inventory=json.loads(Path('config/virtual-sande-v35.1-endpoint-inventory.json').read_text())
          assert evidence['workflow_run_id']==29457124570
          assert evidence['production_url']==production
          assert evidence['dedicated_production_deploy']=='PASSED'
          assert evidence['production_acceptance']=='PASSED'
          assert evidence['legacy_compatibility']=='PASSED'
          assert inventory['production_authorized'] is True
          assert inventory['canonical_production_endpoint']==production+'/ask'
          assert inventory['cutover_strategy']=='MIGRATE_EXACTLY_SIX_VIRTUAL_SANDE_ASK_CONSUMERS'
          assert inventory['rollback_strategy']=='RESTORE_ALL_SIX_CONSUMERS_TO_LEGACY_ENDPOINT'
          assert inventory['non_virtual_sande_legacy_base_consumers']==['protocolometry-center.html']
          for path in ['index.html','papers.html','wpaws/book/index.html','wpaws/paper/index.html','wpaws/analysis/index.html']:
              text=Path(path).read_text()
              assert production+'/ask' in text
              assert legacy+'/ask' not in text
          text=Path('wpaws/index.html').read_text()
          assert production in text and legacy not in text
          protocolometry=Path('protocolometry-center.html').read_text()
          assert legacy in protocolometry and production not in protocolometry
          PY
      - name: Verify critical cutover lifecycle boundary
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base" "$head")"
          git diff --name-only "$merge_base" "$head" | sort > /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          audit='.github/workflows/virtual-sande-v35-1-public-cutover-audit.yml'
          inventory='config/virtual-sande-v35.1-endpoint-inventory.json'
          evidence='config/virtual-sande-v35.1-production-deployment-evidence.json'
          bootstrap='.github/workflows/virtual-sande-v35-1-cutover-bootstrap.yml'
          consumers={'index.html','papers.html','wpaws/analysis/index.html','wpaws/book/index.html','wpaws/index.html','wpaws/paper/index.html'}
          actual={x for x in Path('/tmp/changed.txt').read_text().splitlines() if x}
          critical=actual & {inventory,evidence,bootstrap}
          if critical:
              cutover={audit,inventory,*consumers}
              finalization={audit,bootstrap,inventory,evidence}
              lifecycle=actual & (cutover|finalization)
              if lifecycle not in (cutover,finalization):
                  raise SystemExit(f'Unexpected partial critical cutover set: {sorted(lifecycle)}')
              print(f'Critical cutover lifecycle verified: {sorted(lifecycle)}')
          else:
              print('No critical inventory, evidence or bootstrap change; UI integration changes are not treated as a production cutover.')
          PY
      - name: Cutover boundary
        run: |
          status=$(python3 -c "import json; print(json.load(open('config/virtual-sande-v35.1-endpoint-inventory.json'))['inventory_status'])")
          {
            echo '## Virtual Sande v35.1 Public Cutover Audit'
            echo '- Production evidence and exact routing: **Passed**'
            echo '- Critical lifecycle boundary: **Passed**'
            echo '- Non-critical UI integration is not a cutover: **Confirmed**'
            echo "- Cutover lifecycle status: **$status**"
          } >> "$GITHUB_STEP_SUMMARY"