name: Apply PN-003 papers patch

on:
  push:
    branches:
      - feat/add-pn003-to-papers-2026-07-16
    paths:
      - .github/workflows/apply-pn003-papers-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-pn003-to-papers-2026-07-16
          fetch-depth: 0

      - name: Patch papers.html safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('papers.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<h3>Two applied protocolometry records — open access via Zenodo.</h3>',
                  '<h3>Three applied protocolometry records — open access via Zenodo.</h3>'
              ),
              (
                  '<p><strong>Publication status:</strong> PN-001 and PN-002 are published Zenodo DOI records. WPA-PN-003 remains a working draft in authorial review, has no public DOI claim, and is not counted among the 14 published WPA Zenodo records.</p>',
                  '<p><strong>Publication status:</strong> PN-001, PN-002 and PN-003 are published Zenodo DOI records. WPA-PN-003 was published on 16 July 2026 and is counted among the 15 published WPA Zenodo records.</p>'
              ),
              (
                  '''          </article>\n        </div>\n\n        <div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;">\n          <a href="https://doi.org/10.5281/zenodo.20727210" class="btn btn-secondary" target="_blank" rel="noopener">PN-001 DOI →</a>''',
                  '''          </article>\n\n          <article class="card">\n            <span class="small-kicker">WPA-PN-003 · Applied Protocolometry Record</span>\n            <h4 class="paper-title">Les Invalides 2026 — The Coalition of the Willing Summit and Bastille Day, Paris, 13–14 July 2026</h4>\n            <p class="paper-summary">A bilingual protocol note analysing the integrated two-day ceremonial architecture of the Coalition of the Willing summit and the French state ceremonies through chrono-binding, ceremonial condensation, Evidence Ladder+, visual statecraft and applied protocolometry.</p>\n            <div class="paper-tags"><span class="tag">Protocol Note</span><span class="tag">Les Invalides</span><span class="tag">Evidence Ladder+</span></div>\n            <div class="paper-actions"><a class="btn btn-secondary" href="https://doi.org/10.5281/zenodo.21390763" target="_blank" rel="noopener">→ Zenodo DOI</a></div>\n          </article>\n        </div>\n\n        <div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;">\n          <a href="https://doi.org/10.5281/zenodo.20727210" class="btn btn-secondary" target="_blank" rel="noopener">PN-001 DOI →</a>'''
              ),
              (
                  '<a href="https://doi.org/10.5281/zenodo.20777938" class="btn btn-secondary" target="_blank" rel="noopener">PN-002 DOI →</a>\n          <a href="https://worldprotocolacademy-code.github.io/bibliography/" class="btn btn-primary" target="_blank" rel="noopener">Official Bibliography →</a>',
                  '<a href="https://doi.org/10.5281/zenodo.20777938" class="btn btn-secondary" target="_blank" rel="noopener">PN-002 DOI →</a>\n          <a href="https://doi.org/10.5281/zenodo.21390763" class="btn btn-secondary" target="_blank" rel="noopener">PN-003 DOI →</a>\n          <a href="https://worldprotocolacademy-code.github.io/bibliography/" class="btn btn-primary" target="_blank" rel="noopener">Official Bibliography →</a>'
              ),
              (
                  'Последно ажурирано: 15 јули 2026 · Last updated: 15 July 2026',
                  'Последно ажурирано: 16 јули 2026 · Last updated: 16 July 2026'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          required = [
              'WPA-PN-003 · Applied Protocolometry Record',
              'https://doi.org/10.5281/zenodo.21390763',
              'Three applied protocolometry records',
              '15 published WPA Zenodo records',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')

          path.write_text(text, encoding='utf-8')

      - name: Commit patched page
        run: |
          git config user.name "worldprotocolacademy-code"
          git config user.email "worldprotocolacademy@gmail.com"
          git add papers.html
          git commit -m "Add WPA-PN-003 to Protocol Notes section"
          git push origin HEAD:feat/add-pn003-to-papers-2026-07-16
