name: WPA Logo Binary Install

on:
  push:
    branches:
      - fix/restore-new-wpa-logo-2026-09-10
    paths:
      - '.logo-staging/READY'

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and cryptographically verify latest logo
        shell: bash
        run: |
          set -euo pipefail
          cat .logo-staging/webp.part* | base64 -d > logo.webp
          echo "3bdedd74a9dee3af9ce203365206f810dc8f09b80edc7c08aff70395092f2ac8  logo.webp" | sha256sum -c -
          test "$(head -c 4 logo.webp)" = "RIFF"
          test "$(dd if=logo.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          test "$(stat -c%s logo.webp)" -eq 74258

      - name: Install image converter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Generate and validate PNG fallback
        shell: bash
        run: |
          set -euo pipefail
          convert logo.webp -strip logo.png
          test "$(head -c 8 logo.png | xxd -p)" = "89504e470d0a1a0a"
          identify logo.webp
          identify logo.png

      - name: Commit only final logo assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png logo.webp
          git rm -r .logo-staging
          git rm .github/workflows/wpa-logo-install.yml
          git commit -m "Brand: install latest WPA logo assets"
          git push origin HEAD:fix/restore-new-wpa-logo-2026-09-10
