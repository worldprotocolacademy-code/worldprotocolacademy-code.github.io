name: WPA Logo Binary Install

on:
  push:
    branches:
      - fix/restore-new-wpa-logo-2026-09-10
    paths:
      - '.logo-staging/READY'

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified latest logo
        shell: bash
        run: |
          set -euo pipefail
          cat .logo-staging/webp.part* | base64 -d > logo.webp
          test "$(head -c 4 logo.webp)" = "RIFF"
          test "$(dd if=logo.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          test "$(stat -c%s logo.webp)" -gt 50000

          if command -v magick >/dev/null 2>&1; then
            magick logo.webp -strip logo.png
          elif command -v convert >/dev/null 2>&1; then
            convert logo.webp -strip logo.png
          else
            echo "ImageMagick is unavailable on runner" >&2
            exit 1
          fi

          test "$(head -c 8 logo.png | xxd -p)" = "89504e470d0a1a0a"
          test "$(stat -c%s logo.png)" -gt 100000
          identify logo.webp
          identify logo.png

      - name: Commit only final logo assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png logo.webp
          git rm -r .logo-staging
          git rm .github/workflows/wpa-logo-install.yml
          git commit -m "Brand: install latest WPA logo assets"
          git push origin HEAD:fix/restore-new-wpa-logo-2026-09-10
