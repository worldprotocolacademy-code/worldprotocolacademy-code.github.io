name: WPA Journal Live Production CORS Fix v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/journal-live-production-cors-fix-v2.yml

permissions:
  contents: read

concurrency:
  group: journal-live-production-cors-fix-v2
  cancel-in-progress: false

env:
  WORKER_NAME: wpa-live-production-bridge
  API_ROOT: https://wpa-live-production-bridge.worldprotocolacademy.workers.dev
  OLD_ORIGINS: https://worldprotocolacademy-code.github.io,http://localhost:8000,http://127.0.0.1:8000
  DESIRED_ORIGINS: https://worldprotocolacademy-code.github.io,http://localhost:8000,http://127.0.0.1:8000,https://worldprotocolacademy.mk,https://www.worldprotocolacademy.mk

jobs:
  cors-fix-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Preflight audited Worker state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"

          get_json() {
            local url="$1"
            local out="$2"
            local status
            status=$(curl --silent --show-error \
              --output "$out" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "$url")
            echo "GET HTTP ${status}: ${url##*/}"
            test "$status" = '200'
          }

          get_json "${API_BASE}/settings" /tmp/settings.json
          get_json "${API_BASE}/deployments" /tmp/deployments.json
          get_json "${API_BASE}/versions?per_page=5" /tmp/versions.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def envelope(path):
              payload = json.loads(Path(path).read_text())
              if payload.get('success') is not True:
                  safe = [
                      {'code': e.get('code'), 'message': e.get('message')}
                      for e in (payload.get('errors') or [])
                  ]
                  raise SystemExit(f'Cloudflare API failure: {safe}')
              return payload.get('result')

          def paged_items(result):
              if isinstance(result, dict):
                  items = result.get('items')
                  return items if isinstance(items, list) else []
              if isinstance(result, list):
                  return result
              return []

          settings = envelope('/tmp/settings.json') or {}
          deployments_result = envelope('/tmp/deployments.json')
          versions = paged_items(envelope('/tmp/versions.json'))

          bindings = settings.get('bindings') or []
          expected_names = {
              'ADMIN_TOKEN',
              'API_CACHE_SECONDS',
              'DB',
              'DEGRADED_FAILURE_THRESHOLD',
              'LAB_CACHE_LIMIT',
              'MAX_FEED_BYTES',
              'MAX_ITEMS_PER_FEED',
              'MAX_SOURCES_PER_TICK',
              'MIN_RELEVANCE_SCORE',
              'PUBLIC_ITEM_RETENTION_DAYS',
              'PUBLIC_SITE_ORIGINS',
              'QUARANTINE_FAILURE_THRESHOLD',
              'RSS_QUEUE',
          }
          names = {b.get('name') for b in bindings if isinstance(b, dict) and b.get('name')}
          if names != expected_names:
              raise SystemExit(f'PRECONDITION FAIL: binding names changed: {sorted(names)}')

          by_name = {b.get('name'): b for b in bindings if isinstance(b, dict) and b.get('name')}
          target = by_name['PUBLIC_SITE_ORIGINS']
          if target.get('type') != 'plain_text':
              raise SystemExit('PRECONDITION FAIL: PUBLIC_SITE_ORIGINS is not plain_text')

          current = str(target.get('text') or '')
          old = os.environ['OLD_ORIGINS']
          desired = os.environ['DESIRED_ORIGINS']
          if current == desired:
              already_fixed = True
          elif current == old:
              already_fixed = False
          else:
              raise SystemExit(f'PRECONDITION FAIL: unexpected PUBLIC_SITE_ORIGINS value: {current}')

          if isinstance(deployments_result, dict):
              deployments = deployments_result.get('deployments') or []
          elif isinstance(deployments_result, list):
              deployments = deployments_result
          else:
              deployments = []
          if not deployments or not isinstance(deployments[0], dict):
              raise SystemExit('PRECONDITION FAIL: no active deployment')

          active_versions = deployments[0].get('versions') or []
          if len(active_versions) != 1:
              raise SystemExit('PRECONDITION FAIL: expected one active version')
          active = active_versions[0]
          if float(active.get('percentage') or 0) != 100:
              raise SystemExit('PRECONDITION FAIL: active version is not at 100 percent')
          active_id = active.get('version_id')
          if not active_id:
              raise SystemExit('PRECONDITION FAIL: active version id missing')

          if not versions:
              raise SystemExit('PRECONDITION FAIL: versions result.items unavailable')
          latest_id = (versions[0] or {}).get('id')
          if latest_id != active_id:
              raise SystemExit(
                  f'PRECONDITION FAIL: latest version {latest_id} is not active version {active_id}'
              )

          patch_bindings = []
          for name in sorted(expected_names):
              if name == 'PUBLIC_SITE_ORIGINS':
                  patch_bindings.append({
                      'name': name,
                      'type': 'plain_text',
                      'text': desired,
                  })
              else:
                  patch_bindings.append({
                      'name': name,
                      'type': 'inherit',
                      'version_id': active_id,
                  })

          patch = {
              'bindings': patch_bindings,
              'annotations': {
                  'workers/message': 'Add WPA production domains to PUBLIC_SITE_ORIGINS'
              },
          }
          Path('/tmp/patch-settings.json').write_text(json.dumps(patch, separators=(',', ':')))
          Path('/tmp/expected-binding-names.json').write_text(json.dumps(sorted(expected_names)))
          Path('/tmp/preflight.env').write_text(
              f'OLD_VERSION_ID={active_id}\n'
              f'ALREADY_FIXED={str(already_fixed).lower()}\n'
          )
          print(f'Preflight binding count: {len(bindings)}')
          print(f'Active version: {active_id}')
          print(f'Latest version: {latest_id}')
          print(f'Already fixed: {str(already_fixed).lower()}')
          PY

          cat /tmp/preflight.env >> "$GITHUB_ENV"
          source /tmp/preflight.env

          get_json "${API_BASE}/versions/${OLD_VERSION_ID}" /tmp/old-version.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/old-version.json').read_text())
          if payload.get('success') is not True:
              raise SystemExit('PRECONDITION FAIL: active version detail unavailable')
          result = payload.get('result') or {}
          resources = result.get('resources') or {}
          script = resources.get('script') or {}
          runtime = resources.get('script_runtime') or {}
          bindings = resources.get('bindings') or []
          expected_names = set(json.loads(Path('/tmp/expected-binding-names.json').read_text()))
          names = {b.get('name') for b in bindings if isinstance(b, dict) and b.get('name')}
          if names != expected_names:
              raise SystemExit('PRECONDITION FAIL: active version binding set differs from settings')
          baseline = {
              'etag': script.get('etag'),
              'handlers': script.get('handlers'),
              'named_handlers': script.get('named_handlers'),
              'compatibility_date': runtime.get('compatibility_date'),
              'compatibility_flags': runtime.get('compatibility_flags'),
              'exports': runtime.get('exports'),
          }
          if not baseline['etag']:
              raise SystemExit('PRECONDITION FAIL: active script etag missing')
          Path('/tmp/baseline.json').write_text(json.dumps(baseline, sort_keys=True))
          print('Active code/runtime baseline captured safely.')
          PY

      - name: Create verified CORS-only Worker version
        if: env.ALREADY_FIXED != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"

          status=$(curl --silent --show-error \
            --output /tmp/patch-response.json \
            --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -F 'settings=@/tmp/patch-settings.json;type=application/json' \
            "${API_BASE}/settings")
          echo "PATCH settings HTTP ${status}"
          test "$status" = '200'

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/patch-response.json').read_text())
          if payload.get('success') is not True:
              safe = [
                  {'code': e.get('code'), 'message': e.get('message')}
                  for e in (payload.get('errors') or [])
              ]
              raise SystemExit(f'PATCH settings failed: {safe}')
          print('CORS-only settings patch accepted by Cloudflare.')
          PY

          sleep 2
          status=$(curl --silent --show-error \
            --output /tmp/versions-after.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "${API_BASE}/versions?per_page=5")
          echo "GET versions after PATCH HTTP ${status}"
          test "$status" = '200'

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/versions-after.json').read_text())
          if payload.get('success') is not True:
              raise SystemExit('POST-PATCH FAIL: versions API failure')
          result = payload.get('result')
          if isinstance(result, dict):
              versions = result.get('items') or []
          elif isinstance(result, list):
              versions = result
          else:
              versions = []
          if not versions:
              raise SystemExit('POST-PATCH FAIL: result.items returned no versions')
          new_id = (versions[0] or {}).get('id')
          old_id = os.environ['OLD_VERSION_ID']
          if not new_id or new_id == old_id:
              raise SystemExit('POST-PATCH FAIL: a distinct new version was not created')
          Path('/tmp/new-version.env').write_text(f'NEW_VERSION_ID={new_id}\n')
          print(f'New version created: {new_id}')
          PY
          cat /tmp/new-version.env >> "$GITHUB_ENV"
          source /tmp/new-version.env

          status=$(curl --silent --show-error \
            --output /tmp/new-version.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "${API_BASE}/versions/${NEW_VERSION_ID}")
          echo "GET new version detail HTTP ${status}"
          test "$status" = '200'

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          desired = os.environ['DESIRED_ORIGINS']
          baseline = json.loads(Path('/tmp/baseline.json').read_text())
          expected_names = set(json.loads(Path('/tmp/expected-binding-names.json').read_text()))
          payload = json.loads(Path('/tmp/new-version.json').read_text())
          if payload.get('success') is not True:
              raise SystemExit('POST-PATCH FAIL: new version detail unavailable')
          result = payload.get('result') or {}
          resources = result.get('resources') or {}
          bindings = resources.get('bindings') or []
          names = {b.get('name') for b in bindings if isinstance(b, dict) and b.get('name')}
          if names != expected_names:
              raise SystemExit(f'POST-PATCH FAIL: binding set changed: {sorted(names)}')
          by_name = {b.get('name'): b for b in bindings if isinstance(b, dict) and b.get('name')}
          target = by_name.get('PUBLIC_SITE_ORIGINS') or {}
          if target.get('type') != 'plain_text' or str(target.get('text') or '') != desired:
              raise SystemExit('POST-PATCH FAIL: PUBLIC_SITE_ORIGINS is not the desired value')

          script = resources.get('script') or {}
          runtime = resources.get('script_runtime') or {}
          candidate = {
              'etag': script.get('etag'),
              'handlers': script.get('handlers'),
              'named_handlers': script.get('named_handlers'),
              'compatibility_date': runtime.get('compatibility_date'),
              'compatibility_flags': runtime.get('compatibility_flags'),
              'exports': runtime.get('exports'),
          }
          if candidate != baseline:
              raise SystemExit('POST-PATCH FAIL: code/runtime baseline changed unexpectedly')
          print('New version verified: code/runtime unchanged; only approved binding value changed.')
          PY

      - name: Deploy verified version with automatic rollback and CORS smoke
        if: env.ALREADY_FIXED != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          DEPLOYED_NEW=false

          make_deployment_body() {
            local version_id="$1"
            local message="$2"
            python3 - "$version_id" "$message" <<'PY'
          import json, sys
          version_id, message = sys.argv[1], sys.argv[2]
          print(json.dumps({
              'strategy': 'percentage',
              'versions': [{'percentage': 100, 'version_id': version_id}],
              'annotations': {'workers/message': message},
          }, separators=(',', ':')))
          PY
          }

          rollback() {
            echo 'Rolling back to the previously active Worker version.'
            make_deployment_body "$OLD_VERSION_ID" 'Automatic rollback after failed WPA CORS verification' > /tmp/rollback.json
            local status
            status=$(curl --silent --show-error \
              --output /tmp/rollback-response.json \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/rollback.json \
              "${API_BASE}/deployments")
            echo "Rollback deployment HTTP ${status}"
            test "$status" = '200'
            python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/rollback-response.json').read_text())
          if payload.get('success') is not True:
              safe = [
                  {'code': e.get('code'), 'message': e.get('message')}
                  for e in (payload.get('errors') or [])
              ]
              raise SystemExit(f'ROLLBACK ERROR: {safe}')
          print('Rollback accepted by Cloudflare.')
          PY
          }

          cleanup_on_error() {
            local rc=$?
            if [ "$rc" -ne 0 ] && [ "$DEPLOYED_NEW" = 'true' ]; then
              rollback || echo 'CRITICAL: automatic rollback attempt failed.' >&2
            fi
            exit "$rc"
          }
          trap cleanup_on_error EXIT

          make_deployment_body "$NEW_VERSION_ID" 'Deploy WPA Journal Live production CORS allow-list fix' > /tmp/deploy.json
          deploy_status=$(curl --silent --show-error \
            --output /tmp/deploy-response.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy.json \
            "${API_BASE}/deployments")
          echo "Production deployment HTTP ${deploy_status}"
          test "$deploy_status" = '200'

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/deploy-response.json').read_text())
          if payload.get('success') is not True:
              safe = [
                  {'code': e.get('code'), 'message': e.get('message')}
                  for e in (payload.get('errors') or [])
              ]
              raise SystemExit(f'DEPLOY FAIL: {safe}')
          result = payload.get('result') or {}
          versions = result.get('versions') or []
          expected = os.environ['NEW_VERSION_ID']
          if len(versions) != 1 or versions[0].get('version_id') != expected or float(versions[0].get('percentage') or 0) != 100:
              raise SystemExit('DEPLOY FAIL: new version is not shown at 100 percent')
          print('New CORS-only version deployed at 100 percent.')
          PY
          DEPLOYED_NEW=true

          test_origin() {
            local origin="$1"
            local attempt status acao stamp
            for attempt in 1 2 3 4 5 6; do
              stamp=$(date +%s)-${attempt}
              status=$(curl --silent --show-error \
                --dump-header /tmp/cors-headers.txt \
                --output /tmp/cors-body.json \
                --write-out '%{http_code}' \
                -H "Origin: ${origin}" \
                -H 'Accept: application/json' \
                "${API_ROOT}/api/v1/live?limit=1&cors_smoke=${stamp}" || true)
              acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/cors-headers.txt | tail -n 1)
              if [ "$status" = '200' ] && [ "$acao" = "$origin" ]; then
                if python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('/tmp/cors-body.json').read_text())
          PY
                then
                  echo "CORS PASS for ${origin} on attempt ${attempt}"
                  return 0
                fi
              fi
              echo "CORS retry ${attempt} for ${origin}: HTTP=${status} ACAO=${acao:-missing}"
              sleep 5
            done
            return 1
          }

          test_origin 'https://worldprotocolacademy.mk'
          test_origin 'https://www.worldprotocolacademy.mk'

          verify_status=$(curl --silent --show-error \
            --output /tmp/deployments-final.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "${API_BASE}/deployments")
          echo "Final deployments verification HTTP ${verify_status}"
          test "$verify_status" = '200'

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/deployments-final.json').read_text())
          if payload.get('success') is not True:
              raise SystemExit('FINAL VERIFY FAIL: deployments API failure')
          result = payload.get('result') or {}
          deployments = result.get('deployments') if isinstance(result, dict) else result
          if not isinstance(deployments, list) or not deployments:
              raise SystemExit('FINAL VERIFY FAIL: no deployments returned')
          versions = (deployments[0] or {}).get('versions') or []
          expected = os.environ['NEW_VERSION_ID']
          if len(versions) != 1 or versions[0].get('version_id') != expected or float(versions[0].get('percentage') or 0) != 100:
              raise SystemExit('FINAL VERIFY FAIL: new version is not active at 100 percent')
          print('Final deployment verification passed.')
          PY

          DEPLOYED_NEW=false
          trap - EXIT

      - name: Verify already-correct configuration
        if: env.ALREADY_FIXED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://worldprotocolacademy.mk' 'https://www.worldprotocolacademy.mk'; do
            stamp=$(date +%s)
            status=$(curl --silent --show-error \
              --dump-header /tmp/cors-headers.txt \
              --output /tmp/cors-body.json \
              --write-out '%{http_code}' \
              -H "Origin: ${origin}" \
              -H 'Accept: application/json' \
              "${API_ROOT}/api/v1/live?limit=1&cors_smoke=${stamp}")
            acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/cors-headers.txt | tail -n 1)
            test "$status" = '200'
            test "$acao" = "$origin"
            python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('/tmp/cors-body.json').read_text())
          PY
            echo "CORS PASS for ${origin}"
          done

      - name: Publish safe production summary
        if: success()
        shell: bash
        run: |
          {
            echo '## WPA Journal Live · Production CORS Fix v2'
            echo
            echo '- Target Worker: `wpa-live-production-bridge`'
            echo '- Binding changed: `PUBLIC_SITE_ORIGINS` only'
            echo '- Other bindings: inherited from previously active version'
            echo '- Worker code/runtime baseline: verified unchanged'
            echo '- Production origins tested: apex + www'
            echo '- CORS smoke: **PASS**'
            if [ "${ALREADY_FIXED:-false}" = 'true' ]; then
              echo '- Deployment change: **not needed; configuration was already correct**'
            else
              echo "- Previous version: \`${OLD_VERSION_ID}\`"
              echo "- Active version: \`${NEW_VERSION_ID}\` at 100%"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
