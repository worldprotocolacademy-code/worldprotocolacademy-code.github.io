name: WPA public entry sync 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-public-entry-sync-20260825.yml'
      - '.github/scripts/patch_public_entry_20260825.py'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public entry layer
        run: python3 .github/scripts/patch_public_entry_20260825.py
      - name: Verify controlled diff
        run: git diff --check && git diff -- index.html
      - name: Commit public entry sync
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "WPA source maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify WPA public entry and correct homepage facts"
          git push origin HEAD:main
