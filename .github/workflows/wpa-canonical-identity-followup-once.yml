name: WPA canonical identity followup once

on:
  push:
    branches:
      - fix/wpa-journal-canonical-20260903
    paths:
      - '.github/workflows/wpa-canonical-identity-followup-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align canonical identity engine and remaining journal wording
        shell: python
        run: |
          from pathlib import Path

          changed=[]
          def patch(path, reps):
              p=Path(path)
              if not p.exists(): return
              old=p.read_text(encoding='utf-8')
              new=old
              for a,b in reps: new=new.replace(a,b)
              if new!=old:
                  p.write_text(new,encoding='utf-8')
                  changed.append(path)

          patch('journal/vol-1-issue-1-2026.html',[
              ('data-en="Free submission · symbolic post-acceptance fee · waivers"','data-en="Free submission · no publication or production fee is currently active"'),
              ('<small data-mk="World Protocol Academy · Skopje · ORCID 0009-0008-3219-394X"\n                   data-en="World Protocol Academy · Skopje · ORCID 0009-0008-3219-394X">World Protocol Academy · Skopje · ORCID 0009-0008-3219-394X</small>',
               '<small data-mk="Docent (Titular) · International University Europa Prima – Skopje · ORCID 0009-0008-3219-394X"\n                   data-en="Docent (Titular) · International University Europa Prima – Skopje · ORCID 0009-0008-3219-394X">Docent (Titular) · International University Europa Prima – Skopje · ORCID 0009-0008-3219-394X</small>'),
              ('<meta property="og:description" content="WPA Journal of Protocol, Diplomacy, Public Communication, Security and Communicology — Inaugural Issue, planned / forthcoming. Skopje, Republic of North Macedonia." />',
               '<meta property="og:description" content="WPA Journal of Protocol, Diplomacy, Public Communication, Security and Communicology — planned inaugural issue, in preparation. World Protocol Academy (WPA), development, testing and pilot phase." />'),
              ('<meta name="twitter:description" content="Specialised international interdisciplinary journal in protocol, diplomacy, public communication, security and communicology. Open Access · financial framework inactive." />',
               '<meta name="twitter:description" content="Specialised international interdisciplinary journal in protocol, diplomacy, public communication, security and communicology. Planned inaugural issue · in preparation · financial framework inactive." />'),
          ])

          patch('scripts/wpa-final-reconciliation-20260826.js',[
              ('Doc. Dr / Доц. д-р author identity','Sande Smiljanov, Ph.D. / Доц. д-р · Насловен доцент author identity'),
              ("['Assoc. Prof. Dr. Sande Smiljanov','Doc. Dr Sande Smiljanov']","['Assoc. Prof. Dr. Sande Smiljanov','Sande Smiljanov, Ph.D.']"),
              ("['Assoc. Prof. Dr Sande Smiljanov','Doc. Dr Sande Smiljanov']","['Assoc. Prof. Dr Sande Smiljanov','Sande Smiljanov, Ph.D.']"),
              ("['Assoc. Prof. Sande Smiljanov','Doc. Dr Sande Smiljanov']","['Assoc. Prof. Sande Smiljanov','Sande Smiljanov, Ph.D.']"),
              ("['Associate Professor at International University Europa Prima.','Academic affiliation: International University Europa Prima.']","['Associate Professor at International University Europa Prima.','Docent (Titular), International University Europa Prima – Skopje.']"),
              ("'Doc. Dr Sande Smiljanov · Author · Researcher · Platform Creator'","'Sande Smiljanov, Ph.D. · Docent (Titular) · Author · Researcher · Platform Creator'"),
              ("if(en&&en.textContent!=='Doc. Dr Sande Smiljanov')en.textContent='Doc. Dr Sande Smiljanov';","if(en&&en.textContent!=='Sande Smiljanov, Ph.D.')en.textContent='Sande Smiljanov, Ph.D.';"),
          ])

          patch('scripts/site_quality_check.py',[
              ('for token in ("Doc. Dr Sande Smiljanov","WP-001–WP-013"','for token in ("Sande Smiljanov, Ph.D.","WP-001–WP-013"'),
          ])

          patch('docs/WPA_CANONICAL_REFERENCE_STATE_2026-08-26.md',[
              ('Doc. Dr Sande Smiljanov','Sande Smiljanov, Ph.D.'),
              ('Associate Professor','Docent (Titular)'),
              ('Assoc. Prof. Dr.','Sande Smiljanov, Ph.D.'),
          ])

          # Prevent old canonical scripts from re-injecting the obsolete title.
          for path in [
              'scripts/wpa-public-financial-freeze-20260826.py',
              'scripts/wpa-public-canonical-hardening-20260826.py',
              'scripts/wpa-final-source-reconcile-20260826.py',
          ]:
              patch(path,[
                  ('Doc. Dr Sande Smiljanov','Sande Smiljanov, Ph.D.'),
                  ('Assoc. Prof. Dr. Sande Smiljanov','Sande Smiljanov, Ph.D.'),
                  ('Assoc. Prof. Dr Sande Smiljanov','Sande Smiljanov, Ph.D.'),
              ])

          print('Changed:', *changed, sep='\n - ')

      - name: Run canonical quality check
        run: python scripts/site_quality_check.py
      - name: Commit followup
        run: |
          git config user.name "WPA Canonical Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align canonical identity engine with Docent title" || exit 0
          git push
