name: AI Search Zero State - PLAN AND STAGE

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generate a fresh plan or stage an approved plan'
        required: true
        default: PLAN_ONLY
        type: choice
        options:
          - PLAN_ONLY
          - STAGE_ONLY
      approval_phrase:
        description: 'For STAGE_ONLY type exactly: STAGE PROTOCOL-AI ZERO STATE'
        required: false
        default: ''
        type: string
      approved_plan_sha256:
        description: 'For STAGE_ONLY paste the SHA-256 printed by PLAN_ONLY'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ai-search-zero-state-stage
  cancel-in-progress: false

jobs:
  plan_or_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.mode == 'STAGE_ONLY' && 'production' || 'staging' }}
    env:
      AI_SEARCH_INSTANCE: protocol-ai
      R2_BUCKET: protocol-kb
      WRANGLER_BIN: /tmp/node_modules/.bin/wrangler
      OUT: /tmp/ai-search-zero-state-stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enforce mode gates and credentials
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval_phrase }}
          PLAN_SHA: ${{ inputs.approved_plan_sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing production secret::$name is not available in the selected GitHub environment."
              echo "- Missing secret: $name" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          }

          echo '### Zero-state gate diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: $MODE" >> "$GITHUB_STEP_SUMMARY"
          check_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check_secret CLOUDFLARE_AI_SEARCH_TOKEN "$CLOUDFLARE_AI_SEARCH_TOKEN"

          if [ "$MODE" = STAGE_ONLY ]; then
            check_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
            if [ "$APPROVAL" != 'STAGE PROTOCOL-AI ZERO STATE' ]; then
              echo '::error title=Approval phrase mismatch::Use the exact documented STAGE_ONLY approval phrase.'
              echo '- Approval phrase: INVALID' >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo '- Approval phrase: valid' >> "$GITHUB_STEP_SUMMARY"
            fi
            if ! printf '%s' "$PLAN_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
              echo '::error title=Plan SHA invalid::The approved plan SHA must contain exactly 64 lowercase hexadecimal characters.'
              echo '- Approved plan SHA format: INVALID' >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo '- Approved plan SHA format: valid' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo '- Required credentials: present' >> "$GITHUB_STEP_SUMMARY"

      - name: Install deterministic tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf ghostscript libreoffice jq
          cd /tmp
          npm install --silent --no-audit --no-fund wrangler@4
          python3 -m pip install --disable-pip-version-check --quiet requests
          test -x "$WRANGLER_BIN"
          python3 -m py_compile "$GITHUB_WORKSPACE/scripts/ai_search_zero_state_stage.py"

      - name: Generate current migration plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 scripts/ai_search_zero_state_stage.py --mode PLAN --out "$OUT"
          cat "$OUT/counts.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage verified AI-ready corpus
        if: ${{ inputs.mode == 'STAGE_ONLY' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
        run: |
          set -uo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          set +e
          python3 scripts/ai_search_zero_state_stage.py \
            --mode STAGE \
            --approved-sha "$APPROVED_PLAN_SHA256" \
            --out "$OUT" 2>&1 | tee "$OUT/stage.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            last_item="$(grep -E '^\[[0-9]+/[0-9]+\] ' "$OUT/stage.log" | tail -n 1 || true)"
            python3 - "$OUT/failure.json" "$code" "$last_item" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          code=int(sys.argv[2])
          last=sys.argv[3]
          log=path.with_name('stage.log')
          tail=log.read_text(errors='replace').splitlines()[-120:] if log.exists() else []
          path.write_text(json.dumps({'exit_code':code,'last_item':last,'log_tail':tail},ensure_ascii=False,indent=2)+'\n')
          PY
            echo '### STAGE_ONLY failure evidence' >> "$GITHUB_STEP_SUMMARY"
            echo "- Exit code: $code" >> "$GITHUB_STEP_SUMMARY"
            echo "- Last item: ${last_item:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$OUT/stage.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          cat "$OUT/stage-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert non-destructive boundary
        if: always()
        run: |
          set -euo pipefail
          echo '### Safety boundary' >> "$GITHUB_STEP_SUMMARY"
          echo '- Original R2 objects are never deleted, moved, or overwritten.' >> "$GITHUB_STEP_SUMMARY"
          echo '- PLAN_ONLY performs no R2 writes.' >> "$GITHUB_STEP_SUMMARY"
          echo '- STAGE_ONLY writes only below a versioned `__ai_search_ready_v1__/` prefix.' >> "$GITHUB_STEP_SUMMARY"
          echo '- AI Search source parameters and sync jobs are not changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-search-zero-state-stage-${{ github.run_number }}
          path: /tmp/ai-search-zero-state-stage
          retention-days: 90
          if-no-files-found: warn
