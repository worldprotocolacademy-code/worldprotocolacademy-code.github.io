name: WPA Lighthouse and Mobile QA

on:
  push:
    branches:
      - qa/a11y-prb-baseline-2026-08-31

permissions:
  contents: read

jobs:
  prb-source-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v7

      - name: Locate accessibility source owners
        shell: bash
        run: |
          set -euo pipefail
          echo '=== INDEX mToggle / footer ==='
          grep -n -C 6 -E 'id="mToggle"|a_footer\.1|footer-brand h4|footer-col h5' index.html || true
          echo '=== INDEX mobile aria writers ==='
          grep -n -C 5 -E 'Open navigation menu|Close navigation menu|mToggle' index.html scripts/*.js || true
          echo '=== INSTITUTE core nodes ==='
          grep -n -C 6 -E 'instLangNote|jump-menu-label|wpaMobileMenuButton|wpa-institute-brand|wpaid-instruments|institute\.footer\.about_label' institute.html scripts/*.js styles/*.css || true
          echo '=== WIC selects anywhere ==='
          grep -R -n -C 6 -E 'wicPurpose|wicDomain|wicLang|wicTool' . --exclude-dir=.git --exclude='*.b64' || true
          echo '=== Institute brand href mutation ==='
          grep -R -n -C 5 -E 'wpa-institute-brand|removeAttribute\(.href.|removeAttribute\("href"' scripts styles institute.html --exclude='*.map' || true
          echo '=== Relevant script includes in institute ==='
          grep -n -E '<script[^>]+src=|<link[^>]+stylesheet' institute.html | tail -n 80 || true
