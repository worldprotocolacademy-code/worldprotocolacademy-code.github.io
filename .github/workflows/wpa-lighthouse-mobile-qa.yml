name: WPA Lighthouse and Mobile QA

on:
  push:
    branches:
      - qa/home-a11y-verify-2026-08-31

permissions:
  contents: read

concurrency:
  group: wpa-home-a11y-premerge-qa
  cancel-in-progress: true

jobs:
  home-premerge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Verify candidate source and canonical truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py
          grep -q 'role="tab" aria-selected="true"' scripts/wpa-about-interactive.js
          grep -q 'role="tab" aria-selected="true"' scripts/wpa-ai-hub-clarity.js
          grep -q 'aria-label="Примарна професионална потреба"' scripts/wpa-programme-families-interactive.js
          ! grep -q 'Вкупна академска база од 25 публикации' scripts/wpa-about-interactive.js

      - name: Start candidate static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/wpa-home-a11y-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wpa-home-a11y-http.log >&2 || true
          exit 1

      - name: Run candidate Home Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/ \
            --quiet \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-reports/home-a11y-premerge.json

      - name: Assert targeted accessibility fixes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('lighthouse-reports/home-a11y-premerge.json','utf8'));
          const mustPass=['aria-required-children','select-name','color-contrast'];
          const failed=[];
          for(const id of mustPass){
            const score=((r.audits||{})[id]||{}).score;
            console.log(`${id}=${score}`);
            if(score!==1) failed.push(id);
          }
          const c=r.categories||{};
          const pct=k=>Math.round((((c[k]||{}).score)||0)*100);
          console.log(`Home candidate: performance=${pct('performance')} accessibility=${pct('accessibility')} best-practices=${pct('best-practices')} seo=${pct('seo')}`);
          for(const id of ['heading-order','target-size']) console.log(`${id}=${((r.audits||{})[id]||{}).score}`);
          if(failed.length){console.error(`Targeted accessibility assertions failed: ${failed.join(', ')}`);process.exit(1);}
          NODE

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpa-home-a11y-premerge-lighthouse
          path: lighthouse-reports/home-a11y-premerge.json
          if-no-files-found: warn
          retention-days: 30
