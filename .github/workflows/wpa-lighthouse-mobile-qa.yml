name: WPA Lighthouse and Mobile QA

on:
  push:
    branches:
      - qa/a11y-prb-a-verify2-2026-08-31

permissions:
  contents: read

jobs:
  prb-a-final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Validate source
        run: |
          set -euo pipefail
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py
      - name: Start candidate server
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/wpa-prb-a2-http.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Home and Institute Lighthouse
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/ --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=accessibility,best-practices,seo --output=json --output-path=lighthouse-reports/home.json
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/institute.html --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=accessibility,best-practices,seo --output=json --output-path=lighthouse-reports/institute.json
      - name: Assert PR-B-A target closure
        run: |
          node <<'NODE'
          const fs=require('fs');
          const home=JSON.parse(fs.readFileSync('lighthouse-reports/home.json','utf8'));
          const inst=JSON.parse(fs.readFileSync('lighthouse-reports/institute.json','utf8'));
          const score=(r,id)=>((r.audits||{})[id]||{}).score;
          const pct=r=>Math.round((((r.categories||{}).accessibility||{}).score||0)*100);
          const failures=[];
          if(score(home,'heading-order')!==1) failures.push('home:heading-order');
          const homeLabel=score(home,'label-content-name-mismatch');
          if(homeLabel!==1 && homeLabel!==null) failures.push('home:label-content-name-mismatch');
          for(const id of ['heading-order','label-content-name-mismatch','select-name','crawlable-anchors']) if(score(inst,id)!==1) failures.push(`institute:${id}`);
          const items=((((inst.audits||{})['color-contrast']||{}).details||{}).items)||[];
          const targeted=items.filter(x=>/instLangNote|jump-menu-label|jump-link/.test(((x.node||{}).selector||'')));
          if(targeted.length) failures.push('institute:targeted-color-contrast');
          console.log(`home heading-order=${score(home,'heading-order')} label-mismatch=${homeLabel} accessibility=${pct(home)}`);
          console.log(`institute heading-order=${score(inst,'heading-order')} label-mismatch=${score(inst,'label-content-name-mismatch')} select-name=${score(inst,'select-name')} crawlable-anchors=${score(inst,'crawlable-anchors')} targeted-contrast=${targeted.length} accessibility=${pct(inst)}`);
          if(failures.length){console.error(failures.join(', '));process.exit(1);}
          NODE
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpa-prb-a-final-verification
          path: lighthouse-reports
          retention-days: 30
