name: WPA Lighthouse and Mobile QA

on:
  push:
    branches:
      - qa/perf-institute-logo-verify3-2026-08-31

permissions:
  contents: read

concurrency:
  group: wpa-lighthouse-mobile-qa-premerge-3
  cancel-in-progress: true

jobs:
  institute-premerge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify candidate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="wpa-institute-logo" src="/assets/img/logo.svg"' institute.html
          grep -q "'/assets/img/logo.svg'" scripts/virtual-sande-institute-widget.js
          grep -q "image.src = '/assets/img/logo.svg';" scripts/wpa-performance.js
          test -s assets/img/logo.svg
          echo 'Candidate source verified.'
          wc -c assets/img/logo.svg

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/wpa-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/institute.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wpa-http.log >&2 || true
          exit 1

      - name: Run Institute Lighthouse mobile report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/institute.html \
            --quiet \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-reports/institute-premerge.json

      - name: Assert heavyweight logo removed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('lighthouse-reports/institute-premerge.json', 'utf8'));
          const requests = (((r.audits || {})['network-requests'] || {}).details || {}).items || [];
          const heavy = requests.filter(x => /\/logo\.webp(?:[?#]|$)/.test(x.url || ''));
          if (heavy.length) {
            console.error('FAIL: logo.webp was still requested by candidate Institute page.');
            console.error(heavy.map(x => `${x.url} ${x.transferSize || 0}`).join('\n'));
            process.exit(1);
          }
          const light = requests.filter(x => /\/assets\/img\/logo\.svg(?:[?#]|$)/.test(x.url || ''));
          if (!light.length) {
            console.error('FAIL: lightweight logo.svg was not requested.');
            process.exit(1);
          }
          const c = r.categories || {};
          const pct = key => Math.round((((c[key] || {}).score) || 0) * 100);
          console.log(`Institute candidate: performance=${pct('performance')} accessibility=${pct('accessibility')} best-practices=${pct('best-practices')} seo=${pct('seo')}`);
          console.log(`logo.svg requests=${light.length} transfer=${light.reduce((n,x)=>n+(x.transferSize||0),0)} bytes`);
          NODE

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpa-institute-logo-premerge-lighthouse-v3
          path: lighthouse-reports/institute-premerge.json
          if-no-files-found: warn
          retention-days: 30
