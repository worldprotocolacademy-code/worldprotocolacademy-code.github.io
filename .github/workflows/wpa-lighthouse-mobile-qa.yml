name: WPA Lighthouse and Mobile QA

on:
  push:
    branches:
      - qa/a11y-prb-a-verify-2026-08-31

permissions:
  contents: read

jobs:
  prb-a-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_canonical_public_truth.py
          python3 scripts/site_quality_check.py

      - name: Start candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/wpa-prb-a-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wpa-prb-a-http.log >&2 || true
          exit 1

      - name: Run exact Home and Institute Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/ --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=accessibility,best-practices,seo --output=json --output-path=lighthouse-reports/home.json
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8000/institute.html --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=accessibility,best-practices,seo --output=json --output-path=lighthouse-reports/institute.json

      - name: Assert targeted accessibility fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const home=JSON.parse(fs.readFileSync('lighthouse-reports/home.json','utf8'));
          const inst=JSON.parse(fs.readFileSync('lighthouse-reports/institute.json','utf8'));
          function score(r,id){return ((r.audits||{})[id]||{}).score;}
          function pct(r){return Math.round((((r.categories||{}).accessibility||{}).score||0)*100);}
          const failures=[];
          for(const id of ['heading-order','label-content-name-mismatch']){
            console.log(`home ${id}=${score(home,id)}`);
            if(score(home,id)!==1) failures.push(`home:${id}`);
          }
          for(const id of ['heading-order','label-content-name-mismatch','select-name','crawlable-anchors']){
            console.log(`institute ${id}=${score(inst,id)}`);
            if(score(inst,id)!==1) failures.push(`institute:${id}`);
          }
          const contrast=((inst.audits||{})['color-contrast']||{}).details;
          const items=contrast&&Array.isArray(contrast.items)?contrast.items:[];
          const targeted=items.filter(item=>{
            const sel=((item.node||{}).selector||'');
            return /instLangNote|jump-menu-label|jump-link/.test(sel);
          });
          console.log(`targeted institute contrast failures=${targeted.length}`);
          targeted.forEach(x=>console.log(JSON.stringify(x.node||{})));
          if(targeted.length) failures.push('institute:targeted-color-contrast');
          console.log(`Home accessibility=${pct(home)}`);
          console.log(`Institute accessibility=${pct(inst)}`);
          if(failures.length){console.error(`PR-B-A assertions failed: ${failures.join(', ')}`);process.exit(1);}
          NODE

      - name: Print remaining non-targeted failures
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const name of ['home','institute']){
            const r=JSON.parse(fs.readFileSync(`lighthouse-reports/${name}.json`,'utf8'));
            console.log(`=== ${name.toUpperCase()} REMAINING ===`);
            for(const [id,a] of Object.entries(r.audits||{})){
              if(a.score===0 && a.details && Array.isArray(a.details.items) && a.details.items.length){
                console.log(`FAIL ${id}`);
                a.details.items.slice(0,10).forEach(item=>console.log(JSON.stringify(item.node||{})));
              }
            }
          }
          NODE

      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpa-prb-a-accessibility-verification
          path: lighthouse-reports
          if-no-files-found: warn
          retention-days: 30
