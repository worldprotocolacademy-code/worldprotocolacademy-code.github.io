name: SAFE-8I One-Time Static Language Selector Patch

on:
  push:
    branches:
      - fix/static-public-language-selector-safe8i-20260901
    paths:
      - .github/workflows/safe8i-static-language-selector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed static selector patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def add_french_option(path, french_url):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              french = f'<option value="{french_url}">🇫🇷 Français</option>'
              if french in text:
                  raise SystemExit(f'{path}: French option already present; refusing ambiguous patch')
              pattern = re.compile(r'(?m)^([ \t]*)<option value="https://worldprotocolacademy\.mk/en/">🇬🇧 English</option>$')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one English public option, found {len(matches)}')
              text, count = pattern.subn(lambda m: m.group(0) + '\n' + m.group(1) + french, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: French insertion failed closed')
              p.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact replacement target, found {count}: {old}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          add_french_option('index.html', 'https://worldprotocolacademy.mk/languages/fr/')
          add_french_option('institute.html', 'https://worldprotocolacademy.mk/languages/fr/institute.html')

          replace_once(
              'index.html',
              '<script src="/languages/wpa-language-menu-10.js?v=2.0" defer></script>',
              '<script src="/languages/wpa-language-menu-10.js?v=3.1" defer></script>'
          )
          replace_once(
              'institute.html',
              '<script src="/languages/wpa-language-menu-10.js" defer></script>',
              '<script src="/languages/wpa-language-menu-10.js?v=3.1" defer></script>'
          )
          replace_once(
              'languages/wpa-language-menu-10.js',
              'core.src = "/languages/wpa-language-menu-10-core.js?v=1.2";',
              'core.src = "/languages/wpa-language-menu-10-core.js?v=1.4";'
          )
          PY

      - name: Validate exact public language boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          expectations = {
              'index.html': [
                  'https://worldprotocolacademy.mk/">🇲🇰 Македонски</option>',
                  'https://worldprotocolacademy.mk/en/">🇬🇧 English</option>',
                  'https://worldprotocolacademy.mk/languages/fr/">🇫🇷 Français</option>',
                  '/languages/wpa-language-menu-10.js?v=3.1'
              ],
              'institute.html': [
                  'https://worldprotocolacademy.mk/">🇲🇰 Македонски</option>',
                  'https://worldprotocolacademy.mk/en/">🇬🇧 English</option>',
                  'https://worldprotocolacademy.mk/languages/fr/institute.html">🇫🇷 Français</option>',
                  '/languages/wpa-language-menu-10.js?v=3.1'
              ],
              'languages/wpa-language-menu-10.js': [
                  '/languages/wpa-language-menu-10-core.js?v=1.4'
              ]
          }
          for path, needles in expectations.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing expected SAFE-8I marker: {needle}')
          PY

          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' index.html institute.html languages/wpa-language-menu-10.js)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed-file set:'
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit exact branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html institute.html languages/wpa-language-menu-10.js
          git diff --cached --quiet && exit 0
          git commit -m "SAFE-8I: make French visible in static public selectors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
