name: WPA static contact sync 2026-08-25

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/wpa-static-contact-sync-20260825.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch static contact footer
        run: python3 .github/scripts/patch_static_contact_20260825.py

      - name: Verify controlled diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit static source sync
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "WPA source maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sync static WPA contact footer and update date"
          git push origin HEAD:main
