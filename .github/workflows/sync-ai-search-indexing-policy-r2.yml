name: Sync WPA AI Search Indexing Policy to R2

on:
  push:
    branches: [main]
    paths:
      - 'ops/ai-search/ai_search_indexing_policy.md'
      - '.github/workflows/sync-ai-search-indexing-policy-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wpa-ai-search-indexing-policy-r2
  cancel-in-progress: false

jobs:
  sync-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: protocol-kb
      POLICY_FILE: ops/ai-search/ai_search_indexing_policy.md
      POLICY_KEY: world-protocol-academy/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/_metadata/ai_search_indexing_policy.md
      PREFLIGHT_KEY: world-protocol-academy/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/README.md
      CLOUDFLARE_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          wrangler --version

      - name: Select a working R2 credential
        run: |
          set -euo pipefail
          test_token() {
            local token="$1"
            local label="$2"
            [ -n "$token" ] || return 1
            rm -f /tmp/wpa-policy-preflight
            if CLOUDFLARE_API_TOKEN="$token" wrangler r2 object get "$R2_BUCKET/$PREFLIGHT_KEY" --remote --file /tmp/wpa-policy-preflight >/tmp/wpa-policy-preflight.log 2>&1; then
              echo "R2 credential preflight succeeded with $label."
              echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
              return 0
            fi
            echo "R2 credential preflight failed with $label; trying next configured credential."
            return 1
          }
          if test_token "${CLOUDFLARE_API_TOKEN_PRIMARY:-}" 'CLOUDFLARE_API_TOKEN'; then
            exit 0
          fi
          if test_token "${CLOUDFLARE_AI_SEARCH_TOKEN:-}" 'CLOUDFLARE_AI_SEARCH_TOKEN'; then
            exit 0
          fi
          echo 'No configured GitHub secret currently authenticates to Cloudflare R2.' >&2
          sed -E 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1***/g' /tmp/wpa-policy-preflight.log >&2 || true
          exit 41

      - name: Upload production-aligned indexing policy
        run: |
          set -euo pipefail
          test -s "$POLICY_FILE"
          wrangler r2 object put "$R2_BUCKET/$POLICY_KEY" \
            --remote \
            --force \
            --file "$POLICY_FILE" \
            --content-type 'text/markdown; charset=utf-8'

      - name: Round-trip verify policy object
        run: |
          set -euo pipefail
          wrangler r2 object get "$R2_BUCKET/$POLICY_KEY" --remote --file /tmp/r2-policy.md >/dev/null
          expected="$(sha256sum "$POLICY_FILE" | awk '{print $1}')"
          actual="$(sha256sum /tmp/r2-policy.md | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "POLICY ROUND-TRIP VERIFIED: $actual"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpa-ai-search-indexing-policy-r2-evidence
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/r2-policy.md
