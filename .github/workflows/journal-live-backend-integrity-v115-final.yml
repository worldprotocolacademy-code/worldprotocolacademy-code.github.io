name: WPA Journal Live Backend Integrity v11.5 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/journal-live-backend-integrity-v115-final.yml
      - tools/journal-live-production-bridge/backend-integrity-v11.5.patch
      - tools/journal-live-production-bridge/backend-integrity-v11.5-response-dedupe.patch
      - tools/journal-live-production-bridge/source-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-live-backend-integrity-v115-final
  cancel-in-progress: false

env:
  WORKER_NAME: wpa-live-production-bridge
  API_ROOT: https://wpa-live-production-bridge.worldprotocolacademy.workers.dev
  SOURCE_SHA256: e096506ff99091d2508d1e6bef872d3efe24bdfdb2688bb7f00221be1c67d51f
  HARDENED_SHA256: 703431f29299a9be955036782435036e42c7dc18a761168d4e04cd882205dc1b

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Preflight exact active production state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"

          for endpoint in settings deployments 'versions?per_page=100'; do
            name=$(printf '%s' "$endpoint" | tr '/?' '__')
            code=$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' "${API_BASE}/${endpoint}")
            echo "GET ${endpoint}: ${code}"
            test "$code" = 200
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          settings_payload=json.loads(Path('/tmp/settings.json').read_text())
          deployments_payload=json.loads(Path('/tmp/deployments.json').read_text())
          versions_payload=json.loads(Path('/tmp/versions_per_page=100.json').read_text())
          for label,payload in [('settings',settings_payload),('deployments',deployments_payload),('versions',versions_payload)]:
              if payload.get('success') is not True:
                  safe=[{'code':e.get('code'),'message':e.get('message')} for e in payload.get('errors') or []]
                  raise SystemExit(f'PRECONDITION FAIL: {label}: {safe}')

          settings=settings_payload.get('result') or {}
          dep=deployments_payload.get('result')
          vr=versions_payload.get('result')
          deployments=dep.get('deployments',[]) if isinstance(dep,dict) else (dep or [])
          items=vr.get('items',[]) if isinstance(vr,dict) else (vr or [])
          if not deployments or not isinstance(deployments[0],dict):
              raise SystemExit('PRECONDITION FAIL: active deployment unavailable')
          active_versions=deployments[0].get('versions') or []
          if len(active_versions) != 1:
              raise SystemExit('PRECONDITION FAIL: expected exactly one active version')
          active=active_versions[0]
          if float(active.get('percentage') or 0) != 100:
              raise SystemExit('PRECONDITION FAIL: active version is not at 100 percent')
          active_id=active.get('version_id')
          if not active_id or not items or (items[0] or {}).get('id') != active_id:
              raise SystemExit('PRECONDITION FAIL: active version is not latest')

          expected={'ADMIN_TOKEN','API_CACHE_SECONDS','DB','DEGRADED_FAILURE_THRESHOLD','LAB_CACHE_LIMIT','MAX_FEED_BYTES','MAX_ITEMS_PER_FEED','MAX_SOURCES_PER_TICK','MIN_RELEVANCE_SCORE','PUBLIC_ITEM_RETENTION_DAYS','PUBLIC_SITE_ORIGINS','QUARANTINE_FAILURE_THRESHOLD','RSS_QUEUE'}
          bindings=settings.get('bindings') or []
          names={b.get('name') for b in bindings if isinstance(b,dict) and b.get('name')}
          if names != expected:
              raise SystemExit(f'PRECONDITION FAIL: binding drift: {sorted(names)}')
          by_name={b.get('name'):b for b in bindings if isinstance(b,dict) and b.get('name')}
          origins={x.strip() for x in str((by_name.get('PUBLIC_SITE_ORIGINS') or {}).get('text') or '').split(',') if x.strip()}
          needed={'https://worldprotocolacademy.mk','https://www.worldprotocolacademy.mk'}
          if not needed.issubset(origins):
              raise SystemExit('PRECONDITION FAIL: production CORS origins missing')
          if (by_name.get('DB') or {}).get('type') != 'd1' or (by_name.get('RSS_QUEUE') or {}).get('type') != 'queue':
              raise SystemExit('PRECONDITION FAIL: DB/Queue binding types changed')
          Path('/tmp/state.env').write_text(f'OLD_VERSION_ID={active_id}\n')
          print(f'active_version={active_id}')
          print(f'binding_count={len(bindings)}')
          PY
          cat /tmp/state.env >> "$GITHUB_ENV"
          source /tmp/state.env

          code=$(curl -sS -o /tmp/old-version.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
            "${API_BASE}/versions/${OLD_VERSION_ID}")
          echo "GET active version: ${code}"
          test "$code" = 200

          code=$(curl -sS -L -o /tmp/content.bin -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: */*' \
            "${API_BASE}/content/v2")
          echo "GET content/v2: ${code}"
          test "$code" = 200

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          raw=Path('/tmp/content.bin').read_bytes()
          head,rest=raw.split(b'\r\n\r\n',1)
          boundary=head.split(b'\r\n',1)[0]
          body=rest.rsplit(b'\r\n'+boundary+b'--',1)[0]
          Path('/tmp/index.js').write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          print('active_index_sha256='+digest)
          if digest != os.environ['SOURCE_SHA256']:
              raise SystemExit('PRECONDITION FAIL: production source hash changed')
          PY

      - name: Build deterministic hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          patch --batch --forward index.js "$GITHUB_WORKSPACE/tools/journal-live-production-bridge/backend-integrity-v11.5.patch"
          patch --batch --forward index.js "$GITHUB_WORKSPACE/tools/journal-live-production-bridge/backend-integrity-v11.5-response-dedupe.patch"
          digest=$(sha256sum index.js | cut -d' ' -f1)
          echo "hardened_index_sha256=${digest}"
          test "$digest" = "$HARDENED_SHA256"
          node --check index.js
          grep -q 'version: "11.5.0"' index.js
          grep -q 'publicationIntegrity' index.js
          grep -q 'thematicNoiseReason' index.js
          grep -q 'sameSourceContentKey' index.js

      - name: Upload candidate version with strict inherited bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/old-version.json').read_text())
          if p.get('success') is not True: raise SystemExit('BASELINE FAIL: active version metadata unavailable')
          v=p.get('result') or {}; resources=v.get('resources') or {}; rt=resources.get('script_runtime') or {}; script=resources.get('script') or {}
          names=['ADMIN_TOKEN','API_CACHE_SECONDS','DB','DEGRADED_FAILURE_THRESHOLD','LAB_CACHE_LIMIT','MAX_FEED_BYTES','MAX_ITEMS_PER_FEED','MAX_SOURCES_PER_TICK','MIN_RELEVANCE_SCORE','PUBLIC_ITEM_RETENTION_DAYS','PUBLIC_SITE_ORIGINS','QUARANTINE_FAILURE_THRESHOLD','RSS_QUEUE']
          metadata={
            'main_module':'index.js',
            'bindings':[{'name':n,'type':'inherit','version_id':'latest'} for n in names],
            'annotations':{'workers/message':'WPA Journal Live backend integrity v11.5: publication-date, freshness, noise, dedupe and error-boundary hardening'}
          }
          if rt.get('compatibility_date'): metadata['compatibility_date']=rt['compatibility_date']
          if isinstance(rt.get('compatibility_flags'),list): metadata['compatibility_flags']=rt['compatibility_flags']
          if rt.get('usage_model') in {'standard','bundled','unbound'}: metadata['usage_model']=rt['usage_model']
          if isinstance(rt.get('limits'),dict) and rt['limits']: metadata['limits']=rt['limits']
          Path('/tmp/metadata.json').write_text(json.dumps(metadata,separators=(',',':')))
          Path('/tmp/baseline.json').write_text(json.dumps({
            'handlers':script.get('handlers'),
            'named_handlers':script.get('named_handlers'),
            'runtime':{k:rt.get(k) for k in ('compatibility_date','compatibility_flags','usage_model','limits')},
            'binding_names':names
          },sort_keys=True))
          PY

          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
            -F 'metadata=</tmp/metadata.json;type=application/json' \
            -F 'index.js=@/tmp/index.js;type=application/javascript+module' \
            "${API_BASE}/versions?bindings_inherit=strict")
          echo "POST versions: ${code}"
          test "$code" = 200 -o "$code" = 201

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/upload.json').read_text())
          if p.get('success') is not True:
              safe=[{'code':e.get('code'),'message':e.get('message')} for e in p.get('errors') or []]
              raise SystemExit(f'UPLOAD FAIL: {safe}')
          new=(p.get('result') or {}).get('id')
          if not new: raise SystemExit('UPLOAD FAIL: version id missing')
          Path('/tmp/new.env').write_text(f'NEW_VERSION_ID={new}\n')
          print('candidate_version='+new)
          PY
          cat /tmp/new.env >> "$GITHUB_ENV"
          source /tmp/new.env

          code=$(curl -sS -o /tmp/new-version.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
            "${API_BASE}/versions/${NEW_VERSION_ID}")
          echo "GET candidate version: ${code}"
          test "$code" = 200

          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('/tmp/baseline.json').read_text())
          p=json.loads(Path('/tmp/new-version.json').read_text())
          if p.get('success') is not True: raise SystemExit('VERIFY FAIL: candidate metadata unavailable')
          new=p.get('result') or {}; r=new.get('resources') or {}; script=r.get('script') or {}; rt=r.get('script_runtime') or {}
          names=sorted(b.get('name') for b in r.get('bindings',[]) if isinstance(b,dict) and b.get('name'))
          if names != sorted(base['binding_names']): raise SystemExit('VERIFY FAIL: binding names changed')
          if script.get('handlers') != base['handlers'] or script.get('named_handlers') != base['named_handlers']:
              raise SystemExit('VERIFY FAIL: handler shape changed')
          for k,v in base['runtime'].items():
              if v is not None and rt.get(k) != v: raise SystemExit(f'VERIFY FAIL: runtime drift in {k}')
          print('candidate_metadata=verified')
          PY

      - name: Zero-percent canary, override smoke, promote with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          DEPLOYMENT_TOUCHED=false

          make_body() {
            python3 - "$@" <<'PY'
          import json,sys
          versions=[]
          for pair in sys.argv[1:]:
              vid,pct=pair.split(':',1)
              versions.append({'version_id':vid,'percentage':float(pct)})
          print(json.dumps({'strategy':'percentage','versions':versions},separators=(',',':')))
          PY
          }
          deploy() {
            local file=$1 out=$2 code
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data-binary "@$file" "${API_BASE}/deployments")
            echo "POST deployments: ${code}"
            test "$code" = 200
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          if p.get('success') is not True:
              safe=[{'code':e.get('code'),'message':e.get('message')} for e in p.get('errors') or []]
              raise SystemExit(f'DEPLOYMENT API FAIL: {safe}')
          PY
          }
          rollback() {
            echo 'Rolling back to previously active version.'
            make_body "${OLD_VERSION_ID}:100" > /tmp/rollback.json
            deploy /tmp/rollback.json /tmp/rollback-response.json
          }
          cleanup_on_error() {
            local rc=$?
            if [ "$rc" -ne 0 ] && [ "$DEPLOYMENT_TOUCHED" = true ]; then
              rollback || echo 'CRITICAL: automatic rollback failed.' >&2
            fi
            exit "$rc"
          }
          trap cleanup_on_error EXIT

          make_body "${OLD_VERSION_ID}:100" "${NEW_VERSION_ID}:0" > /tmp/canary.json
          deploy /tmp/canary.json /tmp/canary-response.json
          DEPLOYMENT_TOUCHED=true
          sleep 5

          override="${WORKER_NAME}=\"${NEW_VERSION_ID}\""
          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" \
            -H 'Origin: https://worldprotocolacademy.mk' -D /tmp/health-h -o /tmp/health \
            "${API_ROOT}/api/v1/health?integrity_canary=$(date +%s)"
          grep -qi '^access-control-allow-origin: https://worldprotocolacademy.mk' /tmp/health-h
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/health').read_text())
          if p.get('ok') is not True or p.get('version') != '11.5.0':
              raise SystemExit('CANARY FAIL: version override did not reach v11.5.0')
          PY

          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" \
            -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/live \
            "${API_ROOT}/api/v1/live?limit=100&integrity_canary=$(date +%s)"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=json.loads(Path('/tmp/live').read_text()); items=p.get('items')
          if not isinstance(items,list): raise SystemExit('CANARY FAIL: live contract')
          seen=set()
          lottery=re.compile(r'\b(lottery|lotto|loto|piyango|winning numbers|jackpot)\b',re.I)
          for i in items:
              pub=str(i.get('published_at') or ''); fet=str(i.get('fetched_at') or '')
              if not pub or pub==fet: raise SystemExit('CANARY FAIL: undated/fallback publication leaked')
              key=(str(i.get('source') or '').strip().lower(),str(i.get('title') or '').strip().lower(),pub[:10])
              if key in seen: raise SystemExit('CANARY FAIL: same-source title/day duplicate leaked')
              seen.add(key)
              if lottery.search(' '.join([str(i.get('title') or ''),str(i.get('summary') or '')])):
                  raise SystemExit('CANARY FAIL: lottery noise leaked')
          print(f'canary_live_items={len(items)}')
          PY

          for origin in https://worldprotocolacademy.mk https://www.worldprotocolacademy.mk; do
            curl -sS -X OPTIONS -H "Cloudflare-Workers-Version-Overrides: ${override}" \
              -H "Origin: ${origin}" -D /tmp/options-h -o /dev/null "${API_ROOT}/api/v1/live"
            grep -qi "^access-control-allow-origin: ${origin}" /tmp/options-h
            grep -qi '^vary:.*origin' /tmp/options-h
          done

          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" \
            -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/stats "${API_ROOT}/api/v1/stats?integrity_canary=$(date +%s)"
          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" \
            -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/ticker "${API_ROOT}/api/v1/ticker?limit=10&integrity_canary=$(date +%s)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('/tmp/stats').read_text()); ticker=json.loads(Path('/tmp/ticker').read_text())
          if not isinstance(stats,dict): raise SystemExit('CANARY FAIL: stats contract')
          if not isinstance(ticker.get('items'),list): raise SystemExit('CANARY FAIL: ticker contract')
          PY

          make_body "${NEW_VERSION_ID}:100" > /tmp/promote.json
          deploy /tmp/promote.json /tmp/promote-response.json
          sleep 5

          curl -sS -H 'Origin: https://worldprotocolacademy.mk' -D /tmp/final-h -o /tmp/final-health \
            "${API_ROOT}/api/v1/health?integrity_final=$(date +%s)"
          grep -qi '^access-control-allow-origin: https://worldprotocolacademy.mk' /tmp/final-h
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/final-health').read_text())
          if p.get('ok') is not True or p.get('version') != '11.5.0': raise SystemExit('FINAL FAIL: v11.5.0 not active')
          PY
          curl -sS -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/final-live \
            "${API_ROOT}/api/v1/live?limit=20&integrity_final=$(date +%s)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/final-live').read_text())
          if not isinstance(p.get('items'),list): raise SystemExit('FINAL FAIL: live contract')
          print(f"final_live_items={len(p['items'])}")
          PY

          DEPLOYMENT_TOUCHED=false
          trap - EXIT

      - name: Publish production summary
        if: success()
        shell: bash
        run: |
          {
            echo '## WPA Journal Live · Backend Integrity v11.5 Final'
            echo
            echo '- Exact audited source SHA gate: **PASS**'
            echo '- Publication timestamp integrity: **server-side**'
            echo '- Stale / future / undated records: **blocked from public Live**'
            echo '- Lottery + non-diplomatic sports-result noise: **server-side filtered**'
            echo '- Same-batch duplicate content: **filtered at ingestion**'
            echo '- Same-source title/day duplicates: **deduped in API response**'
            echo '- OPTIONS CORS `Vary: Origin`: **verified for apex + www**'
            echo '- Public internal-error detail leakage: **removed**'
            echo '- Zero-percent canary + version override: **PASS**'
            echo '- Stats + ticker contracts: **PASS**'
            echo '- Production promotion: **new version at 100%**'
            echo "- Previous version: \`${OLD_VERSION_ID}\`"
            echo "- Active version: \`${NEW_VERSION_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
