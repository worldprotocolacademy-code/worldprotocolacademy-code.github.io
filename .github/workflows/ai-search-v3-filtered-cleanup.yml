name: AI Search v3 Filtered Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a protected filtered-cleanup operation'
        required: true
        default: PLAN
        type: choice
        options:
          - PLAN
          - STATUS
          - APPLY
      approval:
        description: 'Required only for APPLY'
        required: true
        default: DO_NOT_APPROVE
        type: choice
        options:
          - DO_NOT_APPROVE
          - APPROVE_EXCLUDE_THREE_EMPTY_CSV_V3

permissions:
  contents: read

concurrency:
  group: ai-search-v3-filtered-cleanup
  cancel-in-progress: false

jobs:
  filtered_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: staging
    env:
      OUT: /tmp/ai-search-v3-filtered-cleanup
      LOCKED_PLAN_SHA256: 1fd406a4e4ea0a559f640a92728c20597479b150628c2bf9e631c5d588dccb7e

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          printf '{"mode":"%s","approval":"%s","run_id":"%s","sha":"%s","locked_plan_sha256":"%s"}\n' \
            '${{ inputs.mode }}' '${{ inputs.approval }}' '${{ github.run_id }}' '${{ github.sha }}' \
            "$LOCKED_PLAN_SHA256" > "$OUT/run-context.json"

      - name: Enforce approval and credential gates
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -uo pipefail
          fail() {
            reason="$1"
            printf '{"status":"gate_failed","reason":"%s"}\n' "$reason" > "$OUT/gate-failure.json"
            echo "::error title=AI Search filtered-cleanup gate failed::$reason"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || fail 'CLOUDFLARE_ACCOUNT_ID is missing'
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN" || fail 'CLOUDFLARE_AI_SEARCH_TOKEN is missing'
          case "$MODE" in
            PLAN|STATUS)
              test "$APPROVAL" = DO_NOT_APPROVE || fail 'PLAN/STATUS requires DO_NOT_APPROVE'
              NORMALIZED_SHA=''
              ;;
            APPLY)
              test "$APPROVAL" = APPROVE_EXCLUDE_THREE_EMPTY_CSV_V3 || fail 'APPLY requires exact cleanup approval'
              printf '%s' "$LOCKED_PLAN_SHA256" | grep -Eq '^[0-9a-f]{64}$' || fail 'repository-locked PLAN SHA-256 is malformed'
              NORMALIZED_SHA="$LOCKED_PLAN_SHA256"
              ;;
            *) fail 'unknown mode' ;;
          esac
          printf '%s' "$NORMALIZED_SHA" > "$OUT/normalized-approved-plan-sha256.txt"
          printf '{"status":"gate_passed","mode":"%s","plan_sha_source":"repository_locked","normalized_sha_length":%s}\n' \
            "$MODE" "${#NORMALIZED_SHA}" > "$OUT/gate-result.json"

      - name: Install and test controller
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet requests
          python3 -m py_compile scripts/ai_search_v3_filtered_cleanup.py
          python3 scripts/ai_search_v3_filtered_cleanup.py --self-test | tee "$OUT/self-test.log"

      - name: Run protected operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          approved_sha="$(cat "$OUT/normalized-approved-plan-sha256.txt")"
          python3 scripts/ai_search_v3_filtered_cleanup.py \
            --mode '${{ inputs.mode }}' \
            --approval '${{ inputs.approval }}' \
            --approved-plan-sha256 "$approved_sha" \
            --out "$OUT" 2>&1 | tee "$OUT/operation.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          for file in result.json status.json plan.json; do
            if [ -f "$OUT/$file" ]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$OUT/$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Safety summary
        if: always()
        run: |
          {
            echo '### AI Search v3 filtered cleanup'
            echo '- Target: `protocol-ai-v3-filtered` only.'
            echo '- PLAN and STATUS use GET requests only.'
            echo '- APPLY approval uses a repository-locked PLAN SHA; no manual SHA field exists.'
            echo '- APPLY may update only `source_params.exclude_items` with three exact redundant CSV keys and may trigger one sync job.'
            echo '- The controller recomputes the full PLAN and fails unless it exactly matches the locked PLAN SHA.'
            echo '- The original 793-key source manifest must remain SHA-locked.'
            echo '- Final success requires exact 790-key identity, 790 completed, and zero skipped/errors/queued/running/outdated.'
            echo '- Non-filter target configuration must remain byte-for-byte equivalent after canonicalization.'
            echo '- R2 objects, `protocol-ai`, `protocol-ai-v3-clean`, and production Worker configuration are never modified.'
            echo '- No delete operation or production cutover exists.'
            for file in gate-failure.json failure.json; do
              if [ -f "$OUT/$file" ]; then echo '```json'; cat "$OUT/$file"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-search-v3-filtered-cleanup-${{ github.run_number }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
