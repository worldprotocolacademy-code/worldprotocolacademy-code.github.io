name: WPA final facts and locale sync 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/wpa-final-facts-sync-trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize canonical facts and quarantine legacy homepage locales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          facts = {
            "schema": "wpa-canonical-public-facts/1.0",
            "version": "1.0.0",
            "updated": "2026-08-25",
            "canonical_site": "https://worldprotocolacademy.mk/",
            "institutional_contact": "info@worldprotocolacademy.mk",
            "author_contact": "sande@worldprotocolacademy.mk",
            "direct_wpa_contact": "sande@wpa.mk",
            "academic_corpus": {
              "total_publications": 26,
              "monographs_and_manuals": 6,
              "dissertation": 1,
              "papers_and_contributions": 19,
              "equation": "6 + 1 + 19 = 26"
            },
            "status_boundaries": {
              "certification": "FRAMEWORK_DEMO_ISSUANCE_NOT_YET_ACTIVE",
              "wpa_institute": "INDEPENDENT_DIGITAL_RESEARCH_AUTHORIAL_ANALYTICAL_PROFESSIONAL_EDUCATIONAL_PLATFORM",
              "virtual_sande_public_production": "v35.1.1",
              "virtual_sande_interface_page": "v1.0",
              "wpaws": "11.1.7"
            },
            "governance": {
              "final_institutional_authority": "human",
              "human_gate_required": True,
              "no_unverified_partnership_claims": True,
              "no_unverified_accreditation_claims": True
            },
            "note": "This file is the canonical machine-readable reference for public WPA facts that are shared across public surfaces. Historical documents may preserve older values as dated records."
          }
          fp = root / 'data/wpa-canonical-public-facts.json'
          fp.write_text(json.dumps(facts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Disable the obsolete runtime patch that hard-coded PN-003 and the old 25-publication corpus.
          p = root / 'scripts/wpa-performance.js'
          text = p.read_text(encoding='utf-8')
          old_call = "    if (isPapers()) placePn003OnPapers();"
          if text.count(old_call) != 1:
              raise SystemExit('wpa-performance.js: expected exactly one legacy PN-003 activation call')
          text = text.replace(old_call, "    // Legacy PN-003/25-publication patch retired 2026-08-25; public facts are maintained in /data/wpa-canonical-public-facts.json.", 1)
          p.write_text(text, encoding='utf-8')

          # Mark old root-homepage locale payloads as non-runtime legacy references and sanitize critical facts.
          for rel, lang in [('locales/mk/index.json','mk'), ('locales/en/index.json','en')]:
              p = root / rel
              data = json.loads(p.read_text(encoding='utf-8'))
              meta_key = '_meta' if '_meta' in data else 'meta'
              if meta_key == '_meta':
                  data['_meta']['status'] = 'legacy_nonruntime_reference'
                  data['_meta']['runtime'] = False
                  data['_meta']['updated'] = '2026-08-25'
                  data['_meta']['notes'] = 'Legacy root-homepage locale reference. Not a canonical runtime source; canonical public facts are in /data/wpa-canonical-public-facts.json.'
              else:
                  data['_meta'] = {
                    'language': lang,
                    'page': 'index',
                    'status': 'legacy_nonruntime_reference',
                    'runtime': False,
                    'updated': '2026-08-25',
                    'notes': 'Legacy root-homepage locale reference. Not a canonical runtime source; canonical public facts are in /data/wpa-canonical-public-facts.json.'
                  }

              # Institutional contact hygiene.
              if 'global' in data:
                  for key in ('contact_email','email'):
                      if key in data['global']:
                          data['global'][key] = 'info@worldprotocolacademy.mk'
              if 'footer' in data and 'contact' in data['footer']:
                  data['footer']['contact'] = 'info@worldprotocolacademy.mk'
              if 'pricing' in data and isinstance(data['pricing'], dict):
                  if 'contact' in data['pricing']:
                      data['pricing']['contact'] = 'info@worldprotocolacademy.mk'
                  data['pricing']['status'] = 'Legacy reference — not a current public offer'
                  data['pricing']['note'] = 'Legacy reference only. Current public pricing, if any, must be confirmed on the canonical WPA site or by institutional contact.'

              if lang == 'mk':
                  try:
                      items = data['matrix']['items']
                      for item in items:
                          if item.get('label') == 'Публикации':
                              item['text'] = '6 монографии и прирачници · 1 дисертација · 19 трудови и прилози · 26 вкупно'
                  except Exception:
                      raise SystemExit('MK locale: publication matrix shape changed')
                  if 'footer' in data:
                      data['footer']['brand_text'] = 'Независна дигитална академија и професионална платформа за протокол, дипломатија, институционална комуникација, истражување, публикации, WPAWS и AI-поддржани алатки.'
              else:
                  if 'meta' in data:
                      data['meta']['title'] = 'World Protocol Academy | Protocol · Diplomacy · Research · Certification · WPAWS'
                      data['meta']['description'] = 'World Protocol Academy is an independent digital academy and professional platform for protocol, diplomacy, research, public communication, security-aware readiness and AI-assisted professional learning.'
                  if 'brand' in data:
                      data['brand']['tagline'] = 'Protocol · Diplomacy · Research · Certification · WPAWS'
                  try:
                      card = data['platform']['cards'].get('passive_revenue')
                      if card:
                          card['title'] = 'Research & Publications'
                          card['text'] = 'Publications, working papers, protocolometry and evidence-backed institutional research.'
                  except Exception:
                      pass

              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Validations.
          js = (root/'scripts/wpa-performance.js').read_text(encoding='utf-8')
          if 'if (isPapers()) placePn003OnPapers();' in js:
              raise SystemExit('Legacy PN-003 runtime activation remains')
          for rel in ('locales/mk/index.json','locales/en/index.json'):
              d = json.loads((root/rel).read_text(encoding='utf-8'))
              if d.get('_meta',{}).get('runtime') is not False:
                  raise SystemExit(f'{rel}: legacy runtime quarantine failed')
              raw = (root/rel).read_text(encoding='utf-8')
              if 'worldprotocolacademy@gmail.com' in raw:
                  raise SystemExit(f'{rel}: old generic Gmail remains')
          f = json.loads(fp.read_text(encoding='utf-8'))
          a = f['academic_corpus']
          if a['monographs_and_manuals'] + a['dissertation'] + a['papers_and_contributions'] != a['total_publications']:
              raise SystemExit('Canonical publication equation does not balance')
          print('Canonical facts and legacy locale hygiene validated.')
          PY

          git diff --check
          git status --short

      - name: Commit synchronized facts layer
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No facts synchronization changes required."
            exit 0
          fi
          git config user.name "worldprotocolacademy-code"
          git config user.email "worldprotocolacademy@gmail.com"
          git add data/wpa-canonical-public-facts.json scripts/wpa-performance.js locales/mk/index.json locales/en/index.json
          git commit -m "Finalize WPA canonical facts and legacy locale hygiene"
          git push origin HEAD:main
