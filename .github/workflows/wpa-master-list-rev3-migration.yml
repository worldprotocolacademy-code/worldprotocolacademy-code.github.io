name: WPA Master List REV3 Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wpa-master-list-rev3-migration.py'
      - '.github/workflows/wpa-master-list-rev3-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden migration source guards, whitespace and public paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/wpa-master-list-rev3-migration.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '"D     | Universities, faculties, schools and academic departments | 26"': '"| D | Universities, faculties, schools and academic departments | 26 |"',
              '**Canonical source:** {REV3}  ': '**Canonical source:** {REV3}',
              '**Status:** Pre-publication candidate / internal review  ': '**Status:** Pre-publication candidate / internal review',
              '**Effective revision date:** {DATE}  ': '**Effective revision date:** {DATE}'
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          marker = '    write(path, s)\n\n\ndef update_verification_page():'
          if 'REV3_PUBLIC_PATH_HARDENING' not in s:
              block = '''    # REV3_PUBLIC_PATH_HARDENING: the global version-label replacement above can\n    # leave the old directory with a new filename; normalize current download paths.\n    s = s.replace(\n        "data/global-institutions/v1.0-corrected-4f-rev2/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3",\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3"\n    )\n    s = s.replace(\n        "data/global-institutions/v1.0-corrected-4f-rev2/WPA_Master_List_QA_Report_v1.0-CORRECTED-4F-REV3.md",\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Master_List_QA_Report_v1.0-CORRECTED-4F-REV3.md"\n    )\n    write(path, s)\n\n\ndef update_verification_page():'''
              if marker not in s:
                  raise SystemExit('Could not locate update_master_list_page write marker')
              s = s.replace(marker, block, 1)

          assertion_anchor = '    if "CORRECTED-4F-REV3" not in page or \'statTotal">161\' not in page or \'statExternal">160\' not in page:\n        raise RuntimeError("Master List public page not synchronized to REV3")'
          if 'malformed_rev2_rev3_path' not in s:
              hardened = assertion_anchor + '''\n    malformed_rev2_rev3_path = "data/global-institutions/v1.0-corrected-4f-rev2/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3"\n    if malformed_rev2_rev3_path in page:\n        raise RuntimeError("Master List public page contains mixed REV2-directory/REV3-filename download path")\n    required_public_paths = [\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.json",\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.csv",\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.md",\n        "data/global-institutions/v1.0-corrected-4f-rev3/WPA_Master_List_QA_Report_v1.0-CORRECTED-4F-REV3.md"\n    ]\n    for public_path in required_public_paths:\n        if public_path not in page:\n            raise RuntimeError(f"Master List public page missing REV3 download path: {public_path}")'''
              if assertion_anchor not in s:
                  raise SystemExit('Could not locate final public page assertion anchor')
              s = s.replace(assertion_anchor, hardened, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Run deterministic REV3 migration and QA assertions
        run: python scripts/wpa-master-list-rev3-migration.py

      - name: Inspect generated delta
        run: |
          git status --short
          git diff --check
          test -f data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.json
          test -f data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.csv
          test -f data/global-institutions/v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.md
          test -f data/global-institutions/v1.0-corrected-4f-rev3/WPA_Master_List_QA_Report_v1.0-CORRECTED-4F-REV3.md
          ! grep -q 'v1.0-corrected-4f-rev2/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3' wpa-global-institutions-master-list.html
          grep -q 'v1.0-corrected-4f-rev3/WPA_Global_Institutions_Master_v1.0-CORRECTED-4F-REV3.json' wpa-global-institutions-master-list.html

      - name: Commit REV3 only after QA passes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/wpa-master-list-rev3-migration.py \
            MASTER-LIST-CANONICAL.md \
            CHANGELOG.md \
            README.md \
            institute.html \
            intelligence-center.html \
            wpa-live-intelligence-feed.html \
            wpa-global-institutions-master-list.html \
            master-list-verification.html \
            wpa-metrics-status.html \
            wpa_institutions_master_list_v1.0.html \
            data/master-list-verification-status.json \
            data/wpa-canonical-metrics-status.json \
            data/global-institutions/v1.0-corrected-4f-rev3 \
            tools/data/institutions-master-rev3.json \
            tools/data/institutions-master.schema.json \
            tools/assets/wpa-five-engines.js \
            tools/qa-institute.sh \
            forms/wpa-index-public-disclaimer.md
          git commit -m "Harden Master List REV3 download paths"
          git push origin HEAD:main
