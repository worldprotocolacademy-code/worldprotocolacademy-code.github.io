name: Apply WPA Institute audit remediation

on:
  push:
    branches:
      - fix/wpa-institute-audit-remediation-20260718
    paths:
      - scripts/apply-wpa-institute-audit-remediation.py
      - .github/workflows/apply-wpa-institute-audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/wpa-institute-audit-remediation-20260718
          fetch-depth: 0

      - name: Apply guarded remediation
        run: python3 scripts/apply-wpa-institute-audit-remediation.py

      - name: Verify expected output
        run: |
          test -f 404.html
          grep -q 'og:title' institute.html
          grep -q 'id="main-content"' institute.html
          grep -q 'skip-link' institute.html
          grep -q 'World Protocol Academy | Протокол и дипломатија' index.html

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html institute.html 404.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Apply verified WPA Institute audit improvements"
            git push origin HEAD:fix/wpa-institute-audit-remediation-20260718
          fi
