name: Virtual Sande v35.1.1 Consistency Audit

on:
  pull_request:
    paths:
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.test.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-consistency-integration.test.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs'
      - 'config/virtual-sande-v35.1-consistency-contract.json'
      - '.github/workflows/virtual-sande-v35-1-ci.yml'
      - '.github/workflows/virtual-sande-v35-1-1-consistency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact consistency candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate runtime syntax and consistency tests
        run: |
          set -euo pipefail
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs
          node --test \
            tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.test.mjs \
            tools/virtual-sande/wpa-protocol-bot-v35.1-consistency-integration.test.mjs \
            tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.test.mjs \
            tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.test.mjs

      - name: Validate public response contract manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/virtual-sande-v35.1-consistency-contract.json').read_text())
          assert data['schema_version'] == '1.0'
          assert data['release'] == 'v35.1.1'
          assert data['public_version'] == 'v35.1.1'
          assert data['runtime'] == 'v35.1.1-multisystem-orchestrator'
          assert data['safe_entrypoint'] == 'v35.1.1-safe-entrypoint'
          assert data['base'] == 'v35.0-protocolometry-connector'
          assert data['response_contract'] == 'wpa-virtual-sande-response-v1.1'
          assert data['corrections']['greeting_requires_retrieval'] is False
          assert data['corrections']['no_context_has_context'] is False
          assert data['production_deploy_performed'] is False
          assert data['requires_same_commit_staging_recertification'] is True
          PY

      - name: Verify exact change boundary
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base" "$head")"
          git diff --name-only "$merge_base" "$head" | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/virtual-sande-v35-1-1-consistency-audit.yml',
              '.github/workflows/virtual-sande-v35-1-ci.yml',
              'config/virtual-sande-v35.1-consistency-contract.json',
              'tools/virtual-sande/wpa-protocol-bot-v35.1-consistency-integration.test.mjs',
              'tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.mjs',
              'tools/virtual-sande/wpa-protocol-bot-v35.1-response-contract.test.mjs',
              'tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs',
          }
          actual = {line for line in Path('/tmp/changed.txt').read_text().splitlines() if line}
          extra = actual - allowed
          if extra:
              raise SystemExit(f'Unexpected file in consistency PR: {sorted(extra)}')
          required = allowed - {'.github/workflows/virtual-sande-v35-1-1-consistency-audit.yml'}
          missing = required - actual
          if missing:
              raise SystemExit(f'Missing required consistency file: {sorted(missing)}')
          PY

      - name: Consistency boundary
        run: |
          {
            echo '## Virtual Sande v35.1.1 Consistency Audit'
            echo '- Public version contract: **Passed**'
            echo '- Greeting fast-path: **Passed**'
            echo '- no-context metadata: **Passed**'
            echo '- Existing security tests: **Passed**'
            echo '- Public consumers changed: **No**'
            echo '- Production deployment performed: **No**'
            echo '- Next gate: same-commit staging recertification'
          } >> "$GITHUB_STEP_SUMMARY"
