name: WPA Watch

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_WPA_WATCH_WRITE to allow this run to write generated feed files"
        required: true
        default: "DO_NOT_APPROVE"
        type: string

permissions:
  contents: write

concurrency:
  group: wpa-watch
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ inputs.approval == 'APPROVE_WPA_WATCH_WRITE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tools/wpa-watch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate WPA Watch feed
        run: npm run watch

      - name: Report
        run: npm run report

      - name: Commit outputs
        run: |
          cd ../..
          git config user.name "wpa-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/wpa-watch/items.json tools/wpa-watch/status.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "WPA Watch update $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push origin main
          fi
