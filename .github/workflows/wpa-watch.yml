name: WPA Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_WPA_WATCH_WRITE to allow this manual run to write generated feed files"
        required: true
        default: "DO_NOT_APPROVE"
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: wpa-watch
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.event_name == 'schedule' || inputs.approval == 'APPROVE_WPA_WATCH_WRITE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tools/wpa-watch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate WPA Watch feed
        run: npm run watch

      - name: Health gate before write
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const status=JSON.parse(fs.readFileSync('status.json','utf8'));
          const items=JSON.parse(fs.readFileSync('items.json','utf8'));
          const generated=new Date(status.generated);
          const ageMinutes=(Date.now()-generated.getTime())/60000;
          const fail=(m)=>{throw new Error(m)};
          if(Number.isNaN(generated.getTime())||ageMinutes<0||ageMinutes>30) fail('status.generated is missing or stale');
          if(!Array.isArray(items)||items.length<10) fail('WPA Watch produced fewer than 10 items');
          if(Number(status.sources_total)!==Number(status.sources_live)+Number(status.sources_dead)) fail('source totals do not reconcile');
          if(Number(status.sources_live)<40) fail('fewer than 40 source feeds are live');
          if(Number(status.tier_a_live)<Math.ceil(Number(status.tier_a_total)*0.90)) fail('fewer than 90% of Tier A feeds are live');
          if(Number(status.live_ratio)<0.90) fail('fewer than 90% of configured feeds are live');
          if(Number(status.items_total)!==items.length) fail('items_total does not match items.json');
          if(status.classification_version!=='WW3.0') fail('unexpected WPA Watch classification version');
          for(const [i,x] of items.entries()){
            if(!x||!String(x.title||'').trim()||!String(x.source||'').trim()||!String(x.link||'').trim()) fail(`invalid item at index ${i}`);
            if(String(x.title).length>240) fail(`title exceeds 240 characters at index ${i}`);
            if(!String(x.source_domain||'').trim()) fail(`source_domain missing at index ${i}`);
            if(x.classification_version!=='WW3.0') fail(`classification version missing at index ${i}`);
            if(!['protocol','diplomacy','pr','security','communicology','academic','general'].includes(x.domain)) fail(`unsupported item domain at index ${i}`);
          }
          console.log(`HEALTHY: ${items.length} items; ${status.sources_live}/${status.sources_total} sources live; Tier A ${status.tier_a_live}/${status.tier_a_total}; ratio ${status.live_ratio}; age ${ageMinutes.toFixed(1)} min`);
          NODE

      - name: Report
        run: npm run report

      - name: Publish healthy outputs through protected PR
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.WPA_AUTOMATION_TOKEN || github.token }}
          PUBLISH_BRANCH_PREFIX: wpa-watch
          PUBLISH_TITLE: WPA Watch automated refresh
          PUBLISH_BODY: Automated WPA Watch refresh. The generated feed passed freshness, minimum-source, minimum-item and item-integrity gates. This PR is merged only after the repository's required public-site and translator checks pass on the exact generated commit.
          PUBLISH_FILES: tools/wpa-watch/items.json tools/wpa-watch/status.json
          PUBLISH_GIT_NAME: wpa-watch-bot
        run: bash scripts/publish_protected_main.sh
