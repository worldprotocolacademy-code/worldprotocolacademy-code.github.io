name: WPA French Technical Gates

on:
  pull_request:
    paths:
      - 'languages/fr/**'
      - 'languages/wpa-public-language-router-v2.js'
      - 'languages/index.html'
      - 'data/language-activation.json'
      - 'data/language-wave1-readiness.json'
      - 'data/human-gates/fr*.json'
      - 'sitemap.xml'
      - 'scripts/fr_full_mirror_check.py'
      - 'scripts/translator_quality_check.py'
      - '.github/workflows/fr-technical-gates.yml'
  push:
    branches: [main]
    paths:
      - 'languages/fr/**'
      - 'languages/wpa-public-language-router-v2.js'
      - 'data/language-activation.json'
      - 'scripts/fr_full_mirror_check.py'
      - '.github/workflows/fr-technical-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fr-technical-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile SAFE-8Q validator
        run: python -m py_compile scripts/fr_full_mirror_check.py
      - name: Validate registry-driven full French mirror
        run: python scripts/fr_full_mirror_check.py
      - name: Preserve historical SAFE-8F Human Gate provenance
        shell: bash
        run: |
          set -euo pipefail
          for f in data/human-gates/fr.json data/human-gates/fr-review-package.json data/human-gates/fr-review-evidence.json data/human-gates/fr-technical-gates.json; do
            grep -q 'e4dcadcbce290950e189d74d24f81d04ac546b44' "$f"
            grep -q '6c442c26a7c908c414683315220486dacd33e873' "$f"
          done
      - name: Start branch-local static server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/wpa-fr-http.log 2>&1 &
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8000/languages/fr/ >/dev/null && break; sleep 0.5; done
          curl --fail --silent http://127.0.0.1:8000/languages/fr/ >/dev/null
      - name: Smoke every registered French surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/fr-routes.txt
          import json
          a=json.load(open('data/language-activation.json',encoding='utf-8'))
          for routes in a['public_surface_routes'].values():
              if 'fr' in routes: print(routes['fr'])
          PY
          while IFS= read -r path; do curl --fail --silent --show-error --location --max-time 15 --output /dev/null "http://127.0.0.1:8000${path}"; done < /tmp/fr-routes.txt
      - name: Browser accessibility and responsive sample
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          for page in /languages/fr/ /languages/fr/institute.html /languages/fr/protocolometry-center.html /languages/fr/journal/; do
            for size in 390,844 1440,900; do
              out="/tmp/fr-dom.html"
              "$chrome" --headless --no-sandbox --disable-dev-shm-usage --window-size="$size" --virtual-time-budget=1200 --dump-dom "http://127.0.0.1:8000${page}" > "$out"
              grep -q '<html lang="fr"' "$out"
              grep -q 'translate="no"' "$out"
              grep -q 'notranslate' "$out"
              grep -q '<h1' "$out"
            done
          done
      - name: Confirm existing public hreflang cluster remains valid
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' sitemap.xml
          grep -q 'hreflang="fr"' sitemap.xml
          grep -q 'https://worldprotocolacademy.mk/languages/fr/' sitemap.xml
          grep -q 'https://worldprotocolacademy.mk/languages/fr/institute.html' sitemap.xml
