name: WPA Publication Metadata Remediation 2026-08-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-publication-metadata-remediation-20260824.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wpa-publication-metadata-remediation-20260824
  cancel-in-progress: false

jobs:
  canonicalize-publication-metrics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Canonicalize active public publication metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              'index.html',
              'papers.html',
              'mk.json',
              'en.json',
              'index/mk.json',
              'index/en.json',
              'locales/index/mk.json',
              'locales/index/en.json',
              'locales/locales/index/mk.json',
              'locales/locales/index/en.json',
              'languages/wpa-language-menu-10.js',
              'bibliography/index.html'
          ]

          pairs = [
              ('5 монографии · 1 дисертација · 19 трудови · 25 вкупно',
               '6 монографии и прирачници · 1 дисертација · 19 трудови и прилози · 26 вкупно'),
              ('6 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози (25 вкупно).',
               '6 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози (26 вкупно).'),
              ('6 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози — 25 публикации вкупно.',
               '6 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози — 26 публикации вкупно.'),
              ('25 публикации (5 монографии, 1 дисертација, 19 трудови)',
               '26 публикации (6 монографии и прирачници, 1 дисертација, 19 трудови и прилози)'),
              ('Автор на 5 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози (25 вкупно публикации).',
               'Автор на 6 монографии и прирачници, 1 докторска дисертација и 19 научни трудови и прилози (26 вкупно публикации).'),
              ('25-publication academic corpus', '26-publication academic corpus'),
              ('25 Academic Publications', '26 Academic Publications'),
              ('25 академски публикации', '26 академски публикации'),
              ('25 публикации вкупно', '26 публикации вкупно'),
              ('25 вкупно публикации', '26 вкупно публикации'),
              ('5 монографии и прирачници', '6 монографии и прирачници'),
              ('5 Monographs and Handbooks', '6 Monographs and Handbooks'),
              ('5 Monographs & Handbooks', '6 Monographs & Handbooks'),
              ('5 monographs and manuals', '6 monographs and manuals'),
              ('5 monographs', '6 monographs'),
              ('25 publications', '26 publications')
          ]

          changed=[]
          for name in targets:
              p=Path(name)
              if not p.exists():
                  continue
              old=p.read_text(encoding='utf-8')
              new=old
              for a,b in pairs:
                  new=new.replace(a,b)
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(name)

          # Guard the two exact defects identified by the audit on active public source.
          checks = {
              'index.html': ['5 монографии · 1 дисертација · 19 трудови · 25 вкупно', '(25 вкупно)'],
              'papers.html': ['25-publication academic corpus']
          }
          for name, stale in checks.items():
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              for token in stale:
                  if token in text:
                      raise SystemExit(f'Stale publication metric remains in {name}: {token}')

          print('Changed files:')
          for name in changed:
              print(name)
          PY

      - name: Validate canonical public metric
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"publications_total": 26' data/wpa-public-evidence-index.json
          grep -F '"monographs_and_manuals": 6' data/wpa-public-evidence-index.json
          grep -F '"doctoral_dissertations": 1' data/wpa-public-evidence-index.json
          grep -F '"scientific_papers_and_contributions": 19' data/wpa-public-evidence-index.json
          grep -F 'wpa-central-orchestrator-1.7.0' data/wpa-public-evidence-index.json
          grep -F 'wpa-strategic-prompt-router-1.0.1' data/wpa-public-evidence-index.json

      - name: Commit metadata remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No publication metadata changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html papers.html mk.json en.json index/mk.json index/en.json locales/index/mk.json locales/index/en.json locales/locales/index/mk.json locales/locales/index/en.json languages/wpa-language-menu-10.js bibliography/index.html
          git commit -m 'Canonicalize WPA publication metrics to 26 total'
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo '## WPA publication metadata remediation'
            echo '- Canonical public metric: **26 total = 6 monographs/manuals + 1 dissertation + 19 papers/contributions**'
            echo '- Home source: **canonicalized**'
            echo '- Papers source: **canonicalized**'
            echo '- MK/EN active locale mirrors: **canonicalized where stale values existed**'
            echo '- Bibliographic records: **not altered**'
            echo '- Historical governance logs: **not altered**'
            echo '- Cloudflare Worker deployment: **not performed**'
          } >> "$GITHUB_STEP_SUMMARY"
