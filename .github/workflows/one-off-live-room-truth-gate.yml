name: One-off Live Room truth gate

on:
  push:
    branches:
      - fix/wpa-live-room-deploy-gate-2026-09-09
    paths:
      - .github/workflows/one-off-live-room-truth-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wpa-live-room-deploy-gate-2026-09-09
          fetch-depth: 0
      - name: Gate Live Room on backend health
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('live-room/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('WPA · Phase 2A · Live WebRTC', 'WPA · Phase 2A · WebRTC Client')
          s = s.replace('WebRTC media + WPA signaling + Human Gate governance.', 'WebRTC media + WPA signaling + Human Gate governance. Signaling availability is verified before room creation or joining.')
          s = s.replace('<button class="btn primary" id="createBtn">Create room</button><button class="btn" id="joinBtn">Join room</button>', '<button class="btn primary" id="createBtn" disabled>Create room</button><button class="btn" id="joinBtn" disabled>Join room</button>')
          anchor = "const $=id=>document.getElementById(id); const state={ws:null,local:null,peerId:null,role:null,peers:new Map(),pcs:new Map(),floor:null,rec:null,chunks:[],screen:null,locked:false};"
          replacement = anchor + "\nasync function backendGate(){try{const r=await fetch(SIGNAL_HTTP+'/health',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error('health');$('createBtn').disabled=false;$('joinBtn').disabled=false;setStatus('WPA signaling operational · rooms enabled.','ok')}catch(e){$('createBtn').disabled=true;$('joinBtn').disabled=true;setStatus('Phase 2A client is ready, but WPA signaling activation is pending Cloudflare authorization.','warn')}}"
          assert anchor in s
          s = s.replace(anchor, replacement, 1)
          tail = "const initial=qs();$('room').value=initial||slug();"
          assert tail in s
          s = s.replace(tail, tail + "backendGate();", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/wpa-home-audio-video-session-card.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('WPA · Live + Creator', 'WPA · Live Room + Creator')
          s = s.replace('WPA Live Room Phase 2A: real WebRTC for small consultations, classes and institutional rooms. Large webinars/broadcast remain Phase 2B.', 'WPA Live Room Phase 2A: WebRTC client is deployed; room access is health-gated on the WPA signaling service. Large webinars/broadcast remain Phase 2B.')
          p.write_text(s, encoding='utf-8')

          live = Path('live-room/index.html').read_text(encoding='utf-8')
          assert "id=\"createBtn\" disabled" in live
          assert "id=\"joinBtn\" disabled" in live
          assert 'backendGate()' in live
          assert "fetch(SIGNAL_HTTP+'/health'" in live
          card = Path('scripts/wpa-home-audio-video-session-card.js').read_text(encoding='utf-8')
          assert 'health-gated' in card
          print('Truth gate applied: Live Room cannot claim or enter rooms unless signaling health is green.')
          PY
      - name: Commit truth gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-room/index.html scripts/wpa-home-audio-video-session-card.js
          git commit -m "Health-gate WPA Live Room activation"
          git push origin HEAD:fix/wpa-live-room-deploy-gate-2026-09-09
