name: Update professional email addresses

on:
  push:
    branches:
      - update-professional-email-addresses
    paths:
      - .github/workflows/update-professional-emails.yml

permissions:
  contents: write

jobs:
  update-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: update-professional-email-addresses
          fetch-depth: 0

      - name: Apply professional email addresses
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          old_footer = '''    <li>
      <a href="mailto:worldprotocolacademy@gmail.com" style="font-size:13px;color:rgba(255,255,255,.52)" data-i18n="a_footer.26">
        worldprotocolacademy@gmail.com
      </a>
    </li>'''
          new_footer = '''    <li><a href="mailto:info@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">info@worldprotocolacademy.mk</a></li>
    <li><a href="mailto:contact@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">contact@worldprotocolacademy.mk</a></li>
    <li><a href="mailto:office@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">office@worldprotocolacademy.mk</a></li>
    <li><a href="mailto:institute@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">institute@worldprotocolacademy.mk</a></li>
    <li><a href="mailto:journal@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">journal@worldprotocolacademy.mk</a></li>
    <li><a href="mailto:sande@worldprotocolacademy.mk" style="font-size:13px;color:rgba(255,255,255,.52)">sande@worldprotocolacademy.mk</a></li>'''
          if old_footer not in text:
              raise SystemExit('Expected homepage footer contact block was not found.')
          text = text.replace(old_footer, new_footer, 1)
          text = text.replace('worldprotocolacademy@gmail.com', 'info@worldprotocolacademy.mk')
          index.write_text(text, encoding='utf-8')

          institute = root / 'institute.html'
          text = institute.read_text(encoding='utf-8')
          text = text.replace('worldprotocolacademy@gmail.com', 'institute@worldprotocolacademy.mk')
          institute.write_text(text, encoding='utf-8')

          journal = root / 'journal' / 'index.html'
          text = journal.read_text(encoding='utf-8')
          text = text.replace('worldprotocolacademy@gmail.com', 'journal@worldprotocolacademy.mk')
          text = text.replace('worldprotocolacademy@outlook.com', 'journal@worldprotocolacademy.mk')
          journal.write_text(text, encoding='utf-8')

          pricing = root / 'scripts' / 'pricing-loader.js'
          text = pricing.read_text(encoding='utf-8')
          text = text.replace("contact: 'worldprotocolacademy@gmail.com'", "contact: 'info@worldprotocolacademy.mk'")
          pricing.write_text(text, encoding='utf-8')

          Path('.github/workflows/update-professional-emails.yml').unlink()

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html institute.html journal/index.html scripts/pricing-loader.js .github/workflows/update-professional-emails.yml
          git commit -m "feat: publish WPA professional email addresses"
          git push origin update-professional-email-addresses
