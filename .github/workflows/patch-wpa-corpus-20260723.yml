name: Patch WPA corpus 2026-07-23

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_wpa_corpus_20260723.py'
      - '.github/workflows/patch-wpa-corpus-20260723.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply static corpus patch
        run: python3 scripts/patch_wpa_corpus_20260723.py

      - name: Verify required records
        run: |
          grep -q 'WPA-WP-2026-013' working-papers/index.html
          grep -q 'WPA-PN-004' working-papers/index.html
          grep -q 'wpaBibWp013' bibliography/index.html
          grep -q 'wpaBibPn004' bibliography/index.html
          grep -q 'wpaWp013PapersCard' papers.html
          grep -q 'wpaPn004PapersCard' papers.html

      - name: Commit generated static updates
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'WPA Corpus Bot'
          git config user.email 'info@worldprotocolacademy.mk'
          git add working-papers/index.html bibliography/index.html papers.html '*.html' ':!journal/**'
          git add -u
          git commit -m 'Publish WP-013 and PN-004 across WPA public corpus [skip ci]'
          git push origin HEAD:main
