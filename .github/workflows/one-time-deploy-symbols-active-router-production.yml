name: One-time deploy active Symbols router to Virtual Sande production

on:
  push:
    paths:
      - '.github/workflows/one-time-deploy-symbols-active-router-production.yml'

permissions:
  contents: read

concurrency:
  group: one-time-symbols-active-router-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Symbols runtime and Worker package
        shell: bash
        run: |
          set -euo pipefail
          test -f wpaws/protocol-symbols/data/active-runtime-197.json
          node - <<'NODE'
          const d=require('./wpaws/protocol-symbols/data/active-runtime-197.json');
          if(!d.counts || d.counts.entities!==197) throw new Error('Expected 197 entities');
          if(d.counts.organizations!==9) throw new Error('Expected 9 organizations');
          if(d.counts.national_day_records!==95) throw new Error('Expected 95 national-day records');
          console.log(d.counts);
          NODE
          node --check tools/virtual-sande/wpa-symbols-active-router-v1.mjs
          node --check workers/virtual-sande-v35.1-production/src/index.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs

      - name: Deploy dedicated production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config workers/virtual-sande-v35.1-production/wrangler.toml 2>&1 | tee /tmp/deploy.log
          PROD='https://wpa-virtual-sande-v35-1-production.worldprotocolacademy.workers.dev'
          echo "PROD=$PROD" >> "$GITHUB_ENV"

      - name: Wait for propagation and run Symbols acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/symbols-acceptance
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output /tmp/symbols-acceptance/health.json --write-out '%{http_code}' "$PROD/symbols/health" || true)
            if [ "$code" = '200' ] && grep -Fq '"active_count": 197' /tmp/symbols-acceptance/health.json; then
              break
            fi
            if [ "$attempt" = '30' ]; then cat /tmp/symbols-acceptance/health.json || true; exit 1; fi
            sleep 4
          done

          curl --fail --silent --show-error --get "$PROD/ask" \
            --data-urlencode 'message=Кажи ми сè за Албанија' --data-urlencode 'lang=mk' \
            | tee /tmp/symbols-acceptance/albania.json
          grep -F '"mode": "symbols_active_197"' /tmp/symbols-acceptance/albania.json
          grep -F 'Тирана' /tmp/symbols-acceptance/albania.json
          grep -F 'Површина' /tmp/symbols-acceptance/albania.json

          curl --fail --silent --show-error --get "$PROD/ask" \
            --data-urlencode 'message=Кои држави во Африка имаат злато во ресурсите?' --data-urlencode 'lang=mk' \
            | tee /tmp/symbols-acceptance/gold-africa.json
          grep -F '"reasoning": "cross_dataset_filter"' /tmp/symbols-acceptance/gold-africa.json

          curl --fail --silent --show-error --get "$PROD/ask" \
            --data-urlencode 'message=Која држава ја барам? Главниот град е Тирана и има двоглав орел.' --data-urlencode 'lang=mk' \
            | tee /tmp/symbols-acceptance/reverse.json
          grep -F 'Албанија' /tmp/symbols-acceptance/reverse.json

          curl --fail --silent --show-error "$PROD/safe-entrypoint/health" | tee /tmp/symbols-acceptance/base-health.json
          grep -F '"ok": true' /tmp/symbols-acceptance/base-health.json

      - name: Summary
        shell: bash
        run: |
          echo 'Active WPA Symbols router deployed and acceptance-tested on production.'
