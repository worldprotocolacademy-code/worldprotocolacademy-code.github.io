name: Apply protocol symbols editorial corrections

on:
  push:
    paths:
      - 'scripts/patch-protocol-symbols-editorial-v2.py'
      - '.github/workflows/apply-protocol-symbols-editorial-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply editorial patch
        run: python scripts/patch-protocol-symbols-editorial-v2.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wpaws/protocol-symbols/index.html
          git commit -m "Apply protocol symbols editorial corrections"
          git push
