name: One-time enable WPA Symbols Comprehensive Assistant v3

on:
  push:
    paths:
      - '.github/workflows/one-time-enable-symbols-comprehensive-v3.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add v3 script to Symbols page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wpaws/protocol-symbols/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./wpa-symbols-assistant-v2.js?v=20260810" defer></script>'
          new='<script src="./wpa-symbols-assistant-v2.js?v=20260810-2" defer></script>\n<script src="./wpa-symbols-comprehensive-v3.js?v=20260810" defer></script>'
          if 'wpa-symbols-comprehensive-v3.js' not in s:
              if old not in s:
                  raise SystemExit('Expected v2 script include not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -F 'wpa-symbols-comprehensive-v3.js' wpaws/protocol-symbols/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- wpaws/protocol-symbols/index.html; then exit 0; fi
          git config user.name 'worldprotocolacademy-code'
          git config user.email 'worldprotocolacademy@gmail.com'
          git add wpaws/protocol-symbols/index.html
          git commit -m 'Enable WPA Symbols Comprehensive Assistant v3 [skip ci]'
          git push origin HEAD:main
