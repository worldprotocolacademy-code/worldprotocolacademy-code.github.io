name: Virtual Sande v35.1 Endpoint Inventory Audit

on:
  pull_request:
    paths:
      - 'config/virtual-sande-v35.1-endpoint-inventory.json'
      - 'index.html'
      - 'papers.html'
      - 'protocolometry-center.html'
      - 'wpaws/index.html'
      - 'wpaws/book/index.html'
      - 'wpaws/paper/index.html'
      - 'wpaws/analysis/index.html'
      - '.github/workflows/virtual-sande-v35-1-endpoint-inventory-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate blocked endpoint inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/virtual-sande-v35.1-endpoint-inventory.json').read_text())
          expected_consumers = [
              'index.html',
              'papers.html',
              'protocolometry-center.html',
              'wpaws/index.html',
              'wpaws/book/index.html',
              'wpaws/paper/index.html',
              'wpaws/analysis/index.html',
          ]

          assert data['component'] == 'Virtual Sande'
          assert data['version'] == 'v35.1'
          assert data['production_authorized'] is False
          assert data['inventory_status'] == 'DISCOVERED_NOT_MIGRATED'
          assert data['legacy_public_endpoint'] == 'https://protocol-bot-workerjs.worldprotocolacademy.workers.dev/ask'
          assert data['public_consumers'] == expected_consumers
          assert data['canonical_production_endpoint'] == 'UNSET'
          assert data['cutover_strategy'] == 'UNSET'
          assert data['rollback_strategy'] == 'UNSET'
          assert data['journal_live_upstream_is_virtual_sande_endpoint'] is False
          PY

      - name: Verify exact legacy public consumer set
        run: |
          set -euo pipefail
          LEGACY_ENDPOINT='https://protocol-bot-workerjs.worldprotocolacademy.workers.dev/ask'
          cat > /tmp/expected-consumers.txt <<'EOF'
          index.html
          papers.html
          protocolometry-center.html
          wpaws/analysis/index.html
          wpaws/book/index.html
          wpaws/index.html
          wpaws/paper/index.html
          EOF
          grep -RIlF --include='*.html' --exclude-dir='.git' "$LEGACY_ENDPOINT" . \
            | sed 's#^./##' \
            | sort > /tmp/discovered-consumers.txt
          echo 'Discovered legacy consumers:'
          cat /tmp/discovered-consumers.txt
          diff -u /tmp/expected-consumers.txt /tmp/discovered-consumers.txt

      - name: Verify migration remains blocked
        run: |
          set -euo pipefail
          test ! -e workers/virtual-sande-v35.1-production/wrangler.toml
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/virtual-sande-v35-1-endpoint-inventory-audit.yml').read_text()
          forbidden = [
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler ' + 'deploy',
              'environment:' + ' production',
              'cloudflare/' + 'wrangler-action',
          ]
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(f'Forbidden deployment surface found: {found}')
          PY

      - name: Record discovery boundary
        run: |
          {
            echo '## Virtual Sande v35.1 Endpoint Inventory'
            echo
            echo '- Legacy public endpoint discovered: **Yes**'
            echo '- Exact public consumer set recorded: **7 files**'
            echo '- Canonical v35.1 production endpoint selected: **No**'
            echo '- Frontend migration performed: **No**'
            echo '- Deployment performed: **No**'
            echo '- Status: **BLOCKED pending target, cutover, rollback, and explicit approval**'
          } >> "$GITHUB_STEP_SUMMARY"
