name: WPA Media Programmes Production

on:
  schedule:
    # Run both UTC candidates and keep only the one that lands at 06:45 Europe/Skopje.
    # This preserves the 07:00 local target across CET/CEST.
    - cron: '45 4 * * *'
    - cron: '45 5 * * *'
    - cron: '15 5 * * 0'
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_wpa_media_programmes.py'
      - 'scripts/materialize_wpa_news_web.py'
      - 'media/data/programmes.json'
      - 'media/data/presenters.json'
      - '.github/workflows/wpa-media-programmes-production.yml'
      - 'tools/data/daily-protocol-minute-30-days.json'
      - 'scripts/generate_wpa_institute_daily.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Production pack to generate
        required: true
        default: all
        type: choice
        options:
          - daily
          - weekly
          - all
  pull_request:
    paths:
      - 'scripts/generate_wpa_media_programmes.py'
      - 'scripts/materialize_wpa_news_web.py'
      - 'media/**'
      - '.github/workflows/wpa-media-programmes-production.yml'
      - 'tools/data/daily-protocol-minute-30-days.json'
      - 'scripts/generate_wpa_institute_daily.py'

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: wpa-media-programmes-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile and deterministic self-test
        run: |
          python -m py_compile scripts/generate_wpa_media_programmes.py scripts/materialize_wpa_news_web.py
          python scripts/generate_wpa_media_programmes.py --repo-root . --mode all --self-test
          python scripts/materialize_wpa_news_web.py \
            --repo-root . \
            --input-dir .wpa-media-selftest/out \
            --output-dir .wpa-media-selftest/web
          test -s .wpa-media-selftest/web/status.json
          test -s .wpa-media-selftest/web/teleprompter.md

  produce:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Choose production mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 5 * * 0" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=all" >> "$GITHUB_OUTPUT"
          else
            local_hour="$(TZ=Europe/Skopje date +%H)"
            if [ "$local_hour" = "06" ]; then
              echo "value=daily" >> "$GITHUB_OUTPUT"
            else
              echo "value=skip" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate production pack
        if: ${{ steps.mode.outputs.value != 'skip' }}
        run: |
          python scripts/generate_wpa_media_programmes.py \
            --repo-root . \
            --output-dir wpa-media-output \
            --mode "${{ steps.mode.outputs.value }}"

      - name: Materialize WPA NEWS web pack
        if: ${{ steps.mode.outputs.value == 'daily' || steps.mode.outputs.value == 'all' }}
        run: |
          python scripts/materialize_wpa_news_web.py \
            --repo-root . \
            --input-dir wpa-media-output \
            --output-dir media/news/production

      - name: Validate production boundaries
        if: ${{ steps.mode.outputs.value != 'skip' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("wpa-media-output")
          manifests=list(root.rglob("*.json"))
          if not manifests:
              raise SystemExit("No media production JSON was generated")
          for p in manifests:
              d=json.loads(p.read_text(encoding="utf-8"))
              if "boundaries" in d and d["boundaries"].get("automatic_external_publication") is not False:
                  raise SystemExit(f"Automatic publication boundary drift: {p}")
              if "presenters" in d:
                  aliases={v.get("public_alias") for v in d["presenters"].values()}
                  if "Дипломатка" not in aliases or "Дипломат" not in aliases:
                      raise SystemExit(f"Canonical presenter aliases missing: {p}")
          print("WPA MEDIA PRODUCTION BOUNDARY GATE PASS")
          PY

      - name: Archive ready-to-record / episode-master package
        if: ${{ steps.mode.outputs.value != 'skip' }}
        uses: actions/upload-artifact@v7
        with:
          name: wpa-media-${{ steps.mode.outputs.value }}-${{ github.run_number }}
          path: |
            wpa-media-output/**
            media/news/production/**
          if-no-files-found: error
          retention-days: 90

      - name: Publish WPA NEWS web pack through protected Human Gate
        if: ${{ steps.mode.outputs.value == 'daily' || steps.mode.outputs.value == 'all' }}
        env:
          GH_TOKEN: ${{ secrets.WPA_AUTOMATION_TOKEN || github.token }}
          PUBLISH_BRANCH_PREFIX: wpa-news-daily
          PUBLISH_TITLE: WPA NEWS daily Human-Gate production pack
          PUBLISH_BODY: Daily WPA NEWS production pack generated from fresh public-source inputs. The web bundle contains the teleprompter, transcript, captions, shorts, description, social copy and provenance manifest. No voice/avatar render or external social/video publication is claimed. Merge remains the Human Gate.
          PUBLISH_FILES: media/news/production/latest.json media/news/production/status.json media/news/production/teleprompter.md media/news/production/transcript.md media/news/production/captions.vtt media/news/production/shorts.json media/news/production/video-description.md media/news/production/social-copy.md
          PUBLISH_GIT_NAME: wpa-news-production-bot
        run: bash scripts/publish_protected_main.sh

      - name: Release boundary
        run: |
          echo "Production pack generated and archived."
          echo "No external social/video publication was attempted."
          echo "Voice/avatar rendering remains dependent on approved canonical assets and production adapters."
          echo "Human Gate remains required before recording/rendering release and platform delivery."
