          assert g01['canonical_baseline']['version']=='v1.0-CORRECTED-4F-REV7'
          assert g01['canonical_baseline']['total_records']==250
          assert g01['scoring_pilot_control']['scoring_pilot_snapshot_exists'] is False
          assert g01['scoring_pilot_control']['pilot_ids_frozen'] is False
          assert g01['scoring_pilot_control']['direct_rev7_crosswalks_among_completed_dossiers']==2
          assert g01['scoring_pilot_control']['completed_dossiers_without_direct_rev7_crosswalk']==4
          assert g01['scoring_pilot_control']['resolution_before_dossier_cases']==7
          gate1=next(x for x in gates['gates'] if x['id']=='G01')
          assert gate1['status']=='IN_PROGRESS'
          assert gate1['evidence']=='/data/institute-index/g01-universe-control.json'
          gate2=next(x for x in gates['gates'] if x['id']=='G02')
          assert gate2['status']=='IN_PROGRESS'
          assert gate2['evidence']=='/data/institute-index/g02-evidence-corpus.json'
