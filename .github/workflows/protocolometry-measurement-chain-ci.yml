name: WPA Protocolometry Measurement Chain CI

on:
  pull_request:
    paths:
      - 'master-list-verification.html'
      - 'wpa-index-appeals-and-corrections.html'
      - 'wpa-institute-index-lab.html'
      - 'wpa-institute-measurement-ranking-strategy.html'
      - 'protocolometry-center.html'
      - 'correction-request.html'
      - 'forms/wpa-index-correction-request-form.md'
      - 'forms/wpa-index-public-disclaimer.md'
      - 'data/wpa-index-correction-log.json'
      - 'data/master-list-verification-status.json'
      - 'data/institute-index/**'
      - 'wpa-metrics-status.html'
      - 'institute.html'
      - 'scripts/protocolometry-reliability.mjs'
      - 'scripts/protocolometry-coverage-weight-stress.mjs'
      - 'scripts/protocolometry-redundancy-fairness.mjs'
      - 'scripts/protocolometry-language-antigaming.mjs'
      - 'scripts/protocolometry-correction-coi.mjs'
      - 'scripts/protocolometry-shadow-stability.mjs'
      - 'scripts/protocolometry-freeze-preflight.mjs'
      - '.github/workflows/protocolometry-measurement-chain-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate machine-readable chain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          chain=json.loads((root/'data/institute-index/measurement-chain-status.json').read_text(encoding='utf-8'))
          g01=json.loads((root/'data/institute-index/g01-universe-control.json').read_text(encoding='utf-8'))
          g02=json.loads((root/'data/institute-index/g02-evidence-corpus.json').read_text(encoding='utf-8'))
          g03=json.loads((root/'data/institute-index/g03-scoring-reproducibility.json').read_text(encoding='utf-8'))
          g04=json.loads((root/'data/institute-index/g04-inter-rater-reliability.json').read_text(encoding='utf-8'))
          g05=json.loads((root/'data/institute-index/g05-evidence-coverage-behavior.json').read_text(encoding='utf-8'))
          g06=json.loads((root/'data/institute-index/g06-weight-robustness.json').read_text(encoding='utf-8'))
          g07=json.loads((root/'data/institute-index/g07-indicator-redundancy.json').read_text(encoding='utf-8'))
          g08=json.loads((root/'data/institute-index/g08-peer-type-fairness.json').read_text(encoding='utf-8'))
          g09=json.loads((root/'data/institute-index/g09-language-regional-fairness.json').read_text(encoding='utf-8'))
          g10=json.loads((root/'data/institute-index/g10-anti-gaming-review.json').read_text(encoding='utf-8'))
          g11=json.loads((root/'data/institute-index/g11-correction-test.json').read_text(encoding='utf-8'))
          g12=json.loads((root/'data/institute-index/g12-conflict-of-interest-control.json').read_text(encoding='utf-8'))
          g13=json.loads((root/'data/institute-index/g13-shadow-index-stability.json').read_text(encoding='utf-8'))
          g14=json.loads((root/'data/institute-index/g14-methodology-freeze.json').read_text(encoding='utf-8'))
          freeze_manifest=json.loads((root/'data/institute-index/protocolometry-v1-freeze-candidate-manifest.json').read_text(encoding='utf-8'))
          gates=json.loads((root/'data/institute-index/v1-readiness-gates.json').read_text(encoding='utf-8'))
          method=json.loads((root/'data/institute-index-methodology-candidate.json').read_text(encoding='utf-8'))
          blueprint=json.loads((root/'data/institute-index/protocolometry-v1-execution-blueprint.json').read_text(encoding='utf-8'))
          verify=json.loads((root/'data/master-list-verification-status.json').read_text(encoding='utf-8'))
          corr=json.loads((root/'data/wpa-index-correction-log.json').read_text(encoding='utf-8'))

          assert chain['canonical_dataset']['version']=='v1.0-CORRECTED-4F-REV7'
          assert chain['canonical_dataset']['total_records']==250
          assert verify['canonical_dataset']=='v1.0-CORRECTED-4F-REV7'
          assert corr['canonical_dataset']=='v1.0-CORRECTED-4F-REV7'
          assert len(gates['gates'])==16
          counts={}
          for g in gates['gates']: counts[g['status']]=counts.get(g['status'],0)+1
          assert chain['readiness']['total_gates']==16
          assert chain['readiness']['passed']==counts.get('PASSED',0)
          assert chain['readiness']['in_progress']==counts.get('IN_PROGRESS',0)
          assert chain['readiness']['not_started']==counts.get('NOT_STARTED',0)
          assert chain['readiness']['locked']==counts.get('LOCKED',0)
