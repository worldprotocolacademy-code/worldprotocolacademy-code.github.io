          gate9=next(x for x in gates['gates'] if x['id']=='G09')
          gate10=next(x for x in gates['gates'] if x['id']=='G10')
          assert gate9['status']=='NOT_STARTED'
          assert gate10['status']=='NOT_STARTED'
          assert gate9['evidence']=='/data/institute-index/g09-language-regional-fairness.json'
          assert gate10['evidence']=='/data/institute-index/g10-anti-gaming-review.json'
          assert g09['status']=='NOT_STARTED'
          assert g10['status']=='NOT_STARTED'
          assert g09['fairness_contract']['primary_evidence_language_is_not_quality_proxy'] is True
          assert g09['fairness_contract']['automatic_fairness_pass_threshold'] is False
          assert g10['control_contract']['automatic_institution_blacklist'] is False
          assert g10['control_contract']['automatic_institution_wide_penalty'] is False
          assert g10['control_contract']['inferred_bad_intent_prohibited'] is True
          gate11=next(x for x in gates['gates'] if x['id']=='G11')
          gate12=next(x for x in gates['gates'] if x['id']=='G12')
          assert gate11['status']=='NOT_STARTED'
          assert gate12['status']=='NOT_STARTED'
          assert gate11['evidence']=='/data/institute-index/g11-correction-test.json'
          assert gate12['evidence']=='/data/institute-index/g12-conflict-of-interest-control.json'
          assert g11['status']=='NOT_STARTED'
          assert g12['status']=='NOT_STARTED'
          assert g11['synthetic_expectations']['public_real_cpr_log_mutation'] is False
          assert g12['control_contract']['concealment_prohibited'] is True
          assert g12['control_contract']['payment_cannot_influence_outcome'] is True
          assert g12['control_contract']['automatic_misconduct_inference'] is False
          gate13=next(x for x in gates['gates'] if x['id']=='G13')
          assert gate13['status']=='LOCKED'
          assert gate13['evidence']=='/data/institute-index/g13-shadow-index-stability.json'
          assert g13['status']=='LOCKED'
          assert g13['hard_boundaries']['real_institution_shadow_table_allowed'] is False
          assert g13['hard_boundaries']['public_ordinal_output_allowed'] is False
          assert g13['hard_boundaries']['automatic_gate_unlock'] is False
          assert g13['hard_boundaries']['current_release_mode']=='R0'
          gate14=next(x for x in gates['gates'] if x['id']=='G14')
          gate15=next(x for x in gates['gates'] if x['id']=='G15')
          assert gate14['status']=='LOCKED'
          assert gate15['status']=='LOCKED'
          assert gate14['evidence']=='/data/institute-index/g14-methodology-freeze.json'
          assert g14['status']=='LOCKED'
          assert g14['candidate_status']['v1_frozen'] is False
          assert g14['candidate_status']['final_sha256_lockfile_generated'] is False
          assert g14['hard_boundaries']['automatic_finalize_command_available'] is False
          assert g14['hard_boundaries']['current_release_mode']=='R0'
          assert freeze_manifest['status']=='CANDIDATE_PREPARED_NOT_V1_FROZEN'
          assert freeze_manifest['mutation_policy']['final_lockfile_status']=='NOT_GENERATED'
          assert freeze_manifest['sequencing_rule']['operational_order'][1]=='G15 independent methodological review of the candidate'
          assert method['schema_version']=='0.9.1-candidate'
          assert len(method['dimensions'])==4
          assert sum(len(d['indicators']) for d in method['dimensions'])==20
          assert sum(d['provisional_weight_percent'] for d in method['dimensions'])==100
          assert method['scoring']['overall_minimum_evidence_coverage_percent']==80
          assert method['scoring']['dimension_minimum_evidence_coverage_percent']==60
          assert method['peer_comparison']['public_ordinal_ranking'].startswith('DISABLED')
          assert blueprint['current_state']['canonical_baseline_version']=='v1.0-CORRECTED-4F-REV7'
          assert blueprint['current_state']['canonical_baseline_total_records']==250
          assert blueprint['current_state']['current_release_mode']=='R0'
          print('measurement chain JSON integrity: PASS')
          PY

