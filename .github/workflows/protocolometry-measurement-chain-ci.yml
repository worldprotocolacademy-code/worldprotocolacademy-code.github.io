name: WPA Protocolometry Measurement Chain CI

on:
  pull_request:
    paths:
      - 'master-list-verification.html'
      - 'wpa-index-appeals-and-corrections.html'
      - 'wpa-institute-index-lab.html'
      - 'wpa-institute-measurement-ranking-strategy.html'
      - 'protocolometry-center.html'
      - 'correction-request.html'
      - 'forms/wpa-index-correction-request-form.md'
      - 'forms/wpa-index-public-disclaimer.md'
      - 'data/wpa-index-correction-log.json'
      - 'data/master-list-verification-status.json'
      - 'data/institute-index/**'
      - 'wpa-metrics-status.html'
      - 'institute.html'
      - 'scripts/protocolometry-reliability.mjs'
      - 'scripts/protocolometry-coverage-weight-stress.mjs'
      - '.github/workflows/protocolometry-measurement-chain-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate machine-readable chain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          chain=json.loads((root/'data/institute-index/measurement-chain-status.json').read_text(encoding='utf-8'))
          g01=json.loads((root/'data/institute-index/g01-universe-control.json').read_text(encoding='utf-8'))
          g02=json.loads((root/'data/institute-index/g02-evidence-corpus.json').read_text(encoding='utf-8'))
          g03=json.loads((root/'data/institute-index/g03-scoring-reproducibility.json').read_text(encoding='utf-8'))
          g04=json.loads((root/'data/institute-index/g04-inter-rater-reliability.json').read_text(encoding='utf-8'))
          g05=json.loads((root/'data/institute-index/g05-evidence-coverage-behavior.json').read_text(encoding='utf-8'))
          g06=json.loads((root/'data/institute-index/g06-weight-robustness.json').read_text(encoding='utf-8'))
          gates=json.loads((root/'data/institute-index/v1-readiness-gates.json').read_text(encoding='utf-8'))
          method=json.loads((root/'data/institute-index-methodology-candidate.json').read_text(encoding='utf-8'))
          blueprint=json.loads((root/'data/institute-index/protocolometry-v1-execution-blueprint.json').read_text(encoding='utf-8'))
          verify=json.loads((root/'data/master-list-verification-status.json').read_text(encoding='utf-8'))
          corr=json.loads((root/'data/wpa-index-correction-log.json').read_text(encoding='utf-8'))

          assert chain['canonical_dataset']['version']=='v1.0-CORRECTED-4F-REV7'
          assert chain['canonical_dataset']['total_records']==250
          assert verify['canonical_dataset']=='v1.0-CORRECTED-4F-REV7'
          assert corr['canonical_dataset']=='v1.0-CORRECTED-4F-REV7'
          assert len(gates['gates'])==16
          counts={}
          for g in gates['gates']: counts[g['status']]=counts.get(g['status'],0)+1
          assert chain['readiness']['total_gates']==16
          assert chain['readiness']['passed']==counts.get('PASSED',0)
          assert chain['readiness']['in_progress']==counts.get('IN_PROGRESS',0)
          assert chain['readiness']['not_started']==counts.get('NOT_STARTED',0)
          assert chain['readiness']['locked']==counts.get('LOCKED',0)
          assert chain['readiness']['current_release_mode']=='R0'
          assert g01['status']=='IN_PROGRESS'
          assert g01['canonical_baseline']['version']=='v1.0-CORRECTED-4F-REV7'
          assert g01['canonical_baseline']['total_records']==250
          assert g01['scoring_pilot_control']['scoring_pilot_snapshot_exists'] is False
          assert g01['scoring_pilot_control']['pilot_ids_frozen'] is False
          assert g01['scoring_pilot_control']['direct_rev7_crosswalks_among_completed_dossiers']==2
          assert g01['scoring_pilot_control']['completed_dossiers_without_direct_rev7_crosswalk']==4
          assert g01['scoring_pilot_control']['resolution_before_dossier_cases']==7
          gate1=next(x for x in gates['gates'] if x['id']=='G01')
          assert gate1['status']=='IN_PROGRESS'
          assert gate1['evidence']=='/data/institute-index/g01-universe-control.json'
          gate2=next(x for x in gates['gates'] if x['id']=='G02')
          assert gate2['status']=='IN_PROGRESS'
          assert gate2['evidence']=='/data/institute-index/g02-evidence-corpus.json'
          assert g02['corpus_summary']['completed_first_pass_dossiers']==6
          assert g02['corpus_summary']['structural_precheck_pass']==6
          assert g02['corpus_summary']['provenance_precheck_pass']==6
          assert g02['corpus_summary']['direct_rev7_identity_ready']==2
          assert g02['corpus_summary']['coverage_ready']==1
          assert g02['corpus_summary']['authorised_human_review_completed']==0
          assert g02['corpus_summary']['method_test_ready']==0
          gate3=next(x for x in gates['gates'] if x['id']=='G03')
          gate4=next(x for x in gates['gates'] if x['id']=='G04')
          assert gate3['status']=='NOT_STARTED'
          assert gate4['status']=='NOT_STARTED'
          assert gate3['substatus']=='PREPARED_FOR_CONTROLLED_PILOT__BLOCKED_BY_G01_G02'
          assert gate4['substatus']=='DIAGNOSTIC_ENGINE_PREPARED_SYNTHETICALLY__NO_REAL_PILOT_DATA'
          assert gate3['evidence']=='/data/institute-index/g03-scoring-reproducibility.json'
          assert gate4['evidence']=='/data/institute-index/g04-inter-rater-reliability.json'
          assert g03['status']=='NOT_STARTED'
          assert g04['status']=='NOT_STARTED'
          assert g03['prerequisites']['current_method_test_ready_dossiers']==0
          assert g03['synthetic_preflight']['real_institutions_used'] is False
          assert g04['interpretation_rule'].startswith('Diagnostics are descriptive')
          gate5=next(x for x in gates['gates'] if x['id']=='G05')
          gate6=next(x for x in gates['gates'] if x['id']=='G06')
          assert gate5['status']=='NOT_STARTED'
          assert gate6['status']=='NOT_STARTED'
          assert gate5['evidence']=='/data/institute-index/g05-evidence-coverage-behavior.json'
          assert gate6['evidence']=='/data/institute-index/g06-weight-robustness.json'
          assert g05['status']=='NOT_STARTED'
          assert g06['status']=='NOT_STARTED'
          assert g05['synthetic_expectations']['imputation_used'] is False
          assert g05['synthetic_expectations']['missing_data_penalty_used'] is False
          assert g06['automatic_acceptability_threshold'] is False
          assert method['schema_version']=='0.9.1-candidate'
          assert len(method['dimensions'])==4
          assert sum(len(d['indicators']) for d in method['dimensions'])==20
          assert sum(d['provisional_weight_percent'] for d in method['dimensions'])==100
          assert method['scoring']['overall_minimum_evidence_coverage_percent']==80
          assert method['scoring']['dimension_minimum_evidence_coverage_percent']==60
          assert method['peer_comparison']['public_ordinal_ranking'].startswith('DISABLED')
          assert blueprint['current_state']['canonical_baseline_version']=='v1.0-CORRECTED-4F-REV7'
          assert blueprint['current_state']['canonical_baseline_total_records']==250
          assert blueprint['current_state']['current_release_mode']=='R0'
          print('measurement chain JSON integrity: PASS')
          PY

      - name: Validate public governance surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          files={
            'verification':Path('master-list-verification.html').read_text(encoding='utf-8'),
            'appeals':Path('wpa-index-appeals-and-corrections.html').read_text(encoding='utf-8'),
            'lab':Path('wpa-institute-index-lab.html').read_text(encoding='utf-8'),
            'strategy':Path('wpa-institute-measurement-ranking-strategy.html').read_text(encoding='utf-8'),
            'center':Path('protocolometry-center.html').read_text(encoding='utf-8'),
            'form':Path('forms/wpa-index-correction-request-form.md').read_text(encoding='utf-8'),
            'disc':Path('forms/wpa-index-public-disclaimer.md').read_text(encoding='utf-8'),
            'metrics':Path('wpa-metrics-status.html').read_text(encoding='utf-8'),
            'institute':Path('institute.html').read_text(encoding='utf-8'),
          }
          assert 'wpa-index-appeals-and-corrections.html' in files['verification']
          assert 'wpa-institute-index-lab.html' in files['verification']
          assert 'protocolometry-center.html' in files['verification']
          assert 'Index Governance · REV7' in files['appeals']
          assert '250 total records / 249 external records / 241 distinct external institutions' in files['appeals']
          assert 'Current REV7 group' in files['form']
          assert 'institute@worldprotocolacademy.mk' in files['form']
          assert 'No fixed response SLA is claimed' in files['form']
          assert '**250 total records**' in files['disc']
          assert '16 governed gates' not in files['lab']  # dynamic runtime count, not hard-coded display
          assert "v1-readiness-gates.json" in files['lab']
          assert 'sync' not in ''  # no-op marker for readable diagnostics
          assert 'REV7 canonical baseline' in files['strategy']
          assert 'Legacy coverage-validation corpus' in files['strategy']
          assert 'wpa-institute-index-lab.html' in files['center']
          assert 'wpa-index-appeals-and-corrections.html' in files['center']
          assert 'wpa_watch_count: "—"' in files['center']
          assert 'Master List REV7 counts' in files['metrics']
          assert '<h2>2. Master List REV7</h2>' in files['metrics']
          assert '<strong id="masterTotal">250</strong>' in files['metrics']
          assert '<strong id="externalTotal">249</strong>' in files['metrics']
          assert '<strong id="distinctTotal">241</strong>' in files['metrics']
          assert 'REV7 group counts:</strong> A87 · B35 · C25 · D34 · G25 · H38 · I5 · R1 = 250' in files['metrics']
          assert 'Master List REV7 · 250 records · 249 external records · 241 distinct external institutions' in files['institute']
          for needle in ['>87 records<','>35 records<','>34 records<','>38 records<']:
            assert needle in files['institute']
          assert "g.evidence" in files['lab']
          assert 'G01 · Universe Control' in files['strategy']
          assert 'G02 · Evidence Corpus' in files['strategy']
          assert '/data/institute-index/g02-evidence-corpus.json' in files['lab']
          assert '/data/institute-index/g03-scoring-reproducibility.json' in files['lab']
          assert '/data/institute-index/g04-inter-rater-reliability.json' in files['lab']
          assert 'G03 · Scoring Reproducibility' in files['strategy']
          assert 'G04 · Inter-rater Reliability' in files['strategy']
          assert 'No automatic reliability pass threshold exists' in files['strategy']
          assert 'G05 · Evidence Coverage Behavior' in files['strategy']
          assert 'G06 · Weight Robustness' in files['strategy']
          assert '/data/institute-index/g05-evidence-coverage-behavior.json' in files['lab']
          assert '/data/institute-index/g06-weight-robustness.json' in files['lab']
          stale=[
            ('appeals','Index Governance · REV4'),
            ('appeals','Canonical REV4 counts'),
            ('form','Current REV2 group'),
            ('disc','**162 total records**'),
            ('strategy','REV3 canonical baseline'),
            ('metrics','Master List REV6'),
            ('metrics','REV4 group counts'),
            ('institute','Master List REV6 · 250 records'),
            ('institute','E and F are not used in REV2'),
          ]
          for key,needle in stale:
            if needle in files[key]:
              raise SystemExit(f'stale governance text remains in {key}: {needle}')
          print('public governance chain: PASS')
          PY

      - name: Validate completed dossier corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          method=json.loads((root/'data/institute-index-methodology-candidate.json').read_text(encoding='utf-8'))
          registry=json.loads((root/'data/institute-index/dossier-registry-and-queue.json').read_text(encoding='utf-8'))
          g02=json.loads((root/'data/institute-index/g02-evidence-corpus.json').read_text(encoding='utf-8'))

          weights={}
          dim_of={}
          dim_possible={}
          for d in method['dimensions']:
              dim_possible[d['id']]=d['provisional_weight_percent']
              for i in d['indicators']:
                  weights[i['id']]=d['indicator_weight_percent']
                  dim_of[i['id']]=d['id']

          expected=[f'I{n:02d}' for n in range(1,21)]
          audit_by_id={x['dossier_id']:x for x in g02['dossiers']}

          for row in registry['completed_first_pass_dossiers']:
              path=root/row['path'].lstrip('/')
              d=json.loads(path.read_text(encoding='utf-8'))
              assert d['dossier_version']=='0.1-candidate'
              assert d['public_evidence_only'] is True
              assert d['entity_resolution_status']
              assert d['agent_trace']['access_boundaries_respected'] is True
              assert d['human_review']['reviewer_authority_required'] is True
              ids=[x['indicator_id'] for x in d['indicator_evidence']]
              assert sorted(ids)==expected
              assert len(set(ids))==20
              source_ids={s['source_id'] for s in d['source_register']}
              assert len(source_ids)>=1
              for s in d['source_register']:
                  assert s['source_tier'] in {'A','B','C','D'}
                  assert s['url'].startswith('https://')
                  assert s['supports']
              total=0
              dims={k:0 for k in dim_possible}
              for e in d['indicator_evidence']:
                  assert e['human_score_status'] in {'NOT_REVIEWED','ACCEPTED','REVISED','WITHHELD'}
                  refs=e['source_ids']
                  assert all(x in source_ids for x in refs)
                  if e['evidence_status']=='NE':
                      assert refs==[]
                  else:
                      assert refs
                      total += weights[e['indicator_id']]
                      dims[dim_of[e['indicator_id']]] += weights[e['indicator_id']]
              dim_pct={k:round(100*v/dim_possible[k],1) for k,v in dims.items()}
              audit=audit_by_id[d['institution_id']]
              assert audit['weighted_evidence_coverage_percent']==total
              assert audit['dimension_coverage_percent']==dim_pct

          print('completed dossier corpus: PASS')
          PY

      - name: Validate synthetic G03/G04 reproducibility preflight
        run: |
          node --check scripts/protocolometry-reliability.mjs
          node scripts/protocolometry-reliability.mjs             data/institute-index/fixtures/g03-g04-synthetic-pass1.json             data/institute-index/fixtures/g03-g04-synthetic-pass2.json             > /tmp/g03-g04-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          actual=json.loads(Path('/tmp/g03-g04-report.json').read_text(encoding='utf-8'))
          expected=json.loads((root/'data/institute-index/fixtures/g03-g04-synthetic-preflight-report.json').read_text(encoding='utf-8'))
          schema=json.loads((root/'data/institute-index/scoring-record.schema.json').read_text(encoding='utf-8'))

          assert actual['synthetic_fixture'] is True
          assert actual['metrics']==expected['metrics']
          for dim in ['D1','D2','D3','D4']:
              assert actual['dimensions'][dim]==expected['dimensions'][dim]
          assert actual['pass_1_ne_frequency']['count']==expected['pass_1_ne_frequency']['count']
          assert actual['pass_1_ne_frequency']['percent']==expected['pass_1_ne_frequency']['percent']
          assert actual['pass_2_ne_frequency']['count']==expected['pass_2_ne_frequency']['count']
          assert actual['pass_2_ne_frequency']['percent']==expected['pass_2_ne_frequency']['percent']
          assert actual['high_score_evidence_tiers']==expected['high_score_evidence_tiers']
          assert [x['indicator_id'] for x in actual['disagreements']]==expected['disagreement_indicators']
          assert [x['indicator_id'] for x in actual['disagreements'] if x['material']]==expected['material_disagreement_indicators']
          assert all(x['reconciliation_status']=='PENDING_HUMAN_RECONCILIATION' for x in actual['disagreements'])
          assert schema['properties']['scoring_lock']['properties']['other_pass_visible_before_lock']['const'] is False
          assert 'assessor_id' in schema['required']
          assert 'scoring_lock' in schema['required']

          for p in [
              root/'data/institute-index/fixtures/g03-g04-synthetic-pass1.json',
              root/'data/institute-index/fixtures/g03-g04-synthetic-pass2.json'
          ]:
              x=json.loads(p.read_text(encoding='utf-8'))
              assert x['synthetic_fixture'] is True
              assert x['public_release_prohibited'] is True
              assert x['scoring_lock']['locked'] is True
              assert x['scoring_lock']['other_pass_visible_before_lock'] is False
              assert x['human_review']['completed'] is False
              assert x['public_ordinal_rank'] is None

          print('G03/G04 synthetic reproducibility preflight: PASS')
          PY

      - name: Validate synthetic G05/G06 stress diagnostics
        run: |
          node --check scripts/protocolometry-coverage-weight-stress.mjs
          node scripts/protocolometry-coverage-weight-stress.mjs coverage             data/institute-index/fixtures/g05-evidence-coverage-synthetic.json             > /tmp/g05-report.json
          node scripts/protocolometry-coverage-weight-stress.mjs weights             data/institute-index/fixtures/g06-weight-robustness-synthetic.json             > /tmp/g06-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          g05=json.loads(Path('/tmp/g05-report.json').read_text(encoding='utf-8'))
          g06=json.loads(Path('/tmp/g06-report.json').read_text(encoding='utf-8'))

          by={x['id']:x for x in g05['profiles']}
          assert by['FULL_EVIDENCE_4']['candidate_composite']==80
          assert by['BALANCED_THRESHOLD_4']['weighted_evidence_coverage_percent']==80
          assert by['BALANCED_THRESHOLD_4']['candidate_composite']==80
          assert by['BALANCED_THRESHOLD_4']['composite_status']=='AVAILABLE'
          assert by['BELOW_OVERALL_4']['weighted_evidence_coverage_percent']==74
          assert by['BELOW_OVERALL_4']['composite_status']=='INSUFFICIENT_EVIDENCE_FOR_COMPOSITE'
          assert by['DIMENSION_FAIL_4']['weighted_evidence_coverage_percent']==82
          assert by['DIMENSION_FAIL_4']['dimensions']['D1']['evidence_coverage_percent']==40
          assert by['DIMENSION_FAIL_4']['composite_status']=='INSUFFICIENT_EVIDENCE_FOR_COMPOSITE'
          assert by['VERIFIED_NONCONFORMANCE']['candidate_composite']==76.8
          assert all(g05['assertions'].values())

          assert g06['composites']['canonical_candidate']=={
            'RESEARCH_HEAVY':78.25,'PRACTICE_HEAVY':76.5,'BALANCED':80
          }
          assert g06['composites']['practice_diagnostic']=={
            'RESEARCH_HEAVY':76.75,'PRACTICE_HEAVY':78.25,'BALANCED':80
          }
          assert g06['composites']['equal_weight_diagnostic']=={
            'RESEARCH_HEAVY':77.5,'PRACTICE_HEAVY':77.5,'BALANCED':80
          }
          assert g06['max_absolute_score_drift']==1.75
          assert len(g06['pairwise_reversals'])==1
          r=g06['pairwise_reversals'][0]
          assert (r['a'],r['b'],r['scheme'])==('RESEARCH_HEAVY','PRACTICE_HEAVY','practice_diagnostic')
          assert g06['automatic_acceptability_threshold'] is False
          print('G05/G06 synthetic stress diagnostics: PASS')
          PY

      - name: JavaScript syntax extraction checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for src,out in [
            ('wpa-institute-index-lab.html','/tmp/index-lab.js'),
            ('protocolometry-center.html','/tmp/protocolometry-center.js')
          ]:
            text=Path(src).read_text(encoding='utf-8')
            blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
            code='\n'.join(b for b in blocks if b.strip() and 'application/ld+json' not in b[:80])
            Path(out).write_text(code,encoding='utf-8')
          PY
          node --check /tmp/index-lab.js
          node --check /tmp/protocolometry-center.js

      - name: JSON syntax
        run: |
          python -m json.tool data/institute-index/measurement-chain-status.json >/dev/null
          python -m json.tool data/institute-index/g01-universe-control.json >/dev/null
          python -m json.tool data/institute-index/g02-evidence-corpus.json >/dev/null
          python -m json.tool data/institute-index/g03-scoring-reproducibility.json >/dev/null
          python -m json.tool data/institute-index/g04-inter-rater-reliability.json >/dev/null
          python -m json.tool data/institute-index/g05-evidence-coverage-behavior.json >/dev/null
          python -m json.tool data/institute-index/g06-weight-robustness.json >/dev/null
          python -m json.tool data/institute-index/fixtures/g05-evidence-coverage-synthetic.json >/dev/null
          python -m json.tool data/institute-index/fixtures/g06-weight-robustness-synthetic.json >/dev/null
          python -m json.tool data/institute-index/scoring-record.schema.json >/dev/null
          python -m json.tool data/institute-index/fixtures/g03-g04-synthetic-pass1.json >/dev/null
          python -m json.tool data/institute-index/fixtures/g03-g04-synthetic-pass2.json >/dev/null
          python -m json.tool data/institute-index/fixtures/g03-g04-synthetic-preflight-report.json >/dev/null
          python -m json.tool data/institute-index/institution-evidence-dossier.schema.json >/dev/null
          python -m json.tool data/institute-index/v1-readiness-gates.json >/dev/null
          python -m json.tool data/institute-index/protocolometry-v1-execution-blueprint.json >/dev/null
          python -m json.tool data/wpa-index-correction-log.json >/dev/null
