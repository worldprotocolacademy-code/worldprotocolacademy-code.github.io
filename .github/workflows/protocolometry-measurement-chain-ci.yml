      - name: Validate locked G14 freeze-candidate integrity
        run: |
          node --check scripts/protocolometry-freeze-preflight.mjs
          node scripts/protocolometry-freeze-preflight.mjs verify > /tmp/g14-freeze-preflight.json
          if node scripts/protocolometry-freeze-preflight.mjs finalize >/tmp/g14-finalize.out 2>/tmp/g14-finalize.err; then
            echo "ERROR: finalize command unexpectedly succeeded"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('/tmp/g14-freeze-preflight.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('data/institute-index/protocolometry-v1-freeze-candidate-manifest.json').read_text(encoding='utf-8'))
          blueprint=json.loads(Path('data/institute-index/protocolometry-v1-execution-blueprint.json').read_text(encoding='utf-8'))
          gates=json.loads(Path('data/institute-index/v1-readiness-gates.json').read_text(encoding='utf-8'))

          assert report['status']=='FREEZE_CANDIDATE_PREFLIGHT_PASS'
          assert report['v1_frozen'] is False
          assert report['final_lockfile_generated'] is False
          assert report['methodology_candidate_version']=='0.9.1-candidate'
          assert report['dimensions']==4
          assert report['indicators']==20
          assert report['dimension_weight_sum_percent']==100
          assert len(report['candidate_assets'])==7
          assert all(len(x['sha256_preview'])==64 for x in report['candidate_assets'])
          assert report['human_gate_required'] is True

          assert manifest['status']=='CANDIDATE_PREPARED_NOT_V1_FROZEN'
          assert manifest['mutation_policy']['final_checksum_algorithm']=='SHA-256'
          assert manifest['mutation_policy']['final_lockfile_status']=='NOT_GENERATED'
          assert manifest['explicit_non_claims'][0]=='This is not Protocolometry v1.0.'

          g14=next(x for x in gates['gates'] if x['id']=='G14')
          g15=next(x for x in gates['gates'] if x['id']=='G15')
          assert g14['status']=='LOCKED'
          assert g15['status']=='LOCKED'

          s7=next(x for x in blueprint['execution_stages'] if x['stage']=='S7')
          assert s7['status']=='LOCKED'
          assert s7['preflight_status']=='FREEZE_CANDIDATE_PREPARED__FINAL_FREEZE_BLOCKED'
          assert '/data/institute-index/protocolometry-v1-freeze-candidate-manifest.json' in s7['preflight_assets']
          assert 'G15 independent methodological review complete' in s7['finalisation_dependencies']
          assert blueprint['current_state']['g14_status']=='LOCKED'
          assert blueprint['current_state']['v1_frozen'] is False
          assert blueprint['current_state']['final_sha256_lockfile_generated'] is False
          assert blueprint['current_state']['current_release_mode']=='R0'

          err=Path('/tmp/g14-finalize.err').read_text(encoding='utf-8')
          assert 'Finalisation is intentionally unavailable' in err
          print('G14 freeze-candidate integrity: PASS')
          PY

      - name: JavaScript syntax extraction checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for src,out in [
            ('wpa-institute-index-lab.html','/tmp/index-lab.js'),
            ('protocolometry-center.html','/tmp/protocolometry-center.js')
          ]:
            text=Path(src).read_text(encoding='utf-8')
            blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
            code='\n'.join(b for b in blocks if b.strip() and 'application/ld+json' not in b[:80])
            Path(out).write_text(code,encoding='utf-8')
          PY
          node --check /tmp/index-lab.js
          node --check /tmp/protocolometry-center.js

