name: WPA Journal Watch

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_WPA_JOURNAL_WATCH_WRITE to allow this run to write generated journal files"
        required: true
        default: "DO_NOT_APPROVE"
        type: string

permissions:
  contents: write

concurrency:
  group: wpa-journal-watch
  cancel-in-progress: false

jobs:
  journal-watch:
    if: ${{ inputs.approval == 'APPROVE_WPA_JOURNAL_WATCH_WRITE' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate Journal Watch topics
        run: node generate-journal-watch.mjs

      - name: Commit Journal Watch updates
        run: |
          git config user.name "wpa-journal-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add journal/watch/topics.json journal/watch/editorial-queue.json
          git commit -m "WPA Journal Watch update $(date -u +%FT%TZ)" || echo "No changes."
          git push
