name: WPA Journal Watch

on:
  workflow_run:
    workflows: ["WPA Watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_WPA_JOURNAL_WATCH_WRITE to allow this manual run to write generated journal files"
        required: true
        default: "DO_NOT_APPROVE"
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: wpa-journal-watch
  cancel-in-progress: false

jobs:
  journal-watch:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.approval == 'APPROVE_WPA_JOURNAL_WATCH_WRITE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate fresh WPA Watch upstream
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('tools/wpa-watch/status.json','utf8'));
          const items=JSON.parse(fs.readFileSync('tools/wpa-watch/items.json','utf8'));
          const generated=new Date(s.generated);
          const ageHours=(Date.now()-generated.getTime())/3600000;
          if(Number.isNaN(generated.getTime())||ageHours<0||ageHours>8) throw new Error(`WPA Watch upstream stale or invalid: ${ageHours.toFixed(1)}h`);
          if(Number(s.sources_live)<4) throw new Error(`WPA Watch upstream degraded: ${s.sources_live} live sources`);
          if(!Array.isArray(items)||items.length<10) throw new Error(`WPA Watch upstream too small: ${Array.isArray(items)?items.length:0} items`);
          if(Number(s.items_total)!==items.length) throw new Error('WPA Watch upstream count mismatch');
          console.log(`UPSTREAM HEALTHY: ${items.length} items, ${s.sources_live}/${s.sources_total} sources, age ${ageHours.toFixed(1)}h`);
          NODE

      - name: Generate Journal Watch topics
        run: node generate-journal-watch.mjs

      - name: Validate Journal Watch outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const topics=JSON.parse(fs.readFileSync('journal/watch/topics.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('journal/watch/editorial-queue.json','utf8'));
          if(!Array.isArray(topics)||topics.length<10) throw new Error('Journal Watch produced fewer than 10 topics');
          if(queue.schema_version!=='2.2'||queue.classification_version!=='JW2.2') throw new Error('Journal Watch output contract mismatch');
          if(!Array.isArray(queue.thematic_scope)||queue.thematic_scope.join(',')!=='protocol,diplomacy,public_relations,security,communicology') throw new Error('Journal Watch thematic scope mismatch');
          if(!Array.isArray(queue.queue)||queue.queue.length!==topics.length) throw new Error('Journal Watch queue/topic count mismatch');
          if(queue.policy!=='Topic candidates only. No automatic journal publication.') throw new Error('Journal governance policy changed unexpectedly');
          console.log(`JOURNAL HEALTHY: ${topics.length} governed topic candidates`);
          NODE

      - name: Publish Journal Watch updates through protected PR
        env:
          GH_TOKEN: ${{ secrets.WPA_AUTOMATION_TOKEN || github.token }}
          PUBLISH_BRANCH_PREFIX: wpa-journal-watch
          PUBLISH_TITLE: WPA Journal Watch automated refresh
          PUBLISH_BODY: Automated WPA Journal Watch refresh generated from a fresh, healthy WPA Watch upstream. Topic candidates remain governed editorial inputs only and are merged only after the repository's required public-site and translator checks pass on the exact generated commit.
          PUBLISH_FILES: journal/watch/topics.json journal/watch/editorial-queue.json
          PUBLISH_GIT_NAME: wpa-journal-watch-bot
        run: bash scripts/publish_protected_main.sh
