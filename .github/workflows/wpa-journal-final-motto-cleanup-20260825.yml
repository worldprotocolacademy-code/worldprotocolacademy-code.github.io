name: WPA Journal final motto cleanup 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpa-journal-final-motto-cleanup-20260825.yml'
      - '.github/scripts/patch_journal_final_motto_cleanup_20260825.py'

permissions:
  contents: write

jobs:
  patch-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final absolute motto variants
        run: python3 .github/scripts/patch_journal_final_motto_cleanup_20260825.py
      - name: Verify controlled diff
        run: git diff --check && git diff -- journal
      - name: Commit final Journal motto cleanup
        shell: bash
        run: |
          if git diff --quiet -- journal; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "WPA source maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add journal
          git commit -m "Remove final absolute motto variants from WPA Journal"
          git push origin HEAD:main
