name: DEPLOY STAGING — RUN THIS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-sande-v35-1-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging package
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-staging/wrangler.toml
          test -f workers/virtual-sande-v35.1-staging/src/index.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          test -f tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs
          node --check workers/virtual-sande-v35.1-staging/src/index.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs

      - name: Deploy isolated staging Worker with full Wrangler logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 deploy \
            --config workers/virtual-sande-v35.1-staging/wrangler.toml \
            2>&1 | tee /tmp/wrangler-deploy.log

      - name: Extract and verify exact deployment URL
        run: |
          set -euo pipefail
          STAGING_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev/?' /tmp/wrangler-deploy.log | tail -n 1 | sed 's:/$::')"
          test -n "$STAGING_URL"
          case "$STAGING_URL" in
            https://*.workers.dev) ;;
            *) echo "Unexpected staging deployment URL: $STAGING_URL" >&2; exit 1 ;;
          esac
          echo "STAGING_DEPLOYMENT_URL=$STAGING_URL"
          printf '%s\n' "$STAGING_URL" > /tmp/virtual-sande-staging-url.txt

      - name: Staging smoke test
        run: |
          set -euo pipefail
          STAGING_URL="$(cat /tmp/virtual-sande-staging-url.txt)"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$STAGING_URL/orchestrator/health" | tee /tmp/health.json
          grep -F 'v35.1' /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е агреман?' \
            --data-urlencode 'lang=mk' | tee /tmp/ask.json
          grep -F 'answer' /tmp/ask.json

      - name: Upload exact staging URL
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sande-v35-1-staging-url
          path: /tmp/virtual-sande-staging-url.txt
          retention-days: 30

      - name: Deployment boundary
        run: |
          echo 'Dedicated workflow deploys only the isolated staging Worker.'
          echo 'No production Worker, custom domain, route, secret, KV namespace, D1 database, or public front end was modified.'
