name: WPA Public Canonical Hardening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wpa-public-canonical-hardening-20260826.py'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical public hardening
        run: python scripts/wpa-public-canonical-hardening-20260826.py
      - name: Commit hardened public source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Public source already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Apply WPA public canonical hardening'
          git push origin HEAD:main
