name: Virtual Sande Independent Multimodal Pilot CI (no deployment)
on:
  pull_request:
    paths:
      - 'scripts/virtual-sande-public-widget.js'
      - 'workers/virtual-sande-multimodal-pilot/**'
      - 'workers/virtual-sande-v35.1-production/src/index.mjs'
      - 'tests/virtual-sande-multimodal-*.test.mjs'
      - '.github/workflows/virtual-sande-multimodal-pilot-ci.yml'
      - 'docs/virtual-sande-multimodal-pilot-v0.1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multimodal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and certified runtime isolation
        run: |
          node --check scripts/virtual-sande-public-widget.js
          node --check workers/virtual-sande-multimodal-pilot/src/agent-gateway.mjs
          node --check workers/virtual-sande-multimodal-pilot/src/index.mjs
          node --check workers/virtual-sande-v35.1-production/src/index.mjs
          cmp workers/virtual-sande-v35.1-production/src/index.mjs workers/virtual-sande-v35.1-staging/src/index.mjs
          node --check tests/virtual-sande-multimodal-agent.test.mjs
          node --check tests/virtual-sande-multimodal-ui.test.mjs
      - name: Isolated contract and UI regression tests (mocked providers)
        run: node --test tests/virtual-sande-multimodal-agent.test.mjs tests/virtual-sande-multimodal-ui.test.mjs
      - name: No silent enablement, secret leak or production deployment
        run: |
          grep -F 'name = "wpa-virtual-sande-v35-1-production"' workers/virtual-sande-v35.1-production/wrangler.toml
          test "$(grep -c '^\[ai\]' workers/virtual-sande-v35.1-production/wrangler.toml)" -eq 1
          grep -F 'WPA_AGENT_ENABLED = "false"' workers/virtual-sande-multimodal-pilot/wrangler.toml
          ! grep -Eq '^OPENAI_API_KEY\s*=|^WPA_AGENT_TURNSTILE_SECRET\s*=' workers/virtual-sande-multimodal-pilot/wrangler.toml
          echo "PASS: certified WPA /ask untouched; new agent isolated, inactive, unbilled"
