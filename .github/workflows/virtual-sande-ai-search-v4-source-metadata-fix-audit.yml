name: Virtual Sande AI Search v4 Source Metadata Fix Audit

on:
  pull_request:
    paths:
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.mjs'
      - 'tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.test.mjs'
      - 'scripts/verify_ai_search_v4_final_target.py'
      - 'config/virtual-sande-ai-search-v4-source-metadata-fix.json'
      - '.github/workflows/deploy-virtual-sande-ai-search-v4-final-source-metadata-fix.yml'
      - '.github/workflows/virtual-sande-ai-search-v4-source-metadata-fix-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source-metadata fix
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source-metadata fix manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/virtual-sande-ai-search-v4-source-metadata-fix.json').read_text())
          assert data['status'] == 'AUTHORIZED_PENDING_PROTECTED_PRODUCTION_DEPLOY'
          assert data['certified_runtime_sha'] == '4e3dc18189b749088b8071e7ddd7a8fdd9afef00'
          assert data['target_instance'] == 'protocol-ai-v4-final'
          assert data['rollback_instance'] == 'protocol-ai'
          assert data['expected_item_count'] == 790
          assert data['source_identity']['legacy_autorag_response_field'] == 'attributes.file.source_key'
          assert data['source_identity']['current_ai_search_response_field'] == 'item.metadata.source_key'
          assert data['source_identity']['normalized_runtime_field'] == 'metadata.source_key'
          assert data['deployment']['staging_preflight_required'] is True
          assert data['deployment']['production_environment_required'] is True
          assert data['deployment']['automatic_runtime_rollback_on_post_deploy_failure'] is True
          assert data['safety']['r2_mutation'] is False
          assert data['safety']['ai_search_instance_deletion'] is False
          assert data['safety']['old_instance_retained'] is True
          PY

      - name: Verify runtime normalization and regression tests
        run: |
          set -euo pipefail
          grep -F 'attributeFile.source_key' tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.mjs
          grep -F 'nestedMetadata.source_key' tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.mjs
          grep -F 'Array.isArray(result.chunks)' tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.mjs
          grep -F 'legacy AutoRAG attributes.file metadata' tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.test.mjs
          grep -F 'new AI Search chunk item.metadata' tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.test.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.mjs
          node --test tools/virtual-sande/wpa-protocol-bot-v35.1-ai-search-source-metadata.test.mjs
          python3 -m py_compile scripts/verify_ai_search_v4_final_target.py

      - name: Verify protected deployment and rollback boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/deploy-virtual-sande-ai-search-v4-final-source-metadata-fix.yml').read_text()
          required = [
              'workflow_dispatch:',
              'permissions:\n  contents: read',
              'CERTIFIED_RUNTIME_SHA: 4e3dc18189b749088b8071e7ddd7a8fdd9afef00',
              'EXPECTED_APPROVAL: APPROVE_AI_SEARCH_V4_SOURCE_METADATA_FIX',
              'environment: staging',
              'needs: preflight',
              'environment: production',
              "test \"$GITHUB_REF\" = 'refs/heads/main'",
              'scripts/verify_ai_search_v4_final_target.py',
              'attributes.file.source_key',
              'item.metadata.source_key',
              'Generated storage filenames leaked as public sources',
              'Roll back production runtime on post-deploy failure',
              'AI_SEARCH_NAME = \"protocol-ai\"',
              'r2_objects_mutated',
              'ai_search_instances_deleted',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Missing source-metadata fix controls: {missing}')

          forbidden = [
              '\npush:',
              '\nschedule:',
              'pull_request_target:',
              'contents: write',
              'r2 put',
              'r2 delete',
              '/ai-search/instances/protocol-ai/delete',
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit(f'Forbidden source-metadata fix surface: {found}')
          PY

      - name: Source-metadata fix boundary
        run: |
          {
            echo '## Virtual Sande AI Search v4 Source Metadata Fix Audit'
            echo '- Legacy AutoRAG attributes.file support: **Tested**'
            echo '- Current AI Search item.metadata support: **Tested**'
            echo '- Locked 790 target verifier: **Read-only**'
            echo '- Staging preflight before production: **Required**'
            echo '- Automatic rollback to protocol-ai: **Required**'
            echo '- R2 mutation: **Absent**'
            echo '- AI Search instance deletion: **Absent**'
          } >> "$GITHUB_STEP_SUMMARY"
