name: Harden WPA AI Search Path Filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-ai-search-path-filters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harden-wpa-ai-search-path-filters
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_NAMESPACE: default
      AI_SEARCH_INSTANCE: protocol-ai

    steps:
      - name: Validate Cloudflare AI Search configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN"

      - name: Read current source configuration
        run: |
          set -euo pipefail
          ns_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/namespaces/${AI_SEARCH_NAMESPACE}/instances/${AI_SEARCH_INSTANCE}"
          legacy_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai-search/instances/${AI_SEARCH_INSTANCE}"
          if curl -fsS "$ns_api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > ai-search-instance-before.raw.json; then
            printf '%s' "$ns_api" > /tmp/ai-search-instance-endpoint
          else
            curl -fsS "$legacy_api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > ai-search-instance-before.raw.json
            printf '%s' "$legacy_api" > /tmp/ai-search-instance-endpoint
          fi
          python - <<'PY'
          import json
          p=json.load(open('ai-search-instance-before.raw.json', encoding='utf-8-sig'))
          if p.get('success') is not True:
              raise SystemExit('Could not read AI Search instance configuration')
          r=p.get('result') or {}
          safe={'source':r.get('source'),'source_params':r.get('source_params') or {}}
          open('ai-search-source-before.json','w',encoding='utf-8').write(json.dumps(safe,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('Current AI Search source:', safe.get('source'))
          print('Current path filters:', json.dumps(safe.get('source_params') or {}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Merge safe exclusion rules
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('ai-search-instance-before.raw.json', encoding='utf-8-sig'))
          r=p.get('result') or {}
          sp=dict(r.get('source_params') or {})
          required=[
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/98_canonical_sources/**',
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/_metadata/**',
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/**/README.md',
          ]
          existing=list(sp.get('exclude_items') or [])
          for item in required:
              if item not in existing:
                  existing.append(item)
          if len(existing) > 10:
              raise SystemExit(f'exclude_items would exceed Cloudflare limit: {len(existing)}')
          sp['exclude_items']=existing
          payload={'source_params':sp}
          open('ai-search-filter-update.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Merged exclusions:', json.dumps(existing, ensure_ascii=False))
          PY

      - name: Update AI Search path filters
        run: |
          set -euo pipefail
          api="$(cat /tmp/ai-search-instance-endpoint)"
          curl -fsS -X PUT "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @ai-search-filter-update.json > ai-search-update-response.raw.json
          python - <<'PY'
          import json
          p=json.load(open('ai-search-update-response.raw.json', encoding='utf-8-sig'))
          if p.get('success') is not True:
              raise SystemExit('AI Search path-filter update failed')
          print('AI Search path-filter update accepted.')
          PY

      - name: Verify exclusions are stored
        run: |
          set -euo pipefail
          api="$(cat /tmp/ai-search-instance-endpoint)"
          curl -fsS "$api" -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" > ai-search-instance-after.raw.json
          python - <<'PY'
          import json
          p=json.load(open('ai-search-instance-after.raw.json', encoding='utf-8-sig'))
          if p.get('success') is not True:
              raise SystemExit('Could not verify updated AI Search configuration')
          r=p.get('result') or {}
          sp=r.get('source_params') or {}
          required={
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/98_canonical_sources/**',
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/_metadata/**',
            '**/UPLOAD_TO_WORLD_PROTOCOL_ACADEMY/99_ai_search_ready/**/README.md',
          }
          actual=set(sp.get('exclude_items') or [])
          missing=sorted(required-actual)
          if missing:
              raise SystemExit(f'Missing stored exclusions: {missing}')
          safe={'source':r.get('source'),'source_params':sp}
          open('ai-search-source-after.json','w',encoding='utf-8').write(json.dumps(safe,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('PATH FILTERS VERIFIED: canonical sources + technical metadata/README excluded')
          PY

      - name: Trigger clean AI Search resync
        run: |
          set -euo pipefail
          api="$(cat /tmp/ai-search-instance-endpoint)"
          curl -fsS -X POST "$api/jobs" \
            -H "Authorization: Bearer ${CLOUDFLARE_AI_SEARCH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"description":"WPA AI Search path-filter hardening resync"}' > ai-search-filter-resync.json
          python - <<'PY'
          import json
          p=json.load(open('ai-search-filter-resync.json', encoding='utf-8-sig'))
          if p.get('success') is not True:
              raise SystemExit('AI Search resync failed')
          job=(p.get('result') or {}).get('id')
          if not job:
              raise SystemExit('AI Search resync returned no job id')
          open('ai-search-filter-resync-job-id.txt','w',encoding='utf-8').write(str(job)+'\n')
          print('AI Search resync job:', job)
          PY

      - name: Upload path-filter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-path-filter-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            ai-search-source-before.json
            ai-search-source-after.json
            ai-search-filter-resync.json
            ai-search-filter-resync-job-id.txt
