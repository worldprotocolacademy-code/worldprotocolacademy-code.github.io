name: WPA Translator Quality CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: wpa-translator-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translator-quality:
    name: Validate translator system
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile translator quality script
        run: python -m py_compile scripts/translator_quality_check.py

      - name: Verify SAFE-8P French browser-translation lock and normalize legacy provenance view
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'languages/fr/index.html': 'e4dcadcbce290950e189d74d24f81d04ac546b44',
              'languages/fr/institute.html': '6c442c26a7c908c414683315220486dacd33e873',
          }
          markers = (
              '<meta name="google" content="notranslate">\n',
              '<meta http-equiv="Content-Language" content="fr">\n',
          )
          for path, old_sha in expected.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert '<html lang="fr" dir="ltr">' in text, path
              assert '<meta name="google" content="notranslate">' in text, path
              assert '<meta http-equiv="Content-Language" content="fr">' in text, path
              assert '<body class="notranslate" translate="no">' in text, path
              normalized = text
              for marker in markers:
                  normalized = normalized.replace(marker, '', 1)
              normalized = normalized.replace('<body class="notranslate" translate="no">', '<body class="">', 1)
              data = normalized.encode('utf-8')
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
              assert blob == old_sha, (path, blob, old_sha)
              p.write_text(normalized, encoding='utf-8')
          print('SAFE-8P wrapper verified; normalized FR surfaces match the exact SAFE-8F Human-Gated blobs.')
          PY

      - name: Run translator quality checks
        run: python scripts/translator_quality_check.py
