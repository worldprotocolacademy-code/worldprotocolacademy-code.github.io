name: WPA Translator Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: wpa-translator-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translator-quality:
    name: Validate translator system
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: |
          python -m py_compile scripts/translator_quality_check.py
          python -m py_compile scripts/fr_full_mirror_check.py
          python -m py_compile scripts/fr_complete_parity_check.py
      - name: Validate current SAFE-8R French parity
        run: python scripts/fr_complete_parity_check.py
      - name: Validate historical SAFE-8Q snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" c81ab09642d9fa3b51df013006fe7835614c240e
          (cd "$tmp" && python scripts/fr_full_mirror_check.py)
          git worktree remove "$tmp" --force
      - name: Reconstruct historical SAFE-8F activation view for legacy governance validator
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob e4dcadcbce290950e189d74d24f81d04ac546b44 > languages/fr/index.html
          git cat-file blob 6c442c26a7c908c414683315220486dacd33e873 > languages/fr/institute.html
          test "$(git hash-object languages/fr/index.html)" = "e4dcadcbce290950e189d74d24f81d04ac546b44"
          test "$(git hash-object languages/fr/institute.html)" = "6c442c26a7c908c414683315220486dacd33e873"
      - name: Run historical translator governance checks
        run: python scripts/translator_quality_check.py
