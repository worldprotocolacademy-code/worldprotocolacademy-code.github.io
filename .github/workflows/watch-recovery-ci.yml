name: WPA Watch Recovery CI

on:
  pull_request:
    paths:
      - '.github/workflows/wpa-watch.yml'
      - '.github/workflows/wpa-journal-watch.yml'
      - '.github/workflows/watch-recovery-ci.yml'
      - 'tools/wpa-watch/aggregate.mjs'
      - 'tools/wpa-watch/feeds.json'
      - 'tools/wpa-watch/rss-config.json'
      - 'data/wpa-rss-source-registry-v1.json'
      - 'scripts/audit-rss-source-registry.mjs'
      - '.github/workflows/rss-registry-audit.yml'
      - 'generate-journal-watch.mjs'
      - 'scripts/publish_protected_main.sh'
      - 'journal/watch/index.html'
      - 'scripts/wpa-watch-freshness.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax checks
        run: |
          node --check tools/wpa-watch/aggregate.mjs
          node --check generate-journal-watch.mjs

      - name: Feed policy and configuration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('tools/wpa-watch/feeds.json','utf8'));
          if(f.policy!=='RSS/Atom only. No scraping.') throw new Error('RSS/Atom-only policy changed');
          if(!Array.isArray(f.feeds)||f.feeds.length<40) throw new Error('insufficient configured feeds');
          if(f.version!=='2.0') throw new Error('expected tiered WPA Watch feed registry v2.0');
          for(const x of f.feeds){
            if(!x.name||!/^https:\/\//.test(x.url||'')||!x.domain||!['A','B'].includes(x.tier)||!x.source_class||!x.expected_host||!x.provenance) throw new Error(`invalid feed config: ${JSON.stringify(x)}`);
          }
          const tierA=f.feeds.filter(x=>x.tier==='A').length;
          if(tierA<20) throw new Error('insufficient Tier A institutional sources');
          JSON.parse(fs.readFileSync('tools/wpa-watch/rss-config.json','utf8'));
          NODE

      - name: Resilient aggregator contract
        run: |
          grep -F 'const maxAttempts = 3' tools/wpa-watch/aggregate.mjs
          grep -F 'WorldProtocolAcademy-WPAWatch/2.0' tools/wpa-watch/aggregate.mjs
          grep -F 'RSS/Atom only. No scraping.' tools/wpa-watch/aggregate.mjs
          grep -F 'sources_live' tools/wpa-watch/aggregate.mjs
          grep -F 'attempts' tools/wpa-watch/aggregate.mjs
          grep -F 'PROVENANCE_HOST_MISMATCH' tools/wpa-watch/aggregate.mjs
          grep -F 'tier_a_live' tools/wpa-watch/aggregate.mjs
          grep -F 'live_ratio' tools/wpa-watch/aggregate.mjs

      - name: Scheduled Watch fail-closed contract
        run: |
          grep -F 'cron: "17 */6 * * *"' .github/workflows/wpa-watch.yml
          grep -F "github.event_name == 'schedule'" .github/workflows/wpa-watch.yml
          grep -F 'Health gate before write' .github/workflows/wpa-watch.yml
          grep -F "Number(status.sources_live)<40" .github/workflows/wpa-watch.yml
          grep -F "Number(status.tier_a_live)<Math.ceil(Number(status.tier_a_total)*0.90)" .github/workflows/wpa-watch.yml
          grep -F "Number(status.live_ratio)<0.90" .github/workflows/wpa-watch.yml
          grep -F "items.length<10" .github/workflows/wpa-watch.yml
          grep -F 'Publish healthy outputs through protected PR' .github/workflows/wpa-watch.yml
          grep -F 'scripts/publish_protected_main.sh' .github/workflows/wpa-watch.yml
          if grep -F 'git push origin HEAD:main' .github/workflows/wpa-watch.yml; then
            echo 'WPA Watch must not push directly to protected main' >&2
            exit 1
          fi

      - name: Journal chain and upstream freshness contract
        run: |
          grep -F 'workflows: ["WPA Watch"]' .github/workflows/wpa-journal-watch.yml
          grep -F "github.event.workflow_run.conclusion == 'success'" .github/workflows/wpa-journal-watch.yml
          grep -F 'Validate fresh WPA Watch upstream' .github/workflows/wpa-journal-watch.yml
          grep -F 'MAX_UPSTREAM_AGE_HOURS = 8' generate-journal-watch.mjs
          grep -F 'MIN_LIVE_SOURCES = 40' generate-journal-watch.mjs
          grep -F 'MIN_LIVE_RATIO = 0.90' generate-journal-watch.mjs
          grep -F 'MIN_TIER_A_RATIO = 0.90' generate-journal-watch.mjs
          grep -F 'source_tier: item.source_tier || null' generate-journal-watch.mjs
          grep -F 'source_provenance: item.source_provenance || null' generate-journal-watch.mjs
          grep -F 'MIN_ITEMS = 10' generate-journal-watch.mjs
          grep -F 'refuses to publish an empty placeholder queue' generate-journal-watch.mjs
          grep -F 'Topic candidates only. No automatic journal publication.' generate-journal-watch.mjs
          grep -F 'Publish Journal Watch updates through protected PR' .github/workflows/wpa-journal-watch.yml
          grep -F 'scripts/publish_protected_main.sh' .github/workflows/wpa-journal-watch.yml
          if grep -F 'git push origin HEAD:main' .github/workflows/wpa-journal-watch.yml; then
            echo 'Journal Watch must not push directly to protected main' >&2
            exit 1
          fi

      - name: Canonical five-discipline scope plus academic support track
        run: |
          grep -F 'new Set(["protocol", "diplomacy", "pr", "security", "communicology", "academic"])' generate-journal-watch.mjs
          grep -F 'thematic_scope: ["protocol", "diplomacy", "public_relations", "security", "communicology"]' generate-journal-watch.mjs
          grep -F 'support_tracks: ["academic_infrastructure"]' generate-journal-watch.mjs
          grep -F 'CLASSIFICATION_VERSION = "JW2.3"' generate-journal-watch.mjs
          grep -F "queue.schema_version!=='2.3'||queue.classification_version!=='JW2.3'" .github/workflows/wpa-journal-watch.yml
          grep -F "queue.thematic_scope.join(',')!=='protocol,diplomacy,public_relations,security,communicology'" .github/workflows/wpa-journal-watch.yml
          grep -F "queue.support_tracks.join(',')!=='academic_infrastructure'" .github/workflows/wpa-journal-watch.yml
          grep -F 'person_profile_or_bio' generate-journal-watch.mjs
          grep -F 'procurement_or_operational_notice' generate-journal-watch.mjs
          grep -F 'production_editorial_candidates' generate-journal-watch.mjs

      - name: Protected-main publisher contract
        run: |
          bash -n scripts/publish_protected_main.sh
          grep -F 'gh pr create' scripts/publish_protected_main.sh
          grep -F 'site-quality.yml' scripts/publish_protected_main.sh
          grep -F 'translator-quality.yml' scripts/publish_protected_main.sh
          grep -F 'Validate public site' scripts/publish_protected_main.sh
          grep -F 'Validate translator system' scripts/publish_protected_main.sh
          grep -F 'merge_method=squash' scripts/publish_protected_main.sh

      - name: Historical RSS registry remains candidate-only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/wpa-rss-source-registry-v1.json','utf8'));
          if(d.policy?.status!=='CANDIDATE_REGISTRY') throw new Error('historical registry status changed');
          if(!Array.isArray(d.records)||d.records.length!==1035) throw new Error('historical registry record count changed');
          if(d.records.some(x=>x.active!==false)) throw new Error('historical source auto-activated');
          NODE

      - name: Existing generated JSON remains parseable
        run: |
          node -e "JSON.parse(require('fs').readFileSync('tools/wpa-watch/items.json','utf8'));JSON.parse(require('fs').readFileSync('tools/wpa-watch/status.json','utf8'));JSON.parse(require('fs').readFileSync('journal/watch/topics.json','utf8'));JSON.parse(require('fs').readFileSync('journal/watch/editorial-queue.json','utf8'));"

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
