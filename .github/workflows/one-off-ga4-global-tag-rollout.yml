name: One-off GA4 global tag rollout

on:
  push:
    branches:
      - fix/ga4-global-tag-rollout-2026-09-09

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ga4-global-tag-rollout-2026-09-09
          fetch-depth: 0

      - name: Install consent-aware GA4 bootstrap site-wide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          analytics_script = '<script defer src="/scripts/wpa-analytics.js?v=20260909-2"></script>'
          analytics_re = re.compile(r'<script\b[^>]*\bsrc=["\']/scripts/wpa-analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', re.I)
          performance_re = re.compile(r'(<script\b[^>]*\bsrc=["\']/scripts/wpa-performance\.js)(?:\?[^"\']*)?(["\'][^>]*>\s*</script>)', re.I)
          head_re = re.compile(r'<head\b[^>]*>', re.I)
          skip = {'.git', 'node_modules', 'vendor'}

          pages = changed = 0
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              head = head_re.search(text)
              if not head:
                  continue
              pages += 1
              updated = analytics_re.sub('', text)
              head = head_re.search(updated)
              updated = updated[:head.end()] + '\n' + analytics_script + '\n' + updated[head.end():]
              updated = performance_re.sub(lambda m: m.group(1) + '?v=20260909-3' + m.group(2), updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed += 1

          print(f'HTML pages with <head>: {pages}')
          print(f'HTML pages changed: {changed}')
          PY

      - name: Harden future optimizer output and runtime cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/optimize_site_media.py')
          text = path.read_text(encoding='utf-8')
          original = text

          old_constant = 'PERFORMANCE_SCRIPT = \'<script defer src="/scripts/wpa-performance.js?v=20260909-2"></script>\'\n'
          new_constants = old_constant.replace('20260909-2', '20260909-3') + 'ANALYTICS_SCRIPT = \'<script defer src="/scripts/wpa-analytics.js?v=20260909-2"></script>\'\n'
          if old_constant not in text:
              raise SystemExit('optimizer performance constant anchor not found')
          text = text.replace(old_constant, new_constants, 1)

          old_func = '''def inject_performance_script(text: str) -> tuple[str, bool]:
              if "wpa-performance.js" in text:
                  return text, False
              match = re.search(r"</head\\s*>", text, flags=re.I)
              if not match:
                  return text, False
              return text[:match.start()] + PERFORMANCE_SCRIPT + "\\n" + text[match.start():], True
          '''
          old_func = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_func.splitlines()) + '\n'
          new_func = '''def inject_performance_script(text: str) -> tuple[str, bool]:
              original = text
              text = re.sub(
                  r'(/scripts/wpa-performance\\.js)(?:\\?[^"\\']*)?',
                  r'\\1?v=20260909-3',
                  text,
                  flags=re.I,
              )
              if "wpa-performance.js" in text:
                  return text, text != original
              match = re.search(r"</head\\s*>", text, flags=re.I)
              if not match:
                  return text, False
              return text[:match.start()] + PERFORMANCE_SCRIPT + "\\n" + text[match.start():], True


          def inject_analytics_script(text: str) -> tuple[str, bool]:
              original = text
              text = re.sub(
                  r'<script\\b[^>]*\\bsrc=["\\']/scripts/wpa-analytics\\.js(?:\\?[^"\\']*)?["\\'][^>]*>\\s*</script>\\s*',
                  '',
                  text,
                  flags=re.I,
              )
              head = re.search(r"<head\\b[^>]*>", text, flags=re.I)
              if not head:
                  return original, False
              text = text[:head.end()] + "\\n" + ANALYTICS_SCRIPT + "\\n" + text[head.end():]
              return text, text != original
          '''
          new_func = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_func.splitlines()) + '\n'
          if old_func not in text:
              raise SystemExit('optimizer inject_performance_script anchor not found')
          text = text.replace(old_func, new_func, 1)

          old_calls = '''    updated = IMG_RE.sub(replace, original)
              updated, injected = inject_performance_script(updated)
              if injected:
                  stats["scripts_injected"] += 1
          '''
          old_calls = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_calls.splitlines()) + '\n'
          new_calls = '''    updated = IMG_RE.sub(replace, original)
              updated, analytics_injected = inject_analytics_script(updated)
              updated, injected = inject_performance_script(updated)
              if analytics_injected:
                  stats["scripts_injected"] += 1
              if injected:
                  stats["scripts_injected"] += 1
          '''
          new_calls = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_calls.splitlines()) + '\n'
          if old_calls not in text:
              raise SystemExit('optimizer optimize_page call anchor not found')
          text = text.replace(old_calls, new_calls, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

          for filename in ('scripts/run_media_optimizer.py', 'scripts/finalize_homepage.py'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('/scripts/wpa-performance.js?v=20260909-2', '/scripts/wpa-performance.js?v=20260909-3')
              s2 = s2.replace('/scripts/wpa-performance.js?v=20260712', '/scripts/wpa-performance.js?v=20260909-3')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8', newline='\n')

          core = Path('scripts/wpa-performance-core.js')
          s = core.read_text(encoding='utf-8')
          s2 = s.replace('/scripts/wpa-analytics.js?v=20260909-1', '/scripts/wpa-analytics.js?v=20260909-2')
          if s2 == s:
              raise SystemExit('performance core analytics cache anchor not found')
          core.write_text(s2, encoding='utf-8', newline='\n')

          if text == original:
              raise SystemExit('optimizer was not updated')
          PY

      - name: Validate GA4 rollout and consent boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          analytics_src = '/scripts/wpa-analytics.js?v=20260909-2'
          analytics_re = re.compile(r'<script\b[^>]*\bsrc=["\']/scripts/wpa-analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          stale_perf_re = re.compile(r'/scripts/wpa-performance\.js\?v=(?!20260909-3)[^"\']+', re.I)
          head_re = re.compile(r'<head\b[^>]*>', re.I)
          skip = {'.git', 'node_modules', 'vendor'}

          pages = 0
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              head = head_re.search(text)
              if not head:
                  continue
              pages += 1
              tags = analytics_re.findall(text)
              assert len(tags) == 1, f'{path}: expected exactly one analytics bootstrap, got {len(tags)}'
              assert analytics_src in tags[0], f'{path}: wrong analytics cache key'
              assert text.find(analytics_src) >= head.end(), f'{path}: analytics bootstrap is not immediately after <head>'
              assert not stale_perf_re.search(text), f'{path}: stale performance cache key remains'

          config = json.loads(Path('config/analytics.json').read_text(encoding='utf-8'))
          assert config.get('measurementId') == 'G-14VP7NERHJ'
          assert config.get('consentRequired') is True

          analytics = Path('scripts/wpa-analytics.js').read_text(encoding='utf-8')
          for needle in (
              "analytics_storage: 'granted'",
              "ad_storage: 'denied'",
              "ad_user_data: 'denied'",
              "ad_personalization: 'denied'",
              "if (consent === 'granted')",
              "showBanner(config)",
              "send_page_view: true",
          ):
              assert needle in analytics, needle

          optimizer = Path('scripts/optimize_site_media.py').read_text(encoding='utf-8')
          assert 'ANALYTICS_SCRIPT' in optimizer
          assert '/scripts/wpa-analytics.js?v=20260909-2' in optimizer
          assert '/scripts/wpa-performance.js?v=20260909-3' in optimizer
          assert 'inject_analytics_script' in optimizer

          print(f'Validated {pages} HTML pages with exactly one consent-aware GA4 bootstrap each.')
          PY

      - name: Commit rollout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rollout changes needed."
            exit 0
          fi
          git config user.name "WPA Analytics Rollout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' scripts/optimize_site_media.py scripts/run_media_optimizer.py scripts/finalize_homepage.py scripts/wpa-performance-core.js
          git commit -m "Install consent-aware GA4 bootstrap site-wide"
          git push origin HEAD:fix/ga4-global-tag-rollout-2026-09-09
