name: One-off GA4 global tag rollout

on:
  push:
    branches:
      - fix/ga4-global-tag-rollout-2026-09-09

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ga4-global-tag-rollout-2026-09-09
          fetch-depth: 0

      - name: Install consent-aware analytics bootstrap on every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          ANALYTICS_SCRIPT = '<script defer src="/scripts/wpa-analytics.js?v=20260909-2"></script>'
          PERFORMANCE_VERSION = '20260909-3'
          SKIP_DIRS = {'.git', 'node_modules', 'vendor'}

          analytics_re = re.compile(
              r'<script\b[^>]*\bsrc=["\']/scripts/wpa-analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
              re.I,
          )
          performance_re = re.compile(
              r'(<script\b[^>]*\bsrc=["\']/scripts/wpa-performance\.js)(?:\?[^"\']*)?(["\'][^>]*>\s*</script>)',
              re.I,
          )
          head_re = re.compile(r'<head\b[^>]*>', re.I)

          changed = []
          tagged = 0
          for path in sorted(ROOT.rglob('*.html')):
              if any(part in SKIP_DIRS for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              head = head_re.search(text)
              if not head:
                  continue

              updated = analytics_re.sub('', text)
              head = head_re.search(updated)
              updated = updated[:head.end()] + '\n' + ANALYTICS_SCRIPT + updated[head.end():]
              updated = performance_re.sub(
                  lambda m: m.group(1) + '?v=' + PERFORMANCE_VERSION + m.group(2),
                  updated,
              )

              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed.append(str(path))
              tagged += 1

          print(f'HTML pages with <head>: {tagged}')
          print(f'HTML pages changed: {len(changed)}')
          for item in changed:
              print(item)
          PY

      - name: Keep future optimizer output on the canonical analytics bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/optimize_site_media.py')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              'PERFORMANCE_SCRIPT = \'<script defer src="/scripts/wpa-performance.js?v=20260909-2"></script>\'\n',
              'PERFORMANCE_SCRIPT = \'<script defer src="/scripts/wpa-performance.js?v=20260909-3"></script>\'\n'
              'ANALYTICS_SCRIPT = \'<script defer src="/scripts/wpa-analytics.js?v=20260909-2"></script>\'\n',
              1,
          )

          old = '''def inject_performance_script(text: str) -> tuple[str, bool]:
              if "wpa-performance.js" in text:
                  return text, False
              match = re.search(r"</head\\s*>", text, flags=re.I)
              if not match:
                  return text, False
              return text[:match.start()] + PERFORMANCE_SCRIPT + "\\n" + text[match.start():], True
          '''.replace('          ', '')
          new = '''def inject_performance_script(text: str) -> tuple[str, bool]:
              original = text
              text = re.sub(
                  r'(/scripts/wpa-performance\\.js)(?:\\?[^"\\']*)?',
                  r'\\1?v=20260909-3',
                  text,
                  flags=re.I,
              )
              if "wpa-performance.js" in text:
                  return text, text != original
              match = re.search(r"</head\\s*>", text, flags=re.I)
              if not match:
                  return text, False
              return text[:match.start()] + PERFORMANCE_SCRIPT + "\\n" + text[match.start():], True


          def inject_analytics_script(text: str) -> tuple[str, bool]:
              original = text
              text = re.sub(
                  r'<script\\b[^>]*\\bsrc=["\\']/scripts/wpa-analytics\\.js(?:\\?[^"\\']*)?["\\'][^>]*>\\s*</script>\\s*',
                  '',
                  text,
                  flags=re.I,
              )
              head = re.search(r"<head\\b[^>]*>", text, flags=re.I)
              if not head:
                  return original, False
              text = text[:head.end()] + "\\n" + ANALYTICS_SCRIPT + text[head.end():]
              return text, text != original
          '''.replace('          ', '')

          if old not in text:
              raise SystemExit('optimizer inject_performance_script anchor not found')
          text = text.replace(old, new, 1)

          old_call = '''    updated = IMG_RE.sub(replace, original)
              updated, injected = inject_performance_script(updated)
              if injected:
                  stats["scripts_injected"] += 1
          '''.replace('          ', '')
          new_call = '''    updated = IMG_RE.sub(replace, original)
              updated, analytics_injected = inject_analytics_script(updated)
              updated, injected = inject_performance_script(updated)
              if analytics_injected:
                  stats["scripts_injected"] += 1
              if injected:
                  stats["scripts_injected"] += 1
          '''.replace('          ', '')
          if old_call not in text:
              raise SystemExit('optimizer optimize_page anchor not found')
          text = text.replace(old_call, new_call, 1)

          if text == original:
              raise SystemExit('optimizer was not updated')
          path.write_text(text, encoding='utf-8', newline='\n')

          for filename in ('scripts/run_media_optimizer.py', 'scripts/finalize_homepage.py'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('/scripts/wpa-performance.js?v=20260909-2', '/scripts/wpa-performance.js?v=20260909-3')
              s2 = s2.replace('/scripts/wpa-performance.js?v=20260712', '/scripts/wpa-performance.js?v=20260909-3')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8', newline='\n')

          core = Path('scripts/wpa-performance-core.js')
          s = core.read_text(encoding='utf-8')
          s2 = s.replace('/scripts/wpa-analytics.js?v=20260909-1', '/scripts/wpa-analytics.js?v=20260909-2')
          if s2 == s:
              raise SystemExit('performance core analytics cache anchor not found')
          core.write_text(s2, encoding='utf-8', newline='\n')
          PY

      - name: Validate GA4 rollout and consent boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ANALYTICS_SRC = '/scripts/wpa-analytics.js?v=20260909-2'
          analytics_re = re.compile(r'<script\b[^>]*\bsrc=["\']/scripts/wpa-analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          stale_perf_re = re.compile(r'/scripts/wpa-performance\.js\?v=(?!20260909-3)[^"\']+', re.I)
          head_re = re.compile(r'<head\b[^>]*>', re.I)

          pages = 0
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules', 'vendor'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              head = head_re.search(text)
              if not head:
                  continue
              pages += 1
              tags = analytics_re.findall(text)
              assert len(tags) == 1, f'{path}: expected exactly one analytics bootstrap, got {len(tags)}'
              assert ANALYTICS_SRC in tags[0], f'{path}: wrong analytics cache key'
              assert text.find(ANALYTICS_SRC) > head.end() - 1, f'{path}: analytics bootstrap is not after <head>'
              assert not stale_perf_re.search(text), f'{path}: stale performance cache key remains'

          config = json.loads(Path('config/analytics.json').read_text(encoding='utf-8'))
          assert config.get('measurementId') == 'G-14VP7NERHJ'
          assert config.get('consentRequired') is True

          analytics = Path('scripts/wpa-analytics.js').read_text(encoding='utf-8')
          assert "analytics_storage: 'granted'" in analytics
          assert "ad_storage: 'denied'" in analytics
          assert "ad_user_data: 'denied'" in analytics
          assert "ad_personalization: 'denied'" in analytics
          assert "if (consent === 'granted')" in analytics
          assert "showBanner(config)" in analytics
          assert "send_page_view: true" in analytics

          optimizer = Path('scripts/optimize_site_media.py').read_text(encoding='utf-8')
          assert 'ANALYTICS_SCRIPT' in optimizer
          assert '/scripts/wpa-analytics.js?v=20260909-2' in optimizer
          assert '/scripts/wpa-performance.js?v=20260909-3' in optimizer

          print(f'Validated {pages} HTML pages with one consent-aware GA4 bootstrap each.')
          PY

      - name: Commit rollout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rollout changes needed."
            exit 0
          fi
          git config user.name "WPA Analytics Rollout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' scripts/optimize_site_media.py scripts/run_media_optimizer.py scripts/finalize_homepage.py scripts/wpa-performance-core.js
          git commit -m "Install consent-aware GA4 bootstrap site-wide"
          git push origin HEAD:fix/ga4-global-tag-rollout-2026-09-09

# trigger: 2026-09-09
