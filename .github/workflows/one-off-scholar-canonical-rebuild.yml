name: One-off Scholar canonical rebuild

on:
  push:
    branches:
      - fix/scholar-canonical-rebuild-2026-09-09
    paths:
      - .github/workflows/one-off-scholar-canonical-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild-scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scholar-canonical-rebuild-2026-09-09
          fetch-depth: 0
      - name: Rebuild and validate Scholar layer
        run: python3 scripts/one_off_rebuild_scholar.py
      - name: Commit rebuilt Scholar layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar sitemap-scholar.xml wpa-scholar-records-2026.bib wpa-scholar-records-2026.ris QA-NOTE.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild canonical WPA Scholar layer"
            git push origin HEAD:fix/scholar-canonical-rebuild-2026-09-09
          fi
