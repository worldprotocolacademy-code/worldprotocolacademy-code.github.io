name: Update Premium Gumroad Link

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_premium_gumroad_link.py'
      - '.github/workflows/update-premium-gumroad-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update purchase links
        run: python scripts/update_premium_gumroad_link.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-reference-2026.html
          git diff --cached --quiet || git commit -m "Connect Premium Reference to Gumroad checkout"
          git push
