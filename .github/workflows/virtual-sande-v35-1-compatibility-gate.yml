name: Virtual Sande v35.1 Compatibility Gate

on:
  workflow_dispatch:
    inputs:
      legacy_url:
        description: 'Current legacy Virtual Sande workers.dev base URL.'
        required: true
        default: 'https://protocol-bot-workerjs.worldprotocolacademy.workers.dev'
        type: string
      candidate_url:
        description: 'Exact isolated v35.1 staging workers.dev base URL.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: virtual-sande-v35-1-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEGACY_URL: ${{ inputs.legacy_url }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}

    steps:
      - name: Checkout exact contract commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate read-only URL boundary
        run: |
          set -euo pipefail
          LEGACY_URL="${LEGACY_URL%/}"
          CANDIDATE_URL="${CANDIDATE_URL%/}"
          for value in "$LEGACY_URL" "$CANDIDATE_URL"; do
            case "$value" in
              https://*.workers.dev) ;;
              *) echo "Only exact HTTPS workers.dev base URLs are allowed: $value" >&2; exit 1 ;;
            esac
          done
          test "$LEGACY_URL" != "$CANDIDATE_URL"
          echo "LEGACY_URL=$LEGACY_URL" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Compare public POST JSON contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/virtual-sande-compatibility
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const contractPath = 'config/virtual-sande-v35.1-compatibility-contract.json';
          const contract = JSON.parse(await fs.readFile(contractPath, 'utf8'));
          if (contract.production_authorized !== false) throw new Error('Compatibility contract must remain production-blocked.');
          if (contract.comparison_mode !== 'READ_ONLY_MANUAL') throw new Error('Unexpected comparison mode.');

          const endpoints = {
            legacy: process.env.LEGACY_URL,
            candidate: process.env.CANDIDATE_URL,
          };
          const report = {
            component: contract.component,
            candidate_version: contract.candidate_version,
            production_authorized: false,
            comparison_mode: contract.comparison_mode,
            endpoints,
            cases: [],
          };

          async function callEndpoint(base, testCase) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);
            try {
              const response = await fetch(`${base}/ask`, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'accept': 'application/json',
                },
                body: JSON.stringify({
                  message: testCase.message,
                  lang: testCase.lang,
                  history: testCase.history || [],
                }),
                signal: controller.signal,
              });
              const text = await response.text();
              let data = null;
              try { data = JSON.parse(text); } catch {}
              const valid = response.status === 200
                && data?.ok === true
                && typeof data?.answer === 'string'
                && data.answer.trim().length > 0;
              return {
                status: response.status,
                valid,
                response_fields: data && typeof data === 'object' ? Object.keys(data).sort() : [],
                answer_length: typeof data?.answer === 'string' ? data.answer.trim().length : 0,
                mode: data?.mode ?? null,
                servedBy: data?.servedBy ?? null,
                error: data?.error ?? null,
              };
            } finally {
              clearTimeout(timeout);
            }
          }

          let failed = false;
          for (const testCase of contract.compatibility_cases) {
            const legacy = await callEndpoint(endpoints.legacy, testCase);
            const candidate = await callEndpoint(endpoints.candidate, testCase);
            const compatible = legacy.valid && candidate.valid;
            if (!compatible) failed = true;
            report.cases.push({
              id: testCase.id,
              lang: testCase.lang,
              history_items: Array.isArray(testCase.history) ? testCase.history.length : 0,
              legacy,
              candidate,
              compatible,
            });
          }

          report.compatible = !failed;
          report.note = 'Answer text is intentionally not compared for equality; only the public request/response contract is enforced.';
          const output = path.join('/tmp/virtual-sande-compatibility', 'compatibility-report.json');
          await fs.writeFile(output, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exitCode = 1;
          NODE

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virtual-sande-v35-1-compatibility-report
          path: /tmp/virtual-sande-compatibility/compatibility-report.json
          retention-days: 30
          if-no-files-found: error

      - name: Compatibility boundary
        if: always()
        run: |
          {
            echo '## Virtual Sande v35.1 Compatibility Gate'
            echo
            echo "- Contract commit: \`${GITHUB_SHA}\`"
            echo '- Comparison type: **read-only POST JSON**'
            echo '- Credentials accessed: **No**'
            echo '- Deployment performed: **No**'
            echo '- Frontend or endpoint changed: **No**'
            echo '- Production authorized: **No**'
          } >> "$GITHUB_STEP_SUMMARY"
