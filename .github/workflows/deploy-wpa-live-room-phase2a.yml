name: Deploy WPA Live Room Phase 2A

on:
  push:
    branches:
      - main
    paths:
      - workers/wpa-live-room-signaling/**
      - live-room/**
      - scripts/wpa-home-audio-video-session-card.js
      - .github/workflows/deploy-wpa-live-room-phase2a.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpa-live-room-phase2a-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate signaling package
        run: |
          set -euo pipefail
          test -f workers/wpa-live-room-signaling/wrangler.toml
          test -f workers/wpa-live-room-signaling/src/index.mjs
          test -f live-room/index.html
          node --check workers/wpa-live-room-signaling/src/index.mjs
          grep -F 'wpa-live-room-signaling' workers/wpa-live-room-signaling/wrangler.toml
          grep -F 'WpaLiveRoom' workers/wpa-live-room-signaling/wrangler.toml
          grep -F 'https://worldprotocolacademy.mk' workers/wpa-live-room-signaling/wrangler.toml
          grep -F 'const VERSION = "2A.2"' workers/wpa-live-room-signaling/src/index.mjs
          grep -F 'token-gated-host-and-guest' workers/wpa-live-room-signaling/src/index.mjs
          grep -F 'generate-ice-servers' workers/wpa-live-room-signaling/src/index.mjs
          grep -F 'RTCPeerConnection' live-room/index.html
          grep -F 'wpa.live-room.host.' live-room/index.html
          grep -F '#guest=' live-room/index.html
          grep -F 'WPA Live Room' scripts/wpa-home-audio-video-session-card.js

      - name: Deploy isolated signaling Worker
        env:
          # Dedicated least-privilege token: Cloudflare Account -> Workers Scripts -> Edit.
          # Do not reuse Virtual Sande or other WPA deployment credentials here.
          CLOUDFLARE_API_TOKEN: ${{ secrets.WPA_LIVE_ROOM_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config workers/wpa-live-room-signaling/wrangler.toml 2>&1 | tee /tmp/wpa-live-room-deploy.log

      - name: Verify deployed service after propagation
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev/?' /tmp/wpa-live-room-deploy.log | tail -n 1 | sed 's:/$::')"
          test -n "$URL"
          case "$URL" in
            https://wpa-live-room-signaling.*.workers.dev) ;;
            *) echo "Unexpected worker URL: $URL" >&2; exit 1 ;;
          esac

          rm -f /tmp/health.json
          verified=0
          for attempt in $(seq 1 18); do
            echo "Health verification attempt ${attempt}/18"
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$URL/health?deploy=${GITHUB_SHA}&attempt=${attempt}" \
              -o /tmp/health.json; then
              if grep -Fq '"ok":true' /tmp/health.json \
                && grep -Fq '"version":"2A.2"' /tmp/health.json \
                && grep -Fq '"media":"webrtc-peer-to-peer"' /tmp/health.json \
                && grep -Fq '"access":"token-gated-host-and-guest"' /tmp/health.json; then
                verified=1
                break
              fi
              echo "Worker edge has not converged to Phase 2A.2 yet."
              cat /tmp/health.json
              echo
            fi
            sleep 5
          done

          if [ "$verified" -ne 1 ]; then
            echo "Phase 2A.2 did not become observable before the propagation deadline." >&2
            test -f /tmp/health.json && cat /tmp/health.json >&2 || true
            exit 1
          fi

          cat /tmp/health.json
          grep -F '"ok":true' /tmp/health.json
          grep -F '"version":"2A.2"' /tmp/health.json
          grep -F '"media":"webrtc-peer-to-peer"' /tmp/health.json
          grep -F '"access":"token-gated-host-and-guest"' /tmp/health.json
          printf '%s\n' "$URL" > /tmp/wpa-live-room-url.txt

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: wpa-live-room-phase2a-deployment
          path: |
            /tmp/wpa-live-room-url.txt
            /tmp/health.json
          retention-days: 30

      - name: Boundary
        run: |
          echo 'This deploys only the isolated WPA Live Room signaling Worker on workers.dev.'
          echo 'TURN long-lived credentials, when configured, remain Worker secrets and are never committed.'
          echo 'No production custom route, KV, D1, R2, AI binding, or existing WPA Worker is modified.'
