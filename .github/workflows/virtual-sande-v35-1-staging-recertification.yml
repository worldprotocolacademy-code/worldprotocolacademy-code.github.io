name: Virtual Sande v35.1 Staging Recertification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-sande-v35-1-staging-recertification
  cancel-in-progress: false

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require main branch dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          echo "CANDIDATE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Verify source and blocked production boundary
        run: |
          set -euo pipefail
          test -f workers/virtual-sande-v35.1-staging/wrangler.toml
          test -f workers/virtual-sande-v35.1-staging/src/index.mjs
          test -f config/virtual-sande-v35.1-certification-ledger.json
          test ! -e workers/virtual-sande-v35.1-production/wrangler.toml
          node --check workers/virtual-sande-v35.1-staging/src/index.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35-protocolometry-connector.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.mjs
          node --check tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.mjs
          node --test \
            tools/virtual-sande/wpa-protocol-bot-v35.1-multisystem-orchestrator.test.mjs \
            tools/virtual-sande/wpa-protocol-bot-v35.1-safe-entrypoint.test.mjs

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config workers/virtual-sande-v35.1-staging/wrangler.toml \
            2>&1 | tee /tmp/wrangler-deploy.log

      - name: Resolve exact staging URL
        run: |
          set -euo pipefail
          STAGING_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev/?' /tmp/wrangler-deploy.log | tail -n 1 | sed 's:/$::')"
          test -n "$STAGING_URL"
          case "$STAGING_URL" in
            https://*.workers.dev) ;;
            *) echo "Unexpected staging URL: $STAGING_URL" >&2; exit 1 ;;
          esac
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_URL" > /tmp/staging-url.txt

      - name: Run staging acceptance suite
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$STAGING_URL/orchestrator/health" | tee /tmp/health.json
          grep -F '"ok": true' /tmp/health.json
          grep -F 'v35.1' /tmp/health.json

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е агреман?' \
            --data-urlencode 'lang=mk' | tee /tmp/agrement.json
          grep -F '"ok": true' /tmp/agrement.json
          grep -F '"answer"' /tmp/agrement.json

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Покажи ми D001' \
            --data-urlencode 'lang=mk' | tee /tmp/d001.json
          grep -F 'D001' /tmp/d001.json

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Кои се најновите дипломатски вести?' \
            --data-urlencode 'lang=mk' | tee /tmp/live.json
          grep -E 'journal_live_strict_search|journal_live_unavailable' /tmp/live.json
          grep -F '"human_review_required": true' /tmp/live.json

          status=$(curl --silent --output /tmp/method.json --write-out '%{http_code}' -X PUT "$STAGING_URL/ask")
          test "$status" = '405'

          status=$(curl --silent --output /tmp/origin.json --write-out '%{http_code}' \
            -H 'Origin: https://example.invalid' \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=Што е протокол?' \
            --data-urlencode 'lang=mk')
          test "$status" = '403'

          message=$(python3 -c "print('а' * 701)")
          status=$(curl --silent --output /tmp/long.json --write-out '%{http_code}' \
            --get "$STAGING_URL/ask" \
            --data-urlencode "message=$message" \
            --data-urlencode 'lang=mk')
          test "$status" = '400'

          status=$(curl --silent --output /tmp/urls.json --write-out '%{http_code}' \
            --get "$STAGING_URL/ask" \
            --data-urlencode 'message=https://a.example https://b.example https://c.example https://d.example' \
            --data-urlencode 'lang=mk')
          test "$status" = '400'

      - name: Run legacy compatibility contract
        env:
          LEGACY_URL: https://protocol-bot-workerjs.worldprotocolacademy.workers.dev
        run: |
          set -euo pipefail
          mkdir -p /tmp/recertification
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const contract = JSON.parse(await fs.readFile('config/virtual-sande-v35.1-compatibility-contract.json', 'utf8'));
          const endpoints = { legacy: process.env.LEGACY_URL, candidate: process.env.STAGING_URL };
          const report = {
            component: contract.component,
            version: contract.candidate_version,
            candidate_sha: process.env.CANDIDATE_SHA,
            production_authorized: false,
            endpoints,
            cases: [],
          };
          async function call(base, testCase) {
            const response = await fetch(`${base}/ask`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'accept': 'application/json' },
              body: JSON.stringify({ message: testCase.message, lang: testCase.lang, history: testCase.history || [] }),
            });
            const data = await response.json();
            return {
              status: response.status,
              valid: response.status === 200 && data?.ok === true && typeof data?.answer === 'string' && data.answer.trim().length > 0,
              response_fields: Object.keys(data || {}).sort(),
              answer_length: typeof data?.answer === 'string' ? data.answer.trim().length : 0,
            };
          }
          let failed = false;
          for (const testCase of contract.compatibility_cases) {
            const legacy = await call(endpoints.legacy, testCase);
            const candidate = await call(endpoints.candidate, testCase);
            const compatible = legacy.valid && candidate.valid;
            if (!compatible) failed = true;
            report.cases.push({ id: testCase.id, legacy, candidate, compatible });
          }
          report.compatible = !failed;
          await fs.writeFile('/tmp/recertification/compatibility-report.json', JSON.stringify(report, null, 2) + '\n');
          if (failed) process.exitCode = 1;
          NODE

      - name: Build exact-candidate certification evidence
        run: |
          set -euo pipefail
          cp /tmp/staging-url.txt /tmp/recertification/staging-url.txt
          cp /tmp/health.json /tmp/recertification/health.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('/tmp/recertification/compatibility-report.json').read_text())
          evidence = {
              'schema_version': '1.0',
              'component': 'Virtual Sande',
              'version': 'v35.1',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'staging_url': os.environ['STAGING_URL'],
              'staging_deploy': 'PASSED',
              'staging_acceptance': 'PASSED',
              'legacy_compatibility': 'PASSED' if report['compatible'] else 'FAILED',
              'production_authorized': False,
              'production_deployment_performed': False,
          }
          Path('/tmp/recertification/certification-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Upload recertification evidence
        uses: actions/upload-artifact@v7
        with:
          name: virtual-sande-v35-1-exact-candidate-recertification
          path: /tmp/recertification
          retention-days: 30
          if-no-files-found: error

      - name: Recertification boundary
        run: |
          {
            echo '## Virtual Sande v35.1 Exact-Candidate Staging Recertification'
            echo
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Staging URL: \`$STAGING_URL\`"
            echo '- Isolated staging deploy: **Passed**'
            echo '- Acceptance suite: **Passed**'
            echo '- Legacy compatibility: **Passed**'
            echo '- Production deployment performed: **No**'
            echo '- Production authorized: **No**'
          } >> "$GITHUB_STEP_SUMMARY"
