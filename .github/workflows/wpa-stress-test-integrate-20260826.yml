name: WPA Stress-Test Integration 2026-08-26

on:
  push:
    paths:
      - 'scripts/wpa-stress-test-integrate-20260826.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python scripts/wpa-stress-test-integrate-20260826.py
      - name: Validate JSON and diff
        run: |
          python -m json.tool data/wpa-module-registry.json >/dev/null
          git diff --check
      - name: Commit public integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml data/wpa-module-registry.json
          git commit -m 'Integrate WPA Protocol Stress-Test public demo'
          git push
