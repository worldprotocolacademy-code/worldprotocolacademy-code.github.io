name: Diagnose WPA protocol-ai New Corpus Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-protocol-ai-new-corpus.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_INSTANCE: protocol-ai
    steps:
      - name: Inventory all AI Search items read-only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_SEARCH_TOKEN"
          cat > /tmp/inventory.py <<'PY'
          import json, os, urllib.parse, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_AI_SEARCH_TOKEN']
          instance=os.environ.get('AI_SEARCH_INSTANCE','protocol-ai')
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai-search/namespaces/default/instances/{instance}/items'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json'}
          all_items=[]
          page=1
          while True:
              url=base+'?'+urllib.parse.urlencode({'page':page,'per_page':100})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  p=json.loads(r.read().decode('utf-8-sig'))
              if p.get('success') is not True:
                  raise SystemExit(f'items API failed page {page}: {p}')
              items=p.get('result') or []
              all_items.extend(items)
              info=p.get('result_info') or {}
              total_pages=int(info.get('total_pages') or 1)
              if page>=total_pages or not items:
                  break
              page+=1
          zenodo_ids=['21933739','21779849','21772500','21675100','21669195','21651611','21514266','21469146','21390763','21299485','20800187','20777938','20727210','20706913','20699718','20599172','20597429','20528224','20434477']
          mono='protocol-state-symbols-anthems-national-days-2026'
          canon='WPA_SYMBOLS_FINAL_PRINT_MASTER.pdf'
          rows=[]
          def safe(x):
              return {'key':x.get('key'),'status':x.get('status'),'chunks_count':x.get('chunks_count'),'file_size':x.get('file_size'),'error':x.get('error')}
          for rid in zenodo_ids:
              hits=[safe(x) for x in all_items if rid in str(x.get('key') or '')]
              rows.append({'kind':'zenodo','id':rid,'count':len(hits),'items':hits})
              print(f'ZENODO {rid}: {len(hits)} item(s) :: '+(' | '.join(str(h.get('key')) for h in hits[:3]) if hits else 'ABSENT'))
          mono_hits=[safe(x) for x in all_items if mono in str(x.get('key') or '')]
          canon_hits=[safe(x) for x in all_items if canon in str(x.get('key') or '')]
          print(f'MONOGRAPH CHUNK ITEMS: {len(mono_hits)}')
          for h in mono_hits[:20]: print('MONO',json.dumps(h,ensure_ascii=False,sort_keys=True))
          print(f'CANONICAL PDF ITEMS: {len(canon_hits)}')
          for h in canon_hits[:10]: print('CANON',json.dumps(h,ensure_ascii=False,sort_keys=True))
          summary={
            'all_items_count':len(all_items),
            'zenodo_ids_present':sum(1 for r in rows if r['count']>0),
            'zenodo_ids_total':len(rows),
            'zenodo_item_count':sum(r['count'] for r in rows),
            'monograph_item_count':len(mono_hits),
            'monograph_indexed_count':sum(1 for h in mono_hits if h.get('status')=='indexed'),
            'canonical_pdf_item_count':len(canon_hits),
          }
          out={'summary':summary,'zenodo':rows,'monograph':mono_hits,'canonical_pdf':canon_hits}
          open('protocol-ai-new-corpus-inventory.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('INVENTORY SUMMARY:',json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
          python /tmp/inventory.py

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: protocol-ai-new-corpus-inventory
          retention-days: 7
          path: protocol-ai-new-corpus-inventory.json
