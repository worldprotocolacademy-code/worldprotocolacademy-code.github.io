name: Translator One-Shot Finalize

on:
  push:
    branches:
      - fix/translator-language-integrity-20260916
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[translator-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout translator branch
        uses: actions/checkout@v4
        with:
          ref: fix/translator-language-integrity-20260916
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply strict Macedonian visible-UI cleanup
        run: python scripts/translator_strict_mk_cleanup.py
      - name: Run current translator gates
        run: |
          python scripts/translator_architecture_check.py
          python scripts/mk_home_language_integrity_check.py
          python scripts/en_public_language_integrity_check.py
      - name: Remove one-shot strict cleanup helper
        run: rm scripts/translator_strict_mk_cleanup.py
      - name: Commit strict translator state
        run: |
          set -euo pipefail
          git config user.name "worldprotocolacademy-code"
          git config user.email "worldprotocolacademy@gmail.com"
          git add index.html scripts/mk_home_language_integrity_check.py scripts/translator_strict_mk_cleanup.py
          git diff --cached --check
          git commit -m "Translator: enforce strict MK visible-language integrity [translator-finalized]"
          git push origin HEAD:fix/translator-language-integrity-20260916
