name: WPA Journal Live Backend Integrity v11.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/journal-live-backend-integrity-v115.yml
      - tools/journal-live-production-bridge/backend-integrity-v11.5.patch
      - tools/journal-live-production-bridge/source-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-live-backend-integrity-v115
  cancel-in-progress: false

env:
  WORKER_NAME: wpa-live-production-bridge
  API_ROOT: https://wpa-live-production-bridge.worldprotocolacademy.workers.dev
  SOURCE_SHA256: e096506ff99091d2508d1e6bef872d3efe24bdfdb2688bb7f00221be1c67d51f
  HARDENED_SHA256: 8bb179ad66e33c7559512ccced129202eeb359d46adc14cb380ac86ab3c2c81f

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact active production state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          for endpoint in settings deployments 'versions?per_page=100'; do
            name=$(printf '%s' "$endpoint" | tr '/?' '__')
            code=$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "${API_BASE}/${endpoint}")
            echo "GET ${endpoint}: ${code}"
            test "$code" = 200
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          settings=json.loads(Path('/tmp/settings.json').read_text())['result']
          dep=json.loads(Path('/tmp/deployments.json').read_text())['result']
          versions=json.loads(Path('/tmp/versions_per_page=100.json').read_text())['result']
          deployments=dep.get('deployments',[]) if isinstance(dep,dict) else dep
          items=versions.get('items',[]) if isinstance(versions,dict) else versions
          if not deployments or len(deployments[0].get('versions') or []) != 1: raise SystemExit('PRECONDITION FAIL: expected single active version')
          active=deployments[0]['versions'][0]
          if float(active.get('percentage') or 0) != 100: raise SystemExit('PRECONDITION FAIL: active version not 100%')
          active_id=active.get('version_id')
          if not items or items[0].get('id') != active_id: raise SystemExit('PRECONDITION FAIL: active version is not latest')
          names={b.get('name') for b in settings.get('bindings',[]) if isinstance(b,dict)}
          expected={'ADMIN_TOKEN','API_CACHE_SECONDS','DB','DEGRADED_FAILURE_THRESHOLD','LAB_CACHE_LIMIT','MAX_FEED_BYTES','MAX_ITEMS_PER_FEED','MAX_SOURCES_PER_TICK','MIN_RELEVANCE_SCORE','PUBLIC_ITEM_RETENTION_DAYS','PUBLIC_SITE_ORIGINS','QUARANTINE_FAILURE_THRESHOLD','RSS_QUEUE'}
          if names != expected: raise SystemExit(f'PRECONDITION FAIL: binding drift: {sorted(names)}')
          origins=next(b for b in settings['bindings'] if b.get('name')=='PUBLIC_SITE_ORIGINS').get('text','').split(',')
          needed={'https://worldprotocolacademy.mk','https://www.worldprotocolacademy.mk'}
          if not needed.issubset({x.strip() for x in origins}): raise SystemExit('PRECONDITION FAIL: production CORS origins missing')
          Path('/tmp/state.env').write_text(f'OLD_VERSION_ID={active_id}\n')
          PY
          cat /tmp/state.env >> "$GITHUB_ENV"
          source /tmp/state.env
          code=$(curl -sS -o /tmp/old-version.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "${API_BASE}/versions/${OLD_VERSION_ID}")
          test "$code" = 200
          code=$(curl -sS -L -o /tmp/content.bin -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: */*' "${API_BASE}/content/v2")
          echo "GET content/v2: ${code}"
          test "$code" = 200
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          raw=Path('/tmp/content.bin').read_bytes()
          head,rest=raw.split(b'\r\n\r\n',1)
          boundary=head.split(b'\r\n',1)[0]
          body=rest.rsplit(b'\r\n'+boundary+b'--',1)[0]
          Path('/tmp/index.js').write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          print('active_index_sha256='+digest)
          if digest != os.environ['SOURCE_SHA256']: raise SystemExit('PRECONDITION FAIL: production source hash changed')
          PY

      - name: Build deterministic hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          patch --batch --forward index.js "$GITHUB_WORKSPACE/tools/journal-live-production-bridge/backend-integrity-v11.5.patch"
          test "$(sha256sum index.js | cut -d' ' -f1)" = "$HARDENED_SHA256"
          node --check index.js
          grep -q 'version: "11.5.0"' index.js
          grep -q 'publicationIntegrity' index.js
          grep -q 'thematicNoiseReason' index.js

      - name: Upload version with strict inherited bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/old-version.json').read_text())['result']
          rt=(v.get('resources') or {}).get('script_runtime') or {}
          names=['ADMIN_TOKEN','API_CACHE_SECONDS','DB','DEGRADED_FAILURE_THRESHOLD','LAB_CACHE_LIMIT','MAX_FEED_BYTES','MAX_ITEMS_PER_FEED','MAX_SOURCES_PER_TICK','MIN_RELEVANCE_SCORE','PUBLIC_ITEM_RETENTION_DAYS','PUBLIC_SITE_ORIGINS','QUARANTINE_FAILURE_THRESHOLD','RSS_QUEUE']
          meta={
            'main_module':'index.js',
            'bindings':[{'name':n,'type':'inherit','version_id':'latest'} for n in names],
            'annotations':{'workers/message':'WPA Journal Live backend integrity v11.5: publication-date, freshness, noise and error-boundary hardening'},
          }
          if rt.get('compatibility_date'): meta['compatibility_date']=rt['compatibility_date']
          if isinstance(rt.get('compatibility_flags'),list): meta['compatibility_flags']=rt['compatibility_flags']
          if rt.get('usage_model') in {'standard','bundled','unbound'}: meta['usage_model']=rt['usage_model']
          if isinstance(rt.get('limits'),dict) and rt['limits']: meta['limits']=rt['limits']
          Path('/tmp/metadata.json').write_text(json.dumps(meta,separators=(',',':')))
          Path('/tmp/baseline.json').write_text(json.dumps({
            'handlers':(v.get('resources') or {}).get('script',{}).get('handlers'),
            'named_handlers':(v.get('resources') or {}).get('script',{}).get('named_handlers'),
            'runtime':{k:rt.get(k) for k in ('compatibility_date','compatibility_flags','usage_model','limits')},
            'binding_names':names,
          },sort_keys=True))
          PY
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
            -F 'metadata=</tmp/metadata.json;type=application/json' \
            -F 'index.js=@/tmp/index.js;type=application/javascript+module' \
            "${API_BASE}/versions?bindings_inherit=strict")
          echo "POST versions: ${code}"
          test "$code" = 200 -o "$code" = 201
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/upload.json').read_text())
          if p.get('success') is not True: raise SystemExit(f"UPLOAD FAIL: {p.get('errors')}")
          new=(p.get('result') or {}).get('id')
          if not new: raise SystemExit('UPLOAD FAIL: version id missing')
          Path('/tmp/new.env').write_text(f'NEW_VERSION_ID={new}\n')
          print('candidate_version='+new)
          PY
          cat /tmp/new.env >> "$GITHUB_ENV"
          source /tmp/new.env
          code=$(curl -sS -o /tmp/new-version.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "${API_BASE}/versions/${NEW_VERSION_ID}")
          test "$code" = 200
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('/tmp/baseline.json').read_text())
          new=json.loads(Path('/tmp/new-version.json').read_text())['result']
          r=new.get('resources') or {}; s=r.get('script') or {}; rt=r.get('script_runtime') or {}
          names=sorted(b.get('name') for b in r.get('bindings',[]) if isinstance(b,dict))
          if names != sorted(base['binding_names']): raise SystemExit('VERIFY FAIL: binding names changed')
          if s.get('handlers') != base['handlers'] or s.get('named_handlers') != base['named_handlers']: raise SystemExit('VERIFY FAIL: handler shape changed')
          for k,v in base['runtime'].items():
            if v is not None and rt.get(k) != v: raise SystemExit(f'VERIFY FAIL: runtime drift in {k}')
          print('candidate metadata verified')
          PY

      - name: Zero-percent canary, version override smoke, promote with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          DEPLOYMENT_TOUCHED=false
          body(){ python3 - "$@" <<'PY'
          import json,sys
          versions=[]
          for pair in sys.argv[1:]:
            vid,pct=pair.split(':',1); versions.append({'version_id':vid,'percentage':float(pct)})
          print(json.dumps({'strategy':'percentage','versions':versions},separators=(',',':')))
          PY
          }
          deploy(){ local file=$1; local out=$2; local code; code=$(curl -sS -o "$out" -w '%{http_code}' -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary "@$file" "${API_BASE}/deployments"); echo "POST deployments: $code"; test "$code" = 200; }
          rollback(){ body "${OLD_VERSION_ID}:100" > /tmp/rollback.json; deploy /tmp/rollback.json /tmp/rollback-response.json; echo 'rollback accepted'; }
          on_exit(){ rc=$?; if [ $rc -ne 0 ] && [ "$DEPLOYMENT_TOUCHED" = true ]; then rollback || echo 'CRITICAL: rollback failed' >&2; fi; exit $rc; }
          trap on_exit EXIT

          body "${OLD_VERSION_ID}:100" "${NEW_VERSION_ID}:0" > /tmp/canary.json
          deploy /tmp/canary.json /tmp/canary-response.json
          DEPLOYMENT_TOUCHED=true
          sleep 4

          override="${WORKER_NAME}=\"${NEW_VERSION_ID}\""
          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" -H 'Origin: https://worldprotocolacademy.mk' -D /tmp/h -o /tmp/health "${API_ROOT}/api/v1/health"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/health').read_text())
          if p.get('version')!='11.5.0' or p.get('ok') is not True: raise SystemExit('CANARY FAIL: health/version mismatch')
          PY
          grep -qi '^access-control-allow-origin: https://worldprotocolacademy.mk' /tmp/h

          curl -sS -H "Cloudflare-Workers-Version-Overrides: ${override}" -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/live "${API_ROOT}/api/v1/live?limit=100&integrity_canary=$(date +%s)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/live').read_text()); items=p.get('items')
          if not isinstance(items,list): raise SystemExit('CANARY FAIL: live contract')
          for i in items:
            pub=i.get('published_at'); fet=i.get('fetched_at')
            if not pub or pub==fet: raise SystemExit('CANARY FAIL: undated/fallback publication leaked')
          print(f'canary live items={len(items)}')
          PY

          for origin in https://worldprotocolacademy.mk https://www.worldprotocolacademy.mk; do
            curl -sS -X OPTIONS -H "Cloudflare-Workers-Version-Overrides: ${override}" -H "Origin: ${origin}" -D /tmp/opt -o /dev/null "${API_ROOT}/api/v1/live"
            grep -qi "^access-control-allow-origin: ${origin}" /tmp/opt
            grep -qi '^vary:.*origin' /tmp/opt
          done

          body "${NEW_VERSION_ID}:100" > /tmp/promote.json
          deploy /tmp/promote.json /tmp/promote-response.json
          sleep 4
          curl -sS -H 'Origin: https://worldprotocolacademy.mk' -D /tmp/final-h -o /tmp/final-health "${API_ROOT}/api/v1/health"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/final-health').read_text())
          if p.get('version')!='11.5.0' or p.get('ok') is not True: raise SystemExit('FINAL FAIL: health/version mismatch')
          PY
          grep -qi '^access-control-allow-origin: https://worldprotocolacademy.mk' /tmp/final-h
          curl -sS -H 'Origin: https://worldprotocolacademy.mk' -o /tmp/final-live "${API_ROOT}/api/v1/live?limit=20&integrity_final=$(date +%s)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/final-live').read_text())
          if not isinstance(p.get('items'),list): raise SystemExit('FINAL FAIL: live contract')
          print(f"final live items={len(p['items'])}")
          PY
          DEPLOYMENT_TOUCHED=false
          trap - EXIT

      - name: Production summary
        if: success()
        shell: bash
        run: |
          {
            echo '## WPA Journal Live · Backend Integrity v11.5'
            echo
            echo '- Exact audited source hash gate: **PASS**'
            echo '- Publication timestamp integrity: **ENFORCED server-side**'
            echo '- Stale/future/undated ingestion: **FILTERED**'
            echo '- Lottery and sports-result noise: **FILTERED server-side**'
            echo '- Duplicate batch content: **FILTERED**'
            echo '- OPTIONS CORS `Vary: Origin`: **VERIFIED**'
            echo '- Public 500 error details: **REDACTED**'
            echo '- Zero-percent canary + version override smoke: **PASS**'
            echo '- Production promotion: **100% new version**'
            echo "- Previous version: \`${OLD_VERSION_ID}\`"
            echo "- Active version: \`${NEW_VERSION_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
