<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPA Live Source Directory</title><style>
:root{--bg:#f4f0e6;--navy:#0d1f3c;--gold:#b88a2b;--paper:#fffdf8;--muted:#64748b;--line:#d8cfbd;--ok:#16794b;--warn:#9a6700;--bad:#b4233a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:22px}.topin,.main{max-width:1450px;margin:auto}.top h1{margin:0;font-family:Georgia,serif;font-size:2.2rem}.top p{color:#d9e1ee}.main{padding:22px}.controls{display:grid;grid-template-columns:1.5fr repeat(3,minmax(150px,.7fr)) auto;gap:10px;background:var(--paper);border:1px solid var(--line);padding:15px;border-radius:16px;position:sticky;top:8px;z-index:10}.controls input,.controls select,.controls button{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);font:inherit}.controls button{background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.stat b{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}.card h2{font-size:1rem;margin:0}.url{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-all}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:.7rem;padding:3px 7px;border-radius:999px;background:#edf1f6}.active{color:var(--ok)}.pending{color:var(--warn)}.duplicate,.error,.degraded,.quarantine{color:var(--bad)}.ok,.empty{color:var(--ok)}.unknown,.pending{color:var(--warn)}.disabled{color:var(--muted)}.health-meta{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}.quarantine-note{font-size:.78rem;color:var(--bad);background:#fff1f3;border:1px solid #fecdd3;border-radius:8px;padding:7px}.actions{display:flex;gap:7px;margin-top:auto}.actions a,.actions button{font:800 .75rem Inter,Arial,sans-serif;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--navy);text-decoration:none;cursor:pointer}.pager{display:flex;justify-content:center;gap:10px;margin:20px}.message{padding:25px;text-align:center;background:var(--paper);border:1px dashed var(--line);border-radius:14px}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:600px){.controls{grid-template-columns:1fr}}
</style><script src="../live/config.js"></script><script defer src="directory.js"></script></head><body><header class="top"><div class="topin"><h1>WPA Live Source Directory</h1><p>Read-only production каталог на collector-enabled и health статуси: ok, empty, unknown, pending, error, degraded, quarantine и duplicate од истиот D1 registry.</p></div></header><main class="main"><section class="controls"><input id="q" type="search" placeholder="Име, URL, земја или tags…"><select id="status"><option value="all">Сите статуси</option><option value="active">Active</option><option value="pending">Pending</option><option value="duplicate">Duplicate</option><option value="error">Error</option><option value="degraded">Degraded</option><option value="quarantine">Quarantine</option><option value="ok">Healthy</option><option value="empty">Empty feed</option><option value="unknown">Unverified</option></select><select id="category"><option value="all">Сите категории</option><option value="protocol">Protocol</option><option value="diplomacy">Diplomacy</option><option value="communication">Communication</option><option value="security">Security</option></select><select id="region"><option value="all">Сите региони</option></select><button id="reload">Освежи</button></section><div id="stats" class="stats"></div><div id="grid" class="grid"></div><div class="pager"><button id="prev">← Претходно</button><span id="page">—</span><button id="next">Следно →</button></div></main></body></html>
