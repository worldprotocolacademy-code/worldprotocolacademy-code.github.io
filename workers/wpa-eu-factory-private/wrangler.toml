name = "wpa-eu-factory-private"
main = "src/index.mjs"
compatibility_date = "2026-11-26"
workers_dev = false
preview_urls = false

[vars]
PRIVATE_HOST = "grants.worldprotocolacademy.mk"
WPA_ACCESS_MODE = "DISABLED"
WPA_MEMBER_RELEASE = "HOLD"
WPA_RADAR_MODE = "DISABLED"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# No route, Access audience, owner allowlist, entitlement DB, or rate limiter is configured.
# Configure only in separately approved Cloudflare staging. No secrets in source.
