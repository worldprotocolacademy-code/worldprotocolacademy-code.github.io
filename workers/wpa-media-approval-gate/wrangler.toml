name = "wpa-media-approval-gate"
main = "src/index.mjs"
compatibility_date = "2026-11-12"
workers_dev = false
preview_urls = false

[vars]
WPA_MEDIA_APPROVAL_MODE = "DISABLED"
GITHUB_RENDER_REF = "main"

# Required secrets/bindings before activation:
# WPA_MEDIA_APPROVAL_HMAC_SECRET
# GITHUB_DISPATCH_URL
# GITHUB_DISPATCH_TOKEN
# KV binding: WPA_MEDIA_APPROVAL_AUDIT
