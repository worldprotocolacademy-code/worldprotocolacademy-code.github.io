# Source-only candidate. No public route, preview or automatic deployment.
name = "wpa-virtual-sande-private-pilot"
main = "src/index.mjs"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[vars]
PILOT_ENABLED = "false"
CORPUS_ENABLED = "false"
AI_SEARCH_NAME = "protocol-ai-v4-final"
# VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct" (only after authorised licence acceptance)
# EVIDENCE_RECEIPT_KEY = secret, at least 32 random characters; set via secret manager
# PILOT_RATE_LIMIT = reviewed rate-limit binding; required before API processing.
# No paid model, licence acceptance or route activation is performed by this source change.
# Required during protected staging setup:
# PILOT_ORIGIN = exact HTTPS origin of the protected staging site
# ACCESS_ISSUER = verified Cloudflare Access issuer
# ACCESS_AUD = exact Access application audience
# SYNTHESIS_MODEL = approved Workers AI model id
# FILE_SAFETY = reviewed service binding for scanning, MIME checks and archive limits.
# Set explicit provider budget, Access policy, rate limits, and data-retention
# conditions before enabling. Do not add a public route.
