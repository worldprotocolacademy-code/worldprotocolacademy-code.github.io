# Example only, NOT DEPLOYED.
# Copy to wrangler.toml in a dedicated, controlled Cloudflare Worker project.
name = "wpa-news-daily-dispatcher"
main = "cron-worker.mjs"
compatibility_date = "2026-11-24"

[triggers]
# UTC 04:30 or 05:30; only the one in the Skopje 06:30 hour dispatches.
# Worker checks Europe/Skopje local hour to handle CET/CEST automatically.
crons = ["30 4,5 * * *"]
