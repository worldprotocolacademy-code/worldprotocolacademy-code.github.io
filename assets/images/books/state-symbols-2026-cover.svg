<text x="350" y="635" text-anchor="middle" fill="#e0b43c" font-family="Georgia,serif" font-size="22" font-weight="700">Доц. д-р Санде Смиљанов</text>
<text x="350" y="659" text-anchor="middle" fill="#e0b43c" font-family="Georgia,serif" font-size="14" font-style="italic">Assoc. Prof. Dr. Sande Smiljanov</text>
<text x="350" y="696" text-anchor="middle" fill="#e0b43c" font-family="Arial,sans-serif" font-size="18" font-weight="700">ISBN 978-608-66168-5-4</text>
<text x="350" y="720" text-anchor="middle" fill="#f3f4f5" font-family="Arial,sans-serif" font-size="11">First bilingual print edition / Прво двојазично печатено издание</text>
<text x="350" y="888" text-anchor="middle" fill="#f3f4f5" font-family="Arial,sans-serif" font-size="10">Самостојно авторско издание · World Protocol Academy · Скопје, 2026</text>
<text x="350" y="912" text-anchor="middle" fill="#f3f4f5" font-family="Arial,sans-serif" font-size="10">Independently published by Sande Smiljanov · Skopje, 2026</text>
<text x="350" y="938" text-anchor="middle" fill="#d9ae35" font-family="Georgia,serif" font-size="12">Не рангираме. Мериме. / We do not rank. We measure.</text>
