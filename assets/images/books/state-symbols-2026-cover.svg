<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 990" role="img" aria-labelledby="t d">
<title id="t">Протокол на државни симболи, химни и национални денови</title>
<desc id="d">Official print-cover web rendering based on the 2026 final print master.</desc>
<rect width="700" height="990" fill="#0b213b"/>
<rect x="32" y="32" width="636" height="926" fill="none" stroke="#d9ae35" stroke-width="2"/>
<rect x="42" y="42" width="616" height="906" fill="none" stroke="#d9ae35" stroke-width="1"/>
<image href="/logo.webp" x="260" y="55" width="180" height="180" preserveAspectRatio="xMidYMid meet"/>
<text x="350" y="278" text-anchor="middle" fill="#e0b43c" font-family="Georgia,serif" font-size="34" font-weight="700">Протокол на државни симболи,</text>
<text x="350" y="319" text-anchor="middle" fill="#e0b43c" font-family="Georgia,serif" font-size="34" font-weight="700">химни и национални денови</text>
<text x="350" y="360" text-anchor="middle" fill="#f3f4f5" font-family="Georgia,serif" font-size="17" font-style="italic">Protocol of State Symbols, Anthems and National Days</text>
<text x="350" y="435" text-anchor="middle" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="13">95 календарски записи / 95 calendar entries</text>
<text x="350" y="464" text-anchor="middle" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="13">197 држави и протоколарни ентитети / 197 states and protocol entities</text>
<text x="350" y="493" text-anchor="middle" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="13">Знамиња, химни, национални денови и оперативен протокол</text>
